rules:
  # ---------------------------------------------------------------------------
  # PlasticOS / IB-Odoo_19 Semgrep Rules
  # Purpose: fast, low-noise blocker detection for Odoo 19 + PlasticOS safety.
  # Scope: Semgrep catches high-confidence patterns only.
  # Non-goals: architectural layer validation, sudo comment proof, full XML audit.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Python safety blockers
  # ---------------------------------------------------------------------------

  - id: plasticos-python-bare-except
    patterns:
      - pattern: |
          try:
            ...
          except:
            ...
    message: "Bare except hides real Odoo registry/runtime errors. Use a specific exception type."
    languages: [python]
    severity: ERROR
    metadata:
      category: safety
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-python-eval-exec
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: compile(...)
    message: "Dynamic code execution is forbidden in production Odoo code."
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-python-pickle-load
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
    message: "pickle load is unsafe for untrusted or externally influenced data."
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-python-yaml-unsafe-load
    patterns:
      - pattern: yaml.load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader)
      - pattern-not: yaml.load(..., Loader=SafeLoader)
      - pattern-not: yaml.safe_load(...)
    message: "Use yaml.safe_load() or yaml.load(..., Loader=yaml.SafeLoader)."
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      plasticos_gate: pr-check

  # ---------------------------------------------------------------------------
  # PlasticOS deferred subsystem hard guard
  # ---------------------------------------------------------------------------

  - id: plasticos-pipeline-v2-import
    pattern-either:
      - pattern: import plasticos_inference_engine.pipeline_v2
      - pattern: from plasticos_inference_engine import pipeline_v2
      - pattern: from plasticos_inference_engine.pipeline_v2 import $X
      - pattern: import pipeline_v2
      - pattern: from pipeline_v2 import $X
    message: "pipeline_v2.py is deferred and must not be imported or activated."
    languages: [python]
    severity: ERROR
    metadata:
      category: deferred_protected
      confidence: HIGH
      plasticos_gate: pipeline-guard

  - id: plasticos-pipeline-v2-string-activation
    pattern-regex: "pipeline_v2"
    paths:
      exclude:
        - "ci/check_pipeline_v2_guard.py"
        - ".semgrep/odoo-patterns.yml"
        - "**/*.md"
        - "**/*.mdc"
        - "**/reports/**"
    message: "Reference to pipeline_v2 detected outside allowed docs/guard files. Confirm this is not activation wiring."
    languages: [python]
    severity: ERROR
    metadata:
      category: deferred_protected
      confidence: MEDIUM
      plasticos_gate: pipeline-guard

  # ---------------------------------------------------------------------------
  # SQL safety
  # ---------------------------------------------------------------------------

  - id: plasticos-sql-fstring-execute
    pattern-either:
      - pattern: self.env.cr.execute(f"...")
      - pattern: self._cr.execute(f"...")
      - pattern: $CR.execute(f"...")
    message: "SQL/Cypher-style execution must not use f-string interpolation. Use parameters."
    languages: [python]
    severity: ERROR
    metadata:
      category: injection
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-sql-format-execute
    pattern-either:
      - pattern: self.env.cr.execute("...".format(...))
      - pattern: self._cr.execute("...".format(...))
      - pattern: $CR.execute("...".format(...))
    message: "SQL execution must not use .format() interpolation. Use parameters."
    languages: [python]
    severity: ERROR
    metadata:
      category: injection
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-sql-percent-format-execute
    pattern-either:
      - pattern: self.env.cr.execute("..." % ...)
      - pattern: self._cr.execute("..." % ...)
      - pattern: $CR.execute("..." % ...)
    message: "SQL execution must not use percent interpolation. Use parameters."
    languages: [python]
    severity: ERROR
    metadata:
      category: injection
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-sql-string-concat-execute
    pattern-either:
      - pattern: self.env.cr.execute("..." + ...)
      - pattern: self._cr.execute("..." + ...)
      - pattern: $CR.execute("..." + ...)
    message: "SQL execution must not use string concatenation. Use parameters."
    languages: [python]
    severity: ERROR
    metadata:
      category: injection
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-raw-sql-review
    # `$SQL, ...` used to exclude this rule entirely: the ellipsis matches zero
    # extra arguments, so every one-argument execute was a pattern-not. Match
    # exactly one argument, and keep the Odoo/psycopg identifier composers.
    patterns:
      - pattern-either:
          - pattern: self.env.cr.execute($SQL)
          - pattern: self._cr.execute($SQL)
      - pattern-not: self.env.cr.execute(SQL(...))
      - pattern-not: self._cr.execute(SQL(...))
      - pattern-not: self.env.cr.execute(sql.SQL(...))
      - pattern-not: self._cr.execute(sql.SQL(...))
      - pattern-not: self.env.cr.execute(sql.SQL(...).format(...))
      - pattern-not: self._cr.execute(sql.SQL(...).format(...))
      - pattern-not: self.env.cr.execute(SQL(...).format(...))
      - pattern-not: self._cr.execute(SQL(...).format(...))
    message: "Raw SQL requires review. Prefer ORM unless justified and parameterized."
    languages: [python]
    severity: WARNING
    metadata:
      category: orm_safety
      confidence: MEDIUM
      plasticos_gate: review

  # Indirect interpolation and request-controlled SQL/domains. The four execute
  # rules above only see a literal built inside the execute call. These do not
  # copy UNJUSTIFIED_SUDO, and they do not treat a value inside a fixed domain
  # or a bound SQL parameter as the unsafe shape.
  - id: plasticos-sql-indirect-interpolation
    pattern-either:
      - pattern-inside: |
          $QUERY = f"...{...}..."
          ...
          $CR.execute($QUERY, ...)
      - pattern-inside: |
          $QUERY = f"{...}"
          ...
          $CR.execute($QUERY, ...)
      - pattern-inside: |
          $QUERY = "...".format(...)
          ...
          $CR.execute($QUERY, ...)
      - pattern-inside: |
          $QUERY = "..." % ...
          ...
          $CR.execute($QUERY, ...)
      - patterns:
          - pattern-inside: |
              $QUERY = "..." + $REST
              ...
              $CR.execute($QUERY, ...)
          - pattern-not-inside: |
              $QUERY = "..." + "..."
              ...
              $CR.execute($QUERY, ...)
      - patterns:
          - pattern: $CR.execute($Q % $A, ...)
          - pattern-not: $CR.execute("..." % $A, ...)
      - patterns:
          - pattern: $CR.execute($Q.format(...), ...)
          - pattern-not: $CR.execute("...".format(...), ...)
          - pattern-not: $CR.execute(sql.SQL(...).format(...), ...)
          - pattern-not: $CR.execute(SQL(...).format(...), ...)
      - patterns:
          - pattern: $CR.execute($Q + $R, ...)
          - pattern-not: $CR.execute("..." + $R, ...)
          - pattern-not: $CR.execute($Q + "...", ...)
    message: "Interpolated SQL reaches execute outside the literal-in-call rules. Pass values as parameters, or compose identifiers with SQL.identifier."
    languages: [python]
    severity: ERROR
    metadata:
      category: injection
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-sql-request-query
    pattern-either:
      - pattern: $CR.execute(request.params.get(...), ...)
      - pattern: $CR.execute(request.params[...], ...)
      - pattern: $CR.execute(request.httprequest.args.get(...), ...)
      - pattern: $CR.execute(request.httprequest.args[...], ...)
      - pattern: $CR.execute(request.httprequest.form.get(...), ...)
      - pattern: $CR.execute(request.httprequest.values.get(...), ...)
      - pattern: $CR.execute(request.get_json_data(...), ...)
      - pattern-inside: |
          $QUERY = request.params.get(...)
          ...
          $CR.execute($QUERY, ...)
      - pattern-inside: |
          $QUERY = request.params[...]
          ...
          $CR.execute($QUERY, ...)
      - pattern-inside: |
          $QUERY = json.loads(request.httprequest.get_data(...))
          ...
          $CR.execute($QUERY, ...)
      - pattern-inside: |
          $QUERY = json.loads(request.httprequest.data)
          ...
          $CR.execute($QUERY, ...)
      - pattern-inside: |
          $RAW = request.httprequest.get_data(...)
          ...
          $QUERY = json.loads($RAW)
          ...
          $CR.execute($QUERY, ...)
      - pattern-inside: |
          $BODY = json.loads(request.httprequest.get_data(...))
          ...
          $CR.execute($BODY.get(...), ...)
      - pattern-inside: |
          $BODY = json.loads(request.httprequest.get_data(...) or ...)
          ...
          $CR.execute($BODY.get(...), ...)
      - pattern-inside: |
          $BODY = json.loads(request.httprequest.get_data(...) or ...)
          ...
          $QUERY = $BODY.get(...)
          ...
          $CR.execute($QUERY, ...)
      - pattern-inside: |
          $RAW = request.httprequest.get_data(...)
          ...
          $BODY = json.loads($RAW)
          ...
          $CR.execute($BODY.get(...), ...)
      - pattern-inside: |
          $RAW = request.httprequest.get_data(...)
          ...
          $BODY = json.loads($RAW)
          ...
          $QUERY = $BODY.get(...)
          ...
          $CR.execute($QUERY, ...)
    message: "Request data is the SQL text passed to execute. Bind it as a parameter."
    languages: [python]
    severity: ERROR
    metadata:
      category: injection
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-request-search-domain
    pattern-either:
      - pattern: $M.search(request.params.get(...), ...)
      - pattern: $M.search(request.params[...], ...)
      - pattern: $M.search(json.loads(request.httprequest.get_data(...)), ...)
      - pattern: $M.search(json.loads(request.httprequest.data), ...)
      - pattern: $M.search_count(request.params.get(...), ...)
      - pattern: $M.search_count(request.params[...], ...)
      - pattern: $M.read_group(request.params.get(...), ...)
      - pattern: $M.filtered_domain(request.params.get(...))
      - pattern: $M.search_read(request.params.get(...), ...)
      - pattern: $M.search_read(request.params[...], ...)
      - pattern: $M.search_read(json.loads(request.httprequest.get_data(...)), ...)
      - pattern: $M.search_read(json.loads(request.httprequest.data), ...)
      - pattern-inside: |
          $DOMAIN = request.params.get(...)
          ...
          $M.search($DOMAIN, ...)
      - pattern-inside: |
          $DOMAIN = request.params[...]
          ...
          $M.search($DOMAIN, ...)
      - pattern-inside: |
          $DOMAIN = json.loads(request.httprequest.get_data(...))
          ...
          $M.search($DOMAIN, ...)
      - pattern-inside: |
          $DOMAIN = json.loads(request.httprequest.get_data(...) or ...)
          ...
          $M.search($DOMAIN, ...)
      - pattern-inside: |
          $DOMAIN = json.loads(request.httprequest.get_data(...) or ...)
          ...
          $M.search_count($DOMAIN, ...)
      - pattern-inside: |
          $DOMAIN = json.loads(request.httprequest.data)
          ...
          $M.search($DOMAIN, ...)
      - pattern-inside: |
          $DOMAIN = json.loads(request.httprequest.get_data(...))
          ...
          $M.search_count($DOMAIN, ...)
      - pattern-inside: |
          $DOMAIN = request.params.get(...)
          ...
          $M.search_count($DOMAIN, ...)
      - pattern-inside: |
          $DOMAIN = request.params.get(...)
          ...
          $M.search_read($DOMAIN, ...)
      - pattern-inside: |
          $DOMAIN = json.loads(request.httprequest.get_data(...) or ...)
          ...
          $M.search_read($DOMAIN, ...)
      - pattern-inside: |
          $BODY = json.loads(request.httprequest.get_data(...) or ...)
          ...
          $M.search($BODY.get(...), ...)
      - pattern-inside: |
          $BODY = json.loads(request.httprequest.get_data(...) or ...)
          ...
          $M.search_count($BODY.get(...), ...)
      - pattern-inside: |
          $BODY = json.loads(request.httprequest.get_data(...) or ...)
          ...
          $M.search_read($BODY.get(...), ...)
      - pattern-inside: |
          $BODY = json.loads(request.httprequest.get_data(...) or ...)
          ...
          $DOMAIN = $BODY.get(...)
          ...
          $M.search($DOMAIN, ...)
      - pattern-inside: |
          $BODY = json.loads(request.httprequest.get_data(...) or ...)
          ...
          $DOMAIN = $BODY.get(...)
          ...
          $M.search_read($DOMAIN, ...)
    message: "A request payload is the search domain. Put request values inside a fixed domain literal."
    languages: [python]
    severity: ERROR
    metadata:
      category: injection
      confidence: HIGH
      plasticos_gate: pr-check

  # ---------------------------------------------------------------------------
  # Odoo 19 Python deprecations / compatibility
  # ---------------------------------------------------------------------------

  - id: plasticos-odoo-api-one-multi
    pattern-either:
      - pattern: "@api.one"
      - pattern: "@api.multi"
    message: "@api.one and @api.multi are removed/deprecated. Use plain recordset methods."
    languages: [python]
    severity: ERROR
    metadata:
      category: odoo19
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-odoo-sql-constraints
    pattern: _sql_constraints = [...]
    message: "Odoo 19 convention requires models.Constraint / UniqueConstraint, not _sql_constraints tuples."
    languages: [python]
    severity: ERROR
    metadata:
      category: odoo19
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-odoo-env-get
    pattern: self.env.get(...)
    paths:
      exclude:
        - "ci/**"
        - "/tests/**"
        - "plasticos_*/tests/**"
        - "docs/**/tests/**"
    message: "Use self.env['model.name'], not self.env.get(...), in Odoo model code."
    languages: [python]
    severity: ERROR
    metadata:
      category: odoo19
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-odoo-depends-id
    pattern: "@api.depends('id')"
    message: "@api.depends('id') is invalid/noisy. Depend on real fields used by the compute."
    languages: [python]
    severity: WARNING
    metadata:
      category: odoo19
      confidence: MEDIUM
      plasticos_gate: review

  - id: plasticos-odoo-unprotected-env-ref
    patterns:
      - pattern: self.env.ref($REF)
      - pattern-not: self.env.ref($REF, raise_if_not_found=False)
    message: "Use raise_if_not_found=False when missing external IDs are survivable."
    languages: [python]
    severity: WARNING
    metadata:
      category: registry_safety
      confidence: MEDIUM
      plasticos_gate: review

  # ---------------------------------------------------------------------------
  # Stub / incomplete implementation blockers
  # ---------------------------------------------------------------------------

  - id: plasticos-production-notimplemented
    pattern: raise NotImplementedError(...)
    paths:
      exclude:
        - "/tests/**"
        - "plasticos_*/tests/**"
        - "docs/**/tests/**"
        - "**/test_*.py"
    message: "Production Odoo code must not ship NotImplementedError stubs."
    languages: [python]
    severity: ERROR
    metadata:
      category: zero_stub
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-production-todo-implement
    pattern-regex: "(TODO|FIXME|PLACEHOLDER|NOT IMPLEMENTED|Not implemented|stub)"
    paths:
      include:
        - "plasticos_*/models/**/*.py"
        - "plasticos_*/controllers/**/*.py"
        - "plasticos_*/wizards/**/*.py"
        - ".semgrep/tests/positive.py"
        - ".semgrep/tests/negative.py"
      exclude:
        - "/tests/**"
        - "plasticos_*/tests/**"
        - "docs/**/tests/**"
    message: "Production path contains TODO/stub marker. Implement, remove, or document as an approved deferral."
    languages: [python]
    severity: WARNING
    metadata:
      category: zero_stub
      confidence: MEDIUM
      plasticos_gate: review

  # ---------------------------------------------------------------------------
  # Secret / credential detection
  # ---------------------------------------------------------------------------

  - id: plasticos-hardcoded-secret-assignment
    pattern-regex: "(?i)(api[_-]?key|secret|token|password|passwd|pwd)\\s*=\\s*['\"][^'\"]{8,}['\"]"
    paths:
      exclude:
        - "/tests/**"
        - "plasticos_*/tests/**"
        - "docs/**/tests/**"
        - "**/*.md"
        - "**/*.mdc"
    message: "Possible hardcoded secret. Use .env or Odoo system parameters."
    languages: [python]
    severity: ERROR
    metadata:
      category: secrets
      confidence: MEDIUM
      plasticos_gate: pr-check

  # ---------------------------------------------------------------------------
  # Destructive migration blockers
  # ---------------------------------------------------------------------------

  - id: plasticos-destructive-migration-sql-py
    pattern-regex: "(?i)\\b(DROP\\s+TABLE|DROP\\s+COLUMN|ALTER\\s+TABLE.+SET\\s+NOT\\s+NULL|TRUNCATE\\s+TABLE)\\b"
    paths:
      include:
        - "plasticos_*/migrations/**/*.py"
        - ".semgrep/tests/positive.py"
        - ".semgrep/tests/negative.py"
    message: "Destructive migration requires explicit approval and rollback plan."
    languages: [python]
    severity: ERROR
    metadata:
      category: migration_safety
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-destructive-migration-sql-file
    pattern-regex: "(?i)\\b(DROP\\s+TABLE|DROP\\s+COLUMN|ALTER\\s+TABLE.+SET\\s+NOT\\s+NULL|TRUNCATE\\s+TABLE)\\b"
    paths:
      include:
        - "plasticos_*/migrations/**/*.sql"
        - ".semgrep/tests/odoo19.xml"
    message: "Destructive migration requires explicit approval and rollback plan."
    languages: [generic]
    severity: ERROR
    metadata:
      category: migration_safety
      confidence: HIGH
      plasticos_gate: pr-check

  # ---------------------------------------------------------------------------
  # XML / generic Odoo 19 compatibility checks
  # Semgrep generic mode is intentionally simple. Deep XML validation remains
  # owned by ci/check_odoo19_xml.py.
  # ---------------------------------------------------------------------------

  - id: plasticos-xml-tree-tag
    pattern-regex: "<\\s*tree\\b"
    paths:
      include:
        - "plasticos_*/**/*.xml"
        - ".semgrep/tests/odoo19.xml"
    message: "Odoo 19 views must use <list>, not <tree>."
    languages: [generic]
    severity: ERROR
    metadata:
      category: odoo19_xml
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-xml-tree-view-mode
    pattern-regex: "view_mode\\s*=\\s*['\"][^'\"]*tree"
    paths:
      include:
        - "plasticos_*/**/*.xml"
        - ".semgrep/tests/odoo19.xml"
    message: "Odoo 19 view_mode should use list, not tree."
    languages: [generic]
    severity: ERROR
    metadata:
      category: odoo19_xml
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-xml-attrs-states
    pattern-regex: "\\b(attrs|states)\\s*="
    paths:
      include:
        - "plasticos_*/**/*.xml"
        - ".semgrep/tests/odoo19.xml"
    message: "Odoo 19 XML should use direct invisible/readonly/required expressions, not attrs/states."
    languages: [generic]
    severity: ERROR
    metadata:
      category: odoo19_xml
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-xml-qweb-t-esc
    pattern-regex: "\\bt-esc\\s*="
    paths:
      include:
        - "plasticos_*/**/*.xml"
        - ".semgrep/tests/odoo19.xml"
    message: "Use t-out instead of t-esc in Odoo 19 QWeb templates."
    languages: [generic]
    severity: ERROR
    metadata:
      category: odoo19_xml
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-xml-cron-numbercall
    pattern-regex: "\\bnumbercall\\s*="
    paths:
      include:
        - "plasticos_*/**/*.xml"
        - ".semgrep/tests/odoo19.xml"
    message: "numbercall on ir.cron is deprecated. Omit it."
    languages: [generic]
    severity: ERROR
    metadata:
      category: odoo19_xml
      confidence: HIGH
      plasticos_gate: pr-check

  - id: plasticos-xml-groups-category-id
    pattern-regex: "<record[^>]+model=\"res\\.groups\"[^>]*>[\\s\\S]*?<field name=\"category_id\""
    paths:
      include:
        - "plasticos_*/security/**/*.xml"
        - "plasticos_*/data/**/*.xml"
        - ".semgrep/tests/odoo19.xml"
    message: "category_id on res.groups is removed in Odoo 19. Use privilege_id instead."
    languages: [generic]
    severity: ERROR
    metadata:
      category: odoo19_xml
      confidence: MEDIUM
      plasticos_gate: pr-check

  # ---------------------------------------------------------------------------
  # PlasticOS naming / Odoo 19 single-file patterns
  # Harvested from scripts/check_odoo_patterns.sh so they also gate at pr-check
  # (semgrep runs in pr-check; the bash script only runs in make audit / CI).
  # ---------------------------------------------------------------------------

  # #8 — Namespace drift: class Plastos* instead of Plasticos*
  - id: plasticos-namespace-drift
    pattern-regex: 'class\s+Plastos[A-Z]'
    paths:
      include:
        - "plasticos_*/**/*.py"
        - ".semgrep/tests/positive.py"
        - ".semgrep/tests/negative.py"
    message: "Namespace drift: class name uses Plastos* — rename to Plasticos*."
    languages: [python]
    severity: ERROR
    metadata:
      category: naming
      confidence: HIGH
      plasticos_gate: pr-check

  # #23 — Studio/legacy x_ prefixed fields
  - id: plasticos-x-prefixed-field
    pattern-regex: '^\s+x_\w+\s*=\s*fields\.'
    paths:
      include:
        - "plasticos_*/**/*.py"
        - ".semgrep/tests/positive.py"
        - ".semgrep/tests/negative.py"
    message: "x_ prefixed field detected. Use clean module field names (e.g. x_trucker_id → trucker_id)."
    languages: [python]
    severity: ERROR
    metadata:
      category: naming
      confidence: HIGH
      plasticos_gate: pr-check

  # #15 — Invalid decoration-secondary
  - id: plasticos-xml-decoration-secondary
    pattern-regex: 'decoration-secondary\s*='
    paths:
      include:
        - "plasticos_*/**/*.xml"
        - ".semgrep/tests/odoo19.xml"
    message: "decoration-secondary is invalid. Use decoration-info/success/warning/danger/muted."
    languages: [generic]
    severity: ERROR
    metadata:
      category: odoo19_xml
      confidence: HIGH
      plasticos_gate: pr-check

  # #13 — string attribute on <search> (invalid Odoo 19 RNG)
  - id: plasticos-xml-search-string
    pattern-regex: '<search[^>]+string\s*='
    paths:
      include:
        - "plasticos_*/**/*.xml"
        - ".semgrep/tests/odoo19.xml"
    message: "string= is invalid on <search>. Remove it (Odoo 19 RNG)."
    languages: [generic]
    severity: ERROR
    metadata:
      category: odoo19_xml
      confidence: HIGH
      plasticos_gate: pr-check

  # #14 — string attribute on <group name="group_by"> in search views
  - id: plasticos-xml-group-by-string
    pattern-either:
      - pattern-regex: '<group[^>]+name="group_by"[^>]+string\s*='
      - pattern-regex: '<group[^>]+string\s*=[^>]+name="group_by"'
    paths:
      include:
        - "plasticos_*/**/*.xml"
        - ".semgrep/tests/odoo19.xml"
    message: 'string= is invalid on <group name="group_by"> in search views. Remove it (Odoo 19 RNG).'
    languages: [generic]
    severity: ERROR
    metadata:
      category: odoo19_xml
      confidence: HIGH
      plasticos_gate: pr-check

  # #11 — XML eval with nested double quotes
  - id: plasticos-xml-eval-nested-quotes
    pattern-regex: 'eval="[^"]*ref\("[^"]*"\)[^"]*"'
    paths:
      include:
        - "plasticos_*/**/*.xml"
        - ".semgrep/tests/odoo19.xml"
    message: "Nested double quotes in eval. Use single quotes inside: eval=\"[ref('module.id')]\"."
    languages: [generic]
    severity: ERROR
    metadata:
      category: odoo19_xml
      confidence: HIGH
      plasticos_gate: pr-check

  # #10 — cron model_id ref missing module prefix (scoped to *cron.xml to match
  # check_odoo_patterns.sh; same-module action binding refs are valid unprefixed).
  - id: plasticos-xml-cron-model-ref-no-prefix
    pattern-regex: 'ref="model_plasticos'
    paths:
      include:
        - "plasticos_*/**/*cron.xml"
        - ".semgrep/tests/odoo19.xml"
    message: 'cron model_id ref missing module prefix. Use ref="plasticos_module.model_plasticos_x".'
    languages: [generic]
    severity: ERROR
    metadata:
      category: odoo19_xml
      confidence: HIGH
      plasticos_gate: pr-check

