rules:
  - id: odoo-hardcoded-model-string
    pattern: self.env["$MODEL"]
    message: "Consider using a module-level constant instead of hardcoded model name string"
    languages: [python]
    severity: WARNING

  - id: odoo-commented-code
    pattern-regex: '^\s*#\s*(self\.|env\.|model\.|fields\.|vals\[)'
    message: "Remove commented-out Odoo code"
    languages: [python]
    severity: WARNING

  - id: odoo-bare-except
    patterns:
      - pattern: |
          try:
            ...
          except:
            ...
    message: "Use specific exception types instead of bare except"
    languages: [python]
    severity: ERROR

  - id: odoo-sudo-without-comment
    pattern: .sudo()
    message: "sudo() call should have inline comment justifying elevated privileges"
    languages: [python]
    severity: WARNING

  - id: odoo-raw-sql
    pattern-either:
      - pattern: self.env.cr.execute(...)
      - pattern: self._cr.execute(...)
    message: "Raw SQL detected - prefer ORM methods to prevent SQL injection"
    languages: [python]
    severity: ERROR

  - id: odoo-env-ref-unguarded
    pattern: self.env.ref($REF)
    pattern-not: self.env.ref($REF, raise_if_not_found=False)
    message: "env.ref() should use raise_if_not_found=False to handle missing records gracefully"
    languages: [python]
    severity: WARNING
