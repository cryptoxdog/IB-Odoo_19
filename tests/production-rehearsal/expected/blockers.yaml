# Named blockers and design-scope notes for the promotion rehearsal.
#
# Only an entry with `verdict_effect: blocked` can turn a gate's BLOCKED
# receipt into the run verdict `blocked` (common.py verdict_blocker_ids).
# A BLOCKED receipt whose reason is not listed that way, any FAIL, and any
# missing receipt make the verdict `failed`. `blocked` is never `ready`.
# Entries without `verdict_effect` are documentation: they explain where the
# wired path ends by design and never excuse a failure.
#
# Format:
#   - id: blocker-id            (a gate receipt `reason` when verdict_effect is set)
#     gate: N
#     verdict_effect: blocked   (optional)
#     status: open | fix-merged-not-proven | by-design
#     step: where the pipeline stops
#     reason: why it stops here
#     adr: reference if applicable
#     severity: expected | warning | error

blockers:

  # ── External prerequisites: the gate cannot run, nothing is proven ─────────

  - id: vanillasoft-key-unbound
    gate: 7
    verdict_effect: blocked
    status: open
    step: capability_bind.py --check VANILLASOFT_API_KEY did not report source=infisical
    reason: >
      The VanillaSoft key is bound from Infisical only. Without it Gate 7 does
      not run and the contact import is unproven.
    severity: error

  - id: vanillasoft-history-census-unbound
    gate: 7
    verdict_effect: blocked
    status: open
    step: VANILLASOFT_HISTORY_CENSUS unset in the rehearsal environment
    reason: >
      The approved 4,876-ContactID census is an operator runtime input. The kit
      never generates, substitutes or shrinks one; without it history mode
      cannot start and the contact import is unproven.
    severity: error

  - id: vanillasoft-history-digest-unbound
    gate: 7
    verdict_effect: blocked
    status: open
    step: VANILLASOFT_HISTORY_CENSUS_SHA256 unset in the rehearsal environment
    reason: >
      The census is used only against the SHA-256 the operator declared
      independently; the kit never computes a digest to declare.
    severity: error

  - id: vanillasoft-history-harness-unforwarded
    gate: 7
    verdict_effect: blocked
    status: open
    step: scripts/test_env.sh run (parse_run) forwards only VANILLASOFT_CALL_FLOOR / CONTACT_FLOOR / REPORT_PATH to make import-vanillasoft and requires both floors
    reason: >
      The verified-clone harness does not yet admit the history settings
      (VANILLASOFT_HISTORY_CENSUS, _CENSUS_SHA256, _CHECKPOINT, _MAX_IDS,
      _FAILURE_BUDGET) and still demands a rolling floor, which history mode
      refuses. The harness is owned outside the kit (contract U-04); Gate 7
      does not route around it, and a run outside the harness is not a
      rehearsal of the verified clone.
    severity: error
    observed: 2026-11-07

  - id: vanillasoft-history-sample-no-import
    gate: 7
    verdict_effect: blocked
    status: open
    step: bounded history session landed no durable ContactID on the clone
    reason: >
      The first REHEARSAL_HISTORY_MAX_IDS planned ids of the frozen cohort
      produced no durable external ref (all held behind missing ERP people,
      or nothing fetched). That proves nothing about the positive import;
      the cohort order and selection are never changed to manufacture one
      (contract U-03).
    severity: warning

  - id: erp-proof-files-missing
    gate: 6
    verdict_effect: blocked
    status: open
    step: ~/.l9/erp-proof/{database,reader.pw} absent and ERP_SQL_SERVER / ERP_SQL_DATABASE unset
    reason: >
      Gate 6 reads only the restored SQL Server database. Without its
      coordinates the import does not run.
    severity: error

  - id: erp-source-incomplete
    gate: 6
    verdict_effect: blocked
    status: open
    step: only one of ERP_SQL_SERVER / ERP_SQL_DATABASE exported
    reason: Both must be set together, or neither (the proof files are then used).
    severity: error

  # ── Historical observations ──────────────────────────────────────────────

  - id: web-lead-crm-lead-http-context
    gate: 5
    status: fix-merged-not-proven
    step: plasticos.web.lead._ensure_crm_lead_for_hot_intake → _create_crm_lead → message_post
    reason: >
      2026-11-05: public HTTP left env.user empty and message_post raised
      Expected singleton: res.users(). PR 385 (merge 5b683806, on Staging)
      binds SUPERUSER_ID inside plasticos_crm_bridge._create_crm_lead.
      Run 2026-11-06_205618 (operator-supplied evidence, not committed; local
      HEAD 9ef95a4b, which differed from origin/Staging) still ended Gate 5 at
      state=error with the same singleton error, so the controller's HTTP user
      context is reported open. PR 398 (merge 85eefe81, on Staging) binds the
      authenticated webhook request to SUPERUSER_ID in web_lead_api.py. Owned
      outside this kit. Gate 5 passes only when the stored crm.lead
      opportunity is read back on a live run; this entry never excuses it.
    adr: rule 50-plasticos-web-lead-guard (do not edit web_lead.py write/unlink guards)
    severity: error
    observed: 2026-11-05, 2026-11-06
    fix_pr: https://github.com/cryptoxdog/IB-Odoo_19/pull/385

  - id: erp-sql-login-18456
    gate: 6
    status: open
    step: restored SQL Server login erp_reader
    reason: >
      Run 2026-11-06_205618 (operator-supplied evidence, not committed): SQL
      Server error 18456 (login failed) for erp_reader. Gate 6
      FAILs on it. Credential and source diagnosis are owned outside this kit.
    severity: error
    observed: 2026-11-06

  # ── Design scope: where the wired path ends on purpose ───────────────────

  - id: web-lead-no-partner-creation
    gate: 5
    status: by-design
    step: WebLead.admit_inbound → plasticos.intake created, crm.lead created
    reason: >
      Partner creation is intentionally deferred. The intake has no partner_id.
      Gate 5 fails if the POST creates a partner.
    adr: plasticos_web_leads rule 50-plasticos-web-lead-guard
    severity: expected

  - id: web-lead-no-gate-triage
    gate: 5
    status: by-design
    step: plasticos.intake.action_match_to_buyers() requires GATE_URL
    reason: >
      Gate/CEG web-lead triage is Phase 3 (ADR-016). GATE_URL is not set
      in the rehearsal environment. The intake is created but not triaged.
    adr: ADR-016, ADR-002 §3
    severity: expected

  - id: web-lead-no-matching
    gate: 5
    status: by-design
    step: No match run triggered from web lead path
    reason: >
      Matching requires imported buyers. ERP import (Gate 6) must run first.
      The web lead path ends at crm.lead creation.
    severity: expected

  - id: erp-10pct-slice
    gate: 6
    status: by-design
    step: Newest 10% of transaction worksheets only
    reason: >
      LIMIT=10% is intentional for rehearsal speed. Full historical import
      is a separate operator task. All partner layers always run in full.
    severity: expected

  - id: vanillasoft-history-bounded-sample
    gate: 7
    status: by-design
    step: make import-vanillasoft in history mode, VANILLASOFT_HISTORY_MAX_IDS=REHEARSAL_HISTORY_MAX_IDS (default 100)
    reason: >
      The rehearsal fetches a bounded prefix of the frozen cohort through the
      same history driver production uses, with a fresh ledger in the evidence
      folder. A PASS means the sample exercised the pipeline; the receipt
      records fetched, imported, held, skipped and undispositioned counts and
      never claims HISTORICAL_SNAPSHOT_COMPLETE, historical_data_complete,
      LIVE_DELTA_COMPLETENESS or FULL_CURRENT_CONTACT_COVERAGE. The full
      cohort is a separate operator session with its durable ledger.
    severity: expected
