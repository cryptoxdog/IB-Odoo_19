schema: l9.program-execution.campaign-source.v2
schema_version: 2.0.0

metadata:
  campaign_id: "l9-ecosystem-fix-plan"
  title: "L9 Ecosystem Low-Hanging-Fruit Fix Campaign"
  version: "1.0.0"
  created_at: "2026-08-05T12:47:00Z"
  status: operator_intake
  owner: "Igor Beylin"
  intended_host: Quantum-L9/Cursor-Governance
  intended_drop_path: >-
    environment/program-execution/campaigns/l9-ecosystem-fix-plan/CAMPAIGN_SOURCE.yaml
  runtime_root: "$HOME/.l9/programs/l9-ecosystem-fix-plan"
  worktree_root: "$HOME/.l9/program-worktrees/l9-ecosystem-fix-plan"
  source_is_immutable: true
  remote_mutation_during_admission: false

integrity:
  digest_algorithm: sha256
  canonical_encoding: utf-8
  canonical_line_endings: lf
  digest_record_location: controller/admission/source-integrity-receipt.json
  generated_counts_or_digests_may_be_hand_edited: false

pipeline_contract:
  pair: program-execution-system.v2
  blueprint: program-execution-blueprint.v2
  controller: program-execution-controller.v2
  required_host_surfaces:
    - environment/program-execution/core
    - environment/program-execution/adapters
    - environment/program-execution/conformance
    - environment/program-execution/registry
    - environment/program-execution/integrations
  compilation_sequence:
    - preserve_immutable_campaign_source
    - instantiate_native_blueprint_and_controller
    - compile_source_into_complete_native_blueprint
    - collect_and_bind_current_state_evidence
    - validate_blueprint_in_template_mode
    - accept_blueprint_only_after_evidence_and_authority_resolution
    - validate_blueprint_in_instantiated_mode
    - bootstrap_controller_and_create_program_lock
    - reconcile_exact_targets
    - probe_adapters_and_validate_conformance
    - admit_and_execute_ready_tasks
    - record_attempt_and_verification_receipts
    - evaluate_evidence_backed_gates
    - export_controller_handoff_receipt
    - obtain_program_owner_terminal_verdict
  authority_boundaries:
    campaign_source_owns: operator_intent_and_campaign_semantics
    blueprint_owns: accepted_program_definition
    controller_owns: mutable_runtime_state_and_gate_results
    adapters_own: host_translation_and_execution_receipts
    activation_prompt_owns: launch_mechanics_only

operator_directive:
  objective: >-
    Apply the Wave 1-6 low-hanging-fruit fix plan across IB-Odoo_19, EIE, CEG,
    and Constellation.Gate to reach a safe, contract-consistent launch state.
  mode: controlled_autonomous_until_material_boundary
  auto_continue:
    - read_only_inspection
    - blueprint_materialization
    - reversible_repo_local_work
    - local_validation
    - independent_verification
    - bounded_retry_of_transient_failures
    - read_only_remote_observation
    - unrelated_ready_work_when_one_subgraph_is_blocked
  pause_only_for:
    - missing_or_conflicting_semantic_authority
    - material_scope_expansion
    - stale_or_invalid_program_lock
    - unresolved_blocking_unknown
    - failed_blocking_gate
    - security_or_secret_boundary
    - exact_remote_mutation_approval
    - exact_merge_tag_release_publish_deploy_or_migration_approval
    - exact_destructive_action_approval

program:
  id: "l9-ecosystem-fix-plan"
  name: "L9 Ecosystem Low-Hanging-Fruit Fix Campaign"
  version: "1.0.0"
  owner: "Igor Beylin"
  definition_status: draft
  snapshot_at: "2026-08-05"
  objective: >-
    Close known safety, tenancy, chassis, contract, and reachability gaps
    across IB-Odoo_19, EIE, CEG, and Constellation.Gate before launch.
  problem_statement: >-
    Odoo Gate writeback can auto-mutate production data, CEG tenant
    resolution falls back to database-name matching, CEG/EIE chassis and
    version declarations are inconsistent, EIE is not confirmed reachable
    from Gate's live registry, and the Odoo match/converge mappers read
    fields (results, entity_snapshot) that do not match CEG/EIE's current
    response and request contracts (candidates, entity/object_type/objective).
  target_state: >-
    Odoo cannot auto-write without explicit enablement; organization_id is
    mandatory in all CEG requests; CEG production refuses to start on legacy
    chassis; EIE reports a single consistent version; Gate's live registry
    shows an active EIE node owning converge; a known CEG match response
    produces correct Odoo buyer-match records; a real EIE converge response
    is stored in Odoo without field loss; and the six launch-critical
    round-trip paths (plus six failure cases) pass.
  scope:
    include:
      - "Odoo Gate writeback safety default (plasticos_gate)"
      - "CEG tenant_id/organization_id enforcement"
      - "CEG/EIE chassis and version configuration consistency"
      - "EIE explicit Gate registration lifecycle"
      - "Odoo match mapper field-contract correction (results -> candidates)"
      - "Cross-repo canonical contract fixtures (match, converge)"
      - "Odoo <-> EIE converge request/response field mapping"
      - "Launch-critical round-trip and failure-path validation"
    exclude:
      - "SDK pin upgrade"
      - "Remediation of the 152 quarantined EIE/CEG test failures"
      - "Complete PacketEnvelope removal"
      - "Broad dead-code cleanup"
      - "Dependency modernization"
      - "Gate payload business-logic transformation"
      - "New nodes or orchestration layers"
  contracts:
    blueprint: program-execution-blueprint.v2
    controller_minimum: program-execution-controller.v2
    pair: program-execution-system.v2
  authority_order:
    - applicable_safety_legal_security_requirements
    - cursor_governance_canonical_law
    - program_execution_v2_interface_contract
    - latest_explicit_operator_instruction
    - latest_accepted_program_decision
    - accepted_architecture_and_contracts
    - verified_current_state_evidence
    - approved_task_card
    - exact_rendered_source_contract
    - repository_local_governance
    - implementation
    - documentation
    - historical_material
    - UNKNOWN
  operating_rules:
    - one_authority_per_responsibility
    - controller_may_narrow_never_widen
    - unknown_blocks_only_named_dependencies
    - promotion_requires_evidence_backed_gates
    - no_silent_scope_expansion
    - no_irreversible_action_without_exact_authority
    - worker_claim_is_not_verification
    - passing_local_command_is_not_remote_event_proof
    - tag_release_and_package_publication_are_distinct_events
    - runtime_state_remains_outside_source_and_target_worktrees
  terminal_verdicts:
    - CONVERGED
    - CONVERGED_WITH_NON_BLOCKING_RISKS
    - NOT_CONVERGED
    - INCONCLUSIVE

