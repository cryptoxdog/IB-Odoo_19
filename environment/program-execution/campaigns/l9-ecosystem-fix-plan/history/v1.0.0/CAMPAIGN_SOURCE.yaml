gates:
  - id: GATE-001
    name: campaign_admission_and_authority_lock
    gate_type: entry
    blocking: true
    owner_authority_id: AUTH-001
    task_ids: [TASK-001]
    required_evidence_ids: [EVID-001]
    pass_criteria:
      - Immutable source is preserved and digest-bound externally.
      - Required Program Execution host surfaces pass validation.
      - Target identities and current revisions are recorded.
      - The complete draft Blueprint passes template validation.
    failure_effect: Block Controller bootstrap and task admission.
  - id: GATE-002
    name: configuration_and_safety_complete
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-002
    task_ids: [TASK-002]
    required_evidence_ids: [EVID-002, EVID-003]
    pass_criteria:
      - Odoo cannot auto-write without explicit enablement.
      - Tenant ID is mandatory in all CEG requests.
      - CEG production cannot start on legacy chassis.
      - EIE reports one consistent version.
      - Full Odoo module install-smoke passes.
    failure_effect: Block downstream promotion and Wave 2+ admission.
  - id: GATE-003
    name: eie_gate_reachability_complete
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-003
    task_ids: [TASK-003]
    required_evidence_ids: [EVID-005]
    pass_criteria:
      - Gate's live registry shows an active EIE node owning converge.
    failure_effect: Block converge-path validation and Wave 3+ admission.
  - id: GATE-004
    name: contract_break_and_fixtures_complete
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-004
    task_ids: [TASK-004, TASK-005]
    required_evidence_ids: [EVID-004]
    pass_criteria:
      - DEC-001 identity contract is resolved with evidence.
      - A known CEG response produces usable Odoo buyer-match records.
      - Canonical contract fixtures exist and cross-repo checks reject drift.
    failure_effect: Block Wave 4 (converge mapping) admission.
  - id: GATE-005
    name: converge_compatibility_complete
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-003
    task_ids: [TASK-006]
    required_evidence_ids: []
    pass_criteria:
      - A real EIE converge response is stored and reviewed inside Odoo without field loss.
    failure_effect: Block Wave 5 (round-trip validation) admission.
  - id: GATE-006
    name: controller_handoff_complete
    gate_type: convergence
    blocking: true
    owner_authority_id: AUTH-001
    task_ids: [TASK-007]
    required_evidence_ids: [EVID-001]
    pass_criteria:
      - The Controller Handoff Receipt is schema-valid and evidence-complete.
      - Remaining risks, Unknowns, waivers, failures, and rollback state are explicit.
      - The Controller recommends but does not declare a terminal verdict.
    failure_effect: Terminal verdict remains INCONCLUSIVE.

scheduler:
  objective_order:
    - unblock_critical_path
    - complete_authority_and_current_state_lock
    - execute_ready_reversible_work
    - preserve_independent_verification
    - prepare_exact_approval_packets
    - close_out_with_complete_evidence
  one_writer_per_repository: true
  non_mutating_cross_repository_tasks_allowed: true
  mutating_cross_repository_tasks_forbidden: true
  initial_max_workers: 1
  maximum_workers_without_new_authorization: 2
  blocked_task_behavior: >-
    Block only the affected task or subgraph, continue unrelated ready work,
    and include the blocker in the next program digest.

retry_policy:
  max_attempts: 2
  retryable:
    - worker_timeout
    - worker_crash
    - temporary_file_lock
    - transient_test_infrastructure
    - temporary_remote_observation_failure
    - temporary_adapter_failure
  non_retryable:
    - deterministic_test_failure
    - scope_violation
    - secret_access_attempt
    - stale_base_revision
    - semantic_unknown
    - approval_mismatch
    - program_lock_failure
    - forbidden_command
  preserve_every_attempt: true
  require_new_source_contract_when:
    - base_revision_changes
    - writable_scope_changes
    - accepted_decision_changes
    - validation_obligation_changes
    - authorization_expiration_changes

observability:
  program_progress_fields:
    - program
    - current_wave
    - current_task
    - controller_status
    - repository_revisions
    - evidence_added
    - commands_executed
    - validation_result
    - decisions_resolved
    - unknowns_remaining
    - risks_changed
    - next_ready_task
    - approval_required
  evidence_policy:
    append_only: true
    bind_exact_revision: true
    bind_collection_method: true
    bind_environment: true
    bind_producer_and_timestamp: true
    distinguish_fact_intent_inference_recommendation_unknown: true

cutover_and_rollback:
  cutover_authority: exact_human_approval_required
  preconditions:
    - accepted_blueprint
    - valid_program_lock
    - exact_candidate_revision
    - independent_verification
    - all_predecessor_gates_pass
    - current_rollback_proof
  rollback_rules:
    - never_move_a_public_tag
    - never_replace_an_existing_published_package_version
    - preserve_failed_release_and_deployment_evidence
    - use_new_version_when_corrective_source_changes_are_required
    - use_forward_recovery_when_restore_would_discard_valid_transactions
  exact_campaign_rollbacks:
    - "Revert configuration diffs per repository via standard git revert; no remote mutation performed without exact approval."
    - "N/A: no remote or external transition is authorized within this campaign's authorization ceilings."

closeout:
  required_handoff_content:
    - campaign_source_digest
    - blueprint_digest
    - program_lock_digest
    - governance_revision
    - final_target_revisions
    - pull_requests_and_merge_commits
    - tags_releases_publications_and_deployments
    - workflow_runs_and_artifact_hashes
    - completed_failed_cancelled_and_superseded_tasks
    - gate_evaluations
    - accepted_decisions
    - remaining_unknowns_risks_and_waivers
    - rollback_state
    - recommended_terminal_verdict
  controller_may_declare_terminal_verdict: false
  terminal_verdict_authority_id: AUTH-001
