tasks:
  - id: TASK-001
    title: Admit campaign and lock current state
    definition_status: ready
    workstream_id: WS-01
    wave_id: W0
    target_id: TARGET-006
    execution_kind: program_control
    objective: Preserve the source, verify the host, collect target baselines, and lock authority.
    authority_basis_ids: [AUTH-001]
    required_decision_ids: []
    blocking_unknown_ids: []
    input_evidence_ids: [EVID-001]
    actions:
      - preserve_campaign_source
      - verify_governance_host
      - collect_repository_baselines
      - materialize_complete_blueprint
      - validate_blueprint_template_mode
    outputs:
      - id: OUT-001
        type: evidence
        location: CURRENT_STATE_DELTA.yaml
        required: true
      - id: OUT-002
        type: artifact
        location: MANIFEST.yaml
        required: true
    acceptance:
      - id: AC-001
        statement: The immutable source and all target identities are digest-bound and evidenced.
        required_evidence_types: [inspection, digest]
      - id: AC-002
        statement: The complete draft Blueprint passes native v2 template validation.
        required_evidence_types: [test_result]
    validation:
      - id: VAL-001
        method: command
        command_or_inspection: "python scripts/validate_blueprint.py . --mode template"
        environment: blueprint
        expected_result: PASS
    negative_cases:
      - missing_required_host_surface
      - unexplained_dirty_tree
      - duplicate_target_identity
      - source_digest_mismatch
    rollback:
      strategy: discard_unaccepted_generated_blueprint_and_preserve_source
      trigger: admission_or_template_validation_failure
      validation: No target repository or accepted Blueprint was mutated.
    risk:
      tier: T0
      reversibility: fully_reversible
      blast_radius: program_definition
    authorization_ceiling:
      inspect: true
      local_write: true
      commit: false
      push: false
      pull_request: false
      merge: false
      publish_or_release: false
      deploy_or_migrate: false
      destructive_change: false
      external_message: false
    completion_gate_ids: [GATE-001]

  - id: TASK-002
    title: Configuration and safety fixes (Wave 1)
    definition_status: blocked
    workstream_id: WS-02
    wave_id: W1
    target_id: TARGET-001
    execution_kind: repo_local
    objective: >-
      Default Odoo Gate writeback to review-only; require explicit
      organization_id; force L9_CHASSIS=sdk in CEG production; fail CEG
      startup on legacy chassis; align EIE version to 2.3.0; merge Odoo PR
      #141 after install-smoke passes.
    authority_basis_ids: [AUTH-002, AUTH-004, AUTH-005]
    required_decision_ids: []
    blocking_unknown_ids: [UNK-001, UNK-002, UNK-004]
    input_evidence_ids: [EVID-002, EVID-003]
    actions:
      - set_odoo_gate_writeback_review_only_default
      - require_explicit_organization_id_remove_db_name_fallback
      - force_l9_chassis_sdk_in_ceg_production
      - fail_ceg_startup_on_legacy_chassis_in_production
      - align_eie_version_declarations_to_2_3_0
      - merge_odoo_pr_141_after_install_smoke
    outputs:
      - id: OUT-003
        type: artifact
        location: "IB-Odoo_19/plasticos_gate config diff"
        required: true
      - id: OUT-004
        type: artifact
        location: "Cognitive.Engine.Graphs production config diff"
        required: true
      - id: OUT-005
        type: artifact
        location: "Enrichment.Inference.Engine version manifest diff"
        required: true
    acceptance:
      - id: AC-003
        statement: >-
          Odoo cannot auto-write without explicit enablement; tenant ID is
          mandatory; CEG production cannot start on legacy chassis; EIE
          reports one consistent version; Odoo install-smoke passes.
        required_evidence_types: [test_result, diff]
    validation:
      - id: VAL-002
        method: command
        command_or_inspection: "repository-owned install-smoke and startup-fail test suite"
        environment: local
        expected_result: PASS
    negative_cases:
      - odoo_writeback_defaults_to_enabled
      - organization_id_missing_falls_back_to_db_name
      - ceg_starts_on_legacy_chassis_in_production
      - eie_version_declarations_diverge
    rollback:
      strategy: revert_configuration_commits_per_repository
      trigger: validation_failure_or_gate_failure
      validation: Prior safe-default configuration restored and re-verified.
    risk:
      tier: T2
      reversibility: reversible
      blast_radius: multi_target
    authorization_ceiling:
      inspect: true
      local_write: true
      commit: false
      push: false
      pull_request: false
      merge: false
      publish_or_release: false
      deploy_or_migrate: false
      destructive_change: false
      external_message: false
    completion_gate_ids: [GATE-002]

  - id: TASK-003
    title: EIE explicit Gate registration (Wave 2)
    definition_status: blocked
    workstream_id: WS-03
    wave_id: W2
    target_id: TARGET-002
    execution_kind: repo_local
    objective: >-
      Add explicit Gate registration to EIE startup lifecycle declaring
      node_name enrichment-engine, owner eie, execute_path /v1/execute,
      supported_actions [converge, graph-inference-result, enrich,
      enrich-and-sync], health_path /api/v1/health.
    authority_basis_ids: [AUTH-003, AUTH-005]
    required_decision_ids: []
    blocking_unknown_ids: [UNK-005]
    input_evidence_ids: [EVID-005]
    actions:
