decisions:
  - id: DEC-001
    question: >-
      Does CEG candidate.entity_id equal the Odoo res.partner integer ID, a
      Neo4j-native node ID, or a domain-spec-defined key requiring an
      explicit resolver mapping?
    authority_id: AUTH-004
    status: proposed
    options:
      - id: OPTION-A
        description: >-
          entity_id is confirmed equal to res.partner ID; map directly with
          no resolver.
      - id: OPTION-B
        description: >-
          entity_id is a graph-native or domain-spec key; introduce an
          explicit resolver/lookup before mapping to buyer_partner_id.
    recommended_option_id: OPTION-B
    selected_option_id: null
    blocking_task_ids: [TASK-004]
    required_evidence_ids: [EVID-004]

unknowns:
  - id: UNK-001
    statement: >-
      Exact current default value of the Odoo Gate writeback-enablement flag
      in plasticos_gate is not verified from source.
    status: open
    owner: "AUTH-002"
    blocking_task_ids: [TASK-002]
    resolution_method: "Direct repository inspection of plasticos_gate config/models"
    resolution_evidence_ids: [EVID-002]
  - id: UNK-002
    statement: >-
      Exact current CEG tenant-resolution fallback logic (whether it falls
      back to database name) is not verified from source.
    status: open
    owner: "AUTH-004"
    blocking_task_ids: [TASK-002]
    resolution_method: "Direct repository inspection of CEG tenant resolver middleware"
    resolution_evidence_ids: [EVID-003]
  - id: UNK-003
    statement: >-
      Identity contract for candidate.entity_id (see DEC-001) is not
      independently confirmed.
    status: open
    owner: "AUTH-004"
    blocking_task_ids: [TASK-004]
    resolution_method: "Inspect CEG domain-spec schema and contracts/schemas directory"
    resolution_evidence_ids: [EVID-004]
  - id: UNK-004
    statement: >-
      Status of Odoo PR #141 (install-smoke result) is not verified.
    status: open
    owner: "AUTH-002"
    blocking_task_ids: [TASK-002]
    resolution_method: "Inspect PR #141 CI status in IB-Odoo_19"
    resolution_evidence_ids: []
  - id: UNK-005
    statement: >-
      Whether EIE currently implements explicit Gate registration or relies
      on auto_register_with_gate is not verified from source.
    status: open
    owner: "AUTH-003"
    blocking_task_ids: [TASK-003]
    resolution_method: "Inspect EIE app startup lifecycle code"
    resolution_evidence_ids: [EVID-005]

risks:
  - id: RISK-001
    statement: >-
      Wave 3 match mapper may pass frozen-fixture tests while
      candidate.entity_id points to the wrong Odoo res.partner record if
      DEC-001 is resolved incorrectly or skipped.
    tier: T2
    likelihood: possible
    impact: material
    owner: "AUTH-004"
    mitigations:
      - "Block TASK-004 on DEC-001 resolution (identity contract checkpoint)"
      - "Add explicit resolver mapping test asserting buyer identity correctness"
    triggers:
      - "TASK-004 begins before UNK-003 is resolved"
  - id: RISK-002
    statement: >-
      Forcing L9_CHASSIS=sdk without confirming Gate_SDK compatibility could
      break existing production traffic if the SDK chassis path is not
      fully implemented.
    tier: T2
    likelihood: possible
    impact: material
    owner: "AUTH-005"
    mitigations:
      - "Validate SDK chassis in staging before production enforcement"
      - "Stage the startup-fail-on-legacy-chassis behind a feature flag first"
    triggers:
      - "TASK-002 forces SDK chassis before staging validation"
  - id: RISK-003
    statement: >-
      152 quarantined EIE/CEG test failures are explicitly deferred but may
      overlap with converge or match code paths touched by TASK-004/TASK-005.
    tier: T3
    likelihood: possible
    impact: moderate
    owner: "AUTH-003"
    mitigations:
      - "Lightweight triage of quarantined failures against touched files before TASK-006 closeout"
    triggers:
      - "TASK-006 closeout begins without quarantine triage"

waivers: []

prohibited_paths:
  - id: DNB-001
    statement: Do not widen authority downstream of an accepted source contract.
    rationale: Program Execution v2 authority is monotonic and may only narrow.
  - id: DNB-002
    statement: Do not treat worker completion as independent verification.
    rationale: Completion and verification are separate authorities and receipts.
  - id: DNB-003
    statement: Do not place mutable runtime state in Cursor-Governance or target worktrees.
    rationale: Runtime state belongs under the declared external program root.
  - id: DNB-004
    statement: Do not claim remote mutation, publication, release, or deployment without observed evidence.
    rationale: Local intent or command success is not remote event proof.
  - id: DNB-005
    statement: Do not invent candidate.entity_id to res.partner ID mapping without DEC-001 resolution.
    rationale: Unverified identity mapping risks silent buyer misattribution (RISK-001).
  - id: DNB-006
    statement: Do not fabricate EIE response fields (e.g. total_cost_usd) not returned by EIE.
    rationale: Wave 5 explicitly forbids inventing unavailable fields.

workstreams:
  - id: WS-01
    name: authority_and_current_state
    owner: "Igor Beylin"
    objective: Lock authority, target identities, evidence, decisions, Unknowns, and risks.
  - id: WS-02
    name: configuration_and_safety
    owner: "AUTH-002 / AUTH-004 / AUTH-005"
    objective: Execute Wave 1 safety/config fixes across Odoo, CEG, and EIE.
  - id: WS-03
    name: reachability_and_contracts
    owner: "AUTH-003 / AUTH-004 / AUTH-005"
    objective: Execute Wave 2-5 (registration, mapper, fixtures, converge mapping).
  - id: WS-04
    name: validation_and_closeout
    owner: "Igor Beylin"
    objective: Execute Wave 6 round-trip validation and reconcile evidence for handoff.

