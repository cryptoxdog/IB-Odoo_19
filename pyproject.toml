# Odoo 19 ReBoot - Python project configuration
#
# This repo is an Odoo 19 addon suite, not a pip-installable package: there is
# intentionally no [project] or [build-system] table. The [tool.*] sections below
# configure dev/CI tooling only (pytest, ruff, mypy, pyright). Runtime deps live in
# requirements.txt; dev/CI-only deps live in requirements-dev.txt.

[tool.pytest.ini_options]
# Constrain default collection to the pure-Python suite (mirrors CI Tier 3 and
# `make test`). conftest.py auto-deactivates Odoo-importing modules when Odoo
# is not installed, so a bare `pytest` here runs the Odoo-free set only.
testpaths = ["tests"]
# Centralize runner flags so CI (.github/workflows/ci.yml) and `make test` stay in
# sync instead of re-specifying them on every command line.
addopts = "--tb=short --no-header -p no:randomly"
# Do not collect or run tests from these directories (mirrors ruff/mypy excludes).
norecursedirs = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "*.egg-info",
    "docs",
    "addons",
    "tests-odoo",
    "odoo-enterprise",
    "current work - ib",
    "Current Work - IGNORE",
    # Addon trees hold Odoo TransactionCase suites — not for bare pytest /
    # Cursor-Governance `make pr` (`pytest .`). Pure suite is tests/ (CI Tier 3).
    "plasticos_*",
]
# Per-test timeout: fail loudly if a test hangs (e.g. Dropbox filesystem I/O timeout)
# rather than silently dying mid-run and producing incomplete results.
# Tests that legitimately scan many files (test_phantom_enum_values) may need ~30s.
timeout = 30
timeout_method = "thread"  # safe for pytest; doesn't interfere with subprocess tests
# pytest-timeout==2.4.0 required (pip install pytest-timeout==2.4.0)

[tool.ruff]
# Exact pin so local, pre-commit (ruff-pre-commit v0.16.0), and CI (ci.yml:
# ruff==0.16.0) are ALWAYS in lockstep — any other ruff version fails fast rather
# than producing a different lint/format verdict. Bump all three sites together.
required-version = "==0.16.0"
target-version = "py312"
line-length = 120

# Exclude Odoo core and external addons
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "*.egg-info",
    ".semgrep/tests",
    "current work - ib",
    "Current Work - IGNORE",
    "*.md",  # ruff 0.16 formats fenced Python in markdown; docs stay human-owned
]

[tool.ruff.lint]
# Enable common rules, but be lenient for Odoo patterns
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "C90",    # mccabe complexity
    "S",      # flake8-bandit (security) — enforced on production modules; dev/CI/test trees ignored below
    # The families below were measured at ZERO findings repo-wide (ruff 0.15.5) and are
    # enabled as ratchets: they cost nothing today and block regressions going forward.
    "A",      # flake8-builtins — no shadowing of Python builtins
    "FLY",    # flynt — static str.join() that should be an f-string
    "INT",    # flake8-gettext — gettext / translation call correctness
    "LOG",    # flake8-logging — correct logging usage (no f-string in _logger, etc.)
    "YTT",    # flake8-2020 — no brittle sys.version / sys.version_info checks
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "E731",   # lambda assignment (common in Odoo)
    "B008",   # function call in default arg (Odoo fields pattern)
    "B905",   # zip without strict (Python 3.10+)
]

[tool.ruff.lint.mccabe]
# Complexity threshold: 25 catches egregiously complex code while allowing
# typical Odoo business logic. Pre-existing functions at 26-30 need refactoring
# but won't block PRs. Default is 10, strict is 15.
max-complexity = 25

[tool.ruff.lint.isort]
known-first-party = [
    "odoo",
    "odoo.addons",
]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.flake8-bandit]
# Active now that "S" is in select. Kept at the bandit default (False) deliberately:
# we ONLY want S110/S112 to flag dangerous *bare* `except:`/`except Exception: pass`,
# not narrow typed fallbacks like `except ValueError: continue`, which are legitimate
# control flow in the inference/commission engines. Set True only if you also triage
# the ~7 intentional typed-except sites in plasticos_* engines.
check-typed-exception = false

[tool.ruff.lint.per-file-ignores]
# Odoo __init__.py files - imports ARE used by Odoo's model registry
"__init__.py" = ["F401", "I001"]
# __manifest__.py files have bare dicts (Odoo convention)
"__manifest__.py" = ["B018"]
# Test files can have unused variables, assertions, undefined env, and broad exceptions (Odoo pattern).
# "S" (bandit) is ignored: tests legitimately use assert (S101), temp files, and parse trusted fixtures.
"test_*.py" = ["F841", "B011", "F821", "B017", "S"]
"**/tests/*.py" = ["F841", "B011", "F821", "B017", "S"]
# Legacy/forbidden code - don't enforce strict style
"**/forbidden/*.py" = ["UP031", "UP030", "F841", "W291", "W293"]
# Dev tools - relaxed rules (includes complex analysis functions). "S" ignored: dev tooling
# runs subprocess and parses the repo's own (trusted) XML — not a production attack surface.
# UP045 ignored so Optional[] survives when hooks invoke tools with macOS system Python 3.9.
"**/tools/*.py" = ["UP031", "F821", "C901", "S", "UP045"]
# Scripts - utility dev/CI scripts with complex main() functions. "S" ignored: subprocess +
# url-open to known endpoints are inherent to these tools, not runtime code.
"scripts/*.py" = ["C901", "S"]
# CI audit scripts - run subprocess (git/python), parse trusted repo XML, and use assert.
# "S" ignored: these never execute in the Odoo runtime / production attack surface.
"ci/*.py" = ["S"]
# Buyer match engine - _check_gates_strict is complex by nature (26 branches)
# TODO: Refactor into smaller gate-checking functions
"plasticos_buyer_match_engine/models/matcher.py" = ["C901"]
# Enrichment module - complex validation and injection logic
"plasticos_enrichment/models/enrichment_run.py" = ["C901"]
"plasticos_enrichment/models/enrichment_service.py" = ["C901"]
# Intake normalizer - complex validation matrix
"plasticos_intake_normalizer/models/intake_normalizer.py" = ["C901"]
# Transaction module - complex state machine and compliance checks
"plasticos_transaction/models/account_move_inherit.py" = ["C901"]
"plasticos_transaction/models/transaction.py" = ["C901"]
# Web leads - complex classification logic
"plasticos_web_leads/models/classification_engine.py" = ["C901"]
# Partner import wizard - complex import logic
"plasticos_partner_import/wizards/partner_import_wizard.py" = ["C901"]
# Wizards - allow single-letter loop vars for Odoo recordsets
"**/wizards/*.py" = ["E741"]
# Import services - may have unused vars during development
"*_import_service.py" = ["F841"]
# Validation matrices - legacy percent formatting
"*validation_matrix*.py" = ["UP031"]
# AI/ML code - may use percent formatting
"ai_*.py" = ["UP031"]
# Web leads - complex legacy code
"web_lead.py" = ["B007"]
# Transaction docs - unused var during dev
"transaction_docs.py" = ["F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# MYPY TYPE CHECKING
# =============================================================================
[tool.mypy]
python_version = "3.12"
warn_return_any = false  # Too noisy for Odoo (returns recordsets as Any)
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "^tests-odoo/",
    "^tests/",           # Repo-level test utilities (not Odoo module tests)
    "^addons/",
    "^\\.venv/",
    "^venv/",
    "^\\.semgrep/",      # Semgrep fixture snippets (not production)
    ".*/migrations/.*",  # Odoo migration scripts (not regular modules)
    "^scripts/",         # Utility scripts
    "^tools/",           # Repo-level tool scripts
    "^plasticos_dev_tools/",  # Dev tools (relaxed checking)
    "^docs/",            # Harvested/experimental code, not production
    "^Files To Harvest/",  # Legacy/harvested code, not production
]

# Odoo-specific: Be lenient on untyped defs (Odoo models rarely have full types)
disallow_untyped_defs = false
check_untyped_defs = false  # Odoo methods often lack type hints

# Catch common errors
warn_redundant_casts = true
warn_unused_ignores = false  # Too noisy during gradual adoption
no_implicit_optional = false  # Odoo uses None defaults extensively

# Per-module overrides
[[tool.mypy.overrides]]
module = [
    "odoo.*",
    "odoo.addons.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "plasticos_inference_engine.*",
]
ignore_errors = true  # Heavy refactoring in progress

[[tool.mypy.overrides]]
module = [
    "plasticos_web_leads.*",
    "plasticos_enrichment.*",
    "plasticos_buyer_match_engine.*",
]
ignore_errors = true  # Complex Odoo recordset patterns, gradual typing

[[tool.mypy.overrides]]
module = ["plasticos_graph_integration.*"]
ignore_errors = true  # Uses requests; types-requests in CI

# =============================================================================
# PYRIGHT TYPE CHECKING (editor-only; not run in CI/pre-commit)
# =============================================================================
# SSOT for Pyright/basedpyright policy (mode, reporters, excludes). basedpyright
# reads [tool.basedpyright] first, then falls back here — keep one block only.
# Machine-specific Odoo source paths live in .vscode/settings.json (extraPaths),
# not here. Do not set venvPath/venv — a missing .venv makes Cursor Pyright fail
# workspace settings resolution. Interpreter is python.defaultInterpreterPath.
# See .cursor/rules/88-plasticos-odoo-python-tooling.mdc.
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingModuleSource = false
# ORM: self.env["x"], fields, @api.* are dynamically typed — keep Unknown reporters off.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportOptionalMemberAccess = "warning"
reportGeneralTypeIssues = "warning"
exclude = [
    "**/__pycache__",
    ".venv",
    "venv",
    "addons",
    "tests-odoo",
    "docs",
    "odoo-enterprise",
    "current work - ib",
    "Current Work - IGNORE",
]

# =============================================================================
# ODOO-SPECIFIC PATTERNS TO GREP FOR (not catchable by ruff/mypy, use grep/CI script)
# =============================================================================
# These patterns cause Odoo 19 runtime errors but static analysis can't detect them.
# Add to CI as grep checks or use odoo --test-enable
#
# 1. models.Constraint (INVALID - does not exist in any Odoo version)
#    grep -r "models\.Constraint(" --include="*.py"
#    Fix: Convert to _sql_constraints = [("name", "SQL", "message"), ...]
#
# 2. @api.depends("id") (disallowed in Odoo 19)
#    grep -r '@api.depends.*"id"' --include="*.py"
#    Fix: Remove "id" from depends list
#
# 3. @api.one / @api.multi (removed in Odoo 13+)
#    grep -r "@api.one\|@api.multi" --include="*.py"
#    Fix: Remove decorator, update method signature
#
# 4. category_id on res.groups (removed in Odoo 19)
#    grep -r 'category_id.*ref=' --include="*.xml"
#    Fix: Remove category_id field from group records
#
# 5. numbercall on ir.cron (deprecated)
#    grep -r "numbercall" --include="*.xml"
#    Fix: Remove field
# =============================================================================

# =============================================================================
# COVERAGE (coverage.py / pytest-cov)
# =============================================================================
# ADVISORY ONLY. The CI Tier 3 "pure-Python" suite does not import the Odoo
# addons (conftest.py deactivates Odoo-importing tests when Odoo is absent), so
# this measures the Odoo-free tooling/logic exercised by that suite — NOT the
# plasticos_* runtime modules. Authoritative module coverage belongs to the Odoo
# runtime tier (odoo --test-enable on Odoo.sh). No fail_under gate is set here on
# purpose: enable one in CI only after a real baseline is observed, then ratchet.
[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    ".venv/*",
    "venv/*",
    "addons/*",
    "tests-odoo/*",
    "odoo-enterprise/*",
    "docs/*",
    "*/migrations/*",
    # Odoo addon code is never imported by the pure-Python tier (conftest deactivates
    # Odoo tests), so measuring it here yields a misleading ~0%. Omit it; real module
    # coverage comes from the Odoo runtime tier. This keeps the advisory report focused
    # on the Odoo-free tooling (ci/, scripts/, tools/) the suite actually exercises.
    "plasticos_*/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Do NOT set fail_under here until a CI baseline exists; a premature threshold
# would block merges on a metric the pure-Python tier cannot meaningfully raise.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
