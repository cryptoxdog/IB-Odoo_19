# Odoo 19 ReBoot - Python project configuration

[tool.ruff]
target-version = "py312"
line-length = 120

# Exclude Odoo core and external addons
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable common rules, but be lenient for Odoo patterns
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "E731",   # lambda assignment (common in Odoo)
    "B008",   # function call in default arg (Odoo fields pattern)
    "B905",   # zip without strict (Python 3.10+)
]

[tool.ruff.lint.isort]
known-first-party = [
    "odoo",
    "odoo.addons",
]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.flake8-bandit]
# Security checks
check-typed-exception = true

[tool.ruff.lint.per-file-ignores]
# __manifest__.py files have bare dicts (Odoo convention)
"__manifest__.py" = ["B018"]
# Test files can have unused variables, assertions, undefined env
"test_*.py" = ["F841", "B011", "F821"]
"**/tests/*.py" = ["F841", "B011", "F821"]
# Legacy/forbidden code - don't enforce strict style
"**/forbidden/*.py" = ["UP031", "UP030", "F841", "W291", "W293"]
# Dev tools - relaxed rules
"**/tools/*.py" = ["UP031", "F821"]
# Wizards - allow single-letter loop vars for Odoo recordsets
"**/wizards/*.py" = ["E741"]
# Import services - may have unused vars during development
"*_import_service.py" = ["F841"]
# Validation matrices - legacy percent formatting
"*validation_matrix*.py" = ["UP031"]
# AI/ML code - may use percent formatting
"ai_*.py" = ["UP031"]
# Web leads - complex legacy code
"web_lead.py" = ["B007"]
# Automation models - legacy percent formatting
"**/automation/models/*.py" = ["UP031"]
"*_automation.py" = ["UP031"]
"*_approval.py" = ["UP031"]
"*_alert.py" = ["UP031"]
# Transaction docs - unused var during dev
"transaction_docs.py" = ["F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
