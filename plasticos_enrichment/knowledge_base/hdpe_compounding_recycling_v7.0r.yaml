# MACK Knowledge Base: HDPE (High-Density Polyethylene) Compounding & Recycling v7.0r
# Purpose: Enable MACK reasoning for HDPE material identification and buyer matching
# Compatible with: MACK v7.0 Odoo reasoning engine
# Last Updated: 2025-11-05
# Data Sources: ASTM D3350, D1248, comprehensive HDPE recycling research

metadata:
  polymer_family: "Polyolefins"
  polymer_type: "HDPE"
  full_name: "High-Density Polyethylene"
  resin_id_code: 2
  structure: "Linear backbone with minimal branching, high crystallinity"
  version: "7.0r"
  last_updated: "2025-11-05"
  data_quality: "verified"
  source_tier: "tier_1"
  note: "Second most common plastic - bottles, pipes, containers"

# ============================================================================
# PRODUCT-TO-SCRAP MAPPING (Bidirectional Reasoning)
# ============================================================================

product_scrap_mapping:
  packaging_products:
    - product: "Milk jugs and beverage bottles"
      scrap_grade: "hdpe_blow_molding"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 3.0]
      typical_contaminants: ["labels <0.5%", "caps (PP) <1%", "residue 1-2%"]
      suitable_buyers: ["blow_molding_non_food", "extrusion_pipe", "injection_molders"]
      reverse_reasoning: "IF buyer_needs_bottles THEN source_hdpe_blow_molding_tier2_tier3_non_food"
      note: "Food contact scrap → non-food applications only"

    - product: "Detergent and chemical bottles"
      scrap_grade: "hdpe_blow_molding"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [2.0, 5.0]
      typical_contaminants: ["chemical residue 1-3%", "labels <1%", "colorants"]
      suitable_buyers: ["blow_molding_industrial", "extrusion_pipe_non_pressure"]

    - product: "Caps and closures"
      scrap_grade: "hdpe_injection"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [0.5, 2.0]
      typical_contaminants: ["minimal - clean manufacturing"]
      suitable_buyers: ["injection_molders", "blow_molding_manufacturers"]

  pipe_products:
    - product: "Pressure pipe (water, gas)"
      scrap_grade: "hdpe_extrusion_pe4710"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [0.5, 2.0]
      typical_contaminants: ["dirt <1%", "minimal contamination"]
      suitable_buyers: ["pipe_manufacturers_pressure", "pipe_manufacturers_non_pressure"]
      reverse_reasoning: "IF buyer_needs_pressure_pipe THEN source_hdpe_extrusion_pe4710_tier1_tier2"
      note: "Pressure pipe requires PE4710 or PE100 grade"

    - product: "Drainage and corrugated pipe"
      scrap_grade: "hdpe_extrusion_pe3408"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [2.0, 5.0]
      typical_contaminants: ["dirt 1-3%", "organic matter 1-2%"]
      suitable_buyers: ["pipe_manufacturers_non_pressure", "extrusion_profile"]

    - product: "Conduit and cable jacketing"
      scrap_grade: "hdpe_extrusion"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 3.0]
      suitable_buyers: ["extrusion_manufacturers", "pipe_manufacturers_non_pressure"]

  industrial_products:
    - product: "Industrial containers and drums"
      scrap_grade: "hdpe_blow_molding"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [2.0, 5.0]
      typical_contaminants: ["chemical residue 1-3%", "labels <1%"]
      suitable_buyers: ["blow_molding_industrial", "extrusion_pipe_non_pressure"]

    - product: "Pallets and crates"
      scrap_grade: "hdpe_injection or hdpe_extrusion"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [3.0, 8.0]
      typical_contaminants: ["dirt 2-5%", "oils <1%", "mixed colors"]
      suitable_buyers: ["injection_molders_industrial", "extrusion_profile"]

    - product: "Geomembranes and liners"
      scrap_grade: "hdpe_extrusion_hmw"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [1.0, 3.0]
      typical_contaminants: ["dirt 1-2%", "minimal"]
      suitable_buyers: ["extrusion_manufacturers_hmw", "geomembrane_manufacturers"]

  automotive_products:
    - product: "Automotive fuel tanks"
      scrap_grade: "hdpe_blow_molding"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [2.0, 5.0]
      typical_contaminants: ["fuel residue 1-3%", "additives <1%"]
      suitable_buyers: ["blow_molding_industrial", "extrusion_manufacturers"]
      note: "Requires washing to remove fuel residue"

    - product: "Automotive components (non-visible)"
      scrap_grade: "hdpe_injection"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 3.0]
      suitable_buyers: ["injection_molders_automotive", "injection_molders_industrial"]

  manufacturing_scrap:
    - product: "Injection molding PIR (runners, sprues)"
      scrap_grade: "hdpe_injection"
      scrap_quality_tier: [1]
      typical_contamination_pct: [0.1, 0.5]
      typical_contaminants: ["minimal - clean manufacturing"]
      suitable_buyers: ["all_hdpe_injection_buyers"]
      reverse_reasoning: "IF buyer_needs_high_quality_hdpe THEN source_injection_pir_tier1"
      note: "Injection PIR is highest quality HDPE scrap - premium value"

    - product: "Pipe extrusion PIR"
      scrap_grade: "hdpe_extrusion_pe4710"
      scrap_quality_tier: [1]
      typical_contamination_pct: [0.1, 0.5]
      suitable_buyers: ["pipe_manufacturers", "extrusion_manufacturers"]

    - product: "Blow molding PIR"
      scrap_grade: "hdpe_blow_molding"
      scrap_quality_tier: [1]
      typical_contamination_pct: [0.1, 0.5]
      suitable_buyers: ["blow_molding_manufacturers", "injection_molders"]

# ============================================================================
# SOURCE QUALITY TIER DEFINITIONS (HDPE-Specific)
# ============================================================================

source_quality_tiers:
  tier_1_premium:
    definition: "Manufacturing PIR, single-source, minimal contamination, known grade"
    contamination_max_pct: 0.5
    pp_contamination_max_pct: 0.5
    pet_contamination_max_ppm: 25
    pvc_contamination_max_ppm: 100
    moisture_max_ppm: 100
    ash_max_pct: 0.5
    dirt_max_pct: 0.1
    property_retention_min_pct: 95
    sorting_purity_min_pct: 99
    processing_history: "Single cycle or virgin manufacturing scrap"
    mi_change_max_pct: 20
    examples:
      - "Injection molding PIR (runners, sprues)"
      - "Pipe extrusion PIR"
      - "Blow molding PIR"
      - "Manufacturing trim and edge scrap"
    suitable_applications:
      - "Pressure pipe (PE4710, PE100)"
      - "Food contact (indirect)"
      - "Automotive visible components"
      - "Premium bottles and containers"
    value_premium_pct: [25, 40]

  tier_2_standard:
    definition: "Post-industrial or sorted post-consumer, moderate contamination"
    contamination_max_pct: 3.0
    pp_contamination_max_pct: 3.0
    pet_contamination_max_ppm: 200
    pvc_contamination_max_ppm: 1000
    moisture_max_ppm: 350
    ash_max_pct: 1.5
    dirt_max_pct: 0.5
    property_retention_min_pct: 80
    sorting_purity_min_pct: 85
    processing_history: "1-3 recycling cycles"
    mi_change_max_pct: 50
    examples:
      - "Sorted post-consumer bottles (washed)"
      - "Post-consumer caps and closures"
      - "Industrial containers (used)"
      - "Pipe scrap (sorted)"
    suitable_applications:
      - "Non-pressure pipe"
      - "Bottles and containers (non-food)"
      - "Industrial parts"
      - "Consumer goods"
    value_premium_pct: [0, 0]

  tier_3_utility:
    definition: "Mixed post-consumer, higher contamination, multiple cycles"
    contamination_max_pct: 8.0
    pp_contamination_max_pct: 5.0
    pet_contamination_max_ppm: 300
    pvc_contamination_max_ppm: 1000
    moisture_max_ppm: 500
    ash_max_pct: 2.0
    dirt_max_pct: 0.8
    property_retention_min_pct: 65
    sorting_purity_min_pct: 70
    processing_history: "3-6 recycling cycles or unknown"
    mi_change_max_pct: 100
    examples:
      - "Mixed post-consumer HDPE (unsorted)"
      - "Contaminated packaging waste"
      - "General waste stream HDPE"
      - "Pallets and crates (used, contaminated)"
    suitable_applications:
      - "Drainage pipe (non-critical)"
      - "Industrial applications (non-critical)"
      - "Construction materials"
      - "Low-value consumer goods"
    value_discount_pct: [40, 55]

  tier_4_marginal:
    definition: "Heavily contaminated, degraded, multiple unknown cycles"
    contamination_min_pct: 8.0
    property_retention_max_pct: 65
    processing_history: ">6 cycles or severely degraded"
    examples:
      - "Heavily contaminated mixed plastic waste"
      - "Degraded geomembranes"
      - "Mixed polymer waste streams"
    suitable_applications:
      - "Chemical recycling feedstock"
      - "Pyrolysis feedstock"
      - "Very limited mechanical recycling"
    value_discount_pct: [70, 85]

# ============================================================================
# MATERIAL PROPERTIES & GRADES
# ============================================================================

material_grades:
  - grade_id: "HDPE_INJECTION_MOLDING"
    grade_name: "HDPE Injection Molding Grade"
    description: "Standard HDPE for injection molding applications"
    type: "virgin"

    melt_index:
      injection_g_10min: [8, 34]
      test_conditions: "190°C/2.16kg"
      test_method: "ASTM D1238"

    density:
      value_g_cm3: [0.952, 0.965]
      test_method: "ASTM D792"
      note: "Higher density = increased stiffness and chemical resistance"

    mechanical_properties:
      tensile_strength_mpa: [22, 31]
      flexural_modulus_mpa: [1000, 1400]
      impact_strength_j_m: [25, 60]
      escr_hours: [1000, 5000]

    thermal_properties:
      melting_point_c: [125, 135]
      processing_temp_c: [180, 220]
      mold_temp_c: [20, 60]

    applications:
      primary:
        - product: "Housewares and containers"
          scrap_source: "Manufacturing PIR, post-consumer"
          quality_tier_required: [2, 3]
        - product: "Automotive components"
          scrap_source: "Automotive manufacturing, end-of-life vehicles"
          quality_tier_required: [2, 3]
        - product: "Caps and closures"
          scrap_source: "Packaging manufacturing PIR, post-consumer sorted"
          quality_tier_required: [1, 2]

    pcr_compatibility:
      max_pcr_pct: 50
      typical_pcr_pct: [15, 50]
      limitations: "Color consistency, property uniformity"

  - grade_id: "HDPE_EXTRUSION_PE4710"
    grade_name: "HDPE Extrusion PE4710 (Pressure Pipe)"
    description: "High performance HDPE for pressure pipe applications"
    type: "virgin"

    melt_index:
      pipe_g_10min: [0.05, 0.4]
      test_conditions: "190°C/2.16kg"
      test_method: "ASTM D1238"
      note: "Low MI for high molecular weight and strength"

    density:
      value_g_cm3: [0.941, 0.965]
      classification: "PE4710"
      test_method: "ASTM D792"

    mechanical_properties:
      hydrostatic_design_basis_psi: [800, 1600]
      slow_crack_growth_resistance_hours: 500
      oxidative_induction_time_min: 20

    thermal_properties:
      processing_temp_c: [160, 220]
      die_temp_c: [180, 210]

    applications:
      primary:
        - product: "Pressure pipe (water, gas)"
          scrap_source: "Pipe manufacturing PIR, infrastructure"
          quality_tier_required: [1, 2]
          note: "Requires PE4710 or PE100 certification"
        - product: "Utility pipe systems"
          scrap_source: "Pipe manufacturing, construction"
          quality_tier_required: [1, 2]

    pcr_compatibility:
      max_pcr_pct: 30
      typical_pcr_pct: [10, 30]
      note: "Low PCR for pressure applications due to safety requirements"

    certifications_required:
      - "ASTM D3350 PE4710"
      - "NSF 61 (potable water)"
      - "ISO 4427"

  - grade_id: "HDPE_EXTRUSION_PE3408"
    grade_name: "HDPE Extrusion PE3408 (Non-Pressure)"
    description: "Lower density HDPE for drainage and non-pressure applications"
    type: "virgin"

    melt_index:
      extrusion_g_10min: [0.2, 2.0]
      test_conditions: "190°C/2.16kg"

    density:
      value_g_cm3: [0.930, 0.940]
      classification: "PE3408"
      note: "Lower density provides higher flexibility"

    applications:
      primary:
        - product: "Drainage and corrugated pipe"
          scrap_source: "Pipe manufacturing, construction"
          quality_tier_required: [2, 3]
        - product: "Conduit and cable jacketing"
          scrap_source: "Manufacturing PIR, telecommunications"
          quality_tier_required: [2, 3]

    pcr_compatibility:
      max_pcr_pct: 95
      typical_pcr_pct: [30, 95]
      note: "High PCR acceptable for non-pressure applications"

  - grade_id: "HDPE_BLOW_MOLDING"
    grade_name: "HDPE Blow Molding Grade"
    description: "HDPE for bottles, containers, and hollow products"
    type: "virgin"

    melt_index:
      extrusion_blow_g_10min: [0.2, 0.8]
      injection_blow_g_10min: [0.3, 1.5]
      test_conditions: "190°C/2.16kg"

    density:
      value_g_cm3: [0.950, 0.965]
      high_stiffness_g_cm3: [0.960, 0.970]

    mechanical_properties:
      escr_hours: 100
      drop_impact: "Meets FDA requirements"
      barrier_properties: "Low permeability to moisture and gases"

    thermal_properties:
      parison_temp_c: [180, 200]
      blow_pressure_mpa: [0.5, 1.0]

    applications:
      primary:
        - product: "Milk jugs and beverage bottles"
          scrap_source: "Post-consumer sorted, manufacturing PIR"
          quality_tier_required: [2, 3]
          note: "Food contact scrap → non-food applications only"
        - product: "Detergent and chemical bottles"
          scrap_source: "Post-consumer, manufacturing PIR"
          quality_tier_required: [2, 3]
        - product: "Industrial containers"
          scrap_source: "Industrial use, manufacturing PIR"
          quality_tier_required: [2, 3]
        - product: "Automotive fuel tanks"
          scrap_source: "Automotive manufacturing, end-of-life vehicles"
          quality_tier_required: [2, 3]

    pcr_compatibility:
      food_contact_pct: [10, 15]
      non_food_pct: [20, 60]
      note: "FDA regulations limit PCR for food contact"

  - grade_id: "HDPE_HMW"
    grade_name: "High Molecular Weight HDPE (HMW-HDPE)"
    description: "Ultra-high strength HDPE for demanding applications"
    type: "virgin"

    melt_index:
      ultra_low_g_10min: [0.01, 0.1]
      low_g_10min: [0.1, 0.3]
      test_conditions: "190°C/2.16kg"
      note: "Ultra-low MI indicates very high molecular weight"

    density:
      value_g_cm3: [0.935, 0.965]
      high_performance_g_cm3: [0.950, 0.965]

    molecular_weight:
      mw_g_mol: 200000
      mwd: [8, 15]
      note: "Broad molecular weight distribution"

    mechanical_properties:
      impact_strength_j_m: 100
      escr_hours: 5000
      abrasion_resistance: "50-100% better than standard HDPE"

    thermal_properties:
      processing_temp_c: [200, 250]
      note: "High torque requirements due to high melt viscosity"

    applications:
      primary:
        - product: "Large diameter pipe (>24 inches)"
          scrap_source: "Pipe manufacturing PIR, infrastructure"
          quality_tier_required: [1, 2]
        - product: "Geomembranes and liners"
          scrap_source: "Manufacturing PIR, construction"
          quality_tier_required: [1, 2]
        - product: "Marine applications"
          scrap_source: "Manufacturing PIR, marine industry"
          quality_tier_required: [1, 2]

    pcr_compatibility:
      max_pcr_pct: 40
      typical_pcr_pct: [10, 40]
      note: "Molecular weight distribution sensitivity - strict contamination control"

    recycling_challenges:
      high_torque_processing: "Requires specialized high-torque extruders"
      mw_distribution_sensitivity: "PCR affects molecular weight distribution"
      strict_contamination_control: "Extremely low contamination tolerance"

# ============================================================================
# RECYCLING RULES & CONTAMINATION PROFILES
# ============================================================================

recycling_rules:
  - rule_id: "HDPE_REGRIND_RETENTION_CYCLES"
    material_type: "HDPE"
    rule: "HDPE retains ~65% properties after 3 regrind cycles"
    reasoning: "After 3 cycles: tensile -35%, impact -40%, MI -40%. Property retention 65%. Blend with virgin or use compatibilizer to restore performance."
    confidence: 0.92
    property_retention_pct: 65
    cycles: 3

  - rule_id: "HDPE_PP_CONTAMINATION_TOLERANCE"
    material_type: "HDPE"
    rule: "PP contamination ≤5% acceptable with compatibilizer (MAPE)"
    reasoning: "PP contamination ≤5 wt% causes negligible property loss when compatibilizer (MAPE) present. Beyond 5%, stiffness and HDT decline."
    confidence: 0.91
    pp_contamination_max_pct: 5.0
    compatibilizer_required: true

  - rule_id: "HDPE_PVC_ZERO_TOLERANCE"
    material_type: "HDPE"
    rule: "PVC contamination >0.1% causes HCl evolution and corrosion"
    reasoning: "PVC contamination >0.1 wt% causes HCl evolution above 200°C, leading to equipment corrosion and toxic off-gassing. Zero tolerance for safety."
    confidence: 0.98
    pvc_contamination_max_ppm: 1000
    safety_critical: true
    action: "reject_or_reroute_to_washing"

  - rule_id: "HDPE_MOISTURE_CONTROL"
    material_type: "HDPE"
    rule: "Moisture >500 ppm causes bubbles and surface defects"
    reasoning: "HDPE not hygroscopic but moisture contamination >500 ppm causes processing defects. Drying recommended for quality applications."
    confidence: 0.88
    moisture_max_ppm: 500
    drying_recommended: true

  - rule_id: "HDPE_INJECTION_PIR_PREMIUM"
    material_type: "HDPE"
    rule: "Injection molding PIR is highest quality HDPE scrap - Tier 1"
    reasoning: "Injection PIR (runners, sprues): clean, single grade, known MI, minimal contamination (<0.5%), 95%+ property retention. Premium value 25-40% above market."
    confidence: 0.95
    pir_characteristics:
      contamination_pct: [0.1, 0.5]
      quality_tier: 1
      property_retention_pct: [95, 100]
      value_premium_pct: [25, 40]

  - rule_id: "HDPE_FOOD_CONTACT_RESTRICTION"
    material_type: "HDPE"
    rule: "Post-consumer food contact HDPE cannot be reused for direct food contact"
    reasoning: "FDA regulations restrict PCR from food contact applications. Route to indirect food contact (10-15% PCR) or non-food applications (20-100% PCR)."
    confidence: 0.98
    restriction: "food_contact_pcr → non_food_or_indirect_only"
    pcr_limits:
      direct_food_contact_pct: 0
      indirect_food_contact_pct: [10, 15]
      non_food_pct: [20, 100]

contamination_profiles:
  - profile_id: "HDPE_INJECTION_PIR"
    material_type: "HDPE"
    source: "Injection molding PIR (runners, sprues)"
    contamination_level: "minimal"
    quality_tier: 1
    typical_contaminants:
      - "Minimal - clean manufacturing environment"
      - "Possible colorants: <0.1%"
    sorting_purity_pct: 99
    suitable_applications:
      - "All HDPE injection molding applications"
      - "Food contact (indirect)"
      - "Automotive components"

  - profile_id: "HDPE_POST_CONSUMER_BOTTLES"
    material_type: "HDPE"
    source: "Post-consumer bottles (sorted, washed)"
    contamination_level: "low-medium"
    quality_tier: 2
    typical_contaminants:
      - "Labels: <0.5%"
      - "Caps (PP): <1%"
      - "Residue: 1-2%"
      - "PP contamination: 1-2%"
    sorting_purity_pct: 85
    processing_requirements:
      washing: "required"
      drying: "recommended"
    suitable_applications:
      - "Bottles and containers (non-food)"
      - "Non-pressure pipe"
      - "Industrial parts"

  - profile_id: "HDPE_PIPE_SCRAP"
    material_type: "HDPE"
    source: "Pipe scrap (construction, infrastructure)"
    contamination_level: "low-medium"
    quality_tier: 2
    typical_contaminants:
      - "Dirt: 1-2%"
      - "Minimal contamination"
    sorting_purity_pct: 90
    suitable_applications:
      - "Non-pressure pipe"
      - "Extrusion applications"
      - "Industrial parts"

  - profile_id: "HDPE_MIXED_POST_CONSUMER"
    material_type: "HDPE"
    source: "Mixed post-consumer HDPE (unsorted)"
    contamination_level: "high"
    quality_tier: 3
    typical_contaminants:
      - "Dirt: 2-5%"
      - "PP contamination: 3-5%"
      - "Mixed colors"
      - "Labels and adhesives: 1-2%"
    sorting_purity_pct: 70
    suitable_applications:
      - "Drainage pipe (non-critical)"
      - "Industrial applications (non-critical)"
      - "Construction materials"

