# MACK Knowledge Base: TPE (Thermoplastic Elastomer) Compounding & Recycling v7.0r
# Purpose: Enable MACK reasoning for TPE material identification and buyer matching
# Compatible with: MACK v7.0 Odoo reasoning engine
# Last Updated: 2025-11-05
# Data Sources: TPE industry research, automotive/medical standards

metadata:
  polymer_family: "Thermoplastic Elastomers"
  polymer_type: "TPE"
  full_name: "Thermoplastic Elastomer"
  common_types: "TPE-S, TPE-O, TPE-U, TPE-V, TPE-A"
  structure: "Block copolymer with soft and hard segments"
  version: "7.0r"
  last_updated: "2025-11-05"
  data_quality: "verified"
  source_tier: "tier_2"
  note: "Flexible material - automotive, medical, consumer goods"

# ============================================================================
# PRODUCT-TO-SCRAP MAPPING (Bidirectional Reasoning)
# ============================================================================

product_scrap_mapping:
  automotive_products:
    - product: "Automotive seals and gaskets"
      scrap_grade: "tpe_v or tpe_o"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 3.0]
      typical_contaminants: ["oils <1%", "dirt <2%"]
      suitable_buyers: ["automotive_tier2", "industrial_seals"]
      reverse_reasoning: "IF buyer_needs_automotive_seals THEN source_tpe_v_tier2_tier3"

    - product: "Automotive soft-touch interior (dashboard, door panels)"
      scrap_grade: "tpe_s or tpe_o"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [2.0, 5.0]
      typical_contaminants: ["adhesives <1%", "coatings <2%"]
      suitable_buyers: ["automotive_tier2", "consumer_goods"]

    - product: "Automotive weather stripping"
      scrap_grade: "tpe_v"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [2.0, 5.0]
      suitable_buyers: ["automotive_tier2", "industrial_applications"]

  medical_products:
    - product: "Medical tubing and catheters"
      scrap_grade: "tpe_u or tpe_s_medical"
      scrap_quality_tier: [1]
      typical_contamination_pct: [0.1, 0.5]
      typical_contaminants: ["minimal - medical PIR only"]
      suitable_buyers: ["medical_device_manufacturers"]
      reverse_reasoning: "IF buyer_needs_medical_devices THEN source_medical_tpe_pir_tier1_only"
      note: "Medical PIR only - post-consumer medical waste not recyclable"

  consumer_products:
    - product: "Footwear (soles, insoles)"
      scrap_grade: "tpe_s or tpe_o"
      scrap_quality_tier: [3, 4]
      typical_contamination_pct: [5.0, 15.0]
      typical_contaminants: ["dirt 3-10%", "adhesives 1-3%"]
      suitable_buyers: ["footwear_manufacturers", "downcycled_applications"]

    - product: "Consumer electronics (grips, cases)"
      scrap_grade: "tpe_s or tpe_o"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [2.0, 5.0]
      suitable_buyers: ["consumer_electronics", "consumer_goods"]

    - product: "Toothbrush handles and grips"
      scrap_grade: "tpe_s"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 3.0]
      suitable_buyers: ["consumer_goods", "industrial_applications"]

  industrial_products:
    - product: "Industrial hoses and tubing"
      scrap_grade: "tpe_u or tpe_v"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [2.0, 5.0]
      typical_contaminants: ["oils 1-3%", "chemicals <2%"]
      suitable_buyers: ["industrial_hose_manufacturers", "industrial_applications"]

  manufacturing_scrap:
    - product: "Injection molding PIR (runners, sprues)"
      scrap_grade: "any_tpe_grade"
      scrap_quality_tier: [1]
      typical_contamination_pct: [0.1, 0.5]
      typical_contaminants: ["minimal - clean manufacturing"]
      suitable_buyers: ["all_tpe_buyers"]
      reverse_reasoning: "IF buyer_needs_high_quality_tpe THEN source_injection_pir_tier1"
      note: "Injection PIR is highest quality TPE scrap"

# ============================================================================
# SOURCE QUALITY TIER DEFINITIONS (TPE-Specific)
# ============================================================================

source_quality_tiers:
  tier_1_premium:
    definition: "Manufacturing PIR, single-source, minimal contamination, known type"
    contamination_max_pct: 0.5
    other_polymer_max_pct: 1.0
    property_retention_min_pct: 95
    sorting_purity_min_pct: 99
    processing_history: "Single cycle or virgin manufacturing scrap"
    examples:
      - "Injection molding PIR"
      - "Medical device manufacturing PIR"
      - "Automotive component manufacturing scrap"
    suitable_applications:
      - "Medical devices"
      - "Automotive visible components"
      - "Premium consumer goods"
    value_premium_pct: [25, 40]

  tier_2_standard:
    definition: "Post-industrial or sorted post-consumer, moderate contamination"
    contamination_max_pct: 3.0
    other_polymer_max_pct: 3.0
    property_retention_min_pct: 80
    sorting_purity_min_pct: 85
    processing_history: "1-3 recycling cycles"
    examples:
      - "Sorted automotive components"
      - "Consumer electronics (sorted)"
      - "Industrial parts (used)"
    suitable_applications:
      - "Automotive interior (non-visible)"
      - "Consumer goods"
      - "Industrial applications"
    value_premium_pct: [0, 0]

  tier_3_utility:
    definition: "Mixed post-consumer, higher contamination"
    contamination_max_pct: 8.0
    other_polymer_max_pct: 5.0
    property_retention_min_pct: 65
    sorting_purity_min_pct: 70
    processing_history: "3-6 recycling cycles or unknown"
    examples:
      - "Mixed post-consumer TPE"
      - "Footwear waste"
      - "General waste stream TPE"
    suitable_applications:
      - "Low-value consumer goods"
      - "Industrial applications (non-critical)"
    value_discount_pct: [40, 55]

  tier_4_marginal:
    definition: "Heavily contaminated, degraded"
    contamination_min_pct: 8.0
    property_retention_max_pct: 65
    processing_history: ">6 cycles or severely degraded"
    examples:
      - "Heavily contaminated footwear waste"
      - "Mixed polymer waste streams"
    suitable_applications:
      - "Chemical recycling feedstock"
      - "Very limited mechanical recycling"
    value_discount_pct: [70, 85]

# ============================================================================
# MATERIAL PROPERTIES & GRADES
# ============================================================================

material_grades:
  - grade_id: "TPE_S_STYRENIC"
    grade_name: "TPE-S (Styrenic Block Copolymer)"
    description: "SBS, SEBS - most common TPE type"
    type: "virgin"
    common_types: ["SBS", "SEBS", "SIS"]

    mechanical_properties:
      hardness_shore_a: [20, 95]
      tensile_strength_mpa: [5, 30]
      elongation_at_break_pct: [300, 800]

    thermal_properties:
      service_temp_c: [-40, 90]
      processing_temp_c: [180, 230]

    applications:
      primary:
        - product: "Automotive soft-touch interior"
          scrap_source: "Automotive manufacturing, end-of-life vehicles"
          quality_tier_required: [2, 3]
        - product: "Consumer electronics grips"
          scrap_source: "Electronics manufacturing, post-consumer"
          quality_tier_required: [2, 3]
        - product: "Footwear soles"
          scrap_source: "Footwear manufacturing, post-consumer"
          quality_tier_required: [3, 4]
        - product: "Toothbrush handles"
          scrap_source: "Consumer goods manufacturing"
          quality_tier_required: [2, 3]

    pcr_compatibility:
      max_pcr_pct: 50
      typical_pcr_pct: [15, 50]

  - grade_id: "TPE_V_VULCANIZATE"
    grade_name: "TPE-V (Thermoplastic Vulcanizate)"
    description: "TPV, EPDM/PP blend - excellent weather resistance"
    type: "virgin"

    mechanical_properties:
      hardness_shore_a: [40, 90]
      tensile_strength_mpa: [8, 18]
      compression_set_pct: [20, 40]

    thermal_properties:
      service_temp_c: [-50, 135]
      processing_temp_c: [190, 230]

    applications:
      primary:
        - product: "Automotive seals and gaskets"
          scrap_source: "Automotive manufacturing, end-of-life vehicles"
          quality_tier_required: [2, 3]
        - product: "Automotive weather stripping"
          scrap_source: "Automotive manufacturing, end-of-life vehicles"
          quality_tier_required: [2, 3]

    pcr_compatibility:
      max_pcr_pct: 40
      typical_pcr_pct: [10, 40]

  - grade_id: "TPE_O_OLEFINIC"
    grade_name: "TPE-O (Olefinic Thermoplastic Elastomer)"
    description: "PP/EPDM blend - good chemical resistance"
    type: "virgin"

    applications:
      primary:
        - product: "Automotive interior components"
          scrap_source: "Automotive manufacturing"
          quality_tier_required: [2, 3]
        - product: "Consumer goods"
          scrap_source: "Manufacturing PIR, post-consumer"
          quality_tier_required: [2, 3]

    pcr_compatibility:
      max_pcr_pct: 50
      typical_pcr_pct: [15, 50]

  - grade_id: "TPE_U_POLYURETHANE"
    grade_name: "TPE-U (Thermoplastic Polyurethane)"
    description: "TPU - excellent abrasion resistance"
    type: "virgin"
    note: "See separate TPU KB for detailed information"

    applications:
      primary:
        - product: "Medical tubing"
          scrap_source: "Medical device manufacturing PIR"
          quality_tier_required: [1]
        - product: "Industrial hoses"
          scrap_source: "Industrial manufacturing, post-consumer"
          quality_tier_required: [2, 3]

    pcr_compatibility:
      max_pcr_pct: 30
      typical_pcr_pct: [10, 30]

# ============================================================================
# RECYCLING RULES & CONTAMINATION PROFILES
# ============================================================================

recycling_rules:
  - rule_id: "TPE_TYPE_SEPARATION"
    material_type: "TPE"
    rule: "Different TPE types (TPE-S, TPE-V, TPE-O, TPE-U) should be separated"
    reasoning: "Different TPE types have different base polymers and processing requirements. Mixed types reduce property consistency."
    confidence: 0.85
    separation_recommended: true

  - rule_id: "TPE_INJECTION_PIR_PREMIUM"
    material_type: "TPE"
    rule: "Injection molding PIR is highest quality TPE scrap - Tier 1"
    reasoning: "Injection PIR: clean, single type, minimal contamination (<0.5%), 95%+ property retention. Premium value 25-40% above market."
    confidence: 0.95
    pir_characteristics:
      contamination_pct: [0.1, 0.5]
      quality_tier: 1
      property_retention_pct: [95, 100]
      value_premium_pct: [25, 40]

  - rule_id: "TPE_MEDICAL_PIR_ONLY"
    material_type: "TPE"
    rule: "Medical TPE requires PIR only - post-consumer medical waste not recyclable"
    reasoning: "Medical regulations prohibit post-consumer medical waste recycling. Only manufacturing PIR acceptable."
    confidence: 0.98
    restriction: "medical_pir_only"

  - rule_id: "TPE_FOOTWEAR_LOW_VALUE"
    material_type: "TPE"
    rule: "Footwear TPE waste is Tier 3-4 due to high contamination"
    reasoning: "Footwear waste heavily contaminated with dirt (3-10%), adhesives (1-3%), limited applications."
    confidence: 0.88
    quality_tier: [3, 4]

  - rule_id: "TPE_HARDNESS_MATCHING"
    material_type: "TPE"
    rule: "TPE hardness (Shore A) should match application requirements"
    reasoning: "TPE hardness ranges from 20-95 Shore A. Soft (20-40) for grips, medium (40-70) for seals, hard (70-95) for structural."
    confidence: 0.90

  - rule_id: "TPE_WEATHER_RESISTANCE"
    material_type: "TPE"
    rule: "TPE-V preferred for outdoor/weather-exposed applications"
    reasoning: "TPE-V (vulcanizate) has excellent weather resistance and UV stability. TPE-S degrades in outdoor applications."
    confidence: 0.92

contamination_profiles:
  - profile_id: "TPE_INJECTION_PIR"
    material_type: "TPE"
    source: "Injection molding PIR"
    contamination_level: "minimal"
    quality_tier: 1
    typical_contaminants:
      - "Minimal - clean manufacturing"
    sorting_purity_pct: 99
    suitable_applications:
      - "All TPE applications"
      - "Medical devices (if medical-grade PIR)"

  - profile_id: "TPE_AUTOMOTIVE_COMPONENTS"
    material_type: "TPE"
    source: "Automotive components"
    contamination_level: "low-medium"
    quality_tier: 2
    typical_contaminants:
      - "Oils: <1%"
      - "Dirt: <2%"
      - "Adhesives: <1%"
    sorting_purity_pct: 85
    suitable_applications:
      - "Automotive interior (non-visible)"
      - "Industrial applications"
      - "Consumer goods"

  - profile_id: "TPE_FOOTWEAR_WASTE"
    material_type: "TPE"
    source: "Footwear waste"
    contamination_level: "high"
    quality_tier: 3
    typical_contaminants:
      - "Dirt: 3-10%"
      - "Adhesives: 1-3%"
      - "Mixed polymers: 2-5%"
    sorting_purity_pct: 70
    suitable_applications:
      - "Low-value consumer goods"
      - "Downcycled applications"

# ============================================================================
# BUYER PROFILES & MATCHING RULES
# ============================================================================

buyer_profiles:
  - buyer_id: "TPE_AUTOMOTIVE_TIER2"
    buyer_type: "Automotive tier 2 supplier"
    industry_segment: "Automotive"

    material_requirements:
      polymer_types: ["TPE_S", "TPE_V", "TPE_O"]
      purity_min_pct: 85
      max_pcr_pct: 50
      preferred_source: "Automotive manufacturing PIR, sorted automotive scrap"
      quality_tier_required: [2, 3]
      color_preference: "black or gray"
      form_preference: "pellets"

    applications:
      - "Automotive soft-touch interior"
      - "Automotive seals and gaskets"
      - "Automotive weather stripping"

    volume_range_tons_month: [50, 500]

  - buyer_id: "TPE_MEDICAL_DEVICE_MANUFACTURERS"
    buyer_type: "Medical device manufacturer"
    industry_segment: "Medical"

    material_requirements:
      polymer_types: ["TPE_U", "TPE_S_medical"]
      purity_min_pct: 99
      max_pcr_pct: 15
      preferred_source: "Medical device manufacturing PIR only"
      quality_tier_required: [1]
      color_preference: "natural or clear"
      form_preference: "pellets"

    certifications_required:
      - "USP Class VI"
      - "ISO 10993 biocompatibility"

    applications:
      - "Medical tubing and catheters"

    volume_range_tons_month: [10, 100]

  - buyer_id: "TPE_CONSUMER_GOODS_MANUFACTURERS"
    buyer_type: "Consumer goods manufacturer"
    industry_segment: "Consumer Goods"

    material_requirements:
      polymer_types: ["TPE_S", "TPE_O"]
      purity_min_pct: 80
      max_pcr_pct: 60
      preferred_source: "any"
      quality_tier_required: [2, 3]
      color_preference: "any"
      form_preference: "pellets"

    applications:
      - "Consumer electronics grips"
      - "Toothbrush handles"
      - "Consumer goods"

    volume_range_tons_month: [100, 1000]

  - buyer_id: "TPE_FOOTWEAR_MANUFACTURERS"
    buyer_type: "Footwear manufacturer"
    industry_segment: "Consumer Goods"

    material_requirements:
      polymer_types: ["TPE_S", "TPE_O"]
      purity_min_pct: 70
      max_pcr_pct: 80
      preferred_source: "any"
      quality_tier_required: [3, 4]
      color_preference: "any"
      form_preference: "pellets or regrind"

    applications:
      - "Footwear soles and insoles"

    volume_range_tons_month: [200, 2000]

  - buyer_id: "TPE_INDUSTRIAL_HOSE_MANUFACTURERS"
    buyer_type: "Industrial hose manufacturer"
    industry_segment: "Industrial"

    material_requirements:
      polymer_types: ["TPE_U", "TPE_V"]
      purity_min_pct: 85
      max_pcr_pct: 40
      preferred_source: "Industrial manufacturing PIR, sorted industrial scrap"
      quality_tier_required: [2, 3]
      color_preference: "any"
      form_preference: "pellets"

    applications:
      - "Industrial hoses and tubing"

    volume_range_tons_month: [50, 500]

# ============================================================================
# QUALITY INDICATORS & TESTING
# ============================================================================

quality_indicators:
  - indicator_id: "TPE_HARDNESS"
    test_method: "ASTM D2240 (Shore A)"
    material_types: ["TPE"]
    thresholds:
      soft: [20, 40]
      medium: [40, 70]
      hard: [70, 95]
    significance: "Determines application suitability"

  - indicator_id: "TPE_TYPE_IDENTIFICATION"
    test_method: "FTIR or DSC"
    material_types: ["TPE"]
    significance: "Identifies TPE type (TPE-S, TPE-V, TPE-O, TPE-U)"

  - indicator_id: "TPE_COLOR_CONSISTENCY"
    test_method: "Visual inspection"
    material_types: ["TPE"]
    thresholds:
      excellent: "Consistent color"
      good: "Single color"
      acceptable: "Mixed colors"
      poor: "Heavily mixed or degraded"
    significance: "Indicates source quality"

# ============================================================================
# INFERENCE RULES & MATCHING LOGIC
# ============================================================================

inference_rules:
  - rule_id: "TPE_PRODUCT_TO_BUYER_FORWARD"
    inference_type: "buyer_matching"
    logic: "IF product=automotive_seals THEN grade=tpe_v AND quality_tier=[2,3] AND match_buyers=[automotive_tier2, industrial_seals]"
    reasoning: "Forward reasoning from product to suitable buyers"
    confidence: 0.90

  - rule_id: "TPE_BUYER_TO_SOURCE_BACKWARD"
    inference_type: "source_matching"
    logic: "IF buyer=medical_device_manufacturers THEN require_grade=tpe_u_medical AND require_tier=1 AND require_source=medical_pir_only"
    reasoning: "Backward reasoning from buyer requirements to acceptable sources"
    confidence: 0.98

  - rule_id: "TPE_INJECTION_PIR_PREMIUM_MATCHING"
    inference_type: "buyer_matching"
    logic: "IF source=injection_pir AND contamination<0.5% THEN tier=1 AND match_all_buyers"
    reasoning: "Injection PIR is premium quality"
    confidence: 0.95

  - rule_id: "TPE_HARDNESS_APPLICATION_MATCHING"
    inference_type: "application_matching"
    logic: "IF hardness=20-40 THEN grips_soft_touch; IF hardness=40-70 THEN seals_gaskets; IF hardness=70-95 THEN structural"
    reasoning: "Hardness determines application suitability"
    confidence: 0.90

  - rule_id: "TPE_TYPE_SEPARATION_ROUTING"
    inference_type: "processing_requirement"
    logic: "IF mixed_tpe_types THEN separation_recommended FOR optimal_properties"
    reasoning: "Different TPE types have different processing requirements"
    confidence: 0.85

# ============================================================================
# STANDARDS & TESTING METHODS
# ============================================================================

standards:
  - standard_id: "ASTM_D2240"
    title: "Rubber Property - Durometer Hardness"
    scope: "Hardness measurement (Shore A, Shore D)"
    relevance: "Primary quality indicator for TPE"

  - standard_id: "USP_CLASS_VI"
    title: "Biological Reactivity Tests, In Vivo"
    scope: "Biocompatibility testing for medical devices"
    relevance: "Required for TPE in medical device applications"

  - standard_id: "ISO_10993"
    title: "Biological evaluation of medical devices"
    scope: "Biocompatibility standards"
    relevance: "Required for medical TPE"

# ============================================================================
# PROCESSING GUIDANCE
# ============================================================================

processing_guidance:
  drying:
    required: false
    note: "TPE not hygroscopic - drying optional unless moisture contamination present"

  temperature_control:
    tpe_s_processing_temp_c: [180, 230]
    tpe_v_processing_temp_c: [190, 230]
    tpe_o_processing_temp_c: [180, 220]
    tpe_u_processing_temp_c: [180, 220]

  mixing_pcr_virgin:
    recommended_method: "Dry blend or masterbatch"
    max_pcr_pct_by_application:
      medical_devices: 15
      automotive_visible: 30
      automotive_interior: 50
      consumer_goods: 60
      footwear: 80

  contamination_removal:
    washing: "Recommended for post-consumer sources"
    sorting: "Critical - separate TPE types (TPE-S, TPE-V, TPE-O, TPE-U)"

# ============================================================================
# END OF TPE KB v7.0r
