# ============================================================================
# PROCESSING GUIDANCE
# ============================================================================

processing_guidance:
  drying:
    required: false
    note: "PP not hygroscopic - drying optional unless moisture contamination present"

  temperature_control:
    processing_temp_c: [190, 260]
    optimal_range_c: [220, 240]
    degradation_onset_c: 280

  mixing_pcr_virgin:
    recommended_method: "Dry blend or masterbatch"
    max_pcr_pct_by_application:
      medical_devices: 15
      food_contact_indirect: 10
      automotive_interior: 50
      packaging_non_food: 100
      industrial_containers: 100

  contamination_removal:
    washing: "Required for post-consumer sources"
    sorting: "Critical - separate PP homopolymer from copolymer, separate from PE"
    density_separation: "Effective for PP/PE separation (0.900-0.910 vs 0.910-0.940)"

  stabilization:
    antioxidants: "Highly recommended for multi-cycle recycling"
    benefit: "Reduces MW degradation from 60-70% to 20-30% after 6 cycles"

