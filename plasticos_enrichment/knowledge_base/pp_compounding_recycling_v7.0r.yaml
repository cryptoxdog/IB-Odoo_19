# ============================================================================
# QUALITY INDICATORS & TESTING
# ============================================================================

quality_indicators:
  - indicator_id: "PP_MFI_CONSISTENCY"
    test_method: "ASTM D1238 (230°C/2.16kg)"
    material_types: ["PP"]
    thresholds:
      low_mfi: [0.5, 5]
      medium_mfi: [15, 30]
      high_mfi: [60, 150]
      very_high_mfi: [150, 500]
    significance: "Critical for application matching and recycling cycle assessment"
    note: "PP MFI always @230°C/2.16kg - do not convert to 190°C"

  - indicator_id: "PP_PE_CONTAMINATION"
    test_method: "FTIR or DSC"
    material_types: ["PP"]
    thresholds:
      excellent:
        pe_contamination_pct: [0, 0.5]
      good:
        pe_contamination_pct: [0.5, 3.0]
      acceptable:
        pe_contamination_pct: [3.0, 8.0]
      poor:
        pe_contamination_pct: [8.0, 100]
    significance: "Determines application suitability and quality tier"

  - indicator_id: "PP_COLOR_CONSISTENCY"
    test_method: "Visual inspection"
    material_types: ["PP"]
    thresholds:
      excellent: "Natural/clear, consistent color"
      good: "Single consistent color"
      acceptable: "Mixed colors or moderate discoloration"
      poor: "Heavily mixed or degraded color"
    significance: "Indicates thermal degradation and source quality"

  - indicator_id: "PP_ASH_CONTENT"
    test_method: "ASTM D2584"
    material_types: ["PP"]
    thresholds:
      excellent:
        ash_pct: [0, 1.0]
      good:
        ash_pct: [1.0, 2.0]
      acceptable:
        ash_pct: [2.0, 3.0]
      poor:
        ash_pct: [3.0, 100]
    significance: "Indicates filler content and contamination level"

# ============================================================================
# INFERENCE RULES & MATCHING LOGIC
# ============================================================================

inference_rules:
  - rule_id: "PP_PRODUCT_TO_BUYER_FORWARD"
    inference_type: "buyer_matching"
    logic: "IF product=bottle_caps THEN grade=pp_homopolymer AND quality_tier=[1,2] AND match_buyers=[packaging_non_food, injection_molders]"
    reasoning: "Forward reasoning from product to suitable buyers based on grade and quality tier"
    confidence: 0.90

  - rule_id: "PP_BUYER_TO_SOURCE_BACKWARD"
    inference_type: "source_matching"
    logic: "IF buyer=medical_device_manufacturers THEN require_grade=pp_medical AND require_tier=1 AND require_source=medical_pir_only"
    reasoning: "Backward reasoning from buyer requirements to acceptable sources"
    confidence: 0.98

  - rule_id: "PP_INJECTION_PIR_PREMIUM_MATCHING"
    inference_type: "buyer_matching"
    logic: "IF source=injection_pir AND contamination<0.5% THEN tier=1 AND match_all_buyers"
    reasoning: "Injection PIR is premium quality - suitable for all PP applications"
    confidence: 0.95

  - rule_id: "PP_MFI_APPLICATION_MATCHING"
    inference_type: "application_matching"
    logic: "IF mfi<5 THEN raffia_sheet; IF mfi=15-30 THEN injection_thin_wall; IF mfi=60-150 THEN fiber_film; IF mfi>150 THEN limited_applications"
    reasoning: "MFI determines application suitability"
    confidence: 0.92

  - rule_id: "PP_FOOD_CONTACT_EXCLUSION"
    inference_type: "application_matching"
    logic: "IF source=post_consumer_food_contact THEN exclude_direct_food_contact AND route_to_indirect_or_non_food"
    reasoning: "FDA restrictions on PCR food contact"
    confidence: 0.98

  - rule_id: "PP_PE_CONTAMINATION_ROUTING"
    inference_type: "buyer_matching"
    logic: "IF pe_contamination<0.5% THEN food_medical_buyers; IF pe<3% THEN automotive_electronics; IF pe<8% THEN industrial; IF pe>8% THEN textile_downcycled"
    reasoning: "PE contamination level determines buyer tier matching"
    confidence: 0.88

  - rule_id: "PP_HOMOPOLYMER_COPOLYMER_SEPARATION"
    inference_type: "processing_requirement"
    logic: "IF mixed_homopolymer_copolymer THEN density_separation_recommended FOR optimal_properties"
    reasoning: "Separation improves property consistency and value"
    confidence: 0.85

