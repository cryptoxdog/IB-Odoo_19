# ============================================================================
# INFERENCE RULES
# ============================================================================

inference_rules:
  - inference_id: "PVC_INF_001"
    inference_type: "property"
    premise: "Material is rigid PVC pipe regrind, but K-value not provided"
    conclusion: "Infer K-value = 62 (range 60-64)"
    confidence: 0.75
    reasoning: "Most post-consumer rigid pipe has K-value 60-64 due to chain scission during recycling. K-62 is typical average."
    examples:
      - input: "Rigid PVC pipe regrind, no K-value data"
        output: "K-value = 62 (confidence 75%)"
    sources:
      - "PVC recycling research"
      - "ISO 1628-2"

  - inference_id: "PVC_INF_002"
    inference_type: "property"
    premise: "Material stored outdoors, moisture content not specified"
    conclusion: "Infer moisture = 400-600 ppm"
    confidence: 0.70
    reasoning: "Outdoor storage typically results in 300-800 ppm moisture depending on climate. 400-600 ppm is typical range."
    examples:
      - input: "PVC regrind, outdoor storage, no moisture data"
        output: "Moisture = 500 ppm (confidence 70%), requires drying"
    sources:
      - "Storage guidelines"
      - "Moisture absorption studies"

  - inference_id: "PVC_INF_003"
    inference_type: "property"
    premise: "Material stored indoors, moisture content not specified"
    conclusion: "Infer moisture = 100-250 ppm"
    confidence: 0.75
    reasoning: "Indoor storage in controlled environment typically results in 100-300 ppm moisture. 100-250 ppm is typical."
    examples:
      - input: "PVC regrind, indoor storage, no moisture data"
        output: "Moisture = 175 ppm (confidence 75%), minimal drying needed"
    sources:
      - "Storage guidelines"

  - inference_id: "PVC_INF_004"
    inference_type: "quality"
    premise: "Post-consumer material, contamination level not quantified"
    conclusion: "Infer contamination = 0.1-0.2%"
    confidence: 0.65
    reasoning: "Typical post-consumer rigid PVC has 0.1-0.3% contamination after basic sorting. 0.1-0.2% is average for decent quality."
    examples:
      - input: "Post-consumer PVC pipe, no contamination data"
        output: "Contamination = 0.15% (confidence 65%)"
    sources:
      - "Recycling industry data"

  - inference_id: "PVC_INF_005"
    inference_type: "quality"
    premise: "Post-industrial material, contamination level not quantified"
    conclusion: "Infer contamination = 0.02-0.05%"
    confidence: 0.75
    reasoning: "Post-industrial regrind from single source typically has very low contamination. 0.02-0.05% is typical."
    examples:
      - input: "Post-industrial PVC regrind, no contamination data"
        output: "Contamination = 0.03% (confidence 75%)"
    sources:
      - "Industry best practices"

  - inference_id: "PVC_INF_006"
    inference_type: "property"
    premise: "Material manufactured before 2015, stabilizer type unknown"
    conclusion: "Infer stabilizer = Lead-based (likely)"
    confidence: 0.80
    reasoning: "Lead stabilizers were standard before 2015 phase-out. High probability of lead-based stabilizers in pre-2015 material."
    examples:
      - input: "PVC pipe manufactured 2010, stabilizer unknown"
        output: "Stabilizer = Lead-based (confidence 80%), restrict to non-food/non-water applications"
    sources:
      - "PVC industry phase-out timeline"
      - "EPA regulations"

  - inference_id: "PVC_INF_007"
    inference_type: "property"
    premise: "Material manufactured after 2015, stabilizer type unknown"
    conclusion: "Infer stabilizer = Calcium-Zinc (likely)"
    confidence: 0.80
    reasoning: "Ca-Zn stabilizers became standard after lead phase-out in 2015. High probability of Ca-Zn in post-2015 material."
    examples:
      - input: "PVC profile manufactured 2020, stabilizer unknown"
        output: "Stabilizer = Ca-Zn (confidence 80%)"
    sources:
      - "PVC industry standards"

  - inference_id: "PVC_INF_008"
    inference_type: "property"
    premise: "Material is pipe grade, ash content not provided"
    conclusion: "Infer ash content = 5-8%"
    confidence: 0.70
    reasoning: "Pipe grades typically use 5-10% CaCO3 filler for cost reduction and processing. 5-8% is typical range."
    examples:
      - input: "PVC pipe grade, no ash data"
        output: "Ash content = 6.5% (confidence 70%)"
    sources:
      - "Pipe formulation guidelines"

  - inference_id: "PVC_INF_009"
    inference_type: "property"
    premise: "Material is profile/siding grade, ash content not provided"
    conclusion: "Infer ash content = 2-5%"
    confidence: 0.70
    reasoning: "Profile grades use less filler than pipe for better surface quality. 2-5% is typical."
    examples:
      - input: "PVC siding grade, no ash data"
        output: "Ash content = 3.5% (confidence 70%)"
    sources:
      - "Profile formulation guidelines"

  - inference_id: "PVC_INF_010"
    inference_type: "application"
    premise: "K-value = 65-70, rigid PVC, low contamination"
    conclusion: "Suitable for pressure pipe applications (blended with virgin)"
    confidence: 0.85
    reasoning: "High K-value and low contamination meet pressure pipe requirements when blended 10-20% with virgin."
    examples:
      - input: "K-value = 67, contamination = 0.04%, rigid PVC"
        output: "Suitable for pressure pipe (15% blend), confidence 85%"
    sources:
      - "NSF 14/61"
      - "ASTM D1785"

  - inference_id: "PVC_INF_011"
    inference_type: "application"
    premise: "K-value = 60-64, rigid PVC, moderate contamination"
    conclusion: "Suitable for non-pressure pipe, conduit, or profiles (non-appearance)"
    confidence: 0.80
    reasoning: "Lower K-value acceptable for non-pressure applications. Moderate contamination tolerable."
    examples:
      - input: "K-value = 62, contamination = 0.15%, rigid PVC"
        output: "Suitable for drainage pipe, conduit (confidence 80%)"
    sources:
      - "ASTM D2665, D3034"

  - inference_id: "PVC_INF_012"
    inference_type: "pricing"
    premise: "Material quality indicators: single-source, low moisture, known stabilizer, K-65+"
    conclusion: "Price = Virgin baseline × (0.75-0.85) + quality premiums"
    confidence: 0.78
    reasoning: "High-quality recycled PVC with multiple positive indicators commands 75-85% of virgin price plus quality premiums."
    examples:
      - input: "Single-source PIR, K-66, moisture 150 ppm, Ca-Zn stabilizer"
        output: "Price = $0.55-0.65/lb (confidence 78%)"
    sources:
      - "Market intelligence"
      - "Pricing data"

  - inference_id: "PVC_INF_013"
    inference_type: "processing"
    premise: "Material has moisture >500 ppm"
    conclusion: "Requires drying at 80-90°C for 3-5 hours before processing"
    confidence: 0.90
    reasoning: "Moisture >500 ppm causes processing defects. Drying to <200 ppm required for quality processing."
    examples:
      - input: "Moisture = 650 ppm"
        output: "Dry at 85°C for 4 hours (confidence 90%)"
    sources:
      - "ASTM processing guidelines"

  - inference_id: "PVC_INF_014"
    inference_type: "quality"
    premise: "Material shows visible UV degradation (chalking, fading, yellowing)"
    conclusion: "Downgrade to non-appearance applications or blend ≤20% with virgin"
    confidence: 0.85
    reasoning: "UV degradation indicates chain scission and property loss. Unsuitable for appearance-critical applications."
    examples:
      - input: "PVC siding regrind, visible chalking and fading"
        output: "Downgrade to conduit or blend ≤20% for non-appearance profiles (confidence 85%)"
    sources:
      - "Weathering studies"

  - inference_id: "PVC_INF_015"
    inference_type: "buyer_matching"
    premise: "Material: K-68, contamination 0.03%, NSF certified, moisture 180 ppm"
    conclusion: "Best match: Pressure pipe extruder (10-20% blend with virgin)"
    confidence: 0.88
    reasoning: "High K-value, very low contamination, NSF certification, and low moisture meet strict pressure pipe requirements."
    examples:
      - input: "K-68, contamination 0.03%, NSF certified, moisture 180 ppm"
        output: "Match: JM Eagle, Westlake Pipe (pressure pipe, 15% blend), confidence 88%"
    sources:
      - "Buyer profile analysis"
      - "NSF requirements"

# ============================================================================
# MARKET INTELLIGENCE
# ============================================================================

market_intelligence:
  # Note: Pricing moved to pricing_model section for dynamic reasoning

  supply_demand:
    current_state: "Balanced to slightly tight"
    trends:
      - "Increasing demand for recycled content (sustainability mandates)"
      - "Lead stabilizer phase-out creating supply disruptions"
      - "Chemical recycling capacity expanding (Vinyloop, ChemCycling)"
      - "NSF certification costs limiting PCR use in pressure pipe"
      - "DEHP phase-out in medical/food contact applications"

  regulatory:
    current:
      - "NSF 14/61 (drinking water pipe) - limits PCR to 10-25%"
      - "Lead stabilizer phase-out (EPA) - completed 2015"
      - "RoHS (EU) - restricts lead, phthalates in electrical applications"
      - "FDA 21 CFR 177.1975 - food contact regulations"
      - "DEHP restrictions in medical devices (EU, some US states)"

    pending:
      - "PFAS restrictions (may affect some PVC additives)"
      - "Phthalate restrictions expanding (DINP, DIDP)"
      - "Circular economy mandates (EU) - minimum recycled content requirements"
      - "Extended producer responsibility (EPR) for building products"

  technology:
    emerging:
      - "Chemical recycling (Vinyloop, ChemCycling) - removes contaminants, restores molecular weight"
      - "Advanced sorting (AI-powered NIR, robotics) - improves quality of recycled streams"
      - "Bio-based plasticizers (replacing phthalates) - sustainability and regulatory compliance"
      - "Non-lead stabilizers (Ca-Zn, organotin) - environmental and health benefits"
      - "Digital watermarking for traceability - improves recycling efficiency"

    impact: "Chemical recycling enables use of lower-quality feedstock. Advanced sorting improves PCR quality. Bio-based additives address regulatory concerns."

  sources:
    - "BusinessAnalytiq PVC Price Index (October 2025)"
    - "Plastics News Resin Pricing (2025)"
    - "Markets and Markets PVC Recycling Report"
    - "Grand View Research Recycled Plastic Pipes Report"
    - "Industry interviews and market research"

