# ============================================================================
# RECYCLING RULES
# ============================================================================

recycling_rules:
  - rule_id: "PVC_RR_001"
    rule_name: "Rigid vs. Flexible Segregation"
    condition: "Material stream contains both rigid and flexible PVC"
    action: "Separate rigid and flexible streams before processing"
    reasoning: "Plasticizers in flexible PVC are incompatible with rigid PVC formulations, causing processing issues and property degradation"
    confidence: 0.95
    exceptions:
      - "Intentional compounding with controlled plasticizer addition"
    sources:
      - "Industry best practices"
      - "PVC recycling guidelines"

  - rule_id: "PVC_RR_002"
    rule_name: "Stabilizer System Compatibility"
    condition: "Blending PVC materials from different sources"
    action: "Match stabilizer types (Ca-Zn with Ca-Zn, organotin with organotin) or test compatibility"
    reasoning: "Incompatible stabilizers can reduce thermal stability effectiveness, leading to degradation and discoloration"
    confidence: 0.90
    exceptions:
      - "Stabilizer compatibility testing performed"
      - "Restabilization with fresh stabilizer package"
    sources:
      - "PVC stabilizer manufacturer guidelines"
      - "ASTM standards"

  - rule_id: "PVC_RR_003"
    rule_name: "K-Value Maintenance Through Blending"
    condition: "Recycled PVC has K-value below target application requirement"
    action: "Blend recycled (low K) with virgin (high K) to achieve target K-value"
    reasoning: "Mechanical recycling causes chain scission, reducing molecular weight (K-value). Blending restores target properties."
    confidence: 0.92
    exceptions:
      - "Downgrading to lower-K application"
      - "Chemical recycling to restore molecular weight"
    sources:
      - "ISO 1628-2"
      - "PVC recycling research"

  - rule_id: "PVC_RR_004"
    rule_name: "Mandatory Moisture Control"
    condition: "Processing any recycled PVC material"
    action: "Dry all recycled PVC at 80-90°C for 2-4 hours to <500 ppm moisture, preferably <200 ppm"
    reasoning: "Moisture causes hydrolysis, bubble formation, and surface defects during processing"
    confidence: 0.98
    exceptions:
      - "Material stored in moisture-controlled environment with verified <200 ppm"
    sources:
      - "ASTM processing guidelines"
      - "Industry best practices"

  - rule_id: "PVC_RR_005"
    rule_name: "Contamination Limits for Structural Applications"
    condition: "Recycled PVC intended for pressure pipe or structural applications"
    action: "Ensure total foreign polymer contamination <0.1%, preferably <0.05%"
    reasoning: "Even trace amounts of incompatible polymers cause significant mechanical property degradation and weld strength reduction"
    confidence: 0.95
    exceptions:
      - "Non-structural applications with higher contamination tolerance"
    sources:
      - "NSF 14/61 guidelines"
      - "ASTM D1785"

  - rule_id: "PVC_RR_006"
    rule_name: "Narrow Processing Temperature Window"
    condition: "Processing any PVC material"
    action: "Maintain processing temperature 160-200°C for rigid, 140-180°C for flexible. Never exceed 220°C."
    reasoning: "PVC has narrow window between melting and degradation. Above 220°C, HCl release causes equipment corrosion and safety hazards."
    confidence: 0.99
    exceptions:
      - "CPVC processing at 190-220°C (higher thermal stability)"
    sources:
      - "ASTM processing standards"
      - "Safety data sheets"

  - rule_id: "PVC_RR_007"
    rule_name: "Multiple Cycle Degradation Limit"
    condition: "Material has undergone multiple mechanical recycling cycles"
    action: "Limit to 3-5 mechanical recycling cycles, then downgrade to lower-value applications"
    reasoning: "Progressive chain scission and property loss with each cycle. After 5 cycles, material unsuitable for most applications."
    confidence: 0.88
    exceptions:
      - "Chemical recycling to restore polymer structure"
      - "Use as filler in non-critical applications"
    sources:
      - "PVC recycling research"
      - "Lifecycle analysis studies"

  - rule_id: "PVC_RR_008"
    rule_name: "Lead Stabilizer Legacy Material Handling"
    condition: "PVC material manufactured before 2015 (likely contains lead stabilizers)"
    action: "Segregate and label as legacy material. Restrict to non-food, non-drinking water applications. Consider chemical recycling."
    reasoning: "Lead stabilizers pose environmental and health risks. Regulatory restrictions limit applications. Mechanical recycling spreads lead contamination."
    confidence: 0.92
    exceptions:
      - "Verified lead-free through testing"
      - "Chemical recycling removes lead"
    sources:
      - "EPA regulations"
      - "PVC industry phase-out timeline"

  - rule_id: "PVC_RR_009"
    rule_name: "Plasticizer Contamination in Rigid Streams"
    condition: "Rigid PVC stream shows signs of plasticizer contamination (flexibility, low density)"
    action: "Remove flexible PVC contamination or downgrade to non-critical applications"
    reasoning: "Plasticizers reduce rigidity, lower heat deflection temperature, and cause long-term property changes through migration"
    confidence: 0.90
    exceptions:
      - "Intentional plasticizer addition for specific applications"
    sources:
      - "PVC processing guidelines"
      - "Contamination studies"

  - rule_id: "PVC_RR_010"
    rule_name: "Color Sorting for Appearance Applications"
    condition: "Recycled PVC intended for siding, window frames, or visible profiles"
    action: "Sort by color or plan for opaque pigmentation to mask color variation"
    reasoning: "Mixed colors create aesthetic issues in appearance-critical applications. Color sorting or heavy pigmentation required."
    confidence: 0.85
    exceptions:
      - "Black or dark-colored applications (masks color variation)"
      - "Non-appearance applications"
    sources:
      - "Industry best practices"
      - "Quality control guidelines"

  - rule_id: "PVC_RR_011"
    rule_name: "UV Degradation Assessment"
    condition: "Recycled PVC from outdoor applications (siding, fencing, outdoor furniture)"
    action: "Test for UV degradation (color change, brittleness, chalking). Downgrade severely degraded material."
    reasoning: "UV exposure causes chain scission, discoloration, and embrittlement. Degraded material has reduced mechanical properties."
    confidence: 0.87
    exceptions:
      - "Material from UV-protected environments"
      - "Restabilization with UV stabilizers for non-critical applications"
    sources:
      - "Weathering studies"
      - "ASTM G154 (UV exposure testing)"

  - rule_id: "PVC_RR_012"
    rule_name: "Pipe Pressure Rating Preservation"
    condition: "Recycled PVC intended for pressure pipe applications"
    action: "Verify K-value ≥65, contamination <0.05%, and blend with virgin to maintain pressure rating. Require NSF certification."
    reasoning: "Pressure pipe failure can cause property damage and safety hazards. Strict quality control and certification required."
    confidence: 0.96
    exceptions:
      - "Non-pressure applications (drainage, conduit)"
    sources:
      - "NSF 14/61"
      - "ASTM D1785, D2241"

  - rule_id: "PVC_RR_013"
    rule_name: "Medical-Grade Exclusion Logic"
    condition: "Recycled PVC material regardless of quality"
    action: "Exclude from medical device applications. Medical-grade PVC must be virgin material."
    reasoning: "Regulatory requirements (FDA, ISO 10993) prohibit recycled content in medical devices due to biocompatibility and traceability concerns."
    confidence: 0.99
    exceptions:
      - "None - regulatory prohibition"
    sources:
      - "FDA 21 CFR 177.1975"
      - "ISO 10993"

  - rule_id: "PVC_RR_014"
    rule_name: "Chemical vs. Mechanical Recycling Decision"
    condition: "PVC material is heavily contaminated, degraded, or contains legacy stabilizers"
    action: "Route to chemical recycling (Vinyloop, ChemCycling) instead of mechanical recycling"
    reasoning: "Chemical recycling can remove contaminants, restore molecular weight, and eliminate legacy additives. More suitable for low-quality feedstock."
    confidence: 0.82
    exceptions:
      - "Chemical recycling not economically viable for small volumes"
      - "Downcycling to low-value applications"
    sources:
      - "Vinyloop process documentation"
      - "Chemical recycling research"

  - rule_id: "PVC_RR_015"
    rule_name: "Multi-Layer Product Handling"
    condition: "PVC material is part of multi-layer product (laminated flooring, coated fabrics)"
    action: "Separate layers before recycling or route to chemical recycling. Do not mechanically recycle multi-layer products."
    reasoning: "Multi-layer products contain incompatible materials (adhesives, coatings, other polymers) that contaminate PVC stream."
    confidence: 0.90
    exceptions:
      - "Chemical recycling can handle multi-layer products"
      - "Specialized delamination processes available"
    sources:
      - "Multi-material recycling guidelines"
      - "Industry best practices"

