# MACK Knowledge Base: PA (Polyamide/Nylon) Compounding & Recycling v7.0r
# Purpose: Enable MACK reasoning for PA material identification and buyer matching
# Compatible with: MACK v7.0 Odoo reasoning engine
# Last Updated: 2025-11-05
# Data Sources: ISO 307, comprehensive PA recycling research, automotive/electronics standards

metadata:
  polymer_family: "Engineering Thermoplastics"
  polymer_type: "PA"
  full_name: "Polyamide (Nylon)"
  common_grades: "PA6, PA66, PA6/66"
  structure: "Polyamide with amide linkages, hygroscopic"
  version: "7.0r"
  last_updated: "2025-11-05"
  data_quality: "verified"
  source_tier: "tier_2"
  note: "Engineering plastic - automotive, electronics, industrial applications"

# ============================================================================
# PRODUCT-TO-SCRAP MAPPING (Bidirectional Reasoning)
# ============================================================================

product_scrap_mapping:
  automotive_products:
    - product: "Automotive engine components (intake manifolds, covers)"
      scrap_grade: "pa66_gf30"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [0.5, 2.0]
      typical_contaminants: ["oil residue <1%", "metal inserts <0.5%"]
      suitable_buyers: ["automotive_tier2", "industrial_engineering"]
      reverse_reasoning: "IF buyer_needs_engine_components THEN source_pa66_gf30_tier1_tier2"
      note: "High-temp applications require PA66 GF30"

    - product: "Automotive interior parts (door handles, brackets)"
      scrap_grade: "pa6_gf15_or_pa66_gf15"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 3.0]
      typical_contaminants: ["paint/coating <1%", "adhesives <0.5%"]
      suitable_buyers: ["automotive_tier2", "industrial_applications"]

    - product: "Automotive gears and bearings"
      scrap_grade: "pa6_unfilled_or_pa66_unfilled"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [0.5, 2.0]
      typical_contaminants: ["lubricants <1%", "minimal"]
      suitable_buyers: ["automotive_tier1", "industrial_gears"]

  electronics_products:
    - product: "Electronics housings and connectors"
      scrap_grade: "pa66_gf15_or_pa6_gf15"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 3.0]
      typical_contaminants: ["metal inserts <0.5%", "adhesives <0.5%"]
      suitable_buyers: ["electronics_manufacturers", "industrial_applications"]
      reverse_reasoning: "IF buyer_needs_electronics_housings THEN source_pa66_gf15_tier2_tier3"

    - product: "Electrical connectors and switches"
      scrap_grade: "pa66_unfilled"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [0.5, 2.0]
      suitable_buyers: ["electronics_manufacturers", "electrical_component_manufacturers"]

  industrial_products:
    - product: "Industrial gears, bearings, bushings"
      scrap_grade: "pa6_unfilled_or_pa66_unfilled"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [1.0, 3.0]
      typical_contaminants: ["lubricants 1-2%", "wear particles <0.5%"]
      suitable_buyers: ["industrial_gears", "industrial_applications"]

    - product: "Industrial housings and enclosures"
      scrap_grade: "pa6_gf20_or_pa66_gf20"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [2.0, 5.0]
      suitable_buyers: ["industrial_applications", "construction_hardware"]

  textile_products:
    - product: "Nylon fibers and textiles (carpets, clothing)"
      scrap_grade: "pa6_unfilled"
      scrap_quality_tier: [3, 4]
      typical_contamination_pct: [5.0, 15.0]
      typical_contaminants: ["dyes 2-5%", "organic matter 3-8%", "mixed fibers 2-5%"]
      suitable_buyers: ["textile_recyclers", "chemical_recycling", "downcycled_applications"]
      note: "High contamination - chemical recycling preferred"

  consumer_products:
    - product: "Consumer appliances (housings, components)"
      scrap_grade: "pa6_gf10_or_pa66_gf10"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [2.0, 5.0]
      typical_contaminants: ["mixed polymers <2%", "adhesives <1%"]
      suitable_buyers: ["consumer_appliance_manufacturers", "industrial_applications"]

  manufacturing_scrap:
    - product: "Injection molding PIR (runners, sprues)"
      scrap_grade: "any_pa_grade"
      scrap_quality_tier: [1]
      typical_contamination_pct: [0.1, 0.5]
      typical_contaminants: ["minimal - clean manufacturing"]
      suitable_buyers: ["all_pa_buyers"]
      reverse_reasoning: "IF buyer_needs_high_quality_pa THEN source_injection_pir_tier1"
      note: "Injection PIR is highest quality PA scrap - premium value"

# ============================================================================
# SOURCE QUALITY TIER DEFINITIONS (PA-Specific)
# ============================================================================

source_quality_tiers:
  tier_1_premium:
    definition: "Manufacturing PIR, single-source, minimal contamination, known grade and filler %"
    contamination_max_pct: 0.5
    glass_contamination_max_pct: 2.0
    talc_contamination_max_pct: 1.0
    other_polymer_max_pct: 1.0
    chemical_contamination_max_ppm: 500
    moisture_max_pct: 0.08
    ash_max_pct: 1.0
    property_retention_min_pct: 95
    sorting_purity_min_pct: 99
    processing_history: "Single cycle or virgin manufacturing scrap"
    examples:
      - "Injection molding PIR (runners, sprues)"
      - "Automotive component manufacturing scrap"
      - "Electronics manufacturing PIR"
    suitable_applications:
      - "Automotive engine components"
      - "Electrical connectors"
      - "Medical devices (non-critical)"
      - "Food contact (indirect)"
    value_premium_pct: [25, 40]

  tier_2_standard:
    definition: "Post-industrial or sorted post-consumer, moderate contamination"
    contamination_max_pct: 3.0
    glass_contamination_max_pct: 8.0
    talc_contamination_max_pct: 5.0
    other_polymer_max_pct: 3.0
    chemical_contamination_max_ppm: 1000
    moisture_max_pct: 0.10
    ash_max_pct: 5.0
    property_retention_min_pct: 80
    sorting_purity_min_pct: 85
    processing_history: "1-3 recycling cycles"
    examples:
      - "Sorted automotive components"
      - "Electronics housings (sorted)"
      - "Industrial parts (used)"
    suitable_applications:
      - "Automotive interior parts"
      - "Electronics housings"
      - "Industrial gears/bearings"
      - "Consumer appliances"
    value_premium_pct: [0, 0]

  tier_3_utility:
    definition: "Mixed post-consumer, higher contamination, multiple cycles"
    contamination_max_pct: 8.0
    glass_contamination_max_pct: 15.0
    talc_contamination_max_pct: 12.0
    other_polymer_max_pct: 8.0
    chemical_contamination_max_ppm: 2000
    moisture_max_pct: 0.15
    ash_max_pct: 10.0
    property_retention_min_pct: 60
    sorting_purity_min_pct: 70
    processing_history: "3-6 recycling cycles or unknown"
    examples:
      - "Mixed post-consumer PA (unsorted)"
      - "General waste stream PA"
      - "Contaminated industrial parts"
    suitable_applications:
      - "General engineering applications"
      - "Construction hardware"
      - "Low-value consumer goods"
    value_discount_pct: [40, 55]

  tier_4_marginal:
    definition: "Heavily contaminated, degraded, textile waste"
    contamination_min_pct: 8.0
    property_retention_max_pct: 60
    processing_history: ">6 cycles or textile waste"
    examples:
      - "Nylon textile waste (carpets, clothing)"
      - "Heavily contaminated mixed waste"
      - "Degraded automotive parts"
    suitable_applications:
      - "Chemical recycling feedstock (caprolactam recovery)"
      - "Pyrolysis feedstock"
      - "Very limited mechanical recycling"
    value_discount_pct: [70, 85]

