# ============================================================================
# QUALITY INDICATORS & TESTING
# ============================================================================

quality_indicators:
  - indicator_id: "PA_MOISTURE_CONTENT"
    test_method: "Karl Fischer (ISO 15512)"
    material_types: ["PA"]
    thresholds:
      excellent:
        moisture_pct: [0, 0.05]
      good:
        moisture_pct: [0.05, 0.08]
      acceptable:
        moisture_pct: [0.08, 0.10]
      poor:
        moisture_pct: [0.10, 100]
    significance: "Critical - moisture causes hydrolytic degradation"
    action: "dry_if_above_0.10"

  - indicator_id: "PA_ASH_CONTENT"
    test_method: "ASTM D2584"
    material_types: ["PA"]
    thresholds:
      unfilled:
        ash_pct: [0, 1.0]
      gf10:
        ash_pct: [5, 12]
      gf15:
        ash_pct: [10, 18]
      gf20:
        ash_pct: [15, 25]
      gf30:
        ash_pct: [25, 35]
    significance: "Indicates filler content (GF, talc, etc.)"

  - indicator_id: "PA_DENSITY"
    test_method: "ISO 1183"
    material_types: ["PA"]
    thresholds:
      pa6_unfilled: [1.13, 1.15]
      pa66_unfilled: [1.14, 1.20]
      pa6_gf30: [1.35, 1.37]
      pa66_gf30: [1.38, 1.40]
    significance: "Indicates PA type and filler content"

