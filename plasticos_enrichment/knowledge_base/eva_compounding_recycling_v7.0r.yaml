# MACK Knowledge Base: EVA (Ethylene Vinyl Acetate) Compounding & Recycling v7.0r
# Purpose: Enable MACK reasoning for EVA material identification and buyer matching
# Compatible with: MACK v7.0 Odoo reasoning engine
# Last Updated: 2025-11-05

metadata:
  polymer_family: "Thermoplastic Copolymers"
  polymer_type: "EVA"
  full_name: "Ethylene Vinyl Acetate"
  structure: "Copolymer of ethylene and vinyl acetate"
  version: "7.0r"
  last_updated: "2025-11-05"
  data_quality: "verified"
  source_tier: "tier_3"
  note: "Flexible copolymer - footwear, foam, solar panels, packaging"

product_scrap_mapping:
  footwear_products:
    - product: "Athletic shoe midsoles and foam"
      scrap_grade: "eva_foam"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [2.0, 8.0]
      typical_contaminants: ["dirt 2-5%", "adhesives 1-2%"]
      suitable_buyers: ["footwear_manufacturers", "foam_manufacturers"]
      reverse_reasoning: "IF buyer_needs_footwear_foam THEN source_eva_foam_tier2_tier3"
      note: "Largest EVA application"

  solar_products:
    - product: "Solar panel encapsulant"
      scrap_grade: "eva_film"
      scrap_quality_tier: [3, 4]
      typical_contamination_pct: [5.0, 15.0]
      typical_contaminants: ["glass 3-10%", "silicon <2%", "metals <1%"]
      suitable_buyers: ["chemical_recycling", "downcycled_applications"]
      note: "High contamination - chemical recycling preferred"

  packaging_products:
    - product: "Flexible packaging films"
      scrap_grade: "eva_film"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 5.0]
      suitable_buyers: ["packaging_manufacturers", "film_manufacturers"]

  manufacturing_scrap:
    - product: "Injection molding PIR"
      scrap_grade: "any_eva"
      scrap_quality_tier: [1]
      typical_contamination_pct: [0.1, 0.5]
      suitable_buyers: ["all_eva_buyers"]

source_quality_tiers:
  tier_1_premium:
    definition: "Manufacturing PIR, minimal contamination"
    contamination_max_pct: 0.5
    property_retention_min_pct: 95
    suitable_applications: ["Premium footwear", "Packaging"]
    value_premium_pct: [25, 40]

  tier_2_standard:
    definition: "Post-industrial, moderate contamination"
    contamination_max_pct: 3.0
    property_retention_min_pct: 80
    suitable_applications: ["Mid-tier footwear", "General foam"]

  tier_3_utility:
    definition: "Mixed post-consumer"
    contamination_max_pct: 8.0
    property_retention_min_pct: 65
    suitable_applications: ["Low-value foam", "Downcycled"]
    value_discount_pct: [40, 55]

  tier_4_marginal:
    definition: "Solar panel waste - heavily contaminated"
    contamination_min_pct: 8.0
    property_retention_max_pct: 65
    suitable_applications: ["Chemical recycling", "Very limited mechanical"]
    value_discount_pct: [70, 85]

material_grades:
  - grade_id: "EVA_FOAM"
    grade_name: "EVA Foam (18-28% VA)"
    description: "Flexible foam for footwear"
    applications:
      primary:
        - product: "Athletic shoe midsoles"
          scrap_source: "Footwear manufacturing, post-consumer footwear"
          quality_tier_required: [2, 3]
          note: "Largest EVA application"
    pcr_compatibility:
      max_pcr_pct: 50
      typical_pcr_pct: [15, 50]

  - grade_id: "EVA_FILM"
    grade_name: "EVA Film (5-18% VA)"
    description: "Film for packaging and solar encapsulant"
    applications:
      primary:
        - product: "Flexible packaging films"
          scrap_source: "Packaging manufacturing, post-consumer"
          quality_tier_required: [2, 3]
        - product: "Solar panel encapsulant"
          scrap_source: "Solar panel end-of-life"
          quality_tier_required: [4]
          note: "Chemical recycling preferred"
    pcr_compatibility:
      max_pcr_pct: 40
      typical_pcr_pct: [10, 40]

recycling_rules:
  - rule_id: "EVA_FOOTWEAR_DOMINANT_SOURCE"
    material_type: "EVA"
    rule: "Footwear is largest EVA scrap source"
    confidence: 0.92
    market_share_pct: 40

  - rule_id: "EVA_SOLAR_CHEMICAL_RECYCLING"
    material_type: "EVA"
    rule: "Solar panel EVA requires chemical recycling due to high contamination"
    confidence: 0.90
    chemical_recycling_preferred: true

  - rule_id: "EVA_INJECTION_PIR_PREMIUM"
    material_type: "EVA"
    rule: "Injection PIR is highest quality EVA scrap - Tier 1"
    confidence: 0.95

contamination_profiles:
  - profile_id: "EVA_FOOTWEAR_FOAM"
    material_type: "EVA"
    source: "Footwear foam"
    contamination_level: "medium"
    quality_tier: 2
    typical_contaminants: ["dirt 2-5%", "adhesives 1-2%"]
    suitable_applications: ["Footwear", "General foam"]

  - profile_id: "EVA_SOLAR_PANEL"
    material_type: "EVA"
    source: "Solar panel encapsulant"
    contamination_level: "very high"
    quality_tier: 4
    typical_contaminants: ["glass 3-10%", "silicon <2%", "metals <1%"]
    suitable_applications: ["Chemical recycling", "Pyrolysis"]
    note: "Mechanical recycling not viable"

buyer_profiles:
  - buyer_id: "EVA_FOOTWEAR_MANUFACTURERS"
    buyer_type: "Footwear manufacturer"
    industry_segment: "Consumer Goods"
    material_requirements:
      polymer_types: ["EVA_foam"]
      purity_min_pct: 85
      max_pcr_pct: 50
      quality_tier_required: [2, 3]
    applications: ["Athletic shoe midsoles and foam"]
    volume_range_tons_month: [200, 2000]

  - buyer_id: "EVA_PACKAGING_MANUFACTURERS"
    buyer_type: "Packaging manufacturer"
    industry_segment: "Packaging"
    material_requirements:
      polymer_types: ["EVA_film"]
      purity_min_pct: 85
      max_pcr_pct: 40
      quality_tier_required: [2, 3]
    applications: ["Flexible packaging films"]
    volume_range_tons_month: [100, 1000]

  - buyer_id: "EVA_CHEMICAL_RECYCLERS"
    buyer_type: "Chemical recycler"
    industry_segment: "Chemical Recycling"
    material_requirements:
      polymer_types: ["EVA_any"]
      purity_min_pct: 50
      max_pcr_pct: 100
      quality_tier_required: [4]
    applications: ["Chemical feedstock", "Pyrolysis"]
    volume_range_tons_month: [200, 2000]
    note: "Accepts solar panel waste"

quality_indicators:
  - indicator_id: "EVA_VA_CONTENT"
    test_method: "FTIR"
    significance: "Vinyl acetate content determines flexibility"

  - indicator_id: "EVA_DENSITY"
    test_method: "ISO 1183"
    significance: "Indicates VA content and foam density"

inference_rules:
  - rule_id: "EVA_PRODUCT_TO_BUYER_FORWARD"
    inference_type: "buyer_matching"
    logic: "IF product=footwear_foam THEN grade=eva_foam AND match_buyers=[footwear_manufacturers, foam_manufacturers]"
    confidence: 0.90

  - rule_id: "EVA_SOLAR_CHEMICAL_ROUTING"
    inference_type: "buyer_matching"
    logic: "IF source=solar_panel THEN route_to_chemical_recycling"
    confidence: 0.90

standards:
  - standard_id: "ISO_1183"
    title: "Density determination"
    relevance: "Indicates EVA VA content and foam density"

processing_guidance:
  drying:
    required: false
    note: "EVA not hygroscopic - drying optional"
  temperature_control:
    processing_temp_c: [140, 180]
  mixing_pcr_virgin:
    max_pcr_pct_by_application:
      premium_footwear: 30
      mid_tier_footwear: 50
      packaging: 40
      general_foam: 60
