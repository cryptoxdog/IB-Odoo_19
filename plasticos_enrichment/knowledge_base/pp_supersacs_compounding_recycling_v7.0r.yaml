# ============================================================
# 12. PROCESSING GUIDANCE
# ============================================================
processing_guidance:
  collection_preparation:
    - step: "Sort by color (natural/white separate from mixed)"
      rationale: "Color sorting increases value 15-25%"

    - step: "Remove dirty liners"
      rationale: "Dirty liners contaminate entire bale"

    - step: "Clean residual content (food/chemical)"
      rationale: "Residue limits buyer options"

    - step: "Dry bags (moisture <1000ppm preferred)"
      rationale: "Moisture causes mold, odor, processing issues"

    - step: "Inspect for tears, degradation"
      rationale: "Damaged bags reduce processing efficiency"

  baling_shipping:
    - step: "Use headers for downstroke bales"
      rationale: "Prevents bale deformation"

    - step: "Stage bales on pallets"
      rationale: "Maintains cleanliness, facilitates loading"

    - step: "Maximize bales per load"
      rationale: "Reduces freight costs per pound"

    - step: "Count bales and take loading pictures"
      rationale: "Facilitates payment, reduces disputes"

    - step: "Stretch wrap bales/pallets"
      rationale: "Protects from dust, pests, moisture"

  recycling_process:
    - step: "Shredding (industrial-grade blades)"
      rationale: "Breaks down woven fabric"

    - step: "Washing (240°C)"
      rationale: "Removes residue, contaminants"

    - step: "Sorting (color, size, shape, melting point)"
      rationale: "Separates polymer from contaminants"

    - step: "Extrusion/pelletizing"
      rationale: "Creates uniform pellets"

    - step: "Compounding (virgin PP or additives)"
      rationale: "Strengthens recycled material, modifies properties"

