metadata:
  kb_name: "PP Supersacs (FIBC Bulk Bags) Compounding & Recycling"
  version: "7.0r"
  material_type: "Polypropylene Woven Bags"
  product_category: "Flexible Intermediate Bulk Containers (FIBC)"
