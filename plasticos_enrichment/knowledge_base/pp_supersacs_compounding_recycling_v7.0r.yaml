# ============================================================
# 5. RECYCLING RULES
# ============================================================
recycling_rules:
  - rule_id: "SUPERSAC_SORTING_COLOR"
    rule_name: "Color Sorting for Premium Markets"
    description: "Natural/white supersacs command premium pricing and access to FIBC manufacturers"
    conditions:
      color: ["natural", "white"]
      contamination_level: "low"
    actions:
      - "Sort by color (natural/white separate from mixed)"
      - "Target FIBC manufacturers"
      - "Target high-grade PP compounders"
    reasoning: "FIBC manufacturers require natural/white rPP for 30% recycled content bags with minimal discoloration"

  - rule_id: "SUPERSAC_LINER_REMOVAL"
    rule_name: "Remove Dirty Liners Before Baling"
    description: "Dirty liners contaminate entire bale and reduce value"
    conditions:
      liner_present: true
      liner_condition: "dirty"
    actions:
      - "Remove all dirty liners"
      - "Discard soiled liners separately"
      - "Inspect for residual contamination"
    reasoning: "Dirty liners introduce food/chemical residue that contaminates entire bale"

  - rule_id: "SUPERSAC_RESIDUE_CLEANING"
    rule_name: "Clean Residual Content Before Baling"
    description: "Food or chemical residue must be removed to ensure recyclability"
    conditions:
      residual_content: "present"
    actions:
      - "Clean bags to remove residual content"
      - "Discard heavily soiled bags"
      - "Sort by contamination level"
    reasoning: "Residual content (food/chemical) reduces quality and limits buyer options"

  - rule_id: "SUPERSAC_MOISTURE_CONTROL"
    rule_name: "Dry Bags Before Baling"
    description: "Moisture causes mold, odor, and processing issues"
    conditions:
      moisture_level: "high"
    actions:
      - "Dry bags before baling"
      - "Store in dry location"
      - "Stretch wrap bales to prevent moisture ingress"
    reasoning: "Moisture >1000ppm causes processing issues and limits buyer options"

  - rule_id: "SUPERSAC_BALING_DENSITY"
    rule_name: "Maximize Bale Density for Shipping"
    description: "Dense bales reduce freight costs and improve value"
    conditions:
      baling_required: true
    actions:
      - "Use headers for downstroke bales"
      - "Stage bales on pallets"
      - "Maximize bales per load (turn on sides if needed)"
      - "Count bales and take loading pictures"
    reasoning: "Dense bales reduce freight costs per pound, improving net value"

  - rule_id: "SUPERSAC_REUSE_LIMIT"
    rule_name: "Limit Reuse to 5 Cycles"
    description: "Supersacs degrade after 5 uses, reducing recycling value"
    conditions:
      reuse_count: {max: 5}
    actions:
      - "Track reuse count if possible"
      - "Inspect for tears, degradation"
      - "Discard after 5 uses or if damaged"
    reasoning: "Bags degrade after 5 uses, reducing tensile strength and recyclability"

  - rule_id: "SUPERSAC_SINGLE_USE_RECYCLING"
    rule_name: "Single-Use Bags Have Highest Value"
    description: "Single-trip bags (unused or lightly used) have highest recycling value"
    conditions:
      usage: "single_trip"
      condition: "good"
    actions:
      - "Prioritize single-trip bags for premium buyers"
      - "Target FIBC manufacturers"
      - "Ensure clean, dry, sorted"
    reasoning: "Single-trip bags retain 85-95% of virgin properties, suitable for 30% rPP FIBCs"

  - rule_id: "SUPERSAC_FOOD_GRADE_LINER"
    rule_name: "Food Contact Requires Virgin PE Liner"
    description: "Recycled PP supersacs unsuitable for direct food contact without virgin liner"
    conditions:
      application: "food_contact"
    actions:
      - "Inform buyer: virgin PE liner required for food-grade"
      - "Target non-food applications if no liner"
    reasoning: "Recycled PP from supersacs not food-grade without virgin PE liner"

  - rule_id: "SUPERSAC_CHEMICAL_TESTING"
    rule_name: "Test Chemical-Contaminated Bags"
    description: "Chemical residue requires testing before recycling"
    conditions:
      contamination_type: "chemical"
    actions:
      - "Test for chemical residue"
      - "Wash if possible"
      - "Discard if heavily contaminated"
      - "Target chemical-tolerant compounders"
    reasoning: "Chemical residue can affect recycled material properties and safety"

  - rule_id: "SUPERSAC_SEASONAL_VOLUME"
    rule_name: "Agriculture Bags Peak in Harvest Season"
    description: "Agriculture supersac volume peaks in Q3-Q4 (harvest season)"
    conditions:
      source: "agriculture"
      season: ["Q3", "Q4"]
    actions:
      - "Plan for high volume in harvest season"
      - "Secure storage capacity"
      - "Pre-arrange buyer commitments"
    reasoning: "Grain/seed harvest drives high supersac volume in Q3-Q4"

# ============================================================
# 6. CONTAMINATION PROFILES
# ============================================================
contamination_profiles:
  - contamination_type: "Food Residue"
    severity: "moderate"
    sources:
      - "Grain dust"
      - "Seed residue"
      - "Fertilizer residue"
      - "Animal feed residue"
    impact_on_recycling:
      property_degradation: "low to moderate"
      processing_difficulty: "moderate (requires washing)"
      buyer_limitations: "excludes food-contact applications"
    mitigation:
      - "Wash bags before baling"
      - "Remove liners"
      - "Target non-food buyers"
    acceptable_buyers:
      - "PP compounders (with washing)"
      - "PP recyclers"
      - "Injection molders (non-food)"

  - contamination_type: "Chemical Residue"
    severity: "moderate to high"
    sources:
      - "Dry chemical bags"
      - "Pigment bags"
      - "Additive bags"
    impact_on_recycling:
      property_degradation: "moderate to high"
      processing_difficulty: "high (requires testing and washing)"
      buyer_limitations: "excludes most applications without testing"
    mitigation:
      - "Test for chemical type and concentration"
      - "Wash if possible"
      - "Discard if heavily contaminated"
    acceptable_buyers:
      - "Chemical-tolerant compounders"
      - "Specialty recyclers"

  - contamination_type: "Dirt/Sand/Gravel"
    severity: "moderate"
    sources:
      - "Construction bags (sand, gravel, soil)"
      - "Mining bags (aggregates)"
      - "Disaster relief sandbags"
    impact_on_recycling:
      property_degradation: "moderate"
      processing_difficulty: "moderate (requires washing)"
      buyer_limitations: "limits to low-grade applications"
    mitigation:
      - "Wash bags before baling"
      - "Sort by contamination level"
      - "Target low-grade compounders"
    acceptable_buyers:
      - "PP recyclers (with washing)"
      - "Low-grade compounders"
      - "Pallet manufacturers"

  - contamination_type: "Moisture"
    severity: "low to moderate"
    sources:
      - "Outdoor storage"
      - "Wet materials (soil, sand)"
      - "Rain exposure"
    impact_on_recycling:
      property_degradation: "low"
      processing_difficulty: "low (requires drying)"
      buyer_limitations: "requires drying before processing"
    mitigation:
      - "Dry bags before baling"
      - "Store in dry location"
      - "Stretch wrap bales"
    acceptable_buyers:
      - "All buyers (if dried)"

  - contamination_type: "Other Polymers (PE, Nylon)"
    severity: "low to moderate"
    sources:
      - "PE liners"
      - "Nylon thread/straps"
      - "Mixed polymer bags"
    impact_on_recycling:
      property_degradation: "low to moderate"
      processing_difficulty: "moderate (requires sorting)"
      buyer_limitations: "limits to buyers with sorting capability"
    mitigation:
      - "Remove PE liners"
      - "Remove nylon straps"
      - "Sort by polymer type"
    acceptable_buyers:
      - "PP compounders (with sorting)"
      - "PP recyclers (with sorting)"
      - "Pallet manufacturers (blends acceptable)"

# ============================================================
# 7. QUALITY INDICATORS
# ============================================================
quality_indicators:
  - indicator: "Color Uniformity"
    measurement: "Visual inspection"
    thresholds:
      tier_1: "Natural/white, uniform color"
      tier_2: "Single color or light mixed"
      tier_3: "Mixed colors"
      tier_4: "Heavily discolored, degraded"
    importance: "High (affects FIBC manufacturing and appearance applications)"

  - indicator: "Residual Content"
    measurement: "Visual inspection, smell test"
    thresholds:
      tier_1: "No visible residue, no odor"
      tier_2: "Minimal residue, faint odor"
      tier_3: "Moderate residue, noticeable odor"
      tier_4: "Heavy residue, strong odor"
    importance: "High (affects processing and buyer acceptance)"

  - indicator: "Moisture Content"
    measurement: "Moisture meter (ppm)"
    thresholds:
      tier_1: "<1000 ppm"
      tier_2: "1000-2000 ppm"
      tier_3: "2000-3000 ppm"
      tier_4: ">3000 ppm"
    importance: "Moderate (affects processing and storage)"

  - indicator: "Dirt/Contamination"
    measurement: "Visual inspection, % by weight"
    thresholds:
      tier_1: "<1.0%"
      tier_2: "1.0-2.0%"
      tier_3: "2.0-5.0%"
      tier_4: ">5.0%"
    importance: "High (affects processing and quality)"

  - indicator: "Physical Condition"
    measurement: "Visual inspection"
    thresholds:
      tier_1: "Intact, no tears, no degradation"
      tier_2: "Minor tears, minimal degradation"
      tier_3: "Moderate tears, some degradation"
      tier_4: "Heavily torn, degraded"
    importance: "Moderate (affects processing efficiency)"

  - indicator: "Liner Condition"
    measurement: "Visual inspection"
    thresholds:
      tier_1: "No liner or clean liner"
      tier_2: "Clean liner, easily removable"
      tier_3: "Dirty liner, requires removal"
      tier_4: "Heavily soiled liner, contaminated"
    importance: "High (dirty liners contaminate entire bale)"

# ============================================================
# 8. INFERENCE RULES (Bidirectional Reasoning)
# ============================================================
inference_rules:
  - rule_id: "FORWARD_AGRICULTURE_TO_FIBC"
    rule_type: "forward"
    description: "Agriculture supersacs (grain/seed) → FIBC manufacturers"
    conditions:
      product_source: "agriculture"
      materials: ["grain", "seeds", "fertilizer"]
      color: ["natural", "white"]
      contamination_level: "low"
    infer:
      suitable_buyers: ["FIBC manufacturers", "PP compounders (high-grade)"]
      quality_tier: "tier_1"
      applications: ["New FIBC production (30% rPP)", "High-grade PP compounds"]
    confidence: 0.90

  - rule_id: "FORWARD_CONSTRUCTION_TO_PALLET"
    rule_type: "forward"
    description: "Construction supersacs (sand/gravel) → Pallet manufacturers"
    conditions:
      product_source: "construction"
      materials: ["sand", "gravel", "soil"]
      color: "mixed"
      contamination_level: "moderate"
    infer:
      suitable_buyers: ["Pallet manufacturers", "Low-grade compounders"]
      quality_tier: "tier_2 to tier_3"
      applications: ["Pallets (PP/HDPE blend)", "Non-critical industrial parts"]
    confidence: 0.85

  - rule_id: "BACKWARD_FIBC_TO_SOURCE"
    rule_type: "backward"
    description: "FIBC manufacturer needs → Agriculture/pharmaceutical/plastics sources"
    conditions:
      buyer_type: "FIBC manufacturer"
      recycled_content_target: "30% rPP"
      color_requirement: "natural/white"
    infer:
      required_sources: ["Agriculture (grain/seed)", "Pharmaceutical (powders)", "Plastics industry (pellet bags)"]
      quality_tier_required: "tier_1"
      contamination_tolerance: "low"
      color: ["natural", "white"]
    confidence: 0.92

  - rule_id: "BACKWARD_COMPOUNDER_TO_SOURCE"
    rule_type: "backward"
    description: "PP compounder needs → Various supersac sources"
    conditions:
      buyer_type: "PP compounder"
      washing_capability: true
    infer:
      required_sources: ["Agriculture", "Construction", "Industrial", "Chemical (tested)"]
      quality_tier_required: "tier_1 to tier_3"
      contamination_tolerance: "low to moderate"
      color: "any (color-sorted preferred)"
    confidence: 0.88

  - rule_id: "COLOR_SORTING_VALUE"
    rule_type: "quality_assessment"
    description: "Natural/white supersacs have higher value than mixed color"
    conditions:
      color: ["natural", "white"]
      contamination_level: "low"
    infer:
      value_premium: "15-25% higher than mixed color"
      buyer_access: ["FIBC manufacturers", "High-grade compounders"]
      quality_tier: "tier_1"
    confidence: 0.90

  - rule_id: "LINER_CONTAMINATION_IMPACT"
    rule_type: "quality_assessment"
    description: "Dirty liners reduce entire bale value"
    conditions:
      liner_condition: "dirty"
      liner_removed: false
    infer:
      value_reduction: "30-50% reduction"
      quality_tier_downgrade: "1-2 tiers"
      buyer_limitations: "excludes premium buyers"
    confidence: 0.95

  - rule_id: "SINGLE_USE_PREMIUM"
    rule_type: "quality_assessment"
    description: "Single-trip bags have highest recycling value"
    conditions:
      usage: "single_trip"
      condition: "good"
      color: ["natural", "white"]
    infer:
      quality_tier: "tier_1"
      property_retention: "85-95% of virgin"
      suitable_buyers: ["FIBC manufacturers", "High-grade compounders"]
    confidence: 0.92

  - rule_id: "REUSE_DEGRADATION"
    rule_type: "quality_assessment"
    description: "Reused bags (>5 cycles) have reduced value"
    conditions:
      reuse_count: {min: 5}
    infer:
      quality_tier: "tier_3 to tier_4"
      property_retention: "50-70% of virgin"
      suitable_buyers: ["Low-grade compounders", "Waste-to-energy"]
    confidence: 0.88

  - rule_id: "PHARMACEUTICAL_PREMIUM"
    rule_type: "quality_assessment"
    description: "Pharmaceutical supersacs command premium due to cleanliness"
    conditions:
      product_source: "pharmaceutical"
      contamination_level: "minimal"
      color: ["natural", "white"]
    infer:
      quality_tier: "tier_1"
      value_premium: "20-30% higher than standard"
      suitable_buyers: ["FIBC manufacturers (premium)", "Medical device manufacturers"]
    confidence: 0.93

