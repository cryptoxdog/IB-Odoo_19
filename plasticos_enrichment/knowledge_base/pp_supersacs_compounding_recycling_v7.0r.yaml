      form_preference: ["woven_fabric", "pellet"]
      color_preference: "natural, white (slight discoloration acceptable)"
      quality_tier_required: [1, 2]
      recycled_content_target: "30% rPP"

    contamination_tolerance:
      moisture_ppm: {max: 1500}
      dirt_pct: {max: 1.5}
      other_polymers_pct: {max: 2.0}
      metals_ppm: {max: 150}
      residual_content: "minimal"

    volume_requirements:
      typical_order_size_lbs: {min: 20000, max: 50000}
      monthly_capacity_lbs: {min: 100000, max: 500000}

