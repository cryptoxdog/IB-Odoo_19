# ============================================================
# 3. SOURCE QUALITY TIERS
# ============================================================
source_quality_tiers:
  tier_1:
    tier_name: "Premium PIR/Clean PCR"
    description: "Single-source, clean, sorted by color, minimal contamination"
    contamination_limits:
      moisture_ppm: {max: 1000}
      dirt_pct: {max: 1.0}
      other_polymers_pct: {max: 2.0}
      metals_ppm: {max: 100}
    source_examples:
      - "Pharmaceutical supersacs (clean)"
      - "Plastic pellet transport bags"
      - "Agriculture bags (grain, seeds)"
    property_retention:
      tensile_strength_pct: {min: 85, max: 95}
      impact_strength_pct: {min: 80, max: 90}
    suitable_applications:
      - "FIBC manufacturing (30% rPP)"
      - "High-grade PP compounding"
      - "Injection molding (non-food)"
    buyer_requirements:
      - "Sorted by color"
      - "Clean (no residue)"
      - "Dry (<1000ppm moisture)"
      - "Baled for shipping"

  tier_2:
    tier_name: "Standard PCR"
    description: "Multi-source, sorted, moderate contamination, requires cleaning"
    contamination_limits:
      moisture_ppm: {max: 2000}
      dirt_pct: {max: 2.0}
      other_polymers_pct: {max: 3.0}
      metals_ppm: {max: 200}
    source_examples:
      - "Mixed industrial supersacs"
      - "Construction bags (clean)"
      - "Chemical bags (low residue)"
    property_retention:
      tensile_strength_pct: {min: 70, max: 85}
      impact_strength_pct: {min: 65, max: 80}
    suitable_applications:
      - "PP compounding (lower-grade)"
      - "Injection molding (hidden parts)"
      - "Extrusion (durable goods)"
    buyer_requirements:
      - "Sorted by type"
      - "Cleaned (minimal residue)"
      - "Dry (<2000ppm moisture)"
      - "Baled for shipping"

  tier_3:
    tier_name: "Utility Grade PCR"
    description: "Mixed-source, moderate to heavy contamination, requires extensive washing"
    contamination_limits:
      moisture_ppm: {max: 3000}
      dirt_pct: {max: 5.0}
      other_polymers_pct: {max: 5.0}
      metals_ppm: {max: 300}
    source_examples:
      - "Construction bags (dirty)"
      - "Mining bags"
      - "End-of-life agricultural bags"
    property_retention:
      tensile_strength_pct: {min: 50, max: 70}
      impact_strength_pct: {min: 45, max: 65}
    suitable_applications:
      - "Low-grade compounding"
      - "Non-critical industrial parts"
      - "Pallets (PP/HDPE blends)"
    buyer_requirements:
      - "Washing capability required"
      - "Contamination testing"
      - "Baled for shipping"

  tier_4:
    tier_name: "Marginal/Reject"
    description: "Heavily contaminated, damaged, or degraded, limited recycling value"
    contamination_limits:
      moisture_ppm: {max: 5000}
      dirt_pct: {max: 10.0}
      other_polymers_pct: {max: 10.0}
      metals_ppm: {max: 500}
    source_examples:
      - "Heavily soiled bags"
      - "Torn/damaged bags"
      - "Chemically degraded bags"
    property_retention:
      tensile_strength_pct: {min: 30, max: 50}
      impact_strength_pct: {min: 25, max: 45}
    suitable_applications:
      - "Waste-to-energy"
      - "Landfill diversion"
      - "Experimental recycling"
    buyer_requirements:
      - "Specialty recyclers only"
      - "Waste-to-energy facilities"

