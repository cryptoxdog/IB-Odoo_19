# ============================================================
# 1. MATERIAL GRADES
# ============================================================
material_grades:
  - grade_id: "PP_SUPERSAC_CLEAN_NATURAL"
    grade_name: "Clean Natural PP Supersacs"
    description: "Clean, natural/white woven PP bulk bags, sorted by color, minimal contamination"
    polymer: "PP"
    form: "woven_fabric"
    color: "natural"
    feedstock_type: "Post Industrial / Post Consumer"

    typical_properties:
      density_g_cm3: {min: 0.90, max: 0.91}
      melt_flow_index_g_10min: {min: 2.0, max: 12.0}
      tensile_strength_mpa: {min: 25, max: 35}

    contamination_profile:
      moisture_ppm: {max: 1000}
      dirt_pct: {max: 1.0}
      other_polymers_pct: {max: 2.0}
      metals_ppm: {max: 100}
      residual_content: "minimal"

    source_quality_tier: "tier_1"

    product_sources:
      - "Agriculture supersacs (grain, seeds, fertilizer)"
      - "Construction supersacs (sand, gravel, soil)"
      - "Pharmaceutical supersacs (powders)"
      - "Chemical supersacs (dry chemicals)"
      - "Plastic pellet/flake transport bags"

    suitable_applications:
      - "Recycled PP pellet production"
      - "PP compounding (30% rPP content)"
      - "New FIBC manufacturing (30% rPP)"
      - "Injection molding (non-critical parts)"
      - "Extrusion (bins, trays, brushes)"

    buyer_targets:
      - "FIBC manufacturers"
      - "PP compounders"
      - "PP recyclers/reclaimers"
      - "Injection molders (non-food)"
      - "Extruders (durable goods)"

  - grade_id: "PP_SUPERSAC_MIXED_COLOR"
    grade_name: "Mixed Color PP Supersacs"
    description: "Mixed color woven PP bulk bags, clean but color-sorted, suitable for non-appearance applications"
    polymer: "PP"
    form: "woven_fabric"
    color: "mixed"
    feedstock_type: "Post Industrial / Post Consumer"

    typical_properties:
      density_g_cm3: {min: 0.90, max: 0.91}
      melt_flow_index_g_10min: {min: 2.0, max: 12.0}
      tensile_strength_mpa: {min: 20, max: 30}

    contamination_profile:
      moisture_ppm: {max: 1500}
      dirt_pct: {max: 2.0}
      other_polymers_pct: {max: 3.0}
      metals_ppm: {max: 150}
      residual_content: "minimal to moderate"

    source_quality_tier: "tier_2"

    product_sources:
      - "Mixed industrial supersacs"
      - "Construction site bulk bags"
      - "Mining supersacs (aggregates)"
      - "Disaster relief sandbags"

    suitable_applications:
      - "PP compounding (lower-grade)"
      - "Injection molding (hidden parts)"
      - "Extrusion (battery cables, brushes)"
      - "Pallets (PP/HDPE blends)"
      - "Non-appearance parts"

    buyer_targets:
      - "PP compounders"
      - "PP recyclers"
      - "Injection molders (industrial)"
      - "Pallet manufacturers"

  - grade_id: "PP_SUPERSAC_CONTAMINATED"
    grade_name: "Contaminated PP Supersacs"
    description: "PP bulk bags with moderate to heavy contamination, requires extensive washing"
    polymer: "PP"
    form: "woven_fabric"
    color: "mixed"
    feedstock_type: "Post Consumer"

    typical_properties:
      density_g_cm3: {min: 0.89, max: 0.91}
      melt_flow_index_g_10min: {min: 1.0, max: 15.0}
      tensile_strength_mpa: {min: 15, max: 25}

    contamination_profile:
      moisture_ppm: {max: 3000}
      dirt_pct: {max: 5.0}
      other_polymers_pct: {max: 5.0}
      metals_ppm: {max: 300}
      residual_content: "moderate to heavy"
      food_residue: "possible"
      chemical_residue: "possible"

    source_quality_tier: "tier_3"

    product_sources:
      - "End-of-life agricultural bags"
      - "Used construction bags"
      - "Food-contaminated bags"
      - "Chemical-contaminated bags"

    suitable_applications:
      - "PP recycling (with extensive washing)"
      - "Low-grade compounding"
      - "Non-critical industrial parts"

    buyer_targets:
      - "PP recyclers (with washing capability)"
      - "Low-grade compounders"

  - grade_id: "PP_SUPERSAC_SOILED_REJECT"
    grade_name: "Soiled/Reject PP Supersacs"
    description: "Heavily soiled or damaged PP bulk bags, limited recycling value"
    polymer: "PP"
    form: "woven_fabric"
    color: "mixed"
    feedstock_type: "Post Consumer"

    contamination_profile:
      moisture_ppm: {max: 5000}
      dirt_pct: {max: 10.0}
      other_polymers_pct: {max: 10.0}
      metals_ppm: {max: 500}
      residual_content: "heavy"
      damage: "torn, degraded"

    source_quality_tier: "tier_4"

    product_sources:
      - "Heavily contaminated bags"
      - "Torn/damaged bags"
      - "Chemically degraded bags"

    suitable_applications:
      - "Waste-to-energy"
      - "Landfill diversion"
      - "Experimental recycling"

    buyer_targets:
      - "Waste-to-energy facilities"
      - "Specialty recyclers"

