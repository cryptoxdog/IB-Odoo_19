material_grades:
  - grade_id: "LDPE_FILM_BLOWN"
    grade_name: "LDPE Blown Film Grade"
    description: "Low MI for bubble stability in blown film extrusion"
    type: "virgin"

    melt_index:
      range_g_10min: [0.5, 2.0]
      typical_g_10min: 1.0
      test_method: "ASTM D1238 (190°C/2.16 kg)"
      significance: "Lower MI provides better bubble stability and melt strength"

    density:
      range_g_cm3: [0.915, 0.925]
      typical_g_cm3: 0.920
      test_method: "ASTM D792"

    processing_temperatures:
      extrusion_temp_c: [160, 200]
      die_temp_c: [180, 210]
      blow_up_ratio: [2.0, 4.0]

    mechanical_properties:
      tensile_strength_mpa: [8, 15]
      elongation_at_break_pct: [300, 700]
      tear_strength_g: [80, 200]  # Elmendorf
      dart_drop_impact_g: [50, 200]
      test_method: "ASTM D638, D1922, D1709"

    optical_properties:
      haze_pct: [2, 8]
      gloss_pct: [20, 60]  # @ 45°
      test_method: "ASTM D1003, D2457"

    applications:
      primary:
        - "Shopping bags and grocery bags"
        - "Food packaging films"
        - "Agricultural films (greenhouse, mulch)"
      secondary:
        - "Shrink wrap"
        - "Protective packaging"

    pcr_compatibility:
      max_pcr_pct: 50
      typical_pcr_pct: [25, 40]
      quality_requirements: "Moderate contamination tolerance, consistent MFI"

    market_data:
      availability: "abundant"
