# ============================================================================
# INFERENCE RULES
# ============================================================================

inference_rules:
  - inference_id: "LDPE_INF_001"
    inference_type: "property"
    premise: "Material is LDPE film regrind, but melt index not provided"
    conclusion: "Infer MI = 2.0 g/10min (range 1.0-3.0)"
    confidence: 0.70
    reasoning: "Most post-consumer LDPE film has MI 1-4 g/10min. MI=2.0 is typical average for blown film."
    examples:
      - input: "LDPE film regrind, no MI data"
        output: "MI = 2.0 g/10min (confidence 70%)"
    sources:
      - "LDPE recycling research"
      - "ASTM D1238"

  - inference_id: "LDPE_INF_002"
    inference_type: "property"
    premise: "Material stored outdoors, moisture content not specified"
    conclusion: "Infer moisture = 1500-2500 ppm"
    confidence: 0.68
    reasoning: "Outdoor storage typically results in 1000-3000 ppm moisture depending on climate. 1500-2500 ppm is typical range."
    examples:
      - input: "LDPE film bales, outdoor storage, no moisture data"
        output: "Moisture = 2000 ppm (confidence 68%), requires drying"
    sources:
      - "Storage guidelines"

  - inference_id: "LDPE_INF_003"
    inference_type: "property"
    premise: "Material stored indoors, moisture content not specified"
    conclusion: "Infer moisture = 500-1000 ppm"
    confidence: 0.72
    reasoning: "Indoor storage in controlled environment typically results in 300-1200 ppm moisture. 500-1000 ppm is typical."
    examples:
      - input: "LDPE regrind, indoor storage, no moisture data"
        output: "Moisture = 750 ppm (confidence 72%), minimal drying needed"
    sources:
      - "Storage guidelines"

  - inference_id: "LDPE_INF_004"
    inference_type: "quality"
    premise: "Post-consumer film, contamination level not quantified"
    conclusion: "Infer contamination = 0.5-1.5%"
    confidence: 0.65
    reasoning: "Typical post-consumer LDPE film has 0.3-2.0% contamination after basic sorting. 0.5-1.5% is average for decent quality."
    examples:
      - input: "Post-consumer LDPE film, no contamination data"
        output: "Contamination = 1.0% (confidence 65%)"
    sources:
      - "Recycling industry data"

  - inference_id: "LDPE_INF_005"
    inference_type: "quality"
    premise: "Post-industrial film, contamination level not quantified"
    conclusion: "Infer contamination = 0.1-0.3%"
    confidence: 0.75
    reasoning: "Post-industrial regrind from single source typically has very low contamination. 0.1-0.3% is typical."
    examples:
      - input: "Post-industrial LDPE film, no contamination data"
        output: "Contamination = 0.2% (confidence 75%)"
    sources:
      - "Industry best practices"

  - inference_id: "LDPE_INF_006"
    inference_type: "application"
    premise: "MI = 0.5-2.0 g/10min, clear film, low contamination"
    conclusion: "Suitable for blown film applications (blended with virgin or 100% recycled)"
    confidence: 0.82
    reasoning: "Low MI provides good bubble stability for blown film. Clear and low contamination suitable for film."
    examples:
      - input: "MI = 1.5, clear, contamination = 0.3%"
        output: "Suitable for blown film (30% blend or 100% non-food), confidence 82%"
    sources:
      - "Film processing guidelines"

  - inference_id: "LDPE_INF_007"
    inference_type: "application"
    premise: "MI = 4-12 g/10min, moderate contamination"
    conclusion: "Suitable for injection molding or cast film (non-critical applications)"
    confidence: 0.78
    reasoning: "Higher MI suitable for injection molding and cast film. Moderate contamination acceptable for non-critical uses."
    examples:
      - input: "MI = 8, contamination = 1.2%"
        output: "Suitable for injection molding (non-food containers), confidence 78%"
    sources:
      - "Processing guidelines"

  - inference_id: "LDPE_INF_008"
    inference_type: "pricing"
    premise: "Material quality indicators: clear film, low contamination, single-source, low moisture"
    conclusion: "Price = Virgin baseline × (0.70-0.85) + quality premiums"
    confidence: 0.75
    reasoning: "High-quality recycled LDPE with multiple positive indicators commands 70-85% of virgin price plus quality premiums."
    examples:
      - input: "Clear PIR film, contamination 0.2%, moisture 400 ppm, single-source"
        output: "Price = $0.35-0.45/lb (confidence 75%)"
    sources:
      - "Market intelligence"
      - "Pricing data"

  - inference_id: "LDPE_INF_009"
    inference_type: "processing"
