# ============================================================================
# RECYCLING RULES
# ============================================================================

recycling_rules:
  - rule_id: "LDPE_RR_001"
    rule_name: "Film vs. Rigid Segregation"
    condition: "Material stream contains both LDPE film and rigid LDPE"
    action: "Separate film and rigid streams before processing"
    reasoning: "Different processing parameters and end applications. Film has lower density and different flow characteristics."
    confidence: 0.90
    exceptions:
      - "Intentional blending for specific applications"
    sources:
      - "Industry best practices"
      - "ASTM D1248 classification"

  - rule_id: "LDPE_RR_002"
    rule_name: "Melt Index Compatibility"
    condition: "Blending LDPE materials from different sources"
    action: "Match melt index ranges (±2 g/10min) or test blend compatibility"
    reasoning: "Significant MI mismatch causes processing issues and property variation in final product"
    confidence: 0.85
    exceptions:
      - "Intentional MI modification through blending"
      - "Compatibility testing performed"
    sources:
      - "Processing guidelines"
      - "ASTM D1238"

  - rule_id: "LDPE_RR_003"
    rule_name: "Moisture Control for Film"
    condition: "Processing recycled LDPE film"
    action: "Dry material to <1000 ppm moisture for film, <500 ppm for injection molding"
    reasoning: "Moisture causes bubbles, surface defects, and property degradation during processing"
    confidence: 0.92
    exceptions:
      - "Material stored in moisture-controlled environment with verified low moisture"
    sources:
      - "ASTM processing guidelines"
      - "Industry best practices"

  - rule_id: "LDPE_RR_004"
    rule_name: "Contamination Limits for Food Contact"
    condition: "Recycled LDPE intended for food contact applications"
    action: "Ensure contamination <0.3%, require FDA compliance documentation, limit to indirect food contact or blend ≤30% with virgin"
    reasoning: "FDA regulations restrict recycled content in direct food contact. Contamination affects safety and regulatory compliance."
    confidence: 0.95
    exceptions:
      - "FDA-approved recycling process"
      - "Indirect food contact applications"
    sources:
      - "FDA 21 CFR 177.1520"
      - "Food packaging regulations"

  - rule_id: "LDPE_RR_005"
    rule_name: "Cross-Polymer Contamination Limits"
    condition: "LDPE stream contains other polyolefins (HDPE, PP, LLDPE)"
    action: "For film applications: <2% total contamination. For non-critical applications: <5% acceptable."
    reasoning: "Cross-contamination affects optical properties (haze), mechanical properties, and processability"
    confidence: 0.88
    exceptions:
      - "Non-appearance applications with higher tolerance"
      - "Intentional polyolefin blends"
    sources:
      - "Film quality standards"
      - "Processing research"

  - rule_id: "LDPE_RR_006"
    rule_name: "Processing Temperature Control"
    condition: "Processing any LDPE material"
    action: "Maintain processing temperature 160-220°C for extrusion, 280-330°C for coating. Avoid exceeding 350°C."
    reasoning: "LDPE degrades above 350°C, causing discoloration, odor, and property loss. Optimal range ensures good processing without degradation."
    confidence: 0.93
    exceptions:
      - "Specific high-temperature applications with stabilizers"
    sources:
      - "ASTM processing standards"
      - "Manufacturer guidelines"

  - rule_id: "LDPE_RR_007"
    rule_name: "Multiple Cycle Property Degradation"
    condition: "Material has undergone multiple mechanical recycling cycles"
    action: "Limit to 4-6 mechanical recycling cycles, then downgrade to lower-value applications or blend with virgin"
    reasoning: "Progressive chain scission, oxidation, and property loss with each cycle. After 6 cycles, significant degradation occurs."
    confidence: 0.85
    exceptions:
      - "Chemical recycling to restore polymer structure"
      - "Use in non-critical applications"
    sources:
      - "Recycling research"
      - "Lifecycle analysis studies"

  - rule_id: "LDPE_RR_008"
    rule_name: "Odor Management for Film Applications"
    condition: "Recycled LDPE has moderate to strong odor"
    action: "Restrict to non-food applications or blend ≤20% with virgin. Consider chemical treatment or deodorization."
    reasoning: "Odor indicates contamination or degradation. Unacceptable for food contact and consumer-facing applications."
    confidence: 0.90
    exceptions:
      - "Deodorization treatment performed"
      - "Non-consumer applications (construction, industrial)"
    sources:
      - "Food packaging standards"
      - "Quality control guidelines"

  - rule_id: "LDPE_RR_009"
    rule_name: "Color Sorting for Appearance Applications"
    condition: "Recycled LDPE intended for visible film or consumer products"
    action: "Sort by color or plan for opaque pigmentation to mask color variation"
    reasoning: "Mixed colors create aesthetic issues in appearance-critical applications. Color sorting or heavy pigmentation required."
    confidence: 0.82
    exceptions:
      - "Black or dark-colored applications (masks color variation)"
      - "Non-appearance applications"
    sources:
      - "Industry best practices"
      - "Quality control guidelines"

  - rule_id: "LDPE_RR_010"
    rule_name: "Dirt and Organics Removal"
    condition: "Recycled LDPE contains >0.5% dirt, labels, or organic contamination"
    action: "Implement washing and screening process. Hot wash (60-80°C) with detergent, screen to remove particulates."
    reasoning: "Dirt and organics cause gel formation, surface defects, and filter plugging during processing"
    confidence: 0.88
    exceptions:
      - "Non-critical applications with high contamination tolerance"
    sources:
      - "Recycling process guidelines"
      - "Washing best practices"

  - rule_id: "LDPE_RR_011"
    rule_name: "Density Separation for Quality Control"
    condition: "Mixed plastic stream contains LDPE and other polymers"
    action: "Use sink-float separation (water density 1.0 g/cm³). LDPE floats, PVC/PET sink. Separate HDPE/PP by density gradient."
    reasoning: "Density separation is cost-effective method to remove heavier contaminants and improve LDPE purity"
    confidence: 0.90
    exceptions:
      - "NIR sorting available (more precise)"
      - "Single-source material with known composition"
    sources:
      - "Recycling technology guidelines"
      - "Density separation research"

  - rule_id: "LDPE_RR_012"
    rule_name: "Agricultural Film Recycling Challenges"
    condition: "LDPE from agricultural applications (greenhouse, mulch, silage)"
    action: "Expect high contamination (soil, organic matter, UV degradation). Require intensive washing and screening. Limit to non-critical applications."
    reasoning: "Agricultural films have severe contamination and UV degradation. Require specialized processing and have limited end applications."
    confidence: 0.87
    exceptions:
      - "Clean greenhouse film (lower contamination)"
      - "Specialized agricultural film recycling facilities"
    sources:
      - "Agricultural film recycling research"
      - "Industry challenges"

