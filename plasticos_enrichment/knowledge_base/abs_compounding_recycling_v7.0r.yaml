# ============================================================================
# QUALITY INDICATORS & TESTING
# ============================================================================

quality_indicators:
  - indicator_id: "ABS_IMPACT_STRENGTH"
    test_method: "ASTM D256 (Izod notched)"
    material_types: ["ABS"]
    thresholds:
      excellent:
        value_j_m: [300, 600]
      good:
        value_j_m: [200, 300]
      acceptable:
        value_j_m: [100, 200]
      poor:
        value_j_m: [0, 100]
    significance: "Key property of ABS - degrades with recycling cycles"

  - indicator_id: "ABS_MFI_CONSISTENCY"
    test_method: "ASTM D1238 (230°C/3.8kg)"
    material_types: ["ABS"]
    thresholds:
      excellent: "±10% of target MFI"
      good: "±20% of target MFI"
      acceptable: "±30% of target MFI"
      poor: ">±30% of target MFI"
    significance: "Indicates molecular weight stability and processability"

  - indicator_id: "ABS_COLOR_CONSISTENCY"
    test_method: "Visual inspection or spectrophotometry"
    material_types: ["ABS"]
    thresholds:
      excellent: "Single consistent color, no discoloration"
      good: "Single color with minor variation"
      acceptable: "Mixed colors or moderate discoloration"
      poor: "Heavily mixed or degraded color"
    significance: "Indicates thermal degradation and source quality"

  - indicator_id: "ABS_CONTAMINATION_LEVEL"
    test_method: "Visual inspection, ash content, metal detection"
    material_types: ["ABS"]
    thresholds:
      excellent:
        total_contamination_pct: [0, 0.5]
        metals_ppm: [0, 100]
      good:
        total_contamination_pct: [0.5, 2.5]
        metals_ppm: [100, 200]
      acceptable:
        total_contamination_pct: [2.5, 5.0]
        metals_ppm: [200, 400]
      poor:
        total_contamination_pct: [5.0, 100]
        metals_ppm: [400, 10000]
    significance: "Determines quality tier and application suitability"

# ============================================================================
# INFERENCE RULES & MATCHING LOGIC
# ============================================================================

inference_rules:
  - rule_id: "ABS_PRODUCT_TO_BUYER_FORWARD"
    inference_type: "buyer_matching"
    logic: "IF product=computer_keyboards THEN grade=general_purpose_abs AND quality_tier=[2,3] AND match_buyers=[electronics_housing, consumer_goods, industrial_housing]"
    reasoning: "Forward reasoning from product to suitable buyers based on grade and quality tier"
    confidence: 0.88

  - rule_id: "ABS_BUYER_TO_SOURCE_BACKWARD"
    inference_type: "source_matching"
    logic: "IF buyer=toy_manufacturers AND application=building_blocks THEN require_grade=general_purpose_abs AND require_tier=1 AND require_source=toy_pir_only"
    reasoning: "Backward reasoning from buyer requirements to acceptable sources"
    confidence: 0.92

  - rule_id: "ABS_TIER_ASSESSMENT_FROM_SOURCE"
    inference_type: "quality_assessment"
    logic: "IF source=weee_electronics AND sorting=sorted AND contamination<2.5% THEN tier=2"
    reasoning: "Assess quality tier from source characteristics and contamination"
    confidence: 0.85

  - rule_id: "ABS_IMPACT_CRITICAL_TIER_REQUIREMENT"
    inference_type: "buyer_matching"
    logic: "IF application=power_tools OR application=safety_helmets THEN require_tier=[1,2] AND require_impact_strength>300"
    reasoning: "Impact-critical applications require high-quality sources"
    confidence: 0.90

  - rule_id: "ABS_ELECTROPLATING_PROCESSING"
    inference_type: "processing_requirement"
    logic: "IF source=plumbing_fixtures OR chrome_plated=true THEN require_de_plating BEFORE recycling"
    reasoning: "Electroplated ABS requires de-plating for recycling"
    confidence: 0.95

  - rule_id: "ABS_PC_BLEND_ROUTING"
    inference_type: "material_routing"
    logic: "IF material=pc_abs_blend THEN route_to_dedicated_stream OR accept_as_tier3_abs"
    reasoning: "PC/ABS blends require dedicated stream or accept as contaminated ABS"
    confidence: 0.87

  - rule_id: "ABS_CYCLE_LIMIT_BY_APPLICATION"
    inference_type: "quality_assessment"
    logic: "IF cycles>2 THEN exclude_toys; IF cycles>4 THEN exclude_automotive_electronics; IF cycles>6 THEN industrial_only"
    reasoning: "Cycle limits based on application tier requirements"
    confidence: 0.85

