# MACK Knowledge Base: ABS (Acrylonitrile Butadiene Styrene) Compounding & Recycling v7.0r
# Purpose: Enable MACK reasoning for ABS material identification and buyer matching
# Compatible with: MACK v7.0 Odoo reasoning engine
# Last Updated: 2025-11-05
# Data Sources: ASTM D4673, comprehensive ABS recycling research, automotive/electronics standards

metadata:
  polymer_family: "Commodity Thermoplastics"
  polymer_type: "ABS"
  full_name: "Acrylonitrile Butadiene Styrene"
  resin_id_code: 7
  composition: "Acrylonitrile 15-35%, Butadiene 5-30%, Styrene 40-60%"
  version: "7.0r"
  last_updated: "2025-11-05"
  data_quality: "verified"
  source_tier: "tier_1"

# ============================================================================
# PRODUCT-TO-SCRAP MAPPING (Bidirectional Reasoning)
# ============================================================================

product_scrap_mapping:
  automotive_products:
    - product: "Interior trim panels (dashboards, consoles)"
      scrap_grade: "general_purpose_abs"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 3.0]
      typical_contaminants: ["adhesives <0.5%", "foam backing <1%", "metals <100ppm"]
      suitable_buyers: ["automotive_tier2", "industrial_housing", "consumer_goods"]
      reverse_reasoning: "IF buyer_needs_automotive_interior THEN source_automotive_abs_tier2_tier3"

    - product: "Bumpers and exterior trim"
      scrap_grade: "high_impact_abs"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.5, 4.0]
      typical_contaminants: ["paint/coating <2%", "UV degradation", "dirt <1%"]
      suitable_buyers: ["automotive_tier2", "industrial_applications"]

    - product: "Automotive instrument panels"
      scrap_grade: "general_purpose_abs"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [0.5, 2.0]
      suitable_buyers: ["automotive_tier1", "electronics_housing"]

  electronics_products:
    - product: "Computer keyboards and housings"
      scrap_grade: "general_purpose_abs"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [0.8, 2.5]
      typical_contaminants: ["metals <150ppm", "adhesives <0.3%", "labels <0.2%"]
      suitable_buyers: ["electronics_manufacturers", "consumer_goods", "industrial_housing"]
      reverse_reasoning: "IF buyer_needs_electronics_housing THEN source_weee_abs_tier2_tier3"

    - product: "Printer housings and components"
      scrap_grade: "general_purpose_abs"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 3.0]
      suitable_buyers: ["electronics_manufacturers", "industrial_housing"]

    - product: "Electronic device housings"
      scrap_grade: "fr_abs"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 2.5]
      suitable_buyers: ["electronics_manufacturers", "appliance_manufacturers"]

  appliance_products:
    - product: "Refrigerator interior components"
      scrap_grade: "general_purpose_abs"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.5, 3.5]
      typical_contaminants: ["food residue <1%", "adhesives <0.5%"]
      suitable_buyers: ["appliance_manufacturers", "industrial_housing"]
      reverse_reasoning: "IF buyer_needs_appliance_components THEN source_appliance_abs_tier2_tier3"

    - product: "Washing machine components"
      scrap_grade: "general_purpose_abs"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 3.0]
      suitable_buyers: ["appliance_manufacturers", "industrial_housing"]

    - product: "Vacuum cleaner housings"
      scrap_grade: "high_impact_abs"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.5, 3.5]
      suitable_buyers: ["appliance_manufacturers", "consumer_goods"]

  consumer_products:
    - product: "Toys (LEGO, building blocks)"
      scrap_grade: "general_purpose_abs"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [0.3, 1.5]
      typical_contaminants: ["printing inks <0.2%", "minimal contamination"]
      suitable_buyers: ["toy_manufacturers", "consumer_goods", "industrial_housing"]
      reverse_reasoning: "IF buyer_needs_toys THEN source_toy_abs_pir_tier1_tier2"
      note: "Toy-grade ABS often high quality PIR from manufacturing"

    - product: "Luggage and cases"
      scrap_grade: "high_impact_abs"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [2.0, 4.0]
      suitable_buyers: ["consumer_goods", "industrial_applications"]

    - product: "Sporting goods"
      scrap_grade: "high_impact_abs"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.5, 3.5]
      suitable_buyers: ["sporting_goods", "consumer_goods"]

  industrial_products:
    - product: "Power tool housings"
      scrap_grade: "high_impact_abs"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [0.5, 2.0]
      typical_contaminants: ["metal dust <200ppm", "oils <0.3%"]
      suitable_buyers: ["power_tool_manufacturers", "industrial_housing"]
      reverse_reasoning: "IF buyer_needs_power_tools THEN source_power_tool_abs_tier1_tier2"

    - product: "Industrial equipment housings"
      scrap_grade: "general_purpose_abs"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 3.0]
      suitable_buyers: ["industrial_manufacturers"]

  plumbing_products:
    - product: "Plumbing fixtures (faucets, drains)"
      scrap_grade: "electroplating_abs"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.5, 3.5]
      typical_contaminants: ["chrome/nickel plating <2%", "adhesives <0.5%"]
      suitable_buyers: ["plumbing_manufacturers", "industrial_applications"]
      note: "Electroplated ABS requires de-plating for recycling"

# ============================================================================
# SOURCE QUALITY TIER DEFINITIONS (ABS-Specific)
# ============================================================================

source_quality_tiers:
  tier_1_premium:
    definition: "Single-source PIR, minimal contamination, documented processing"
    contamination_max_pct: 0.5
    moisture_max_ppm: 500
    metal_content_max_ppm: 100
    property_retention_min_pct: 90
    sorting_purity_min_pct: 98
    processing_history: "Single cycle or virgin manufacturing scrap"
    examples:
      - "Toy manufacturing PIR (LEGO-type)"
      - "Automotive component manufacturing scrap (documented)"
      - "Power tool manufacturing PIR"
      - "Electronics housing PIR (known grade)"
    suitable_applications:
      - "Toys (high quality requirements)"
      - "Automotive visible components"
      - "Premium electronics housing"
      - "Power tools"
    value_premium_pct: [15, 25]

  tier_2_standard:
    definition: "Multi-source sorted PCR, moderate contamination"
    contamination_max_pct: 2.5
    moisture_max_ppm: 1000
    metal_content_max_ppm: 200
    property_retention_min_pct: 75
    sorting_purity_min_pct: 85
    processing_history: "1-3 recycling cycles"
    examples:
      - "WEEE electronics housing (sorted)"
      - "Post-consumer automotive components (sorted)"
      - "Appliance housing scrap (sorted)"
      - "General post-consumer ABS (sorted, washed)"
    suitable_applications:
      - "Electronics housing (non-critical)"
      - "Automotive interior (non-visible)"
      - "Appliance components"
      - "Consumer goods (non-toy)"
      - "Industrial housings"
    value_premium_pct: [0, 0]

  tier_3_utility:
    definition: "Mixed-source, higher contamination, multiple cycles"
    contamination_max_pct: 5.0
    moisture_max_ppm: 2000
    metal_content_max_ppm: 400
    property_retention_min_pct: 60
    sorting_purity_min_pct: 70
    processing_history: "3-6 recycling cycles or unknown"
    examples:
      - "Mixed post-consumer ABS (unsorted)"
      - "Contaminated electronics scrap"
      - "General waste stream ABS"
      - "Mixed consumer goods"
    suitable_applications:
      - "Industrial applications (non-critical)"
      - "Construction materials"
      - "Low-value consumer goods"
      - "Utility products"
    value_discount_pct: [35, 50]

  tier_4_marginal:
    definition: "Heavily contaminated, degraded, multiple unknown cycles"
    contamination_min_pct: 5.0
    property_retention_max_pct: 60
    processing_history: ">6 cycles or severely degraded"
    examples:
      - "Heavily contaminated mixed waste"
      - "Degraded consumer goods"
      - "Mixed polymer waste streams"
    suitable_applications:
      - "Chemical recycling feedstock"
      - "Downcycled products (very limited)"
      - "Waste-to-energy"
    value_discount_pct: [60, 80]

# ============================================================================
# MATERIAL PROPERTIES & GRADES
# ============================================================================

material_grades:
  - grade_id: "ABS_GENERAL_PURPOSE"
    grade_name: "General Purpose ABS"
    description: "Standard ABS for general applications requiring impact resistance and processability"
    type: "virgin"

    composition:
      acrylonitrile_pct: [15, 35]
      butadiene_pct: [5, 30]
      styrene_pct: [40, 60]

    processing_temperatures:
      melt_temp_c: [200, 260]
      optimal_range_c: [220, 250]
      decomposition_temp_c: 300
      mold_temp_c: [50, 80]

    density:
      value_g_cm3: 1.05
      range_g_cm3: [1.02, 1.08]
      test_method: "ASTM D792"

    melt_flow_rate:
      value_g_10min: [2, 30]
      test_conditions: "230°C/3.8kg"
      test_method: "ASTM D1238"
      note: "Wide range - flow varies significantly by grade"

    mechanical_properties:
      tensile_strength_mpa: [35, 55]
      flexural_modulus_mpa: [2000, 2800]
      impact_strength_j_m: [150, 400]
      hdt_c: [85, 105]
      elongation_at_break_pct: [15, 40]
      test_method: "ASTM D638, D790, D256, D648"

    applications:
      primary:
        - product: "Appliance housings"
          scrap_source: "Appliance manufacturing, post-consumer appliances"
          quality_tier_required: [2, 3]
        - product: "Computer and electronic housings"
          scrap_source: "WEEE electronics"
          quality_tier_required: [2, 3]
        - product: "Automotive interior components"
          scrap_source: "Automotive manufacturing, end-of-life vehicles"
          quality_tier_required: [2, 3]
      secondary:
        - product: "Toys and sporting goods"
          scrap_source: "Toy manufacturing PIR"
          quality_tier_required: [1, 2]
        - product: "Luggage and cases"
          scrap_source: "Consumer goods"
          quality_tier_required: [2, 3]

    pcr_compatibility:
      max_pcr_pct: 50
      typical_pcr_pct: [20, 40]
      quality_requirements: "Moderate contamination control, <2.5% contaminants"

  - grade_id: "ABS_HIGH_IMPACT"
    grade_name: "High Impact ABS"
    description: "Enhanced impact resistance ABS for demanding applications"
    type: "virgin"

    composition:
      acrylonitrile_pct: [15, 25]
      butadiene_pct: [20, 30]
      styrene_pct: [45, 60]
      note: "Higher butadiene content for enhanced impact"

    processing_temperatures:
      melt_temp_c: [200, 250]
      optimal_range_c: [220, 240]

    mechanical_properties:
      tensile_strength_mpa: [30, 45]
      flexural_modulus_mpa: [1800, 2400]
      impact_strength_j_m: [300, 600]
      hdt_c: [80, 95]
      elongation_at_break_pct: [25, 60]
      note: "Superior impact, slightly lower stiffness than GP ABS"

    applications:
      primary:
        - product: "Automotive bumpers and trim"
          scrap_source: "Automotive manufacturing, end-of-life vehicles"
          quality_tier_required: [2, 3]
        - product: "Power tool housings"
          scrap_source: "Power tool manufacturing PIR"
          quality_tier_required: [1, 2]
        - product: "Safety helmets"
          scrap_source: "Safety equipment manufacturing"
          quality_tier_required: [1, 2]
      secondary:
        - product: "Outdoor furniture"
          scrap_source: "Consumer goods"
          quality_tier_required: [2, 3]
        - product: "Heavy-duty appliance components"
          scrap_source: "Appliance manufacturing"
          quality_tier_required: [2, 3]

  - grade_id: "ABS_FLAME_RETARDANT"
    grade_name: "Flame Retardant ABS (UL94 V-0)"
    description: "FR-enhanced ABS for electrical/electronic applications"
    type: "virgin"

    flame_retardant_system:
      type: "halogenated or halogen-free"
      loading_pct: [10, 25]
      common_systems: ["brominated + antimony trioxide", "phosphorus compounds"]

    fire_performance:
      ul94_rating: "V-0, V-1, or V-2"
      oxygen_index_pct: [22, 28]
      flame_spread_index: 25
      test_method: "UL 94, ASTM D2863, E162"

    mechanical_properties:
      tensile_strength_mpa: [30, 50]
      flexural_modulus_mpa: [2200, 3000]
      impact_strength_j_m: [100, 300]
      hdt_c: [90, 110]
      note: "Reduced impact due to FR additives"

    applications:
      primary:
        - product: "Electrical and electronic housings"
          scrap_source: "WEEE electronics"
          quality_tier_required: [2, 3]
        - product: "Automotive interior components"
          scrap_source: "Automotive manufacturing"
          quality_tier_required: [2, 3]
        - product: "Appliance components"
          scrap_source: "Appliance manufacturing"
          quality_tier_required: [2, 3]
      secondary:
        - product: "Building and construction materials"
          scrap_source: "Construction"
          quality_tier_required: [3, 4]

  - grade_id: "ABS_GLASS_FILLED"
    grade_name: "Glass Fiber Reinforced ABS (GF10-30%)"
    description: "Glass fiber reinforced ABS for high-stiffness structural applications"
    type: "virgin"

    glass_fiber_content:
      standard_grades_pct: [10, 30]
      high_loading_pct: [30, 40]
      fiber_length_mm: [0.1, 0.4]

    enhanced_properties:
      tensile_strength_mpa: [60, 120]
      flexural_modulus_mpa: [4000, 8000]
      impact_strength_j_m: [80, 200]
      hdt_c: [120, 160]
      dimensional_stability: "significantly improved"

    processing_considerations:
      melt_temp_c: [230, 280]
      note: "Higher than unfilled ABS, increased wear on equipment"
      anisotropy: "directional properties due to fiber orientation"

    applications:
      primary:
        - product: "Automotive structural components"
          scrap_source: "Automotive manufacturing PIR"
          quality_tier_required: [1, 2]
        - product: "Power tool housings"
          scrap_source: "Power tool manufacturing PIR"
          quality_tier_required: [1, 2]
        - product: "Industrial equipment parts"
          scrap_source: "Industrial manufacturing"
          quality_tier_required: [2, 3]

  - grade_id: "ABS_ELECTROPLATING"
    grade_name: "Electroplating Grade ABS"
    description: "Optimized for chrome/nickel plating applications"
    type: "virgin"

    processing_requirements:
      melt_temp_c: [220, 250]
      mold_temp_c: [50, 80]
      surface_finish: "mirror polish required"

    surface_properties:
      surface_roughness_ra_um: 0.1
      adhesion: "excellent chrome/nickel adhesion"
      platability: "optimized for electroplating"

    applications:
      primary:
        - product: "Plumbing fixtures (faucets, drains)"
          scrap_source: "Plumbing manufacturing, post-consumer"
          quality_tier_required: [2, 3]
          note: "Requires de-plating for recycling"
        - product: "Automotive trim (chrome-plated)"
          scrap_source: "Automotive manufacturing, end-of-life vehicles"
          quality_tier_required: [2, 3]

  - grade_id: "ABS_PC_BLEND"
    grade_name: "PC/ABS Blend"
    description: "ABS blended with polycarbonate for enhanced heat and impact resistance"
    type: "blend"

    composition:
      abs_pct: [50, 85]
      pc_pct: [15, 50]

    enhanced_properties:
      tensile_strength_mpa: [40, 60]
      impact_strength_j_m: [400, 700]
      hdt_c: [100, 130]
      note: "Combines ABS processability with PC heat/impact resistance"

    applications:
      primary:
        - product: "Automotive interior components (premium)"
          scrap_source: "Automotive manufacturing PIR"
          quality_tier_required: [1, 2]
        - product: "Electronics housings (premium)"
          scrap_source: "WEEE electronics"
          quality_tier_required: [2, 3]
      note: "PC/ABS blend recycling requires separation or dedicated stream"

# ============================================================================
# RECYCLING RULES & CONTAMINATION PROFILES
# ============================================================================

recycling_rules:
  - rule_id: "ABS_PIR_VS_PCR_QUALITY"
    rule: "ABS PIR significantly higher quality than PCR due to thermal history"
    reasoning: "PIR ABS: single cycle, known grade, minimal contamination, 90%+ property retention. PCR ABS: multiple cycles, mixed grades, contamination, 60-80% property retention. Impact strength particularly sensitive to recycling."
    confidence: 0.88
    pir_characteristics:
      property_retention_pct: [90, 100]
      contamination_pct: [0.1, 0.5]
      quality_tier: 1
    pcr_characteristics:
      property_retention_pct: [60, 80]
      contamination_pct: [1.0, 5.0]
      quality_tier: [2, 3]

  - rule_id: "ABS_IMPACT_DEGRADATION"
    material_type: "ABS"
    rule: "ABS impact strength degrades with recycling cycles - butadiene oxidation"
    reasoning: "Butadiene rubber phase oxidizes during thermal cycling, reducing impact strength 10-20% per cycle. Tensile strength more stable. Impact-critical applications require Tier 1-2 only."
    confidence: 0.90
    degradation_rates:
      impact_strength_loss_per_cycle_pct: [10, 20]
      tensile_strength_loss_per_cycle_pct: [3, 8]

  - rule_id: "ABS_WEEE_SOURCE_QUALITY"
    material_type: "ABS"
    source_type: "WEEE electronics"
    rule: "WEEE ABS sources vary widely - sorting by grade critical"
    reasoning: "WEEE contains GP ABS, FR ABS, PC/ABS blends. Sorting purity 70-85%. Contamination: metals, adhesives, other plastics. Grade identification critical for buyer matching."
    confidence: 0.85
    weee_characteristics:
      sorting_purity_pct: [70, 85]
      typical_grades: ["GP ABS", "FR ABS", "PC/ABS blends"]
      contamination_pct: [1.0, 3.5]
      quality_tier: [2, 3]

  - rule_id: "ABS_ELECTROPLATING_CHALLENGE"
    material_type: "ABS"
    rule: "Electroplated ABS requires de-plating before recycling"
    reasoning: "Chrome/nickel plating on ABS (plumbing fixtures, automotive trim) must be removed before recycling. De-plating adds cost but enables Tier 2-3 quality. Unplated scrap is Tier 4."
    confidence: 0.92
    processing_requirements:
      de_plating_required: true
      de_plating_methods: ["chemical stripping", "mechanical removal"]
      cost_impact: "moderate - adds $200-400/ton"

  - rule_id: "ABS_MULTI_CYCLE_LIMITS"
    rule: "ABS recycling cycle limits vary by application tier"
    reasoning: "Toys/premium: 1-2 cycles max (Tier 1). Electronics/automotive: 3-4 cycles acceptable (Tier 2). Industrial: 5-6 cycles OK (Tier 3)."
    confidence: 0.85
    cycle_limits:
      toys_premium_max_cycles: 2
      electronics_automotive_max_cycles: 4
      industrial_max_cycles: 6

  - rule_id: "ABS_PC_BLEND_SEPARATION"
    material_type: "PC/ABS blend"
    rule: "PC/ABS blends require separation or dedicated recycling stream"
    reasoning: "PC/ABS blends common in automotive and electronics. Separation difficult and costly. Best practice: dedicated PC/ABS recycling stream or accept as contaminated ABS (Tier 3)."
    confidence: 0.87
    processing_options:
      dedicated_stream: "preferred - maintains blend properties"
      separation: "costly - chemical or selective dissolution"
      contaminated_abs: "acceptable for Tier 3 applications"

contamination_profiles:
  - profile_id: "ABS_WEEE_ELECTRONICS_SORTED"
    material_type: "ABS"
    source: "WEEE electronics (sorted)"
    contamination_level: "low-medium"
    quality_tier: 2
    typical_contaminants:
      - "Metals (screws, brackets): 100-200 ppm"
      - "Adhesives: <0.5%"
      - "Labels/printing: <0.3%"
      - "Other plastics (PS, PC): <2%"
    sorting_purity_pct: 80
    suitable_applications:
      - "Electronics housing (non-critical)"
      - "Industrial housings"
      - "Consumer goods"

  - profile_id: "ABS_AUTOMOTIVE_PIR"
    material_type: "ABS"
    source: "Automotive manufacturing PIR"
    contamination_level: "very low"
    quality_tier: 1
    typical_contaminants:
      - "Minimal - clean manufacturing environment"
      - "Paint/coating residue: <0.2%"
    sorting_purity_pct: 98
    suitable_applications:
      - "Automotive components (all tiers)"
      - "Premium electronics"
      - "Power tools"

  - profile_id: "ABS_TOY_MANUFACTURING_PIR"
    material_type: "ABS"
    source: "Toy manufacturing PIR (LEGO-type)"
    contamination_level: "minimal"
    quality_tier: 1
    typical_contaminants:
      - "Printing inks: <0.2%"
      - "Minimal contamination - high quality control"
    sorting_purity_pct: 99
    suitable_applications:
      - "Toys (meets toy safety standards)"
      - "Premium consumer goods"
      - "Electronics housing"

  - profile_id: "ABS_APPLIANCE_PCR"
    material_type: "ABS"
    source: "Post-consumer appliances (sorted)"
    contamination_level: "medium"
    quality_tier: 3
    typical_contaminants:
      - "Food residue: 1-2%"
      - "Adhesives: 0.5-1%"
      - "Mixed plastics: 2-4%"
    sorting_purity_pct: 75
    suitable_applications:
      - "Appliance components (non-food contact)"
      - "Industrial housings"
      - "Construction materials"

