product_scrap_mapping:
  automotive:
    - product: "Automotive bumpers and fascia"
      scrap_grade_ref: "PP_IMPACT_COPOLYMER"
      scrap_quality_tier:
      typical_contamination:
        total_pct:
          value: [2.0, 5.0]
          unit: "%"
        contaminants:
          - name: "paint/coating"
            pct:
              value: [1.0, 3.0]
              unit: "%"
          - name: "TPO/TPE"
            pct:
              value: [0.0, 2.0]
              unit: "%"
          - name: "adhesives"
            pct:
              value: [0.0, 0.5]
              unit: "%"
      suitable_buyer_refs:
        - "PP_AUTOMOTIVE_TIER2"
        - "PP_INDUSTRIAL_CONTAINER_MANUFACTURERS"
      reverse_reasoning: "IF buyer_needs_automotive_bumpers THEN source_automotive_pp_icp_tier2_tier3"
      note: null

    - product: "Automotive interior trim and panels"
