inference_rules:
  - rule_id: "PP_PRODUCT_TO_BUYER_FORWARD"
    inference_type: "buyer_matching"
    rule_type: "forward"
    conditions:
      - field: "product_category"
        operator: "in"
        value:
          - "bottle_caps"
          - "closures"
    conclusions:
      - field: "grade_ref"
        value: "PP_HOMOPOLYMER_INJECTION"
      - field: "quality_tier"
        value: null
      - field: "matched_buyer_refs"
        value:
          - "PP_PACKAGING_NON_FOOD"
          - "PP_INJECTION_MOLDERS"
    confidence: 0.90
    reasoning: "Forward reasoning from product to suitable buyers based on grade and quality tier"

  - rule_id: "PP_BUYER_TO_SOURCE_BACKWARD"
    inference_type: "source_matching"
    rule_type: "backward"
    conditions:
      - field: "buyer_ref"
        operator: "eq"
        value: "PP_MEDICAL_DEVICE_MANUFACTURERS"
    conclusions:
      - field: "grade_ref"
        value: "PP_MEDICAL_GRADE"
      - field: "quality_tier"
        value: null
      - field: "source_constraint"
        value: "medical_pir_only"
    confidence: 0.98
    reasoning: "Backward reasoning from buyer requirements to acceptable sources"

  - rule_id: "PP_INJECTION_PIR_PREMIUM_MATCHING"
    inference_type: "buyer_matching"
    rule_type: "forward"
    conditions:
      - field: "source_type"
        operator: "eq"
        value: "injection_pir"
      - field: "contamination_total_pct"
        operator: "lt"
        value: 0.5
    conclusions:
      - field: "quality_tier"
        value: null
      - field: "matched_buyer_refs"
        value:
          - "ALL_PP_BUYERS"
    confidence: 0.95
    reasoning: "Injection PIR is premium quality - suitable for all PP applications"

  - rule_id: "PP_MFI_APPLICATION_MATCHING"
    inference_type: "application_matching"
    rule_type: "forward"
    conditions:
      - field: "melt_flow_rate"
        operator: "lt"
        value: 5
        unit: "g/10min"
    conclusions:
      - field: "suitable_applications"
        value:
          - "raffia"
          - "sheet_extrusion"
    confidence: 0.92
    reasoning: "Low MFI PP suited for high-MW applications (raffia, sheet)"

  - rule_id: "PP_MFI_INJECTION_MATCHING"
    inference_type: "application_matching"
    rule_type: "forward"
    conditions:
      - field: "melt_flow_rate"
        operator: "between"
        value: null
        unit: "g/10min"
    conclusions:
      - field: "suitable_applications"
        value:
          - "injection_molding"
          - "thin_wall"
    confidence: 0.92
    reasoning: "Medium MFI PP suited for injection molding and thin-wall"

  - rule_id: "PP_MFI_FIBER_MATCHING"
    inference_type: "application_matching"
    rule_type: "forward"
    conditions:
      - field: "melt_flow_rate"
        operator: "between"
        value: null
        unit: "g/10min"
    conclusions:
      - field: "suitable_applications"
        value:
          - "fiber"
          - "film"
    confidence: 0.92
    reasoning: "High MFI PP suited for fiber and film"

  - rule_id: "PP_MFI_LIMITED_MATCHING"
    inference_type: "application_matching"
    rule_type: "forward"
    conditions:
      - field: "melt_flow_rate"
        operator: "gt"
        value: 150
        unit: "g/10min"
    conclusions:
      - field: "suitable_applications"
        value:
          - "limited_applications"
    confidence: 0.92
    reasoning: "Very high MFI PP - severely degraded, limited applications"

  - rule_id: "PP_FOOD_CONTACT_EXCLUSION"
    inference_type: "application_matching"
    rule_type: "forward"
    conditions:
      - field: "source_type"
        operator: "eq"
        value: "post_consumer_food_contact"
    conclusions:
      - field: "excluded_applications"
        value:
          - "direct_food_contact"
      - field: "route_to"
        value:
          - "indirect_food_contact"
          - "non_food"
    confidence: 0.98
    reasoning: "FDA restrictions on PCR food contact"

  - rule_id: "PP_PE_CONTAMINATION_ROUTING"
    inference_type: "buyer_matching"
    rule_type: "forward"
    conditions:
      - field: "pe_contamination_pct"
        operator: "lt"
        value: 0.5
    conclusions:
      - field: "matched_buyer_refs"
        value:
          - "PP_MEDICAL_DEVICE_MANUFACTURERS"
          - "PP_PACKAGING_FOOD"
    confidence: 0.88
    reasoning: "Very low PE contamination enables food/medical buyers"

  - rule_id: "PP_PE_CONTAMINATION_ROUTING_MEDIUM"
    inference_type: "buyer_matching"
    rule_type: "forward"
    conditions:
      - field: "pe_contamination_pct"
        operator: "between"
        value: [0.5, 3.0]
    conclusions:
      - field: "matched_buyer_refs"
        value:
          - "PP_AUTOMOTIVE_TIER2"
          - "PP_ELECTRONICS_BUYERS"
    confidence: 0.88
    reasoning: "Medium PE contamination routes to automotive/electronics buyers"

  - rule_id: "PP_PE_CONTAMINATION_ROUTING_HIGH"
    inference_type: "buyer_matching"
    rule_type: "forward"
    conditions:
      - field: "pe_contamination_pct"
        operator: "between"
        value: [3.0, 8.0]
    conclusions:
      - field: "matched_buyer_refs"
        value:
          - "PP_INDUSTRIAL_CONTAINER_MANUFACTURERS"
    confidence: 0.88
    reasoning: "Higher PE contamination routes to industrial buyers"

  - rule_id: "PP_PE_CONTAMINATION_ROUTING_VERY_HIGH"
    inference_type: "buyer_matching"
    rule_type: "forward"
    conditions:
      - field: "pe_contamination_pct"
        operator: "gt"
        value: 8.0
    conclusions:
      - field: "matched_buyer_refs"
        value:
          - "PP_TEXTILE_RECYCLERS"
          - "PP_DOWNCYCLED_APPLICATIONS"
    confidence: 0.88
    reasoning: "Very high PE contamination routes to textile/downcycled buyers"

  - rule_id: "PP_HOMOPOLYMER_COPOLYMER_SEPARATION"
    inference_type: "processing_requirement"
    rule_type: "forward"
    conditions:
      - field: "mixed_homopolymer_copolymer"
        operator: "eq"
        value: true
    conclusions:
      - field: "density_separation_recommended"
        value: true
    confidence: 0.85
    reasoning: "Separation improves property consistency and value"

