# MACK Knowledge Base: PBT (Polybutylene Terephthalate) Compounding & Recycling v7.0r
# Purpose: Enable MACK reasoning for PBT material identification and buyer matching
# Compatible with: MACK v7.0 Odoo reasoning engine
# Last Updated: 2025-11-05

metadata:
  polymer_family: "Engineering Thermoplastics"
  polymer_type: "PBT"
  full_name: "Polybutylene Terephthalate"
  structure: "Semi-crystalline thermoplastic polyester"
  version: "7.0r"
  last_updated: "2025-11-05"
  data_quality: "verified"
  source_tier: "tier_3"
  note: "Electrical/electronic applications - automotive connectors"

product_scrap_mapping:
  automotive_products:
    - product: "Automotive electrical connectors"
      scrap_grade: "pbt_gf30"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [0.5, 2.0]
      typical_contaminants: ["metal inserts <0.5%"]
      suitable_buyers: ["automotive_electrical", "electronics_manufacturers"]
      reverse_reasoning: "IF buyer_needs_electrical_connectors THEN source_pbt_gf30_tier1_tier2"
      note: "Largest PBT application"

    - product: "Automotive under-hood components"
      scrap_grade: "pbt_gf30"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 3.0]
      suitable_buyers: ["automotive_tier2"]

  electronics_products:
    - product: "Electronics housings and connectors"
      scrap_grade: "pbt_unfilled or pbt_gf15"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 3.0]
      suitable_buyers: ["electronics_manufacturers"]

  manufacturing_scrap:
    - product: "Injection molding PIR"
      scrap_grade: "any_pbt"
      scrap_quality_tier: [1]
      typical_contamination_pct: [0.1, 0.5]
      suitable_buyers: ["all_pbt_buyers"]
      note: "Premium quality - Tier 1"

source_quality_tiers:
  tier_1_premium:
    definition: "Manufacturing PIR, electrical properties maintained"
    contamination_max_pct: 0.5
    property_retention_min_pct: 95
    suitable_applications: ["Automotive electrical", "Electronics"]
    value_premium_pct: [25, 40]

  tier_2_standard:
    definition: "Post-industrial, moderate contamination"
    contamination_max_pct: 3.0
    property_retention_min_pct: 80
    suitable_applications: ["General automotive", "Industrial"]

  tier_3_utility:
    definition: "Mixed post-consumer"
    contamination_max_pct: 8.0
    property_retention_min_pct: 65
    suitable_applications: ["Low-value applications"]
    value_discount_pct: [40, 55]

material_grades:
  - grade_id: "PBT_GF30"
    grade_name: "PBT + 30% Glass Fiber"
    description: "High-strength for automotive electrical"
    applications:
      primary:
        - product: "Automotive electrical connectors"
          scrap_source: "Automotive manufacturing, end-of-life vehicles"
          quality_tier_required: [1, 2]
        - product: "Automotive under-hood components"
          scrap_source: "Automotive manufacturing"
          quality_tier_required: [2, 3]
    pcr_compatibility:
      max_pcr_pct: 30
      typical_pcr_pct: [10, 30]

  - grade_id: "PBT_UNFILLED"
    grade_name: "PBT Unfilled"
    description: "General-purpose electrical applications"
    applications:
      primary:
        - product: "Electronics housings"
          scrap_source: "Electronics manufacturing, post-consumer"
          quality_tier_required: [2, 3]
    pcr_compatibility:
      max_pcr_pct: 50
      typical_pcr_pct: [15, 50]

recycling_rules:
  - rule_id: "PBT_ELECTRICAL_PROPERTIES_CRITICAL"
    material_type: "PBT"
    rule: "Electrical properties critical - contamination >3% affects performance"
    confidence: 0.92

  - rule_id: "PBT_INJECTION_PIR_PREMIUM"
    material_type: "PBT"
    rule: "Injection PIR maintains electrical properties - Tier 1"
    confidence: 0.95

contamination_profiles:
  - profile_id: "PBT_AUTOMOTIVE_ELECTRICAL"
    material_type: "PBT"
    source: "Automotive electrical connectors"
    contamination_level: "low"
    quality_tier: 2
    typical_contaminants: ["metal inserts <0.5%"]
    suitable_applications: ["Automotive electrical", "Electronics"]

buyer_profiles:
  - buyer_id: "PBT_AUTOMOTIVE_ELECTRICAL"
    buyer_type: "Automotive electrical component manufacturer"
    industry_segment: "Automotive"
    material_requirements:
      polymer_types: ["PBT_GF30"]
      purity_min_pct: 90
      max_pcr_pct: 30
      quality_tier_required: [1, 2]
    applications: ["Automotive electrical connectors"]
    volume_range_tons_month: [50, 500]

  - buyer_id: "PBT_ELECTRONICS_MANUFACTURERS"
    buyer_type: "Electronics manufacturer"
    industry_segment: "Electronics"
    material_requirements:
      polymer_types: ["PBT_unfilled", "PBT_GF15"]
      purity_min_pct: 85
      max_pcr_pct: 50
      quality_tier_required: [2, 3]
    applications: ["Electronics housings and connectors"]
    volume_range_tons_month: [50, 500]

quality_indicators:
  - indicator_id: "PBT_DIELECTRIC_STRENGTH"
    test_method: "ASTM D149"
    significance: "Critical for electrical applications"

  - indicator_id: "PBT_HDT"
    test_method: "ISO 75"
    significance: "Heat resistance for under-hood applications"

inference_rules:
  - rule_id: "PBT_PRODUCT_TO_BUYER_FORWARD"
    inference_type: "buyer_matching"
    logic: "IF product=electrical_connectors THEN grade=pbt_gf30 AND match_buyers=[automotive_electrical, electronics]"
    confidence: 0.90

  - rule_id: "PBT_ELECTRICAL_MATCHING"
    inference_type: "quality_control"
    logic: "IF contamination>3% THEN reject_electrical_applications"
    confidence: 0.92

standards:
  - standard_id: "ASTM_D149"
    title: "Dielectric Breakdown Voltage and Dielectric Strength"
    relevance: "Critical for PBT electrical applications"

processing_guidance:
  drying:
    required: true
    moisture_threshold_pct: 0.02
    drying_temp_c: [120, 140]
    drying_time_hours: [3, 4]
  temperature_control:
    processing_temp_c: [240, 270]
  mixing_pcr_virgin:
    max_pcr_pct_by_application:
      automotive_electrical: 30
      electronics: 50
      general_applications: 60
