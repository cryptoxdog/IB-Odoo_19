# ============================================================================
# QUALITY INDICATORS & TESTING
# ============================================================================

quality_indicators:
  - indicator_id: "LLDPE_TEAR_STRENGTH"
    test_method: "ASTM D1922 (Elmendorf)"
    material_types: ["LLDPE"]
    thresholds:
      excellent:
        value_g: [250, 600]
      good:
        value_g: [150, 250]
      acceptable:
        value_g: [100, 150]
      poor:
        value_g: [0, 100]
    significance: "Key property for film applications - indicates comonomer type and quality"

  - indicator_id: "LLDPE_CONTAMINATION_VISUAL"
    test_method: "Visual inspection"
    material_types: ["LLDPE"]
    thresholds:
      excellent: "Clean, minimal visible contamination, consistent color"
      good: "Minor contamination, single color"
      acceptable: "Moderate contamination, mixed colors"
      poor: "Heavy contamination, degraded appearance"
    significance: "Indicates source quality and tier classification"

  - indicator_id: "LLDPE_MELT_INDEX"
    test_method: "ASTM D1238 (190°C/2.16kg)"
    material_types: ["LLDPE"]
    thresholds:
      film_grade: [0.5, 4.0]
      rotomolding_grade: [3.0, 8.0]
      injection_grade: [15, 35]
    significance: "Indicates molecular weight and processability - critical for application matching"

  - indicator_id: "LLDPE_DIRT_CONTENT"
    test_method: "Visual inspection or filtration test"
    material_types: ["LLDPE"]
    thresholds:
      excellent:
        dirt_pct: [0, 0.1]
      good:
        dirt_pct: [0.1, 1.0]
      acceptable:
        dirt_pct: [1.0, 3.0]
      poor:
        dirt_pct: [3.0, 100]
    significance: "Critical for film applications - affects optical properties and processability"

# ============================================================================
# INFERENCE RULES & MATCHING LOGIC
# ============================================================================

inference_rules:
  - rule_id: "LLDPE_PRODUCT_TO_BUYER_FORWARD"
    inference_type: "buyer_matching"
    logic: "IF product=stretch_wrap THEN grade=hexene_lldpe AND quality_tier=[1,2] AND match_buyers=[stretch_film_manufacturers, industrial_film]"
    reasoning: "Forward reasoning from product to suitable buyers based on grade and quality tier"
    confidence: 0.90

  - rule_id: "LLDPE_BUYER_TO_SOURCE_BACKWARD"
    inference_type: "source_matching"
    logic: "IF buyer=food_packaging_non_contact THEN require_grade=octene_or_metallocene AND require_tier=1 AND require_source=film_pir_only"
    reasoning: "Backward reasoning from buyer requirements to acceptable sources"
    confidence: 0.95

  - rule_id: "LLDPE_FILM_PIR_PREMIUM_MATCHING"
    inference_type: "buyer_matching"
    logic: "IF source=film_pir AND contamination<0.5% THEN tier=1 AND match_all_buyers"
    reasoning: "Film PIR is premium quality - suitable for all LLDPE applications"
    confidence: 0.95

  - rule_id: "LLDPE_AGRICULTURAL_WASHING_REQUIREMENT"
    inference_type: "processing_requirement"
    logic: "IF source=agricultural_film THEN require_washing BEFORE tier_assessment"
    reasoning: "Agricultural film requires washing to remove soil/organic contamination"
    confidence: 0.92

  - rule_id: "LLDPE_FOOD_CONTACT_EXCLUSION"
    inference_type: "application_matching"
    logic: "IF source=post_consumer_food_contact THEN exclude_food_contact_reuse AND route_to_non_food"
    reasoning: "FDA restrictions on PCR food contact - route to non-food applications"
    confidence: 0.98

  - rule_id: "LLDPE_COMONOMER_VALUE_MATCHING"
    inference_type: "buyer_matching"
    logic: "IF comonomer=C8 THEN premium_applications; IF comonomer=C6 THEN standard_applications; IF comonomer=C4 THEN cost_sensitive_applications"
    reasoning: "Comonomer type determines performance tier and buyer matching"
    confidence: 0.85

  - rule_id: "LLDPE_STRETCH_WRAP_RECYCLING"
    inference_type: "buyer_matching"
    logic: "IF product=stretch_wrap AND source=post_industrial THEN tier=[1,2] AND match_buyers=[stretch_film_manufacturers]"
    reasoning: "Post-industrial stretch wrap ideal for stretch film recycling"
    confidence: 0.90

