# MACK Knowledge Base: LLDPE (Linear Low-Density Polyethylene) Compounding & Recycling v7.0r
# Purpose: Enable MACK reasoning for LLDPE material identification and buyer matching
# Compatible with: MACK v7.0 Odoo reasoning engine
# Last Updated: 2025-11-05
# Data Sources: ASTM D1248, comprehensive LLDPE recycling research, film/packaging standards

metadata:
  polymer_family: "Polyolefins"
  polymer_type: "LLDPE"
  full_name: "Linear Low-Density Polyethylene"
  resin_id_code: 4
  structure: "Linear backbone with short chain branches (10-35 per 1000 C)"
  version: "7.0r"
  last_updated: "2025-11-05"
  data_quality: "verified"
  source_tier: "tier_1"

# ============================================================================
# PRODUCT-TO-SCRAP MAPPING (Bidirectional Reasoning)
# ============================================================================

product_scrap_mapping:
  packaging_film_products:
    - product: "Grocery bags and shopping bags"
      scrap_grade: "butene_lldpe_film"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [2.0, 5.0]
      typical_contaminants: ["food residue 1-3%", "printing inks <1%", "labels <0.5%"]
      suitable_buyers: ["film_manufacturers_non_food", "industrial_film", "construction_film"]
      reverse_reasoning: "IF buyer_needs_grocery_bags THEN source_post_consumer_lldpe_film_tier2_tier3"

    - product: "Stretch wrap and pallet wrap"
      scrap_grade: "hexene_lldpe_film"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [0.5, 2.0]
      typical_contaminants: ["minimal - industrial use", "adhesive residue <0.3%"]
      suitable_buyers: ["stretch_film_manufacturers", "industrial_film", "packaging_manufacturers"]
      reverse_reasoning: "IF buyer_needs_stretch_film THEN source_post_industrial_lldpe_tier1_tier2"

    - product: "Food packaging films"
      scrap_grade: "octene_lldpe_film or metallocene_lldpe"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [0.3, 1.5]
      typical_contaminants: ["food residue <1%", "printing inks <0.5%"]
      suitable_buyers: ["food_packaging_non_contact", "industrial_film"]
      note: "Food contact scrap cannot be reused for food contact - route to non-food applications"

    - product: "Trash bags and liners"
      scrap_grade: "butene_lldpe_film"
      scrap_quality_tier: [3, 4]
      typical_contamination_pct: [5.0, 15.0]
      typical_contaminants: ["heavy contamination", "mixed waste"]
      suitable_buyers: ["construction_film", "industrial_non_critical"]

  agricultural_products:
    - product: "Agricultural films (greenhouse, mulch)"
      scrap_grade: "butene_lldpe_film or hexene_lldpe_film"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [3.0, 8.0]
      typical_contaminants: ["soil/dirt 2-5%", "UV degradation", "organic matter 1-3%"]
      suitable_buyers: ["agricultural_film_manufacturers", "construction_film", "industrial_film"]
      reverse_reasoning: "IF buyer_needs_agricultural_film THEN source_agricultural_lldpe_tier2_tier3_washed"

    - product: "Silage wrap and hay bale wrap"
      scrap_grade: "hexene_lldpe_film"
      scrap_quality_tier: [3, 4]
      typical_contamination_pct: [5.0, 12.0]
      typical_contaminants: ["organic matter 3-8%", "soil/dirt 2-4%"]
      suitable_buyers: ["agricultural_film_recyclers", "construction_film"]

  industrial_products:
    - product: "Geomembranes and pond liners"
      scrap_grade: "hexene_lldpe or octene_lldpe"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [2.0, 5.0]
      typical_contaminants: ["soil/dirt 1-3%", "UV degradation"]
      suitable_buyers: ["geomembrane_manufacturers", "construction_film", "industrial_film"]

    - product: "Pipe and conduit (LLDPE-based)"
      scrap_grade: "hexene_lldpe_injection"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [0.5, 2.0]
      suitable_buyers: ["pipe_manufacturers", "industrial_applications"]

  rotomolding_products:
    - product: "Rotomolded tanks and containers"
      scrap_grade: "butene_lldpe_rotomolding or hexene_lldpe_rotomolding"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 3.0]
      typical_contaminants: ["minimal - industrial use"]
      suitable_buyers: ["rotomolding_manufacturers", "industrial_applications"]

  manufacturing_scrap:
    - product: "Film manufacturing edge trim (PIR)"
      scrap_grade: "any_lldpe_film_grade"
      scrap_quality_tier: [1]
      typical_contamination_pct: [0.1, 0.5]
      typical_contaminants: ["minimal - clean manufacturing"]
      suitable_buyers: ["film_manufacturers", "all_lldpe_buyers"]
      reverse_reasoning: "IF buyer_needs_high_quality_lldpe THEN source_film_pir_tier1"
      note: "Film PIR is highest quality LLDPE scrap - premium value"

# ============================================================================
# SOURCE QUALITY TIER DEFINITIONS (LLDPE-Specific)
# ============================================================================

source_quality_tiers:
  tier_1_premium:
    definition: "Film manufacturing PIR, single-source, minimal contamination"
    contamination_max_pct: 0.5
    moisture_max_ppm: 1000
    dirt_max_pct: 0.1
    property_retention_min_pct: 95
    sorting_purity_min_pct: 99
    processing_history: "Single cycle or virgin manufacturing scrap"
    examples:
      - "Film manufacturing edge trim (PIR)"
      - "Stretch wrap manufacturing scrap"
      - "Packaging film PIR (documented grade)"
      - "Rotomolding manufacturing scrap"
    suitable_applications:
      - "Food packaging (non-contact)"
      - "Premium stretch film"
      - "High-performance films"
      - "Medical packaging (non-sterile)"
    value_premium_pct: [20, 35]

  tier_2_standard:
    definition: "Post-industrial or sorted post-consumer, moderate contamination"
    contamination_max_pct: 3.0
    moisture_max_ppm: 2000
    dirt_max_pct: 1.0
    property_retention_min_pct: 80
    sorting_purity_min_pct: 85
    processing_history: "1-3 recycling cycles"
    examples:
      - "Post-industrial stretch wrap (used)"
      - "Sorted post-consumer film (washed)"
      - "Agricultural film (sorted, washed)"
      - "Geomembrane scrap"
    suitable_applications:
      - "Grocery bags"
      - "Trash bags"
      - "Agricultural films"
      - "Industrial films"
      - "Construction films"
    value_premium_pct: [0, 0]

  tier_3_utility:
    definition: "Mixed post-consumer, higher contamination, multiple cycles"
    contamination_max_pct: 8.0
    moisture_max_ppm: 5000
    dirt_max_pct: 3.0
    property_retention_min_pct: 60
    sorting_purity_min_pct: 70
    processing_history: "3-6 recycling cycles or unknown"
    examples:
      - "Mixed post-consumer film (unwashed)"
      - "Contaminated agricultural film"
      - "General waste stream LLDPE"
      - "Mixed grocery bags"
    suitable_applications:
      - "Construction films (non-critical)"
      - "Industrial applications (low-value)"
      - "Trash bags (low-grade)"
      - "Downcycled products"
    value_discount_pct: [40, 60]

  tier_4_marginal:
    definition: "Heavily contaminated, degraded, multiple unknown cycles"
    contamination_min_pct: 8.0
    property_retention_max_pct: 60
    processing_history: ">6 cycles or severely degraded"
    examples:
      - "Heavily contaminated trash bags"
      - "Degraded agricultural film"
      - "Mixed polymer waste streams"
    suitable_applications:
      - "Chemical recycling feedstock"
      - "Pyrolysis feedstock"
      - "Very limited mechanical recycling"
    value_discount_pct: [70, 85]

# ============================================================================
# MATERIAL PROPERTIES & GRADES
# ============================================================================

material_grades:
  - grade_id: "LLDPE_BUTENE_FILM"
    grade_name: "Butene LLDPE Film Grade (C4-LLDPE)"
    description: "Cost-effective LLDPE for general film applications"
    type: "virgin"
    comonomer: "1-butene (C4)"

    melt_index:
      film_grade_g_10min: [0.5, 4.0]
      test_conditions: "190°C/2.16kg"
      test_method: "ASTM D1238"

    density:
      film_grade_g_cm3: [0.918, 0.925]
      test_method: "ASTM D792"

    mechanical_properties:
      tensile_strength_mpa: [12, 25]
      elongation_at_break_pct: [400, 800]
      tear_strength_g: [100, 300]
      impact_strength_j_m: [600, 1200]
      test_method: "ASTM D638, D1922, D256"

    applications:
      primary:
        - product: "Grocery bags and shopping bags"
          scrap_source: "Post-consumer retail, film manufacturing PIR"
          quality_tier_required: [2, 3]
        - product: "Trash bags and liners"
          scrap_source: "Post-consumer waste, film manufacturing PIR"
          quality_tier_required: [3, 4]
        - product: "Agricultural films (lower performance)"
          scrap_source: "Agricultural waste, film PIR"
          quality_tier_required: [2, 3]

    pcr_compatibility:
      max_pcr_pct: 100
      typical_pcr_pct: [25, 75]
      note: "LLDPE film highly recyclable - up to 100% PCR in non-critical applications"

  - grade_id: "LLDPE_HEXENE_FILM"
    grade_name: "Hexene LLDPE Film Grade (C6-LLDPE)"
    description: "Balanced performance LLDPE for high-quality film applications"
    type: "virgin"
    comonomer: "1-hexene (C6)"

    melt_index:
      film_grade_g_10min: [0.5, 4.0]
      test_conditions: "190°C/2.16kg"

    density:
      film_grade_g_cm3: [0.918, 0.925]

    mechanical_properties:
      tensile_strength_mpa: [15, 28]
      elongation_at_break_pct: [500, 900]
      tear_strength_g: [150, 400]
      impact_strength_j_m: [700, 1400]
      note: "Superior tear strength vs C4-LLDPE"

    applications:
      primary:
        - product: "Stretch and shrink films"
          scrap_source: "Post-industrial stretch wrap, film PIR"
          quality_tier_required: [1, 2]
        - product: "Heavy-duty bags and sacks"
          scrap_source: "Post-consumer, film PIR"
          quality_tier_required: [2, 3]
        - product: "Geomembranes and liners"
          scrap_source: "Construction/industrial, manufacturing PIR"
          quality_tier_required: [2, 3]
      secondary:
        - product: "Agricultural films (premium)"
          scrap_source: "Agricultural waste, film PIR"
          quality_tier_required: [2, 3]

  - grade_id: "LLDPE_OCTENE_FILM"
    grade_name: "Octene LLDPE Film Grade (C8-LLDPE)"
    description: "Premium performance LLDPE for demanding film applications"
    type: "virgin"
    comonomer: "1-octene (C8)"

    melt_index:
      film_grade_g_10min: [0.5, 4.0]
      specialty_g_10min: [0.3, 1.0]
      test_conditions: "190°C/2.16kg"

    density:
      film_grade_g_cm3: [0.918, 0.925]

    mechanical_properties:
      tensile_strength_mpa: [18, 32]
      elongation_at_break_pct: [600, 1000]
      tear_strength_g: [200, 500]
      impact_strength_j_m: [800, 1600]
      note: "Highest tear strength among LLDPE grades"

    applications:
      primary:
        - product: "Premium food packaging films"
          scrap_source: "Food packaging manufacturing PIR only"
          quality_tier_required: [1]
          note: "Food contact scrap → non-food applications only"
        - product: "Medical and pharmaceutical packaging"
          scrap_source: "Medical packaging manufacturing PIR"
          quality_tier_required: [1]
        - product: "High-performance stretch films"
          scrap_source: "Film manufacturing PIR"
          quality_tier_required: [1, 2]

  - grade_id: "LLDPE_METALLOCENE"
    grade_name: "Metallocene LLDPE (mLLDPE)"
    description: "Advanced catalyst LLDPE with superior properties and processability"
    type: "virgin"
    catalyst: "metallocene or constrained geometry"

    molecular_characteristics:
      mw_distribution: "narrow (Mw/Mn = 2.0-2.5)"
      comonomer_distribution: "uniform"

    mechanical_properties:
      tensile_strength_mpa: [20, 35]
      elongation_at_break_pct: [700, 1200]
      tear_strength_g: [250, 600]
      impact_strength_j_m: [900, 1800]
      dart_drop_impact_g: [200, 800]

    optical_properties:
      clarity: "superior"
      gloss: "enhanced"

    applications:
      primary:
        - product: "Premium packaging films"
          scrap_source: "Film manufacturing PIR"
          quality_tier_required: [1]
        - product: "Medical device packaging"
          scrap_source: "Medical manufacturing PIR"
          quality_tier_required: [1]
        - product: "High-clarity films"
          scrap_source: "Film manufacturing PIR"
          quality_tier_required: [1]

  - grade_id: "LLDPE_ROTOMOLDING"
    grade_name: "Rotomolding Grade LLDPE"
    description: "LLDPE optimized for rotational molding applications"
    type: "virgin"

    melt_index:
      rotomolding_g_10min: [3.0, 8.0]
      test_conditions: "190°C/2.16kg"

    density:
      rotomolding_g_cm3: [0.930, 0.940]
      note: "Higher density than film grades"

    applications:
      primary:
        - product: "Rotomolded tanks and containers"
          scrap_source: "Rotomolding manufacturing PIR, post-industrial"
          quality_tier_required: [1, 2]
        - product: "Industrial containers"
          scrap_source: "Industrial use, manufacturing PIR"
          quality_tier_required: [2, 3]

  - grade_id: "LLDPE_INJECTION"
    grade_name: "Injection Molding Grade LLDPE"
    description: "Higher flow LLDPE for injection molding applications"
    type: "virgin"

    melt_index:
      injection_g_10min: [15, 35]
      test_conditions: "190°C/2.16kg"

    applications:
      primary:
        - product: "Pipe and conduit"
          scrap_source: "Pipe manufacturing PIR, construction"
          quality_tier_required: [1, 2]
        - product: "Injection molded parts"
          scrap_source: "Manufacturing PIR"
          quality_tier_required: [1, 2]

# ============================================================================
# RECYCLING RULES & CONTAMINATION PROFILES
# ============================================================================

recycling_rules:
  - rule_id: "LLDPE_FILM_PIR_PREMIUM"
    material_type: "LLDPE"
    rule: "Film manufacturing PIR is highest quality LLDPE scrap - Tier 1"
    reasoning: "Film edge trim from manufacturing: clean, single grade, known comonomer, minimal contamination (<0.5%), 95%+ property retention. Premium value for all applications."
    confidence: 0.95
    pir_characteristics:
      contamination_pct: [0.1, 0.5]
      quality_tier: 1
      property_retention_pct: [95, 100]

  - rule_id: "LLDPE_FOOD_CONTACT_RESTRICTION"
    material_type: "LLDPE"
    rule: "Post-consumer food contact LLDPE cannot be reused for food contact"
    reasoning: "FDA regulations restrict PCR from food contact applications for direct food contact reuse. Route to non-food applications: grocery bags, trash bags, industrial film."
    confidence: 0.98
    restriction: "food_contact_pcr → non_food_applications_only"

  - rule_id: "LLDPE_AGRICULTURAL_CONTAMINATION"
    material_type: "LLDPE"
    source_type: "agricultural film"
    rule: "Agricultural LLDPE requires washing - soil/organic contamination 3-8%"
    reasoning: "Agricultural films (greenhouse, mulch, silage) contaminated with soil (2-5%), organic matter (1-3%), UV degradation. Washing required for Tier 2-3 quality."
    confidence: 0.90
    processing_requirements:
      washing: "required"
      contamination_removal: "soil, organic matter"
      quality_tier_after_washing: [2, 3]

  - rule_id: "LLDPE_STRETCH_WRAP_QUALITY"
    material_type: "LLDPE"
    source_type: "stretch wrap"
    rule: "Post-industrial stretch wrap is Tier 1-2 quality - minimal contamination"
    reasoning: "Stretch wrap from industrial/warehouse use: minimal contamination (adhesive residue <0.3%), known grade (typically C6-LLDPE), 1-2 cycles. Excellent for stretch film recycling."
    confidence: 0.88
    quality_characteristics:
      contamination_pct: [0.5, 2.0]
      quality_tier: [1, 2]
      typical_grade: "hexene_lldpe"

  - rule_id: "LLDPE_MULTI_CYCLE_TOLERANCE"
    material_type: "LLDPE"
    rule: "LLDPE tolerates multiple recycling cycles better than LDPE"
    reasoning: "LLDPE linear structure with short branches: less chain scission than LDPE. Property retention: 80-90% after 3 cycles, 60-75% after 6 cycles. Suitable for high-PCR applications."
    confidence: 0.85
    property_retention:
      after_3_cycles_pct: [80, 90]
      after_6_cycles_pct: [60, 75]

  - rule_id: "LLDPE_COMONOMER_IDENTIFICATION"
    material_type: "LLDPE"
    rule: "Comonomer type (C4/C6/C8) affects recycling value and applications"
    reasoning: "C4-LLDPE: lowest value, general applications. C6-LLDPE: balanced, most common. C8-LLDPE: premium value, high-performance. Comonomer identification critical for buyer matching."
    confidence: 0.82
    value_hierarchy: "C8 > C6 > C4"

contamination_profiles:
  - profile_id: "LLDPE_FILM_PIR"
    material_type: "LLDPE"
    source: "Film manufacturing PIR (edge trim)"
    contamination_level: "minimal"
    quality_tier: 1
    typical_contaminants:
      - "Minimal - clean manufacturing environment"
      - "Possible printing inks: <0.1%"
    sorting_purity_pct: 99
    suitable_applications:
      - "All LLDPE film applications"
      - "Food packaging (non-contact)"
      - "Premium stretch film"

  - profile_id: "LLDPE_STRETCH_WRAP_POST_INDUSTRIAL"
    material_type: "LLDPE"
    source: "Post-industrial stretch wrap (used)"
    contamination_level: "low"
    quality_tier: 2
    typical_contaminants:
      - "Adhesive residue: <0.5%"
      - "Minimal dirt: <0.3%"
    sorting_purity_pct: 90
    suitable_applications:
      - "Stretch film recycling"
      - "Industrial film"
      - "Packaging film"

  - profile_id: "LLDPE_AGRICULTURAL_FILM_SORTED"
    material_type: "LLDPE"
    source: "Agricultural film (sorted, washed)"
    contamination_level: "medium"
    quality_tier: 3
    typical_contaminants:
      - "Soil/dirt: 2-5% (before washing)"
      - "Organic matter: 1-3%"
      - "UV degradation"
    sorting_purity_pct: 75
    processing_requirements:
      washing: "required"
      drying: "required"
    suitable_applications:
      - "Agricultural film recycling"
      - "Construction films"
      - "Industrial films (non-critical)"

  - profile_id: "LLDPE_GROCERY_BAGS_POST_CONSUMER"
    material_type: "LLDPE"
    source: "Post-consumer grocery bags (sorted)"
    contamination_level: "medium-high"
    quality_tier: 3
    typical_contaminants:
      - "Food residue: 1-3%"
      - "Printing inks: <1%"
      - "Labels: <0.5%"
      - "Mixed LDPE/LLDPE: 5-15%"
    sorting_purity_pct: 70
    suitable_applications:
      - "Trash bags"
      - "Construction films"
      - "Industrial films (low-value)"

