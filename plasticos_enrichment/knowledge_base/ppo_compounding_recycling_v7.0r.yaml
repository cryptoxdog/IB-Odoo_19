# MACK Knowledge Base: PPO (Polyphenylene Oxide) Compounding & Recycling v7.0r
# Purpose: Enable MACK reasoning for PPO material identification and buyer matching
# Compatible with: MACK v7.0 Odoo reasoning engine
# Last Updated: 2025-11-05

metadata:
  polymer_family: "Engineering Thermoplastics"
  polymer_type: "PPO"
  full_name: "Polyphenylene Oxide (Modified PPE)"
  common_types: "PPO/PS blend (Noryl)"
  structure: "Amorphous thermoplastic"
  version: "7.0r"
  last_updated: "2025-11-05"
  data_quality: "verified"
  source_tier: "tier_3"
  note: "High-temp applications - automotive, electronics, appliances"

product_scrap_mapping:
  automotive_products:
    - product: "Automotive under-hood components"
      scrap_grade: "ppo_gf20"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 3.0]
      suitable_buyers: ["automotive_tier2"]
      reverse_reasoning: "IF buyer_needs_high_temp_automotive THEN source_ppo_gf20_tier2_tier3"

  electronics_products:
    - product: "Electronics housings (high-temp)"
      scrap_grade: "ppo_unfilled"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 3.0]
      suitable_buyers: ["electronics_manufacturers"]

  appliance_products:
    - product: "Appliance housings and components"
      scrap_grade: "ppo_unfilled"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [2.0, 5.0]
      suitable_buyers: ["appliance_manufacturers"]

  manufacturing_scrap:
    - product: "Injection molding PIR"
      scrap_grade: "any_ppo"
      scrap_quality_tier: [1]
      typical_contamination_pct: [0.1, 0.5]
      suitable_buyers: ["all_ppo_buyers"]

source_quality_tiers:
  tier_1_premium:
    definition: "Manufacturing PIR, high-temp properties maintained"
    contamination_max_pct: 0.5
    property_retention_min_pct: 95
    suitable_applications: ["Automotive under-hood", "High-temp electronics"]
    value_premium_pct: [25, 40]

  tier_2_standard:
    definition: "Post-industrial, moderate contamination"
    contamination_max_pct: 3.0
    property_retention_min_pct: 80
    suitable_applications: ["General automotive", "Appliances"]

  tier_3_utility:
    definition: "Mixed post-consumer"
    contamination_max_pct: 8.0
    property_retention_min_pct: 65
    suitable_applications: ["Low-value applications"]
    value_discount_pct: [40, 55]

material_grades:
  - grade_id: "PPO_GF20"
    grade_name: "PPO + 20% Glass Fiber"
    description: "High-strength for automotive"
    applications:
      primary:
        - product: "Automotive under-hood components"
          scrap_source: "Automotive manufacturing"
          quality_tier_required: [2, 3]
    pcr_compatibility:
      max_pcr_pct: 30
      typical_pcr_pct: [10, 30]

  - grade_id: "PPO_UNFILLED"
    grade_name: "PPO Unfilled (PPO/PS blend)"
    description: "General-purpose high-temp applications"
    applications:
      primary:
        - product: "Electronics housings"
          scrap_source: "Electronics manufacturing, post-consumer"
          quality_tier_required: [2, 3]
        - product: "Appliance components"
          scrap_source: "Appliance manufacturing, post-consumer"
          quality_tier_required: [2, 3]
    pcr_compatibility:
      max_pcr_pct: 50
      typical_pcr_pct: [15, 50]

recycling_rules:
  - rule_id: "PPO_HIGH_TEMP_CRITICAL"
    material_type: "PPO"
    rule: "High-temp resistance critical - contamination >3% affects HDT"
    confidence: 0.92

  - rule_id: "PPO_INJECTION_PIR_PREMIUM"
    material_type: "PPO"
    rule: "Injection PIR maintains high-temp properties - Tier 1"
    confidence: 0.95

contamination_profiles:
  - profile_id: "PPO_AUTOMOTIVE_UNDERHOOD"
    material_type: "PPO"
    source: "Automotive under-hood components"
    contamination_level: "low-medium"
    quality_tier: 2
    typical_contaminants: ["oils <1%", "dirt <2%"]
    suitable_applications: ["Automotive", "Industrial"]

buyer_profiles:
  - buyer_id: "PPO_AUTOMOTIVE_TIER2"
    buyer_type: "Automotive tier 2 supplier"
    industry_segment: "Automotive"
    material_requirements:
      polymer_types: ["PPO_GF20"]
      purity_min_pct: 85
      max_pcr_pct: 30
      quality_tier_required: [2, 3]
    applications: ["Automotive under-hood components"]
    volume_range_tons_month: [50, 500]

  - buyer_id: "PPO_APPLIANCE_MANUFACTURERS"
    buyer_type: "Appliance manufacturer"
    industry_segment: "Consumer Goods"
    material_requirements:
      polymer_types: ["PPO_unfilled"]
      purity_min_pct: 80
      max_pcr_pct: 50
      quality_tier_required: [2, 3]
    applications: ["Appliance housings and components"]
    volume_range_tons_month: [100, 1000]

quality_indicators:
  - indicator_id: "PPO_HDT"
    test_method: "ISO 75"
    significance: "Critical for high-temp applications"

inference_rules:
  - rule_id: "PPO_PRODUCT_TO_BUYER_FORWARD"
    inference_type: "buyer_matching"
    logic: "IF product=automotive_underhood THEN grade=ppo_gf20 AND match_buyers=[automotive_tier2]"
    confidence: 0.90

standards:
  - standard_id: "ISO_75"
    title: "Heat Deflection Temperature"
    relevance: "Critical for PPO high-temp applications"

processing_guidance:
  drying:
    required: false
    note: "PPO not hygroscopic - drying optional"
  temperature_control:
    processing_temp_c: [260, 300]
  mixing_pcr_virgin:
    max_pcr_pct_by_application:
      automotive_underhood: 30
      electronics: 50
      appliances: 50
