# ============================================================================
# SOURCE QUALITY TIER DEFINITIONS (PC-Specific)
# ============================================================================

source_quality_tiers:
  tier_1_premium:
    definition: "Single-source, fully traceable, minimal contamination, known processing history"
    contamination_max_pct: 0.5
    moisture_max_ppm: 100
    metal_content_max_ppm: 50
    property_retention_min_pct: 95
    sorting_purity_min_pct: 98
    processing_history: "Single cycle or virgin manufacturing scrap (PIR)"
    examples:
      - "Optical lens manufacturing scrap (documented)"
      - "Medical device manufacturing scrap (clean room)"
      - "Automotive component manufacturing scrap (single-source)"
      - "Electronics housing PIR (known grade)"
    suitable_applications:
      - "Medical devices (with USP Class VI certification)"
      - "Optical lenses (secondary applications)"
      - "Premium electronics housing"
      - "Automotive visible components"
      - "Safety-critical applications"
    value_premium_pct: [20, 35]

  tier_2_standard:
    definition: "Multi-source sorted, moderate contamination, general processing history"
    contamination_max_pct: 2.0
    moisture_max_ppm: 200
    metal_content_max_ppm: 150
    property_retention_min_pct: 80
    sorting_purity_min_pct: 85
    processing_history: "1-3 recycling cycles"
    examples:
      - "WEEE electronics housing (sorted by grade)"
      - "Post-consumer automotive components (sorted)"
      - "General post-consumer PC (sorted, washed)"
      - "Mixed electronics scrap (sorted)"
    suitable_applications:
      - "Electronics housing (non-critical)"
      - "Automotive interior (non-visible)"
      - "Industrial equipment housings"
      - "Consumer goods (non-optical)"
      - "Appliance components"
    value_premium_pct: [0, 0]

  tier_3_utility:
    definition: "Mixed-source, higher contamination, multiple cycles"
    contamination_max_pct: 5.0
    moisture_max_ppm: 300
    metal_content_max_ppm: 300
    property_retention_min_pct: 60
    sorting_purity_min_pct: 70
    processing_history: "3-6 recycling cycles or unknown"
    examples:
      - "Mixed post-consumer PC (unsorted)"
      - "Contaminated electronics scrap"
      - "General waste stream PC"
      - "Mixed consumer goods"
    suitable_applications:
      - "Construction glazing (non-critical)"
      - "Industrial applications (non-critical)"
      - "Low-value consumer goods"
      - "Utility products"
    value_discount_pct: [40, 60]

  tier_4_marginal:
    definition: "Heavily contaminated, degraded, multiple unknown cycles"
    contamination_min_pct: 5.0
    property_retention_max_pct: 60
    processing_history: ">6 cycles or severely degraded"
    examples:
      - "Heavily contaminated mixed waste"
      - "Degraded consumer goods"
      - "Mixed polymer waste streams"
    suitable_applications:
      - "Chemical recycling feedstock"
      - "Waste-to-energy"
      - "Very limited mechanical recycling"
    value_discount_pct: [70, 90]

# ============================================================================
# MATERIAL PROPERTIES & GRADES
# ============================================================================

material_grades:
  - grade_id: "PC_GENERAL_PURPOSE"
    grade_name: "General Purpose Polycarbonate"
    description: "Standard PC for general applications requiring impact resistance and transparency"
    type: "virgin"

    processing_temperatures:
      melt_temp_c: [270, 320]
      optimal_range_c: [280, 300]
      decomposition_temp_c: 400
      mold_temp_c: [80, 120]

    density:
      value_g_cm3: 1.20
      tolerance_g_cm3: 0.01
      test_method: "ASTM D792"

    melt_flow_rate:
      value_cm3_10min: [6, 15]
      test_conditions: "300°C/1.2kg"
      test_method: "ISO 1133"
      note: "DO NOT convert to other conditions - PC flow highly condition-dependent"

    mechanical_properties:
      tensile_strength_mpa: [55, 70]
      flexural_modulus_mpa: [2200, 2400]
      impact_strength_j_m: [600, 900]
      hdt_c: [127, 138]
      elongation_at_break_pct: [80, 130]
      test_method: "ASTM D638, D790, D256, D648"

    optical_properties:
      light_transmission_pct: 89
      haze_pct: 1
      refractive_index: 1.586
      yellowness_index: 2
      test_method: "ASTM D1003, D1925"

    moisture_sensitivity:
      critical: true
      target_before_processing_pct: 0.02
      target_after_drying_ppm: 200
      drying_temp_c: [110, 120]
      drying_hours: [3, 4]
      note: "PC hydrolyzes at processing temp - moisture control critical"

    applications:
