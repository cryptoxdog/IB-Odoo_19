# ============================================================================

standards:
  - standard_id: "ASTM_D3935"
    title: "Classification System for Polycarbonate Materials"
    scope: "Defines PC types, grades, and property requirements"
    key_parameters:
      - "Melt volume rate (MVR)"
      - "Density"
      - "Impact strength"
      - "Tensile properties"
    relevance: "Primary classification standard for PC materials"

  - standard_id: "ISO_10993"
    title: "Biological Evaluation of Medical Devices"
    scope: "Biocompatibility testing for medical-grade PC"
    relevance: "Required for medical device applications"

  - standard_id: "UL_94"
    title: "Flammability of Plastic Materials"
    scope: "Flame retardancy classification (V-0, V-1, V-2)"
    relevance: "Required for FR-PC in electrical/electronic applications"

  - standard_id: "ASTM_D1003"
    title: "Haze and Luminous Transmittance of Transparent Plastics"
    scope: "Optical clarity testing"
    relevance: "Critical for optical-grade PC applications"

  - standard_id: "ISO_1133"
    title: "Melt Mass-Flow Rate (MFR) and Melt Volume-Flow Rate (MVR)"
    test_conditions: "300°C/1.2kg for PC"
    significance: "Indicates molecular weight and processability"
    note: "DO NOT convert between conditions - PC highly condition-dependent"

