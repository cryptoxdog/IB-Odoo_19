# ============================================================================
# QUALITY INDICATORS & TESTING
# ============================================================================

quality_indicators:
  - indicator_id: "PC_MOISTURE_CONTENT"
    test_method: "Karl Fischer titration or moisture analyzer"
    material_types: ["PC"]
    thresholds:
      excellent:
        before_processing_pct: [0, 0.01]
        after_drying_ppm: [0, 100]
      good:
        before_processing_pct: [0.01, 0.02]
        after_drying_ppm: [100, 200]
      acceptable:
        before_processing_pct: [0.02, 0.03]
        after_drying_ppm: [200, 300]
      poor:
        before_processing_pct: [0.03, 100]
        after_drying_ppm: [300, 10000]
    significance: "Critical - PC hydrolyzes at processing temp if moisture too high"

  - indicator_id: "PC_OPTICAL_CLARITY"
    test_method: "ASTM D1003 (haze and light transmission)"
    material_types: ["PC_optical_grade", "PC_general_purpose"]
    thresholds:
      excellent:
        light_transmission_pct: [90, 92]
        haze_pct: [0, 0.5]
        yellowness_index: [0, 2]
      good:
        light_transmission_pct: [88, 90]
        haze_pct: [0.5, 1.0]
        yellowness_index: [2, 3]
      acceptable:
        light_transmission_pct: [85, 88]
        haze_pct: [1.0, 2.0]
        yellowness_index: [3, 5]
      poor:
        light_transmission_pct: [0, 85]
        haze_pct: [2.0, 100]
        yellowness_index: [5, 100]
    significance: "Critical for optical applications, indicates thermal degradation"

  - indicator_id: "PC_IMPACT_STRENGTH"
    test_method: "ASTM D256 (Izod notched)"
    material_types: ["PC"]
    thresholds:
      excellent:
        value_j_m: [700, 900]
      good:
        value_j_m: [500, 700]
      acceptable:
        value_j_m: [300, 500]
      poor:
        value_j_m: [0, 300]
    significance: "Defining characteristic of PC - exceptional impact resistance"

  - indicator_id: "PC_MVR_CONSISTENCY"
    test_method: "ISO 1133 (300°C/1.2kg)"
    material_types: ["PC"]
    thresholds:
      excellent: "±5% of target MVR"
      good: "±10% of target MVR"
      acceptable: "±15% of target MVR"
      poor: ">±15% of target MVR"
    significance: "Indicates molecular weight stability and processing consistency"
    note: "DO NOT convert MVR between conditions - PC highly condition-dependent"

# ============================================================================
# INFERENCE RULES & MATCHING LOGIC
# ============================================================================

inference_rules:
  - rule_id: "PC_PRODUCT_TO_BUYER_FORWARD"
    inference_type: "buyer_matching"
    logic: "IF product=headlight_lenses THEN grade=automotive_pc_optical AND quality_tier=[1,2] AND match_buyers=[automotive_tier1, optical_secondary]"
    reasoning: "Forward reasoning from product to suitable buyers based on grade and quality tier"
    confidence: 0.90

  - rule_id: "PC_BUYER_TO_SOURCE_BACKWARD"
    inference_type: "source_matching"
    logic: "IF buyer=medical_device AND application=surgical_instruments THEN require_grade=medical_pc AND require_tier=1 AND require_source=medical_pir_only"
    reasoning: "Backward reasoning from buyer requirements to acceptable sources"
    confidence: 0.95

  - rule_id: "PC_MOISTURE_GATE"
    inference_type: "quality_assessment"
    logic: "IF moisture>0.02% THEN require_drying BEFORE processing"
    reasoning: "Moisture control critical gate - PC hydrolyzes above 0.02%"
    confidence: 0.98

  - rule_id: "PC_OPTICAL_TIER_REQUIREMENT"
    inference_type: "buyer_matching"
    logic: "IF application=optical OR application=medical THEN require_tier=1 AND require_source=pir_only"
    reasoning: "Optical and medical applications require highest quality tier"
    confidence: 0.92

  - rule_id: "PC_BPA_FOOD_CONTACT_EXCLUSION"
    inference_type: "application_matching"
    logic: "IF source=post_consumer_food_contact THEN exclude_food_contact_reuse AND route_to_non_food_applications"
    reasoning: "BPA concerns limit PC food-contact recycling"
    confidence: 0.90

  - rule_id: "PC_WEEE_GRADE_SORTING"
    inference_type: "source_assessment"
    logic: "IF source=weee_electronics THEN identify_grade=[gp_pc, fr_pc, pc_abs_blend] AND sort_by_grade BEFORE buyer_matching"
    reasoning: "WEEE contains mixed PC grades - sorting critical for buyer matching"
    confidence: 0.85

  - rule_id: "PC_CYCLE_LIMIT_BY_APPLICATION"
    inference_type: "quality_assessment"
    logic: "IF cycles>2 THEN exclude_optical_medical; IF cycles>4 THEN exclude_automotive_electronics; IF cycles>6 THEN construction_only"
    reasoning: "Cycle limits based on application tier requirements"
    confidence: 0.85

