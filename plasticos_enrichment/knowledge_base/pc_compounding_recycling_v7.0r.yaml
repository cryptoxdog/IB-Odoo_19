# ============================================================================
# PRODUCT-TO-SCRAP MAPPING (Bidirectional Reasoning)
# ============================================================================

product_scrap_mapping:
  automotive_products:
    - product: "Headlight lenses"
      scrap_grade: "automotive_pc_optical"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [0.3, 1.5]
      typical_contaminants: ["UV coating residue", "adhesives <0.5%", "metals <50ppm"]
      suitable_buyers: ["automotive_tier1", "optical_secondary", "lighting_manufacturers"]
      reverse_reasoning: "IF buyer_needs_automotive_lenses THEN source_automotive_pc_scrap_tier1_tier2"

    - product: "Instrument cluster covers"
      scrap_grade: "optical_pc"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [0.2, 1.0]
      suitable_buyers: ["automotive_tier1", "optical_secondary", "electronics_housing"]

    - product: "Sunroof panels"
      scrap_grade: "automotive_pc_structural"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 3.0]
      suitable_buyers: ["automotive_tier2", "construction_glazing"]

    - product: "Interior trim components"
      scrap_grade: "general_purpose_pc"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.5, 3.5]
      suitable_buyers: ["automotive_tier2", "industrial_housing", "consumer_goods"]

  electronics_products:
