# ============================================================================
# RECYCLING RULES & CONTAMINATION PROFILES
# ============================================================================

recycling_rules:
  - rule_id: "PC_MOISTURE_CRITICAL"
    material_type: "PC"
    rule: "Moisture control is critical for PC - hydrolysis at processing temperatures"
    reasoning: "PC hydrolyzes at melt temperatures (280-320°C) if moisture >0.02%. Results in chain scission, property loss, yellowing, and brittleness. Target ≤0.02% before processing, ≤100-200ppm after drying."
    confidence: 0.95
    moisture_targets:
      before_processing_max_pct: 0.02
      after_drying_optical_max_ppm: 100
      after_drying_general_max_ppm: 200
      drying_temp_c: [110, 120]
      drying_hours: [3, 4]

  - rule_id: "PC_PIR_VS_PCR_QUALITY"
    rule: "PC PIR significantly higher quality than PCR due to thermal history and contamination"
    reasoning: "PIR PC: single cycle, known grade, minimal contamination, 95%+ property retention. PCR PC: multiple cycles, mixed grades, contamination, 60-85% property retention. Thermal degradation cumulative."
    confidence: 0.90
    pir_characteristics:
      property_retention_pct: [95, 100]
      contamination_pct: [0.1, 0.5]
      quality_tier: 1
    pcr_characteristics:
      property_retention_pct: [60, 85]
      contamination_pct: [1.0, 5.0]
      quality_tier: [2, 3]

  - rule_id: "PC_OPTICAL_DEGRADATION"
    material_type: "PC"
    rule: "PC optical clarity degrades with recycling - yellowing and haze increase"
    reasoning: "Thermal cycling causes oxidation, chain scission, and yellowing. Contamination increases haze. Optical applications require Tier 1 PIR only."
    confidence: 0.88
    degradation_indicators:
      yellowness_index_increase: "2-5 units per cycle"
      haze_increase_pct: "0.5-2% per cycle"
      light_transmission_decrease_pct: "1-3% per cycle"

  - rule_id: "PC_WEEE_SOURCE_QUALITY"
    material_type: "PC"
    source_type: "WEEE electronics"
    rule: "WEEE PC sources vary widely - sorting by grade critical"
    reasoning: "WEEE contains GP PC, FR PC, PC/ABS blends. Sorting purity 70-90%. Contamination: metals, adhesives, labels, other plastics. Grade identification critical for buyer matching."
    confidence: 0.85
    weee_characteristics:
      sorting_purity_pct: [70, 90]
      typical_grades: ["GP PC", "FR PC", "PC/ABS blends"]
      contamination_pct: [0.8, 3.0]
      quality_tier: [2, 3]

  - rule_id: "PC_BPA_CONCERNS"
    material_type: "PC"
    rule: "BPA concerns limit PC food-contact applications - route to non-food uses"
    reasoning: "PC made from Bisphenol A (BPA). Health concerns limit food-contact reuse. Post-consumer food-contact PC should route to non-food applications. BPA-free PC alternatives emerging."
    confidence: 0.92
    application_restrictions:
      food_contact_pcr: "not recommended"
      alternative_route: "industrial, construction, non-food consumer goods"

  - rule_id: "PC_MULTI_CYCLE_LIMITS"
    rule: "PC recycling cycle limits vary by application tier"
    reasoning: "Optical/medical: 1-2 cycles max (Tier 1 only). Electronics/automotive: 3-4 cycles acceptable (Tier 2). Industrial/construction: 5-6 cycles OK (Tier 3)."
    confidence: 0.85
    cycle_limits:
      optical_medical_max_cycles: 2
      electronics_automotive_max_cycles: 4
      industrial_construction_max_cycles: 6

contamination_profiles:
  - profile_id: "PC_WEEE_ELECTRONICS_SORTED"
    material_type: "PC"
    source: "WEEE electronics (sorted)"
    contamination_level: "low-medium"
    quality_tier: 2
    typical_contaminants:
      - "Metals (screws, brackets): 50-150 ppm"
      - "Adhesives: <0.5%"
      - "Labels/printing: <0.3%"
      - "Other plastics (ABS, PS): <2%"
    sorting_purity_pct: 85
    processing_cost_note: "Moderate - requires metal detection, washing"
    suitable_applications:
      - "Electronics housing (non-critical)"
      - "Industrial housings"
      - "Appliance components"

  - profile_id: "PC_AUTOMOTIVE_PIR"
    material_type: "PC"
    source: "Automotive manufacturing PIR"
    contamination_level: "very low"
