      scrap_grade: "fr_pc_electronics"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [0.5, 2.0]
      typical_contaminants: ["metals <100ppm", "adhesives <0.3%", "labels <0.2%"]
      suitable_buyers: ["electronics_manufacturers", "appliance_manufacturers", "industrial_housing"]
      reverse_reasoning: "IF buyer_needs_electronics_housing THEN source_weee_pc_scrap_tier1_tier2"

    - product: "Smartphone covers"
      scrap_grade: "general_purpose_pc"
      scrap_quality_tier: [2, 3]
      typical_contamination_pct: [1.0, 3.0]
      suitable_buyers: ["consumer_goods", "industrial_housing"]

    - product: "Computer housings"
      scrap_grade: "fr_pc_electronics"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [0.8, 2.5]
      suitable_buyers: ["electronics_manufacturers", "industrial_housing"]

    - product: "LED light covers"
      scrap_grade: "optical_pc"
      scrap_quality_tier: [1, 2]
      typical_contamination_pct: [0.3, 1.2]
      suitable_buyers: ["lighting_manufacturers", "optical_secondary"]

  medical_products:
    - product: "Medical device housings"
      scrap_grade: "medical_grade_pc"
      scrap_quality_tier: [1]
      typical_contamination_pct: [0.1, 0.5]
      typical_contaminants: ["minimal - clean room manufacturing"]
      suitable_buyers: ["medical_device_manufacturers_tier1_only"]
      reverse_reasoning: "IF buyer_needs_medical_grade THEN source_medical_pir_tier1_only_with_usp_class_vi"
      note: "Medical PC scrap rarely available, extremely high quality requirements"

    - product: "Surgical instruments"
      scrap_grade: "medical_grade_pc"
      scrap_quality_tier: [1]
      typical_contamination_pct: [0.1, 0.3]
      suitable_buyers: ["medical_device_manufacturers_tier1_only"]

    - product: "Dialysis components"
