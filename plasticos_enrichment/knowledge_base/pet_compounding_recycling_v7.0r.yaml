    description: "Heat-resistant crystalline PET for oven-safe and microwaveable packaging"

    intrinsic_viscosity:
      range_dl_g: [0.75, 0.90]
      typical_dl_g: 0.82
      test_method: "ASTM D4603"

    density:
      crystalline_g_cm3: [1.38, 1.40]
      typical_g_cm3: 1.39
      test_method: "ASTM D792"
      notes: "Controlled crystallization during processing"

    crystallinity:
      typical_pct: [30, 40]
      range_pct: [20, 45]
      notes: "Controlled annealing creates crystalline structure"

    processing_temperatures:
      extrusion_temp_c: [270, 290]
      thermoforming_temp_c: [140, 180]
      annealing_temp_c: [200, 230]
      crystallization_temp_c: [120, 140]
      drying_temp_c: 150
      drying_hours: [4, 6]
      cooling: "controlled_annealing"

    thermal_properties:
      heat_deflection_temp_c: [220, 240]
      max_use_temp_c: 220
      microwave_safe: true
      oven_safe_c: 220

    mechanical_properties:
      tensile_strength_mpa: [60, 80]
      flexural_modulus_mpa: [3000, 4500]
      impact_strength_j_m: [25, 50]
      appearance: "translucent_to_opaque"
      test_method: "ASTM D638, D790, D256"

    applications:
      - "Oven-safe meal trays"
      - "Microwaveable food containers"
      - "Dual-ovenable packaging"
      - "Hot-fill applications"
      - "Ready-meal trays"

    pcr_compatibility:
      max_pcr_pct: 30
      typical_pcr_pct: [15, 25]
      quality_requirements: "Very strict - heat resistance critical"
      fda_status: "Approved for food contact with proper decontamination"

  - grade_id: "PET_PREFORM_GRADE"
    grade_name: "Preform Grade PET"
    description: "Specialized PET for injection molding bottle preforms (thick-walled blanks for stretch blow molding)"

    intrinsic_viscosity:
      range_dl_g: [0.78, 0.88]
      typical_dl_g: 0.82
      test_method: "ASTM D4603"
      notes: "Higher IV than standard bottle grade for stretch blow molding"

    density:
      typical_g_cm3: 1.38
      test_method: "ASTM D792"

    processing_temperatures:
      injection_molding_temp_c: [270, 290]
      mold_temp_c: [10, 20]
      reheat_temp_c: [100, 120]
      drying_temp_c: 150
      drying_hours: [4, 6]

    rheological_properties:
      melt_strength: "high"
      strain_hardening: "excellent"
      notes: "Critical for stretch blow molding performance"

    mechanical_properties:
      tensile_strength_mpa: [60, 75]
      elongation_pct: [300, 500]
      wall_thickness_mm: [3, 5]
      test_method: "ASTM D638"

    applications:
      - "Beverage bottle preforms"
      - "Water bottle preforms"
      - "Carbonated soft drink preforms"
      - "Wide-mouth jar preforms"
      - "Custom bottle preforms"

    pcr_compatibility:
      max_pcr_pct: 50
      typical_pcr_pct: [25, 35]
      quality_requirements: "Strict IV control, low acetaldehyde"
      fda_status: "Approved for food contact with proper decontamination"

  - grade_id: "PET_PETG_GRADE"
    grade_name: "PETG (Glycol-Modified PET)"
    description: "Amorphous PET modified with CHDM (<50%) for enhanced impact resistance and processability"

    chemical_modification:
      comonomer: "CHDM (Cyclohexane Dimethanol)"
      chdm_content_pct: [25, 45]
      structure: "amorphous"
      crystallinity_pct: 0

    intrinsic_viscosity:
      range_dl_g: [0.70, 0.85]
      typical_dl_g: 0.78
      test_method: "ASTM D4603"

    density:
      typical_g_cm3: [1.26, 1.28]
      test_method: "ASTM D792"
      notes: "Lower than standard PET due to CHDM modification"

    processing_temperatures:
      extrusion_temp_c: [230, 260]
      injection_molding_temp_c: [240, 270]
      thermoforming_temp_c: [120, 160]
      drying_temp_c: 65
      drying_hours: [2, 4]

    mechanical_properties:
      tensile_strength_mpa: [60, 66]
      elongation_pct: [102, 118]
      impact_strength_j_m: [190, 200]
      youngs_modulus_gpa: [2.01, 2.11]
      clarity_pct: [88, 92]
      test_method: "ASTM D638, D256"

    thermal_properties:
      max_service_temp_c: [51, 64]
      glass_transition_c: [81, 91]
      hdt_c: [65, 75]

    applications:
      - "Medical braces and devices"
      - "Electronics covers and guards"
      - "Point-of-purchase displays"
      - "Washing machine components"
      - "Appliance housings"
      - "3D printing filament"
      - "Protective shields and barriers"
      - "Thermoformed packaging"

    advantages:
      - "3-4x better impact resistance than standard PET"
      - "Easier to thermoform (lower temps, no crystallization)"
      - "Excellent clarity (amorphous structure)"
      - "Better chemical resistance than acrylic"
      - "Lower cost than polycarbonate"
      - "FDA compliant for food contact"

    disadvantages:
      - "Lower heat resistance than standard PET (51-64°C vs 70-240°C)"
      - "Lower stiffness (more flexible)"
      - "Not widely recycled (infrastructure lacking)"
      - "Can contaminate PET recycling streams"

    pcr_compatibility:
      max_pcr_pct: 30
      typical_pcr_pct: [15, 25]
      quality_requirements: "Strict clarity and impact requirements"
      recycling_challenge: "Limited infrastructure, can contaminate PET streams"

  - grade_id: "PET_PCTG_GRADE"
