# ============================================================================
# INFERENCE RULES FOR MISSING DATA
# ============================================================================

inference_rules:
  - rule_id: "INF_PET_IV_FROM_GRADE"
    trigger: "iv_missing"
    conditions:
      - grade_known: true
    infer:
      fiber_grade_iv_dl_g: 0.60
      film_grade_iv_dl_g: 0.80
      bottle_grade_iv_dl_g: 0.75
      engineering_grade_iv_dl_g: 1.00
    confidence: 0.85
    reasoning:
      mode: "abductive"
      logic: "If grade is known but IV is missing, infer typical IV for that grade based on industry standards."

  - rule_id: "INF_PET_MOISTURE_FROM_FORM"
    trigger: "moisture_missing"
    conditions:
      - form: ["flake", "pellet"]
      - storage: "outdoor"
    infer:
      moisture_ppm: 200
      drying_required: true
    confidence: 0.75
    reasoning:
      mode: "abductive"
      logic: "PET stored outdoors typically absorbs 150-250ppm moisture. Assume 200ppm and require drying."

  - rule_id: "INF_PET_PVC_FROM_SOURCE"
    trigger: "pvc_contamination_missing"
    conditions:
      - source: "curbside"
      - sorting: "manual"
    infer:
      pvc_ppm: 100
      risk_level: "moderate"
    confidence: 0.70
    reasoning:
      mode: "abductive"
      logic: "Curbside collection with manual sorting typically has 50-150ppm PVC. Assume 100ppm."

  - rule_id: "INF_PET_PRICE_FROM_GRADE_COLOR"
    trigger: "price_missing"
    conditions:
      - grade_known: true
      - color_known: true
    infer:
      clear_bottle_price_per_lb: 0.55
      mixed_bottle_price_per_lb: 0.38
      fiber_price_per_lb: 0.32
    confidence: 0.80
    reasoning:
      mode: "deductive"
      logic: "Apply typical market prices based on grade and color. Adjust for regional and seasonal factors."

  - rule_id: "INF_PET_APPLICATION_FROM_IV"
    trigger: "application_missing"
    conditions:
      - iv_known: true
    infer:
      iv_0_40_0_70: "fiber"
      iv_0_70_0_78: "bottle"
      iv_0_70_1_00: "film"
      iv_0_80_1_20: "engineering"
    confidence: 0.88
    reasoning:
      mode: "deductive"
      logic: "IV range determines suitable applications based on molecular weight requirements."

# ============================================================================
# ASTM STANDARDS & TESTING METHODS
# ============================================================================

astm_standards:
  - standard_id: "ASTM_D4603"
    title: "Intrinsic Viscosity of PET"
    description: "Primary method for determining molecular weight of PET"
    application: "All PET grades"

  - standard_id: "ASTM_D638"
    title: "Tensile Properties of Plastics"
    description: "Measures tensile strength, modulus, and elongation"
    application: "Mechanical property verification"

  - standard_id: "ASTM_D792"
    title: "Density and Specific Gravity of Plastics"
    description: "Determines density and crystallinity"
    application: "Quality control and grade verification"

  - standard_id: "ASTM_D790"
    title: "Flexural Properties of Plastics"
    description: "Measures flexural strength and modulus"
    application: "Engineering grade verification"

  - standard_id: "ASTM_D256"
    title: "Impact Resistance of Plastics"
    description: "Izod impact test for toughness"
    application: "Quality control for all grades"

  - standard_id: "ASTM_D3985"
    title: "Oxygen Transmission Rate"
    description: "Measures gas barrier properties"
    application: "Film and bottle grade verification"

  - standard_id: "ASTM_F1249"
    title: "Water Vapor Transmission Rate"
    description: "Measures moisture barrier properties"
    application: "Film grade verification"

