# ============================================================================
# RECYCLING RULES & REASONING LOGIC
# ============================================================================

recycling_rules:
  - id: "PET_BOTTLE_TO_BOTTLE_V7R"
    when:
      - source_form: "bottle"
      - target_application: "bottle"
      - food_contact: true
    infer:
      fda_approval_required: true
      decontamination_process: "FDA-approved"
      max_pcr_pct: 50
      property_retention_pct: [90, 95]
      acetaldehyde_limit_ppm: 1.0
    reasoning:
      mode: "deductive"
      logic: "FDA requires approved decontamination for food contact. Property retention 90-95% achievable with proper processing."
      confidence: 0.95

  - id: "PET_BOTTLE_TO_FIBER_V7R"
    when:
      - source_form: "bottle"
      - target_application: "fiber"
    infer:
      max_pcr_pct: 100
      clarity_required: false
      color_sorting: "beneficial"
      property_retention_pct: [85, 90]
    reasoning:
      mode: "deductive"
      logic: "Fiber applications have lower property requirements. Color-sorted streams improve quality but not required."
      confidence: 0.92

  - id: "PET_MOISTURE_CRITICAL_V7R"
    when:
      - processing_method: "any"
    infer:
      moisture_limit_ppm: 50
      drying_required: true
      drying_temp_c: 150
      drying_hours: [4, 6]
      hydrolysis_risk: "high"
    reasoning:
      mode: "deductive"
      logic: "PET is hygroscopic. Moisture >50ppm causes hydrolytic degradation during melt processing, reducing IV and mechanical properties."
      confidence: 0.98

  - id: "PET_PVC_CONTAMINATION_V7R"
    when:
      - contaminant: "PVC"
    infer:
      fiber_tolerance_ppm: 50
      bottle_nonfood_tolerance_ppm: 25
      film_tolerance_ppm: 10
      engineering_tolerance_ppm: 10
      degradation_risk: "severe"
    reasoning:
      mode: "deductive"
      logic: "PVC releases HCl during processing, causing chain scission and discoloration. Black specks form at >50ppm."
      confidence: 0.97

  - id: "PET_RECYCLE_CYCLES_V7R"
    when:
      - recycle_cycles_le: 3
    infer:
      iv_retention_pct: [85, 95]
      tensile_retention_pct: [90, 95]
      impact_retention_pct: [85, 90]
      color_shift: "minimal"
    reasoning:
      mode: "inductive"
      logic: "Research shows PET maintains 85-95% properties through 3 recycle cycles with proper drying and processing."
      confidence: 0.88

  - id: "PET_RECYCLE_CYCLES_EXCESSIVE_V7R"
    when:
      - recycle_cycles_gt: 5
    infer:
      iv_retention_pct: [60, 75]
      tensile_retention_pct: [70, 80]
      brittleness_risk: "high"
      yellowing: "significant"
      downgrade_recommended: true
    reasoning:
      mode: "inductive"
      logic: "Excessive recycling causes chain scission, yellowing, and brittleness. Downgrade to fiber or non-critical applications."
      confidence: 0.85

  - id: "PET_COLOR_SORTING_BENEFIT_V7R"
    when:
      - color_sorted: true
      - target_application: ["bottle", "film"]
    infer:
      clarity_improvement_pct: 30
      value_premium_pct: 15
      buyer_preference: "high"
    reasoning:
      mode: "inductive"
      logic: "Color-sorted PET (especially clear) commands 15-30% premium for bottle and film applications due to clarity requirements."
      confidence: 0.90

# ============================================================================
# CONTAMINATION PROFILES & TOLERANCE
# ============================================================================

contamination_profiles:
  - contaminant_type: "PVC"
    severity: "critical"
    detection_method: "NIR, manual sorting"
    tolerance_by_grade:
      fiber_ppm: 50
      bottle_nonfood_ppm: 25
      film_ppm: 10
      engineering_ppm: 10
    effects:
      - "HCl release during processing"
      - "Chain scission and IV loss"
      - "Black specks and discoloration"
      - "Equipment corrosion"
    remediation:
      - "NIR sorting"
      - "Manual removal of PVC bottles"
      - "Density separation"

  - contaminant_type: "PE/PP"
    severity: "moderate"
    detection_method: "NIR, density separation"
    tolerance_by_grade:
      fiber_ppm: 1000
      bottle_nonfood_ppm: 500
      film_ppm: 200
      engineering_ppm: 200
    effects:
      - "Haze and opacity in clear applications"
      - "Reduced barrier properties"
      - "Surface defects"
    remediation:
      - "Density separation (PE/PP float, PET sinks)"
      - "NIR sorting"
      - "Melt filtration"

  - contaminant_type: "Dirt/Labels"
    severity: "moderate"
    detection_method: "Visual, optical sorting"
    tolerance_by_grade:
      fiber_pct: 0.5
      bottle_nonfood_pct: 0.3
      film_pct: 0.1
      engineering_pct: 0.1
    effects:
      - "Gel formation"
      - "Surface defects"
      - "Reduced clarity"
    remediation:
      - "Washing and caustic treatment"
      - "Label removal systems"
      - "Melt filtration"

  - contaminant_type: "Moisture"
    severity: "critical"
    detection_method: "Moisture analyzer"
    tolerance_ppm: 50
    effects:
      - "Hydrolytic degradation"
      - "IV loss during processing"
      - "Brittleness"
      - "Bubble formation"
    remediation:
      - "Desiccant drying 4-6h @ 150°C"
      - "Vacuum drying"
      - "Dehumidified storage"

  - contaminant_type: "Metal"
    severity: "moderate"
    detection_method: "Metal detector"
    tolerance_by_grade:
      fiber_ppm: 100
      bottle_nonfood_ppm: 50
      film_ppm: 25
      engineering_ppm: 25
    effects:
      - "Equipment damage"
      - "Contamination of final product"
      - "FDA rejection for food contact"
    remediation:
      - "Metal detection and rejection"
      - "Magnetic separation"
      - "Eddy current separation"

