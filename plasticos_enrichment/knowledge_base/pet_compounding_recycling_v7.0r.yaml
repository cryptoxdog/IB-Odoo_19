# PET (Polyethylene Terephthalate) Compounding & Recycling Knowledge Base v7.0r
# Purpose: Enable MACK reasoning for PET material identification, buyer matching, and pricing
# Compatible with: MACK v7.0 Odoo reasoning engine
# Last Updated: 2025-11-05
# Data Sources: ASTM D4603, D638, D792, FDA guidelines, peer-reviewed research

metadata:
  polymer_family: "Polyester"
  polymer_type: "PET"
  full_name: "Polyethylene Terephthalate"
  resin_id_code: 1
  cas_number: "25038-59-9"
  version: "7.0r"
  last_updated: "2025-11-05"
  data_quality: "verified"
  source_tier: "tier_1"  # ASTM standards + manufacturer data

# ============================================================================
# MATERIAL PROPERTIES & GRADES
# ============================================================================

material_grades:
  - grade_id: "PET_FIBER_GRADE"
    grade_name: "Fiber Grade PET"
    description: "Lower IV for textile and industrial fiber applications"

    intrinsic_viscosity:
      range_dl_g: [0.40, 0.70]
      typical_dl_g: 0.60
      test_method: "ASTM D4603"

    density:
      amorphous_g_cm3: [1.33, 1.35]
      crystalline_g_cm3: [1.40, 1.41]
      typical_g_cm3: 1.38
      test_method: "ASTM D792"

    processing_temperatures:
      melt_temp_c: [260, 290]
      crystallization_temp_c: [120, 140]
      glass_transition_c: [78, 81]
      drying_temp_c: 150
      drying_hours: [4, 6]

    mechanical_properties:
      tensile_strength_mpa: [55, 75]
      flexural_modulus_mpa: [2800, 4100]
      impact_strength_j_m: [25, 60]
      hdt_amorphous_c: [70, 80]
      hdt_crystalline_c: [220, 240]
      test_method: "ASTM D638, D790, D256"

    applications:
      - "Textile fibers (clothing, carpets)"
      - "Industrial fibers (tire cord, conveyor belts)"
      - "Geotextiles"
      - "Filter media"
      - "Rope and cordage"

    pcr_compatibility:
      max_pcr_pct: 100
      typical_pcr_pct: [50, 100]
      quality_requirements: "Moderate contamination tolerance"

  - grade_id: "PET_FILM_GRADE"
    grade_name: "Film Grade PET"
    description: "Medium IV for packaging and specialty films"

    intrinsic_viscosity:
      range_dl_g: [0.70, 1.00]
      typical_dl_g: 0.80
      test_method: "ASTM D4603"

    density:
      typical_g_cm3: 1.38
      test_method: "ASTM D792"

    processing_temperatures:
      extrusion_temp_c: [270, 290]
      orientation_temp_c: [80, 100]
      heat_setting_c: [200, 230]
      drying_temp_c: 150
      drying_hours: [4, 6]

    film_properties:
      thickness_range_micron: [6, 350]
      tensile_strength_mpa: [200, 300]
      elongation_pct: [100, 150]
      clarity_pct: 90
      oxygen_transmission_cc_m2_day: [1, 5]
      water_vapor_transmission_g_m2_day: [1, 15]

    applications:
      - "BOPET films (packaging, electrical)"
      - "Photographic film base"
      - "Magnetic tape base"
      - "Solar panel backsheets"
      - "Flexible packaging"
      - "Labels and graphics"

    pcr_compatibility:
      max_pcr_pct: 50
      typical_pcr_pct: [15, 50]
      quality_requirements: "Strict contamination control for clarity"
      limitations: "Optical clarity requirements limit PCR use"

  - grade_id: "PET_BOTTLE_GRADE"
    grade_name: "Bottle Grade PET"
    description: "Standard IV for beverage and food containers"

    intrinsic_viscosity:
      range_dl_g: [0.70, 0.78]
      csd_range_dl_g: [0.80, 0.85]  # Carbonated soft drinks
      typical_dl_g: 0.75
      test_method: "ASTM D4603"

    density:
      typical_g_cm3: 1.38
      crystallinity_pct: [30, 35]
      test_method: "ASTM D792"

    processing_temperatures:
      injection_temp_c: [270, 290]
      preform_mold_c: [10, 20]
      blow_molding_c: [90, 110]
      drying_temp_c: 150
      drying_hours: [4, 6]

    bottle_properties:
      wall_thickness_mm: [0.3, 0.8]
      burst_pressure_mpa: 1.5
      co2_permeability_cc_mm_m2_day_atm: 0.5
      acetaldehyde_ppm: 1.0  # Taste threshold
      crystallinity_pct: [30, 35]

    applications:
      - "Beverage bottles (water, soft drinks, juice)"
      - "Food containers (jars, trays)"
      - "Personal care containers"
      - "Pharmaceutical containers"
      - "Household chemical containers"

    pcr_compatibility:
      max_pcr_pct: 100
      food_contact_max_pct: 50  # FDA approval required
      typical_pcr_pct: [25, 100]
      quality_requirements: "Color sorting, contamination control"
      fda_requirement: "Letter of Non-Objection for food contact"

  - grade_id: "PET_APET_GRADE"
    grade_name: "Amorphous PET (APET)"
    description: "Clear, transparent PET for thermoformed packaging (trays, clamshells, blisters)"

    intrinsic_viscosity:
      range_dl_g: [0.70, 0.85]
      typical_dl_g: 0.78
      test_method: "ASTM D4603"

    density:
      amorphous_g_cm3: [1.33, 1.35]
      typical_g_cm3: 1.34
      test_method: "ASTM D792"
      notes: "Rapid cooling prevents crystallization"

    crystallinity:
      typical_pct: 0
      max_pct: 5
      notes: "Amorphous structure provides clarity"

    processing_temperatures:
      extrusion_temp_c: [260, 280]
      thermoforming_temp_c: [120, 160]
      glass_transition_c: [78, 81]
      drying_temp_c: 150
      drying_hours: [4, 6]
      cooling: "rapid_quench"

    mechanical_properties:
      tensile_strength_mpa: [50, 70]
      impact_strength_j_m: [40, 80]
      clarity_pct: [85, 92]
      hdt_c: [70, 80]
      test_method: "ASTM D638, D256"

    applications:
      - "Food trays (fresh produce, bakery, deli)"
      - "Clamshell containers (salad, fruit)"
      - "Blister packs (retail packaging)"
      - "Clear lids and windows"
      - "Display packaging"

    pcr_compatibility:
      max_pcr_pct: 50
      typical_pcr_pct: [25, 40]
      quality_requirements: "Strict clarity requirements, low contamination"
      fda_status: "Approved for food contact with proper decontamination"

  - grade_id: "PET_CPET_GRADE"
