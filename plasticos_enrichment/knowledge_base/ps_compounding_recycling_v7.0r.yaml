# ============================================================================
# MATERIAL PROPERTIES & GRADES
# ============================================================================

material_grades:
  - grade_id: "PS_GPPS_HIGH_FLOW"
    grade_name: "General Purpose PS (GPPS) - High Flow"
    description: "Crystal clear PS for thin-wall packaging and complex geometries"
    type: "virgin"

    melt_flow_rate:
      value_g_10min: [15, 25]
      test_conditions: "200°C/5kg"
      test_method: "ASTM D1238"

    density:
      range_g_cm3: [1.04, 1.06]
      typical_g_cm3: 1.05
      test_method: "ASTM D792"

    processing_temperatures:
      melt_temp_c: [180, 260]
      optimal_range_c: [200, 240]
      decomposition_temp_c: 300

    mechanical_properties:
      tensile_strength_mpa: [35, 50]
      flexural_modulus_mpa: [3000, 3500]
      impact_strength_j_m: [15, 25]  # Brittle
      hdt_c: [70, 100]
      elongation_at_break_pct: [1, 4]
      test_method: "ASTM D638, D790, D256, D648"

    optical_properties:
      light_transmission_pct: 90
      clarity: "excellent"
      haze: "low"

    applications:
      primary:
        - "Disposable cups and containers"
        - "CD/DVD cases"
        - "Packaging applications"
      secondary:
        - "Laboratory equipment"
        - "Optical components"

    pcr_compatibility:
      max_pcr_pct: 30
      typical_pcr_pct: [10, 20]
      quality_requirements: "Strict - optical clarity critical, <0.5% contamination"

    market_data:
      availability: "abundant"
      demand: "moderate"

  - grade_id: "PS_HIPS_APPLIANCE"
    grade_name: "High Impact PS (HIPS) - Appliance Grade"
    description: "Impact-modified PS for appliance housings and structural parts"
    type: "virgin"

    rubber_content:
      polybutadiene_pct: [5, 15]
      particle_size_um: [0.5, 3.0]

    melt_flow_rate:
      value_g_10min: [3, 12]
      test_conditions: "200°C/5kg"
      test_method: "ASTM D1238"

    density:
      range_g_cm3: [1.03, 1.06]
      typical_g_cm3: 1.04
      test_method: "ASTM D792"

    processing_temperatures:
      melt_temp_c: [180, 250]
      optimal_range_c: [200, 230]

    mechanical_properties:
      tensile_strength_mpa: [20, 40]
      flexural_modulus_mpa: [1800, 2500]
      impact_strength_j_m: [80, 150]  # Significantly higher than GPPS
      hdt_c: [65, 85]
      elongation_at_break_pct: [15, 50]
      test_method: "ASTM D638, D790, D256, D648"

    appearance:
      clarity: "opaque"
      color: "typically white or colored"

    applications:
      primary:
        - "Appliance housings (refrigerators, TVs)"
        - "Automotive interior components"
        - "Electronics housings"
      secondary:
        - "Toys and sporting goods"
        - "Food packaging containers"
        - "Point-of-purchase displays"

    pcr_compatibility:
      max_pcr_pct: 50
      typical_pcr_pct: [15, 35]
      quality_requirements: "Moderate - rubber phase compensates for property loss, <0.8% contamination acceptable"
      property_retention_note: "HIPS tensile strength maintains or improves during initial recycling (unique advantage)"

    market_data:
      availability: "abundant"
      demand: "high"

  - grade_id: "PS_EPS_INSULATION"
    grade_name: "Expandable PS (EPS) - Insulation Grade"
    description: "EPS beads for building insulation and packaging applications"
    type: "virgin"

    bead_specifications:
      bead_size_mm: [0.5, 3.0]
      pentane_content_pct: [4, 8]
      expansion_ratio: [20, 50]

    foam_density:
      low_density_kg_m3: [12, 20]
      medium_density_kg_m3: [20, 35]
      high_density_kg_m3: [35, 50]
      test_method: "ASTM C578"

    processing_parameters:
      pre_expansion_temp_c: [80, 100]
      molding_temp_c: [100, 120]
      steam_pressure_mpa: [0.05, 0.2]
      aging_time_hours: [4, 24]

    mechanical_properties:
      compressive_strength_kpa: [70, 350]
      flexural_strength_kpa: [200, 700]
      thermal_conductivity_w_m_k: [0.030, 0.040]
      water_absorption_pct: 4
      test_method: "ASTM D1621, C203, C272"

    applications:
      primary:
        - "Building insulation"
        - "Protective packaging"
        - "Food containers (cups, trays)"
      secondary:
        - "Flotation devices"
        - "Geofoam (civil engineering)"

    pcr_compatibility:
      max_pcr_pct: 40
      typical_pcr_pct: [20, 30]
      quality_requirements: "Moderate - foam structure masks property changes, contamination affects expansion"
      densification_requirement: "Yes - $50k-500k equipment for 50:1 volume reduction"

    market_data:
      availability: "abundant"
      demand: "high"
      recycling_rate_global: "5%"
      recycling_rate_europe: "30%"

# ============================================================================
# RECYCLING RULES & CONTAMINATION PROFILES
# ============================================================================

recycling_rules:
  - rule_id: "PS_HIPS_PROPERTY_RETENTION"
    material_type: "HIPS"
    rule: "HIPS demonstrates unique property retention advantage during recycling"
    reasoning: "Unlike most thermoplastics, HIPS tensile strength maintains or improves slightly during initial recycling (25-32 MPa recycled vs 22-35 MPa virgin). Impact strength shows minimal degradation (35-38 kJ/m² vs 36-39 kJ/m²). Multi-cycle retention: 82% tensile, 68% impact after 6 cycles."
    confidence: 0.92
    source: "Comprehensive HIPS/PS recycling research 2024-2025"

  - rule_id: "PS_GPPS_DEGRADATION"
    material_type: "GPPS"
    rule: "GPPS shows greater property degradation than HIPS during recycling"
    reasoning: "GPPS tensile strength decreases 10-20% (30-45 MPa), impact strength declines 20-30% (1.5-2.5 kJ/m²). Multi-cycle retention: 62% tensile, 50% impact after 6 cycles. Lack of rubber modification makes GPPS more susceptible to chain scission."
    confidence: 0.90
    source: "Comprehensive HIPS/PS recycling research"

  - rule_id: "PS_WEEE_HIPS_PREMIUM"
    material_type: "HIPS"
    source_type: "WEEE electronics"
    rule: "WEEE-sourced HIPS commands significant premium due to superior supply chain"
    reasoning: "WEEE HIPS: 70% collection efficiency (vs 45% general), 90% sorting purity (vs 85%), $260/ton processing cost (vs $280), 25% recycling rate (vs 0.1% general HIPS). Established electronics manufacturer relationships."
    confidence: 0.88
    value_premium_pct: [15, 25]

  - rule_id: "PS_FOOD_SERVICE_CHALLENGE"
    material_type: "GPPS"
    source_type: "food service"
    rule: "Food service PS presents severe supply chain challenges"
    reasoning: "Only 10% collection efficiency, 60% sorting purity (contamination), $420/ton processing cost (highest among PS streams), 1,200 kt/year global generation. Food residues, inks, mixed materials create quality issues."
    confidence: 0.85
    value_discount_pct: [20, 30]

  - rule_id: "PS_EPS_DENSIFICATION_CRITICAL"
    material_type: "EPS"
    rule: "EPS densification is critical economic requirement"
    reasoning: "EPS is 98% air, 2% plastic. Without densification, transportation is uneconomical. Densification equipment ($50k-500k) achieves 50:1 volume reduction, enabling viable recycling for insulation applications."
    confidence: 0.90
    equipment_requirement: "densifier"

  - rule_id: "PS_MULTI_CYCLE_LIMITS"
    rule: "PS recycling cycle limits vary by type and application"
    reasoning: "HIPS premium apps: 1-3 cycles max, HIPS industrial: 4-5 cycles acceptable, HIPS construction: 6+ cycles OK. GPPS premium: 1-2 cycles max, GPPS general: 3-4 cycles limit, GPPS 5+ unsuitable."
    confidence: 0.85

  - rule_id: "PS_CLARITY_DEGRADATION"
    material_type: "GPPS"
    rule: "Optical clarity degrades significantly with recycling"
    reasoning: "GPPS clarity (>90% light transmission virgin) decreases with each cycle due to contamination, oxidation, and molecular weight changes. Limits PCR use in optical applications."
    confidence: 0.88

  - rule_id: "PS_BRITTLENESS_INCREASE"
    material_type: "GPPS"
    rule: "GPPS brittleness increases with recycling, limiting structural applications"
    reasoning: "Already brittle virgin GPPS (1.5-2.5 kJ/m² impact) becomes more brittle with recycling. HIPS rubber phase compensates, making HIPS more recyclable."
    confidence: 0.90

contamination_profiles:
  - profile_id: "PS_WEEE_HIPS_CLEAN"
    material_type: "HIPS"
    source: "WEEE electronics"
    contamination_level: "low"
    typical_contaminants:
      - "Metals (screws, brackets): <100 ppm"
      - "Adhesives: <0.3%"
      - "Labels/printing: <0.2%"
      - "Other plastics (ABS, PC): <2%"
    sorting_purity_pct: 90
    collection_efficiency_pct: 70
    processing_cost_usd_ton: 260
    value_range_usd_ton: [720, 850]

  - profile_id: "PS_FOOD_SERVICE_CONTAMINATED"
    material_type: "GPPS"
    source: "food service"
    contamination_level: "high"
    typical_contaminants:
      - "Food residues: 5-15%"
      - "Inks and printing: 1-3%"
      - "Mixed materials: 3-8%"
      - "Moisture: >1000 ppm"
    sorting_purity_pct: 60
    collection_efficiency_pct: 10
    processing_cost_usd_ton: 420
    value_range_usd_ton: [100, 250]
    washing_required: true

  - profile_id: "PS_EPS_CONSTRUCTION"
    material_type: "EPS"
    source: "construction/demolition"
    contamination_level: "high"
    typical_contaminants:
      - "Concrete dust: 5-20%"
      - "Adhesives: 2-5%"
      - "Construction debris: 3-10%"
      - "Moisture: >2000 ppm"
    sorting_purity_pct: 70
    collection_efficiency_pct: 10
    processing_cost_usd_ton: 380
    densification_required: true
    value_range_usd_ton: [80, 180]

