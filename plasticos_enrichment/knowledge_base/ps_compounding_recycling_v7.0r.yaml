      tensile_strength_min_mpa: 25
      contamination_max_pct: 0.8
      moisture_max_ppm: 500

    certifications_required:
      - "UL listed (electrical safety)"
      - "RoHS compliant"

    applications:
      - "TV housings"
      - "Computer housings"
      - "Monitor bezels"

    volume_range_tons_month: [50, 500]
    price_sensitivity: "moderate"

  - buyer_id: "PS_PACKAGING_THERMOFORM"
    buyer_type: "Packaging manufacturer"
    material_requirements:
      polymer_types: ["GPPS"]
      purity_min_pct: 92
      max_pcr_pct: 30
      color_preference: "clear or white"
      form_preference: "pellets"

    quality_specifications:
      clarity: "high (for clear applications)"
      tensile_strength_min_mpa: 35
      contamination_max_pct: 0.5
      odor: "none to minimal"

