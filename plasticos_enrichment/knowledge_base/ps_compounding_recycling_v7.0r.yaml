# PROCESSING GUIDANCE
# ============================================================================

processing_guidance:
  drying:
    required: true
    temperature_c: [70, 80]
    duration_hours: [2, 4]
    moisture_target_ppm: 300
    reasoning: "PS is hygroscopic, moisture causes degradation and surface defects"

  temperature_control:
    critical: true
    degradation_onset_c: 300
    color_change_warning: "Yellowing indicates thermal degradation"

  mixing_pcr_virgin:
    recommended_method: "Dry blend or masterbatch"
    homogenization: "Critical for property consistency"
    max_pcr_pct_by_application:
      optical: 20
      structural_hips: 50
      insulation_eps: 100

  contamination_removal:
    metal_detection: "Required for electronics applications"
    washing: "Required for food service sourced material"
    densification: "Required for EPS (50:1 volume reduction)"

