      - "ASTM C578 (thermal insulation)"

    applications:
      - "Building insulation panels"
      - "Geofoam"

    volume_range_tons_month: [200, 2000]
    price_sensitivity: "very high"
    densification_equipment: "required"

# ============================================================================
# QUALITY INDICATORS
# ============================================================================

quality_indicators:
  - indicator_id: "PS_IMPACT_STRENGTH"
    test_method: "ASTM D256 (Izod notched)"
    material_types: ["HIPS", "GPPS"]
    thresholds:
      excellent:
        hips_j_m: [100, 150]
        gpps_j_m: [20, 25]
      good:
        hips_j_m: [80, 100]
        gpps_j_m: [15, 20]
      acceptable:
        hips_j_m: [60, 80]
        gpps_j_m: [10, 15]
      poor:
        hips_j_m: [0, 60]
        gpps_j_m: [0, 10]
    significance: "Critical for HIPS applications, GPPS inherently brittle"

  - indicator_id: "PS_OPTICAL_CLARITY"
    test_method: "ASTM D1003 (haze and light transmission)"
    material_types: ["GPPS"]
    thresholds:
      excellent:
        light_transmission_pct: [88, 92]
        haze_pct: [0, 3]
      good:
        light_transmission_pct: [82, 88]
        haze_pct: [3, 6]
      acceptable:
        light_transmission_pct: [75, 82]
        haze_pct: [6, 10]
      poor:
        light_transmission_pct: [0, 75]
        haze_pct: [10, 100]
    significance: "Critical for clear packaging and optical applications"

  - indicator_id: "PS_MFR_CONSISTENCY"
    test_method: "ASTM D1238 (200°C/5kg)"
    material_types: ["HIPS", "GPPS", "EPS"]
    thresholds:
      excellent: "±5% of target MFR"
      good: "±10% of target MFR"
      acceptable: "±15% of target MFR"
      poor: ">±15% of target MFR"
    significance: "Indicates processing consistency and molecular weight stability"

# ============================================================================
# INFERENCE RULES
# ============================================================================

inference_rules:
  - rule_id: "PS_TYPE_IDENTIFICATION"
    inference_type: "material_identification"
    logic: "IF impact_strength >60 J/m THEN HIPS; IF impact_strength <30 J/m AND clear THEN GPPS; IF density <0.8 g/cm³ THEN EPS"
    confidence: 0.92

  - rule_id: "PS_WEEE_SOURCE_PREMIUM"
    inference_type: "pricing"
    logic: "IF material=HIPS AND source=WEEE electronics THEN apply +15-25% premium due to superior supply chain"
    confidence: 0.88

  - rule_id: "PS_FOOD_SERVICE_DISCOUNT"
    inference_type: "pricing"
    logic: "IF source=food_service THEN apply -20-30% discount due to contamination and collection challenges"
    confidence: 0.85

  - rule_id: "PS_EPS_DENSIFICATION_REQUIREMENT"
    inference_type: "processing"
    logic: "IF material=EPS AND form=loose_foam THEN densification_required=true AND equipment_cost=$50k-500k"
    confidence: 0.90

  - rule_id: "PS_HIPS_PCR_ADVANTAGE"
    inference_type: "buyer_matching"
    logic: "IF application=structural AND impact_required THEN prefer_HIPS_over_GPPS due to property retention advantage"
    confidence: 0.88

  - rule_id: "PS_CLARITY_CRITICAL_APPS"
    inference_type: "buyer_matching"
    logic: "IF application=optical OR packaging_clear THEN require GPPS AND max_pcr_pct=20% due to clarity degradation"
    confidence: 0.90

# ============================================================================
# STANDARDS & TESTING
# ============================================================================

standards:
  - standard_id: "ASTM_D4549"
    title: "Classification System for Polystyrene Materials"
    scope: "Defines PS types, grades, and property requirements"
    key_parameters:
      - "Melt flow rate"
      - "Density"
      - "Impact strength"
      - "Tensile properties"
    relevance: "Primary classification standard for PS materials"

  - standard_id: "ASTM_C578"
    title: "Rigid Cellular Polystyrene Thermal Insulation"
    scope: "EPS insulation specifications and testing"
    key_parameters:
      - "Thermal conductivity"
      - "Compressive strength"
      - "Water absorption"
      - "Density"
    relevance: "Critical for EPS insulation applications"

  - standard_id: "ASTM_D1238"
    title: "Melt Flow Rates of Thermoplastics"
    test_conditions: "200°C/5kg for PS"
    significance: "Indicates molecular weight and processability"

  - standard_id: "ISO_2897"
    title: "Polystyrene (PS) molding and extrusion materials"
    scope: "International PS material specifications"
    relevance: "Global trade and quality standards"

