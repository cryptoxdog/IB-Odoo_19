    buyer_type: "Electronics manufacturer"
    material_requirements:
      polymer_types: ["HIPS"]
      purity_min_pct: 95
      max_pcr_pct: 50
      color_preference: "consistent single color or black"
      form_preference: "pellets or regrind"

    quality_specifications:
