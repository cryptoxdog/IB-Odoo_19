title = "PlasticOS gitleaks config"

[allowlist]
description = "Known false positives — shell variables and non-secret identifiers"

# These fingerprints are false positives confirmed on 2026-05-26:
# - Makefile `make sonar` uses $$SONAR_TOKEN (shell variable from .env.local, NOT hardcoded)
# - SonarCloud project key in URL is a public identifier, not a secret
fingerprints = [
    "19f08514f46f1c9970ca122d0214a02a85014066:Makefile:curl-auth-user:273",
    "19f08514f46f1c9970ca122d0214a02a85014066:Makefile:generic-api-key:274",
]

# Also allowlist the sonar target pattern globally — $$SONAR_TOKEN is a shell
# variable, not a hardcoded credential. Any curl -u "$$..." pattern is safe.
[[rules]]
id = "curl-auth-shell-var"
description = "Allow curl -u with shell variable substitution ($$VAR pattern)"
# Override: paths where we intentionally use curl -u with shell vars
[rules.allowlist]
regexes = [
    # $$SONAR_TOKEN and similar — double-dollar is Makefile shell variable
    'curl.*-u.*\$\$[A-Z_]+',
]
