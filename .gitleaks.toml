title = "PlasticOS gitleaks config"

[allowlist]
description = "Known false positives — shell variables and non-secret identifiers"

# Fingerprints confirmed as false positives:
# Makefile `make sonar` uses $$SONAR_TOKEN (shell variable from .env.local, NOT hardcoded)
# SonarCloud project key in URL is a public identifier, not a secret
fingerprints = [
    "19f08514f46f1c9970ca122d0214a02a85014066:Makefile:curl-auth-user:273",
    "19f08514f46f1c9970ca122d0214a02a85014066:Makefile:generic-api-key:274",
]

# Paths to always skip
paths = [
    '''.env.local''',
    '''.env.example''',
    '''requirements.txt''',
]

# ── Rule overrides ────────────────────────────────────────────────────────────
# Override built-in rules that produce false positives in this repo.
# Empty regex + path suppresses the rule entirely (gitleaks v8 syntax).
# The "curl-auth-shell-var" built-in rule fires on Makefile $$VAR curl patterns
# which are shell variable substitutions, not hardcoded secrets.

[[rules]]
id = "curl-auth-shell-var"
description = "Disabled: Makefile uses shell variables ($$VAR), not hardcoded secrets"
regex = '''curl.*-u.*\$\$[A-Z_]+[^\s]*'''
paths = ['''Makefile''']

    [rules.allowlist]
    description = "All curl with shell vars in Makefile are safe"
    regexes = ['''curl.*-u.*\$\$[A-Z_]+''']
