market_intelligence:
  supply_demand:
    current_state: Balanced to slightly tight
    trends:
    - Increasing demand for recycled content (sustainability mandates)
    - Lead stabilizer phase-out creating supply disruptions
    - Chemical recycling capacity expanding (Vinyloop, ChemCycling)
    - NSF certification costs limiting PCR use in pressure pipe
    - DEHP phase-out in medical/food contact applications
  regulatory:
    current:
    - NSF 14/61 (drinking water pipe) - limits PCR to 10-25%
    - Lead stabilizer phase-out (EPA) - completed 2015
    - RoHS (EU) - restricts lead, phthalates in electrical applications
    - FDA 21 CFR 177.1975 - food contact regulations
    - DEHP restrictions in medical devices (EU, some US states)
    pending:
    - PFAS restrictions (may affect some PVC additives)
    - Phthalate restrictions expanding (DINP, DIDP)
    - Circular economy mandates (EU) - minimum recycled content requirements
    - Extended producer responsibility (EPR) for building products
  technology:
    emerging:
    - Chemical recycling (Vinyloop, ChemCycling) - removes contaminants, restores molecular weight
    - Advanced sorting (AI-powered NIR, robotics) - improves quality of recycled streams
    - Bio-based plasticizers (replacing phthalates) - sustainability and regulatory compliance
    - Non-lead stabilizers (Ca-Zn, organotin) - environmental and health benefits
    - Digital watermarking for traceability - improves recycling efficiency
    impact: Chemical recycling enables use of lower-quality feedstock. Advanced sorting improves PCR quality. Bio-based additives
      address regulatory concerns.
  sources:
  - BusinessAnalytiq PVC Price Index (October 2025)
  - Plastics News Resin Pricing (2025)
  - Markets and Markets PVC Recycling Report
  - Grand View Research Recycled Plastic Pipes Report
  - Industry interviews and market research
supplier_intelligence:
  supplier_types:
  - type: Pipe Manufacturers (PIR)
    characteristics:
    - Consistent quality (single formulation)
    - Known processing history (single cycle)
    - Clean regrind (minimal contamination)
    - Predictable volume
    typical_quality: high
    typical_contamination: low (0.01-0.05%)
    reliability: excellent
  - type: Window/Profile Manufacturers (PIR)
    characteristics:
    - Color-sorted or single color
    - May contain impact modifiers
    - UV stabilizers present
    - Clean processing environment
    typical_quality: high
    typical_contamination: low (0.02-0.08%)
    reliability: excellent
  - type: Demolition/Construction Contractors (PCR)
    characteristics:
    - Mixed sources (pipe, siding, profiles)
    - Variable quality
    - May contain dirt, labels, fasteners
    - Outdoor exposure (UV degradation possible)
    typical_quality: medium
    typical_contamination: medium to high (0.1-0.5%)
    reliability: fair
  - type: Municipal Recycling Programs (PCR)
    characteristics:
    - Mixed plastic streams
    - Variable sorting quality
    - May contain cross-contamination
    - Volume fluctuations
    typical_quality: medium to low
    typical_contamination: high (0.2-1.0%)
    reliability: fair
  - type: Wire/Cable Recyclers (Flexible PVC)
    characteristics:
    - Plasticizer content (30-50%)
    - May contain copper contamination
    - Known plasticizer type (usually)
    - Consistent quality from single source
    typical_quality: medium
    typical_contamination: low to medium (copper risk)
    reliability: good
  - type: Medical Facilities (Flexible PVC)
    characteristics:
    - Biocompatible formulations
    - DEHP or DEHP-free plasticizers
    - Regulatory restrictions (cannot recycle to medical)
    - Limited recyclability
    typical_quality: high (but limited applications)
    typical_contamination: low
    reliability: good (but limited volume)
  reliability_indicators:
  - indicator: Consistent Monthly Volume (±10%)
    impact: Enables production planning, preferred by buyers
  - indicator: Quality Documentation (COA, Testing)
    impact: Reduces buyer risk, enables premium pricing
  - indicator: Traceability (Source to Delivery)
    impact: Required for NSF/FDA applications, adds value
  - indicator: Contamination History (Low)
    impact: Builds buyer trust, repeat business
  - indicator: Responsive Communication
    impact: Facilitates problem-solving, relationship building
  risk_factors:
  - factor: Unknown Stabilizer System
    mitigation: XRF testing, request MSDS, assume lead if pre-2015
  - factor: Mixed Rigid/Flexible Streams
    mitigation: Density testing, visual inspection, separate before processing
  - factor: Outdoor Storage (Moisture, UV)
    mitigation: Moisture testing, UV degradation assessment, drying
  - factor: Legacy Lead Stabilizers
    mitigation: XRF testing, restrict to non-food/non-water applications
  - factor: Cross-Polymer Contamination
    mitigation: Density separation, NIR sorting, visual inspection
  sources:
  - Supplier interviews
  - Industry best practices
  - Recycling facility audits
processing_guidance:
  equipment_requirements:
  - equipment: Extruder Screw Design
    specifications:
    - Low-shear screw profile (compression ratio 2.0-2.5:1)
    - Gradual compression zones
    - Minimal shear to prevent degradation
    - Chrome-plated or nitrided for corrosion resistance
    reasoning: PVC is shear-sensitive and releases HCl when degraded, requiring low-shear screws and corrosion-resistant materials
  - equipment: Barrel Temperature Zones
    specifications:
    - 5-7 temperature zones for precise control
    - 'Zone 1 (feed): 150-160°C'
    - 'Zone 2-4 (compression/metering): 170-190°C'
    - 'Die: 180-200°C'
    - 'Maximum: Never exceed 220°C'
    reasoning: Narrow processing window between melting (160°C) and degradation (220°C) requires precise multi-zone control
  - equipment: Venting System
    specifications:
    - Atmospheric vent or vacuum vent
    - Corrosion-resistant vent design
    - HCl scrubber for exhaust
    reasoning: Removes moisture and volatiles, prevents HCl buildup, protects environment and workers
  - equipment: Corrosion Protection
    specifications:
    - Stainless steel or chrome-plated surfaces
    - Corrosion-resistant fasteners
    - HCl-resistant seals and gaskets
    reasoning: HCl release during processing causes corrosion of equipment, requiring protective materials
  process_parameters:
  - parameter: Screw Speed
    range: 20-60 RPM (rigid PVC), 30-80 RPM (flexible PVC)
    impact: Higher speed increases shear heating and degradation risk. Lower speed reduces output.
  - parameter: Back Pressure
    range: 50-200 psi
    impact: Higher back pressure improves mixing but increases shear and residence time. Balance required.
  - parameter: Residence Time
    range: 2-5 minutes maximum
    impact: Longer residence time increases degradation risk. Minimize residence time while ensuring melt homogeneity.
  - parameter: Cooling Rate
    range: Gradual cooling (avoid thermal shock)
    impact: Rapid cooling can cause internal stress and warping. Gradual cooling improves dimensional stability.
  - parameter: Melt Temperature
    range: 170-200°C (rigid), 150-180°C (flexible)
    impact: Critical parameter. Too low = poor melt quality. Too high = degradation and HCl release.
  troubleshooting:
  - issue: Discoloration (yellowing, browning)
    causes:
    - Excessive temperature (>220°C)
    - Long residence time
    - Metal contamination (copper, iron)
    - Degraded stabilizer system
    solutions:
    - Reduce barrel temperatures
    - Increase screw speed (reduce residence time)
    - Remove metal contamination
    - Add fresh stabilizer
    - Purge with stabilized compound
  - issue: HCl Odor (Acrid Smell)
    causes:
    - Thermal degradation (temperature too high)
    - Shear degradation (screw speed too high)
    - Contamination with incompatible polymers
    solutions:
    - Immediately reduce temperature
    - Reduce screw speed
    - Purge barrel with stabilized PVC
    - Check for contamination
    - Inspect equipment for corrosion
  - issue: Surface Defects (Gels, Fish Eyes)
    causes:
    - Contamination (foreign polymers, dirt)
    - Degraded material (black specks)
    - Poor mixing
    - Filter screen plugging
    solutions:
    - Improve contamination removal (sorting, washing)
    - Increase filtration (finer screen)
    - Improve mixing (higher back pressure)
    - Clean/replace filter screens
    - Purge degraded material
  - issue: Bubbles/Voids (Splay Marks)
    causes:
    - Excessive moisture (>500 ppm)
    - Volatile contamination
    - Air entrapment
    solutions:
    - Dry material to <200 ppm
    - Use vented extruder
    - Reduce screw speed
    - Increase back pressure
  - issue: Poor Weld Strength (Pipe)
    causes:
    - Contamination with polyolefins
    - Low K-value (degraded material)
    - Improper welding temperature
    solutions:
    - Reduce polyolefin contamination to <0.05%
    - Blend with higher K-value material
    - Optimize welding parameters
    - Test weld strength regularly
  - issue: Dimensional Instability (Warping)
    causes:
    - Uneven cooling
    - Internal stress
    - Moisture absorption
    solutions:
    - Improve cooling uniformity
    - Reduce processing temperature
    - Anneal parts (heat treatment)
    - Control storage humidity
  sources:
  - PVC processing handbooks
  - Equipment manufacturer guidelines
  - ASTM processing standards
  - Industry best practices
