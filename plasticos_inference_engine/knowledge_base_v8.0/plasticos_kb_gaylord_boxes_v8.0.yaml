quality_indicators:
- indicator: Polymer Type
  measurement: Density test, visual inspection
  thresholds:
    HDPE: Sinks in water (density 0.94-0.97)
    PP: Floats in water (density 0.90-0.91)
  importance: High (affects buyer matching and processing)
- indicator: Damage Level
  measurement: Visual inspection
  thresholds:
    tier_1: No cracks, no warping, no degradation
    tier_2: Minor cracks, minimal warping
    tier_3: Moderate cracks, some warping
    tier_4: Heavily cracked, warped, degraded
  importance: High (affects processing efficiency and property retention)
- indicator: Residual Content
  measurement: Visual inspection, smell test
  thresholds:
    tier_1: No visible residue, no odor
    tier_2: Minimal residue, faint odor
    tier_3: Moderate residue, noticeable odor
    tier_4: Heavy residue, strong odor
  importance: High (affects processing and buyer acceptance)
- indicator: Moisture Content
  measurement: Moisture meter (ppm)
  thresholds:
    tier_1: <500 ppm
    tier_2: 500-1500 ppm
    tier_3: 1500-3000 ppm
    tier_4: '>3000 ppm'
  importance: Moderate (affects processing and storage)
- indicator: Reuse Cycles Completed
  measurement: Visual inspection, documentation
  thresholds:
    tier_1: <50 cycles
    tier_2: 50-100 cycles
    tier_3: '>100 cycles'
  importance: Moderate (affects property retention)
- indicator: Collapsibility
  measurement: Functional test
  thresholds:
    tier_1: Fully collapsible, mechanism works
    tier_2: Partially collapsible, mechanism stiff
    tier_3: Non-collapsible, mechanism broken
  importance: Moderate (affects reuse value and shipping costs)
