processing_guidance:
  collection_preparation:
  - step: Sort by polymer type (HDPE vs. PP)
    rationale: Polymer sorting increases value 10-15%
  - step: Inspect for damage (cracks, warping)
    rationale: Damaged containers reduce processing efficiency
  - step: Clean residual content (food, chemical, industrial)
    rationale: Residue limits buyer options
  - step: Dry containers (moisture <500ppm preferred)
    rationale: Moisture causes processing issues
  - step: Remove metal components (hinges, latches)
    rationale: Metal contamination damages processing equipment
  - step: Remove labels and stickers
    rationale: Labels introduce paper/adhesive contamination
  recycling_process:
  - step: Shredding (industrial-grade blades)
    rationale: Breaks down rigid containers
  - step: Washing (industrial washing)
    rationale: Removes residue, contaminants
  - step: Sorting (polymer type, color)
    rationale: Separates HDPE from PP, removes contaminants
  - step: Extrusion/pelletizing
    rationale: Creates uniform pellets
  - step: Compounding (virgin HDPE/PP or additives)
    rationale: Strengthens recycled material, modifies properties
