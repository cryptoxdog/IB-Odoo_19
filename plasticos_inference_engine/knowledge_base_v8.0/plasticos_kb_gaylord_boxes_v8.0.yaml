recycling_rules:
- rule_id: GAYLORD_POLYMER_SORTING
  rule_name: Sort by Polymer Type (HDPE vs. PP)
  description: HDPE and PP Gaylords must be sorted separately for optimal recycling value
  conditions:
    polymer:
    - HDPE
    - PP
  actions:
  - Sort by polymer type (HDPE vs. PP)
  - Use density test if unsure (HDPE sinks, PP floats)
  - Target polymer-specific buyers
  reasoning: HDPE and PP have different properties and buyers; mixing reduces value
- rule_id: GAYLORD_DAMAGE_INSPECTION
  rule_name: Inspect for Damage (Cracks, Warping)
  description: Damaged Gaylords have reduced recycling value and processing efficiency
  conditions:
    damage:
    - cracks
    - warping
    - degradation
  actions:
  - Inspect for cracks, warping, degradation
  - Separate damaged containers
  - Target low-grade compounders or specialty recyclers
  reasoning: Damage reduces property retention and limits buyer options
- rule_id: GAYLORD_CLEANING
  rule_name: Clean Residue Before Processing
  description: Food, chemical, or industrial residue must be removed to ensure recyclability
  conditions:
    residual_content: present
  actions:
  - Clean containers to remove residual content
  - Discard heavily contaminated containers
  - Sort by contamination level
  reasoning: Residual content reduces quality and limits buyer options
- rule_id: GAYLORD_MOISTURE_CONTROL
  rule_name: Dry Containers Before Processing
  description: Moisture causes processing issues and limits buyer options
  conditions:
    moisture_level: high
  actions:
  - Dry containers before processing
  - Store in dry location
  - Prevent moisture ingress
  reasoning: Moisture >500ppm causes processing issues and limits buyer options
- rule_id: GAYLORD_REUSE_LIMIT
  rule_name: Track Reuse Cycles (100+ cycles = end-of-life)
  description: Gaylords degrade after 100+ uses, reducing recycling value
  conditions:
    reuse_count:
      value:
      - 100.0
      - 100.0
      typical: 100.0
      unit: ''
  actions:
  - Track reuse count if possible
  - Inspect for degradation
  - Recycle after 100+ uses
  reasoning: Containers degrade after 100+ uses, reducing property retention
- rule_id: GAYLORD_COLLAPSIBLE_VALUE
  rule_name: Collapsible Gaylords Have Higher Value
  description: Collapsible Gaylords reduce return shipping costs and have higher reuse value
  conditions:
    collapsible: true
    condition: good
  actions:
  - Prioritize collapsible Gaylords for reuse
  - Target Gaylord box manufacturers
  - Ensure collapse mechanism works
  reasoning: Collapsible design reduces return shipping costs (3:1 ratio)
- rule_id: GAYLORD_METAL_REMOVAL
  rule_name: Remove Metal Components (Hinges, Latches)
  description: Metal components must be removed before recycling
  conditions:
    metal_components: present
  actions:
  - Remove metal hinges, latches, locks
  - Discard metal separately
  - Ensure no metal contamination
  reasoning: Metal contamination reduces recycling quality and damages processing equipment
- rule_id: GAYLORD_LABEL_REMOVAL
  rule_name: Remove Labels and Stickers
  description: Labels and stickers contaminate recycled material
  conditions:
    labels: present
  actions:
  - Remove labels and stickers
  - Clean adhesive residue
  - Ensure no paper contamination
  reasoning: Labels introduce paper/adhesive contamination
- rule_id: GAYLORD_FOOD_CONTAMINATION
  rule_name: Food-Contaminated Gaylords Require Washing
  description: Food residue requires washing before recycling
  conditions:
    contamination_type: food
  actions:
  - Wash containers to remove food residue
  - Dry thoroughly
  - Target buyers with washing capability
  reasoning: Food residue affects recycled material properties and hygiene
- rule_id: GAYLORD_CHEMICAL_TESTING
  rule_name: Test Chemical-Contaminated Gaylords
  description: Chemical residue requires testing before recycling
  conditions:
    contamination_type: chemical
  actions:
  - Test for chemical residue
  - Wash if possible
  - Discard if heavily contaminated
  - Target chemical-tolerant compounders
  reasoning: Chemical residue can affect recycled material properties and safety
