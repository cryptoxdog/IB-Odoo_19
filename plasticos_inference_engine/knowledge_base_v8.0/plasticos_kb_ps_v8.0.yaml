recycling_rules:
- rule_id: PS_HIPS_PROPERTY_RETENTION
  material_type: HIPS
  rule: HIPS demonstrates unique property retention advantage during recycling
  reasoning: 'Unlike most thermoplastics, HIPS tensile strength maintains or improves slightly during initial recycling (25-32
    MPa recycled vs 22-35 MPa virgin). Impact strength shows minimal degradation (35-38 kJ/m² vs 36-39 kJ/m²). Multi-cycle
    retention: 82% tensile, 68% impact after 6 cycles.'
  confidence: 0.92
  source: Comprehensive HIPS/PS recycling research 2024-2025
- rule_id: PS_GPPS_DEGRADATION
  material_type: GPPS
  rule: GPPS shows greater property degradation than HIPS during recycling
  reasoning: 'GPPS tensile strength decreases 10-20% (30-45 MPa), impact strength declines 20-30% (1.5-2.5 kJ/m²). Multi-cycle
    retention: 62% tensile, 50% impact after 6 cycles. Lack of rubber modification makes GPPS more susceptible to chain scission.'
  confidence: 0.9
  source: Comprehensive HIPS/PS recycling research
- rule_id: PS_WEEE_HIPS_PREMIUM
  material_type: HIPS
  source_type: WEEE electronics
  rule: WEEE-sourced HIPS commands significant premium due to superior supply chain
  reasoning: 'WEEE HIPS: 70% collection efficiency (vs 45% general), 90% sorting purity (vs 85%), $260/ton processing cost
    (vs $280), 25% recycling rate (vs 0.1% general HIPS). Established electronics manufacturer relationships.'
  confidence: 0.88
  value_premium_pct:
  - 15
  - 25
- rule_id: PS_FOOD_SERVICE_CHALLENGE
  material_type: GPPS
  source_type: food service
  rule: Food service PS presents severe supply chain challenges
  reasoning: Only 10% collection efficiency, 60% sorting purity (contamination), $420/ton processing cost (highest among PS
    streams), 1,200 kt/year global generation. Food residues, inks, mixed materials create quality issues.
  confidence: 0.85
  value_discount_pct:
  - 20
  - 30
- rule_id: PS_EPS_DENSIFICATION_CRITICAL
  material_type: EPS
  rule: EPS densification is critical economic requirement
  reasoning: EPS is 98% air, 2% plastic. Without densification, transportation is uneconomical. Densification equipment ($50k-500k)
    achieves 50:1 volume reduction, enabling viable recycling for insulation applications.
  confidence: 0.9
  equipment_requirement: densifier
- rule_id: PS_MULTI_CYCLE_LIMITS
  rule: PS recycling cycle limits vary by type and application
  reasoning: 'HIPS premium apps: 1-3 cycles max, HIPS industrial: 4-5 cycles acceptable, HIPS construction: 6+ cycles OK.
    GPPS premium: 1-2 cycles max, GPPS general: 3-4 cycles limit, GPPS 5+ unsuitable.'
  confidence: 0.85
- rule_id: PS_CLARITY_DEGRADATION
  material_type: GPPS
  rule: Optical clarity degrades significantly with recycling
  reasoning: GPPS clarity (>90% light transmission virgin) decreases with each cycle due to contamination, oxidation, and
    molecular weight changes. Limits PCR use in optical applications.
  confidence: 0.88
- rule_id: PS_BRITTLENESS_INCREASE
  material_type: GPPS
  rule: GPPS brittleness increases with recycling, limiting structural applications
  reasoning: Already brittle virgin GPPS (1.5-2.5 kJ/m² impact) becomes more brittle with recycling. HIPS rubber phase compensates,
    making HIPS more recyclable.
  confidence: 0.9
