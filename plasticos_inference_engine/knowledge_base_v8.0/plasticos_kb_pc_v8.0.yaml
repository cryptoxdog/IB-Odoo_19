inference_rules:
- rule_id: PC_PRODUCT_TO_BUYER_FORWARD
  inference_type: buyer_matching
  logic: IF product=headlight_lenses THEN grade=automotive_pc_optical AND quality_tier=[1,2] AND match_buyers=[automotive_tier1,
    optical_secondary]
  reasoning: Forward reasoning from product to suitable buyers based on grade and quality tier
  confidence: 0.9
- rule_id: PC_BUYER_TO_SOURCE_BACKWARD
  inference_type: source_matching
  logic: IF buyer=medical_device AND application=surgical_instruments THEN require_grade=medical_pc AND require_tier=1 AND
    require_source=medical_pir_only
  reasoning: Backward reasoning from buyer requirements to acceptable sources
  confidence: 0.95
- rule_id: PC_MOISTURE_GATE
  inference_type: quality_assessment
  logic: IF moisture>0.02% THEN require_drying BEFORE processing
  reasoning: Moisture control critical gate - PC hydrolyzes above 0.02%
  confidence: 0.98
- rule_id: PC_OPTICAL_TIER_REQUIREMENT
  inference_type: buyer_matching
  logic: IF application=optical OR application=medical THEN require_tier=1 AND require_source=pir_only
  reasoning: Optical and medical applications require highest quality tier
  confidence: 0.92
- rule_id: PC_BPA_FOOD_CONTACT_EXCLUSION
  inference_type: application_matching
  logic: IF source=post_consumer_food_contact THEN exclude_food_contact_reuse AND route_to_non_food_applications
  reasoning: BPA concerns limit PC food-contact recycling
  confidence: 0.9
- rule_id: PC_WEEE_GRADE_SORTING
  inference_type: source_assessment
  logic: IF source=weee_electronics THEN identify_grade=[gp_pc, fr_pc, pc_abs_blend] AND sort_by_grade BEFORE buyer_matching
  reasoning: WEEE contains mixed PC grades - sorting critical for buyer matching
  confidence: 0.85
- rule_id: PC_CYCLE_LIMIT_BY_APPLICATION
  inference_type: quality_assessment
  logic: IF cycles>2 THEN exclude_optical_medical; IF cycles>4 THEN exclude_automotive_electronics; IF cycles>6 THEN construction_only
  reasoning: Cycle limits based on application tier requirements
  confidence: 0.85
