    - 40
- rule_id: TPU_MEDICAL_PIR_ONLY
  material_type: TPU
  rule: Medical TPU requires PIR only - post-consumer medical waste not recyclable
  reasoning: Medical regulations prohibit post-consumer medical waste recycling. Only manufacturing PIR acceptable.
  confidence: 0.98
  restriction: medical_pir_only
- rule_id: TPU_FOOTWEAR_DOMINANT_SOURCE
  material_type: TPU
  rule: Footwear is largest TPU scrap source (40% of market)
  reasoning: Athletic footwear uses TPU for soles, midsoles, uppers. Large post-consumer and PIR volumes available.
  confidence: 0.92
  market_share_pct: 40
- rule_id: TPU_RECYCLING_CYCLES
  material_type: TPU
  rule: TPU retains ~80% properties after 3 recycling cycles
  reasoning: 'After 3 cycles: tensile strength -15-20%, elongation -20-25%. Property retention 75-85%. Blend with virgin for
    optimal properties.'
  confidence: 0.88
  property_retention_pct:
  - 75
  - 85
  cycles: 3
- rule_id: TPU_AROMATIC_UV_DEGRADATION
  material_type: TPU
