recycling_rules:
- rule_id: TPU_TYPE_SEPARATION
  material_type: TPU
  rule: Polyester and polyether TPU should be separated for optimal recycling
  reasoning: Polyester and polyether TPU have different hydrolysis resistance and processing requirements. Mixed types reduce
    property consistency.
  confidence: 0.85
  separation_recommended: true
- rule_id: TPU_INJECTION_PIR_PREMIUM
  material_type: TPU
  rule: Injection molding PIR is highest quality TPU scrap - Tier 1
  reasoning: 'Injection PIR: clean, single type, minimal contamination (<0.5%), 95%+ property retention. Premium value 25-40%
    above market.'
  confidence: 0.95
  pir_characteristics:
    contamination_pct:
    - 0.1
    - 0.5
    quality_tier: 1
    property_retention_pct:
    - 95
