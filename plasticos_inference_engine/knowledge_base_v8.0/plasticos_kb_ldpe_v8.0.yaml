market_intelligence:
  supply_demand:
    current_state: Tightening for quality recycled material
    trends:
    - Strong demand from film companies
    - Recycled LDPE prices rising (narrowing gap with virgin)
    - Film scrap prices surged 21.67% in October 2025
    - Domestic processing matching output to demand
    - Quality premiums increasing (clear vs colored, low contamination)
  regulatory:
    current:
    - FDA 21 CFR 177.1520 (food contact) - limits recycled content or requires FDA approval
    - BRC Global Standard for Food Safety
    - SQF (Safe Quality Food) certification
    - State-level plastic bag bans (increasing recycled content mandates)
    pending:
    - Extended producer responsibility (EPR) for packaging
    - Minimum recycled content mandates (California, other states)
    - Circular economy regulations (EU)
  technology:
    emerging:
    - Advanced sorting (AI-powered NIR, robotics) - improves quality of recycled streams
    - Chemical recycling (pyrolysis, gasification) - handles contaminated feedstock
    - Dissolution/reprecipitation - purifies LDPE streams
    - Digital watermarking for traceability - improves recycling efficiency
    - Deodorization technologies - enables food contact applications
    impact: Advanced sorting improves PCR quality. Chemical recycling enables use of contaminated feedstock. Deodorization
      expands food contact applications.
  sources:
  - BusinessAnalytiq LDPE Price Index (October 2025)
  - Plastics News Recycled LDPE Pricing (March 2025)
  - RecycleInMe LDPE Film Scrap Data (August-October 2025)
  - Recycle.net Exchange Listings (October 2025)
  - Industry research and market data
astm_standards:
- standard_id: ASTM D1248
  title: Standard Specification for Polyethylene Plastics Extrusion Materials for Wire and Cable
  scope: Covers LDPE materials for wire and cable applications
  key_requirements:
  - 'Density classification (Type I: 0.910-0.925 g/cm³)'
  - Melt index ranges by category
  - Electrical property requirements
  - Tensile strength and elongation
  applicable_grades:
  - LDPE_WIRE_CABLE
  testing_methods:
  - Density (ASTM D792)
  - Melt index (ASTM D1238)
  - Tensile properties (ASTM D638)
  sources:
  - ASTM D1248 standard
- standard_id: ASTM D1238
  title: Standard Test Method for Melt Flow Rates of Thermoplastics by Extrusion Plastometer
  scope: Defines method for measuring melt flow rate (melt index) of thermoplastics
  key_requirements:
  - 'Test conditions: 190°C, 2.16 kg load for polyethylene'
  - Precision requirements
  - Sample preparation
  applicable_grades:
  - All LDPE grades
  testing_methods:
  - Extrusion plastometer
  - Weight measurement
  sources:
  - ASTM D1238 standard
- standard_id: ASTM D792
  title: Standard Test Methods for Density and Specific Gravity (Relative Density) of Plastics by Displacement
  scope: Defines methods for measuring density of plastic materials
  key_requirements:
  - Displacement method (water or other liquid)
  - Temperature control (23°C)
  - Precision requirements
  applicable_grades:
  - All LDPE grades
  testing_methods:
  - Water displacement
  - Density gradient column
  sources:
  - ASTM D792 standard
- standard_id: ASTM D638
  title: Standard Test Method for Tensile Properties of Plastics
  scope: Defines method for measuring tensile strength, modulus, elongation
  key_requirements:
  - Standard specimen geometry (Type I, IV, V)
  - Test speed (50 mm/min typical)
  - Measurement precision
  applicable_grades:
  - All LDPE grades
  testing_methods:
  - Tensile testing machine
  - Extensometer
  sources:
  - ASTM D638 standard
- standard_id: ASTM D1693
  title: Standard Test Method for Environmental Stress-Cracking of Ethylene Plastics
  scope: Measures resistance to environmental stress cracking
  key_requirements:
  - Test conditions (50°C, 100% Igepal solution)
  - Specimen preparation (notched)
  - Time to failure measurement
  applicable_grades:
  - LDPE_ROTOMOLDING
  - LDPE_INJECTION_MOLDING
  testing_methods:
  - Constant tensile load apparatus
  - Time to failure observation
  sources:
  - ASTM D1693 standard
