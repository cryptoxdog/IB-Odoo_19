violations:
- id: ALN-01
  severity: High
  confidence: Confirmed
  rule: POS-INV-05 company/party isolation
  affected:
  - plasticos_broker_intelligence/models/advice_service.py
  - plasticos_broker_intelligence_rejections/wizards/rejection_wizard.py
  evidence: Original retrieval filtered company_id in env.companies.ids, not source.company_id; a two-company
    broker could mix approved advice from different source companies.
  expected: Global plus only the source legal company, or active operator company when no source company exists.
  root_cause: Duplicated and overbroad approved knowledge company domains.
  correction: Single core _knowledge_company_domain used by advice and rejection.
  owner: plasticos.broker.advice.service
  status: Resolved
  release_blocker: runtime_proof_pending
  validation: Odoo tests authored; actual two-company ORM query NOT RUN
- id: ALN-02
  severity: High
  confidence: Confirmed
  rule: POS-INV-03 and POS-INV-07 evidence/approval cannot silently gain authority
  affected:
  - plasticos_broker_intelligence/models/knowledge.py
  evidence: Original write() kept reviewer_attested=True when edited draft meaning, scope, supporting evidence
    or company.
  expected: Any material edit invalidates earlier review attestation before approved-state transition.
  root_cause: Attestation not bound to current saved review inputs.
  correction: _REVIEW_INPUTS reset attestation on material write; reject single write that changes inputs while
    asserting attestation.
  owner: plasticos.broker.knowledge
  status: Resolved
  release_blocker: runtime_proof_pending
  validation: Odoo reviewer test authored, NOT RUN
- id: ALN-03
  severity: High
  confidence: Confirmed
  rule: POS-INV-04 stable identity, replay and POS-INV-05 company scope
  affected:
  - plasticos_broker_intelligence/services/evidence.py
  - plasticos_broker_intelligence/models/feedback.py
  evidence: Original feedback hash omitted company scope and concatenated user text via unescaped colons; distinct
    data tuples can hash identical serialized inputs.
  expected: Canonical domain-separated idempotency identity plus exact-safe recognition of previous receipts.
  root_cause: Ambiguous serialization and missing legal-company discriminator.
  correction: Canonical JSON-array SHA-256 v2, company/scope included; legacy SHA accepted only after exact
    field comparison.
  owner: plasticos.broker.feedback
  status: Resolved
  release_blocker: runtime_proof_pending
  validation: Three new pure Python tests Passed; Odoo upgrade replay NOT RUN
- id: ALN-04
  severity: Medium
  confidence: Confirmed
  rule: POS-INV-15 shadow automation must not disrupt live owner
  affected:
  - plasticos_broker_intelligence_web_leads/models/web_lead_advice.py
  evidence: Original optional knowledge query caught broad Exception with no DB savepoint; a failed SQL statement
    could poison the surrounding transaction before normal routing continues.
  expected: Optional shadow failure must leave the parent qualification transaction operational.
  root_cause: Failure isolation missing around optional knowledge retrieval.
  correction: Encapsulate knowledge lookup in native cursor savepoint, then preserve parent signals on error.
  owner: plasticos.web.lead shadow bridge
  status: Resolved
  release_blocker: runtime_proof_pending
  validation: Source check Passed; real DB error injection NOT RUN
- id: ALN-05
  severity: Medium
  confidence: Confirmed
  rule: POS-INV-04 stable identity, POS-INV-05 exact access
  affected:
  - plasticos_broker_intelligence/models/advice_service.py
  evidence: int(True) == 1 and int(1.5) == 1 were permitted for source IDs.
  expected: An invalid record identity must not be coerced into another existing record.
  root_cause: Unconditional int() conversion.
  correction: Reject booleans, floats and nondecimal strings before source browse.
  owner: plasticos.broker.advice.service
  status: Resolved
  release_blocker: runtime_proof_pending
  validation: Odoo malformed-ID test authored, NOT RUN
