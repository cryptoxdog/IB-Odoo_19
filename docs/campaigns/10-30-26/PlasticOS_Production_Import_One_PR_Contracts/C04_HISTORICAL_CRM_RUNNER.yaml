objective: Deliver a Production-compatible, restart-safe VanillaSoft full historical ContactID bootstrap that
  reuses SyncOrchestrator.upsert_contact_external_id, the approved ERP crosswalk, and subsequent provider delta,
  without a false 30-day full-import claim.
