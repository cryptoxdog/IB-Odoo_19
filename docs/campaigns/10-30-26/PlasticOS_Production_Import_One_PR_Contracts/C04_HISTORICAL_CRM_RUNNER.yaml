in_scope:
- plasticos_crm_sync/scripts/import_vanillasoft_shell.py existing entrypoint or the smallest owner-local supported
  historical mode calling upsert_contact_external_id.
- Existing docs/campaigns/.../import_4876.py algorithm as reference, not deployed runtime truth; remove hardcoded
  local project mount assumption at runtime.
- Read-only approved crosswalk digest, 4,876-ID historical census and exact partition (763 YES, 18 NO, 4095
  PENDING), plus explicit current provider delta and calls/custom table scope. Per amendment v1.2 the runtime crosswalk
  is the packaged plasticos_crm_sync/data/approved_contact_crosswalk.csv pinned at 9aa6fcd0eee9fedf106c23090fa32b24c2faacc1576531c4f4fcc846663b72c1
  (759 VS / 691 ERP; supersedes 3689fccf...); the census is an operator-supplied runtime input verified against
  an operator-declared SHA-256 and never read from PRIVATE_INPUTS by the runner (D3).
- Crash-safe bounded checkpoint with durable storage outside ephemeral Odoo.sh shell session, and idempotent
  Odoo provider references.
- Controls preventing simultaneous incremental cron/second bootstrap and accidental CRM external sending.
- 'Separate authoritative Odoo provider identity state from checkpoint reporting. A checkpoint row is not proof
  of committed Odoo state: resume must revalidate durable Odoo external refs/call/custom rows before accepting
  prior DONE.'
- Persistent progress in an existing authorized durable substrate (Odoo DB or operator-controlled persistent
  storage); if neither is proven, prefer replay-from-source on idempotent existing refs rather than trusting
  ephemeral Odoo.sh disk.
- Time-bounded API sessions with retry/backoff and hard retry budget by documented provider behavior; stop
  on auth, source identity corruption or unexplained partial fulfillment.
- Current provider catch-up handled separately from immutable 4,876 snapshot; never promise all live historical
  contacts without an enumeratable authoritative current ID census.
out_of_scope:
- Worksheet images, historical document binaries, and attaching images/documents to transactions (fully deferred)
- Historical ERP CSV/grid as an alternative production source; rewriting ADR-021 transport or adding a second
  ETL pipeline
- New EIE, CEG, Gate, matching, enrichment, AI, website, export or warehouse workflows
- AWS DR rollout, broad business acceptance, bulk historical document recovery
- Changing authorization or core accounting semantics just to make tests pass
- 'Merging PR #345/#346 or repairing their independent unresolved failures outside direct regression scope'
- Actual Odoo.sh Production deployment, destructive reset, Production data write, real overnight import or
  enabling outbound integrations
- Any second PR, raw git push, unapproved repo write, or change outside the bounded import ownership
locked_invariants:
- One PR to Staging covers the entire Production import enablement seam; all coding contracts are sequential
  phases of that one branch and one PR, not separate PRs.
- ERP SQL Server -> existing reader.py PROJECTION_SCRIPTS -> SourceIndex -> native Odoo ORM/importer; no new
  CSV-driven source of truth.
- ERP first (explicitly active companies/contacts; no ineligible Contact IsActive aliases or inactive partner
  creation), then commercial documents, then full VanillaSoft historical ContactID cohort + current delta.
- Native Odoo sale.order, purchase.order and account.move are commercial document owners; transaction is compiled
  from confirmed sale.order, never directly bulk written.
- Source-native ERP keys and VanillaSoft ContactIDs are identity; no fuzzy name, phone, email, Odoo ID, or
  unapproved crosswalk matching.
- Approved 763 / rejected 18 / pending 4095 decisions; 759 approved VanillaSoft crosswalk IDs and four duplicate-omitted
  IDs are preserved and reverified on input bytes. Pending IDs remain CRM leads, not ERP partner bindings.
- Every imported source row gets a consistent created/updated/unchanged/rejected or named exception disposition;
  material failure never reported as a green complete run.
- Odoo.sh Production writes are forbidden by default and may only be enabled by an exact-target, operator-authorized,
  explicitly bounded path; never bypass environment detection or rename target to suppress checks.
- No live SMTP, Linda SO/PO issuance, procurement, calls, external side effects, or overlapping CRM cron on
  historical import. Existing import_mode/skip_procurement behavior must remain verified.
- 'Preserve all non-import features and existing local/uncommitted work; no regression of ten-test closure
  work, PR #346 sale/load integration, or protected source semantics.'
- Whole-run resume must be idempotent across crash-after-write/before-checkpoint and duplicate replay; no infinite
  retry or unattended unbounded execution.
- No unapproved accounting posting, settlement, payment creation, or status fabrication. Source-accurate historical
  statuses remain a separately proven contract and cannot be silently redefined as all draft.
- Promotion does not authorize destruction of legacy Production data; any reset or new Odoo.sh database is
  a separate operator action.
- 'Separate proof gates: an implementation PR may be published with transparent NOT_RUN live-host probes and
  known inherited test failures; this cannot be described as import-ready, merge-ready or Production-ready
  until all relevant gates actually pass.'
- A current go-live ERP SQL snapshot is immutable through both ERP phases and carries source identity, extraction
  time, table counts and a secure read-only access proof; old fixture grids and the October 3 backup are never
  live cutover authority.
- A first-time Production import is permitted only into an explicitly admitted empty-business-data target;
  any reset, fresh database replacement or override of contaminated data requires a separate operator decision,
  never an automatic side effect of this PR.
acceptance_criteria:
- Historical backfill uses one per-ID provider API get through existing orchestrator, not make import-vanillasoft
  modified-after endpoint. An old >30-day ID is covered.
- Unmodified YES crosswalk resolves to existing active ERP person and never creates a duplicate lead; NO/PENDING
  become CRM leads without unauthorized ERP partner binding; four duplicate YES IDs explicitly skipped.
- On simulated crash between Odoo commit and checkpoint write, resume replays safely and creates zero duplicate
  lead, partner ref, call, or custom field rows.
- Persisted checkpoint survives Odoo.sh shell session termination and contains one disposition and preserved
  signal reasons for all processed IDs; fail/held retryable rows are not incorrectly declared complete or silently
  skipped.
- No CRM fetch/eligibility exclusion based on DNC, Unqualified or ClosedFlag; DNC restriction preserved as
  source attribute.
- Every frozen ContactID has an honest disposition, counts sum to 4,876, hold/fail reasons are nonempty, live
  API delta is separately tracked from historical snapshot.
- No private source files, secrets or contact PII enter git; no unsupported new provider, ERP partner fuzzing
  or CRM model refactor. Existing Git tracking of PRIVATE_INPUTS authorizes no new publication and is not the
  Production transport (amendment v1.2 D3).
- Simulate crash after Odoo write/before checkpoint; crash after checkpoint/before confirming durable Odoo
  write; dropped SSH session; on resume verify Odoo persisted identities before skipping or re-fetching.
- One source ID may be fetched again only when justified by retry/recovery, and such replay must be duplicate-safe;
  no false guarantee of exactly one network call across crashes.
- If API has no authoritative all-time census beyond old 4,876 IDs, report HISTORICAL_SNAPSHOT_COMPLETE separately
  from LIVE_DELTA_COMPLETENESS and FULL_CURRENT_CONTACT_COVERAGE=UNKNOWN.
- 'Historical CRM path and incremental sync cannot race: concurrent cron/manual sync is fenced in the actual
  owner and tested with overlapping attempts.'
forbidden_actions:
- No actual Production writes, Odoo.sh deployment, reset, PR merge or cutover during implementation/validation.
- No arbitrary production bypass flags, ODOO_STAGE spoofing, environment rename, direct SQL INSERT/UPDATE to
  source, or privileged open SQL Server endpoint.
- No raw git push, gh pr create or API publication; one final repository-local make pr (Makefile pr ->
  scripts/make_push_pipeline.sh, base Staging) only, per amendment v1.2 D1.
- No export of customer PII, CRM crosswalk, credentials, private source databases or contact notes to GitHub/PR/test
  receipts.
- No gating suppression or automatic status changes to hide full-suite errors, failed import rows, DNC, or
  rejected identities.
- Do not run a continuous daemon/background process inside Odoo.sh, uncontrolled cron, automatic email/stock
  side effects or a bulk modified-after API pretending to cover historical CRM.
- Do not deploy this contract ZIP or run its example scripts in Production; code publication does not authorize
  Promotion, first Production writes, ERP source mutation, CRM provider writes or emailing customers.
- Do not add a new ORM model/field, queue, external service or auth scheme merely for checkpoint convenience;
  if irreducible under current owner, produce an explicit bounded change request before changing public schema.
validation_obligations:
- Unit/focused integration tests against existing approved_identity and orchestrator owner; replay same ID
  twice and interrupted import cases.
- Full cohort on disposable Enterprise clone with existing private inputs and provider API if credentials available,
  otherwise mark end-to-end NOT_RUN.
- Verify no duplicate provider external ref / leads after resumed run and 100% checkpoint coverage; case-specific
  hold/failure signal evidence.
- Verify standard make import-vanillasoft continues incremental semantics, unchanged, not misused for full
  history.
- Check eligible CRM contacts + calls + custom data, owner/stage/material mapping without installing unapproved
  new mappings.
- Odoo.sh-compatible input/checkpoint location and redacted audit output.
- 'Report separately: code implementation evidence, final candidate Enterprise regression proof, Odoo.sh read-only
  hosting proof, actual Production import authorization, and post-run data acceptance. No earlier phase may
  imply a later PASS.'
- Adversarial tests for interrupted checkpoint, duplicate JSONL rows, accepted prior FAILED/HOLD without real
  reason, missing crosswalk digest, PENDING incorrectly linked, API 400 old modified-after, revoked key, 429
  throttling, and post-snapshot delta.
- Retain source signals and error reasons while scrubbing credentials, emails and customer notes from artifacts;
  test sanitization and no PII in checkpoint.
delivery_mode: Single shared branch; no PR in this phase; accumulate patch and evidence for one terminal governed
  PR
implementation_discretion: Rehome historical runner into existing CRM sync owner using current API/ORM. Durable
  checkpoint implementation is open only among already available substrates proven safe and durable; no new
  service or dependency.
external_action_permissions:
- Read-only inspections of authorized repositories and target environments where accessible.
- Edit and test a single bounded local worktree in the writable repository after rebind.
- One PR publication to Staging by the repository-local make pr terminal ceremony only (amendment v1.2 D1),
  after review of that publication source and once all code-gated phases pass; operational NOT_RUN/BLOCKED items
  cannot be called import-ready.
- No permission to merge, deploy, modify Odoo.sh Production data, modify SQL Server, rotate secrets or run
  full Production imports.
unresolved_unknowns:
- Actual Odoo.sh durable checkpoint medium and approved persistent operator source file mount/transport; use
  existing admitted substrate, escalate if unavailable.
- VanillaSoft API credential/project/old ContactID availability from target and provider rate/timeout limits.
- Private 4,876 ID census and approved crosswalk digest must be reverified at execution; source might have
  changed since Oct 13.
- Host access, current SQL backup and live CRM credentials are operational cutover preconditions, not automatic
  blockers to offline coding, focused tests or one PR publication. If unverified, mark IMPORT_READY=BLOCKED/UNKNOWN,
  not PASS.
