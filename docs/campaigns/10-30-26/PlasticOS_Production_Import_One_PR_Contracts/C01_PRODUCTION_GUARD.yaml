- Current CRM 4,876-ID runner hardcodes /mnt/extra-addons/Current Work - IGNORE; current full bulk modified-after
  API is not a historical importer.
- Current ERP native document importer creates draft account.move and no posting/payment; actual historical
  status parity is not established.
- ERP source go-live-day SQL backup, Odoo.sh source reachability, Odoo.sh installed module configuration, runtime
  tool access and Production data cleanliness unverified.
preservation_obligations:
- Keep original ADR-021/approved crosswalk law and source identity markers intact; preserve duplicate-safe
  replay.
- Keep CRM warnings with reason and explicit held/failed classes; Do Not Call is preserved as contact restriction.
- Keep native documents, SO-confirm/transaction compile, purchase/invoice/bill semantics and source payables
  reconciliation; no new transaction writer.
- Keep original source owner negative tests effective; add new positive Production-approved test rather than
  deleting deny tests.
- No unapproved new addon/model/IR model schema or runtime dependency; minimal owner changes, tests and operator
  documentation only.
- Preserve existing native Odoo.sh protection and rollback checkpoint; AWS recovery implementation and broad
  business UAT are deferred without expanding this coding seam.
- Preserve the accurate distinction between historical cohort completion, current-source delta completeness,
  and unproven live total; never claim all contacts loaded solely from the 4,876-ID historical snapshot.
