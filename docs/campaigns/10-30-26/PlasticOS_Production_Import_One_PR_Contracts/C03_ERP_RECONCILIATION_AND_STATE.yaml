contract_id: PLASTICOS.PROD_IMPORT.20261030.C03
objective: Harden source-row and financial reconciliation of the existing ERP importer without changing approved
  accounting semantics; refuse false full success on partial/failed runs and explicitly segregate historical
  actual-status admission from purely technical PR readiness.
target:
  repository_or_artifact: https://github.com/cryptoxdog/IB-Odoo_19
  base_revision: 42556d2e5e7434be43f2ff7f89e66b1c8ee6c15a
  branch_or_worktree: feat/production-erp-crm-bootstrap (one proposed isolated worktree; bind actual branch
    + SHA in C00)
authority_refs:
- 'Operator 2026-10-30: one seam, one PR, as many coding contracts as required; no worksheet image/document
  attachment imports; production ERP + VanillaSoft history after promotion'
- Uploaded L9 Coding Agent Execution Contract(9).md v1.1.0
- https://github.com/cryptoxdog/IB-Odoo_19/blob/42556d2e5e7434be43f2ff7f89e66b1c8ee6c15a/docs/adr/ADR-021-erp-sql-crm-api-import.md
- https://github.com/cryptoxdog/IB-Odoo_19/blob/42556d2e5e7434be43f2ff7f89e66b1c8ee6c15a/INVARIANTS.md
- https://github.com/cryptoxdog/IB-Odoo_19/blob/42556d2e5e7434be43f2ff7f89e66b1c8ee6c15a/docs/campaigns/PlasticOS_ERP_Then_Full_VanillaSoft_Cursor_Delegation_v2_2026-10-21/CURSOR_EXECUTION_CONTRACT.md
- Existing governing repository rules and current canonical L9 authority, where independently verified; absent
  authority must be recorded UNKNOWN rather than assumed
- 'Observed target Staging snapshot: https://github.com/cryptoxdog/IB-Odoo_19/commit/42556d2e5e7434be43f2ff7f89e66b1c8ee6c15a;
  rebind to actual current integration head before edits/publication'
- 'Observed Cursor-Governance source snapshot: https://github.com/Quantum-L9/Cursor-Governance/commit/f47c256b2c282b51a22b416f28466d60018e299f;
  not the publication owner under amendment v1.2 D1'
- 'Amendment v1.2 (13_AMENDMENT_v1.2_OPERATOR_DECISIONS.md): operator decisions D1-D4, 2026-10-30; prevails
  over conflicting v1.1 text'
- 'Observed Quantum-L9/.github snapshot: https://github.com/Quantum-L9/.github/commit/3dcdeaae355b6de08562993f705084d7a3714bfd;
  canonical consumer projection + independent PASS receipts NOT_VERIFIED'
- 'Operator latest decision: worksheet images and document-to-transaction attachments are deferred; six contracts
  together form one PR only'
- 'Odoo 19 official Odoo.sh shell and interruption documentation: https://www.odoo.com/documentation/19.0/administration/odoo_sh/getting_started/branches.html;
  https://www.odoo.com/documentation/19.0/administration/odoo_sh/advanced.html'
in_scope:
- plasticos_partner_import/erp/summary.py run-exit and reconciliation reporting; source-count drift and source
  snapshot identity checks.
- plasticos_transaction/models/native_document_import.py only for root-cause import correctness, source-accurate
  native commercial documents and no unintended side effects.
- Original accepted source mapping law and any current authoritative accounting status decisions, read-only
  source proof and separate exception disclosure.
- Explicit source-backed distinction between imported, rejected, quarantined, partial, historically draft,
  posted and unsupported source status.
- Source-native exception register for rejected/quarantined commercial rows with count and monetary exposure;
  preserve existing row-total checks instead of global fail-on-reject when the source intentionally excludes
  inactive/cancelled records.
- 'Release gate distinction: program exit 0 may still produce final_status=partial; nightly operator must treat
  PARTIAL as NOT_DATA_COMPLETE absent an explicit reviewed exception disposition, even when code validation
  passes.'
- 'Approved source accounting state decision only: if posting status is demanded and no admitted mapping exists,
  block ACCOUNTING_DATA_ACCEPTANCE without opportunistic auto-post, source modification or new accounting model.'
out_of_scope:
- Worksheet images, historical document binaries, and attaching images/documents to transactions (fully deferred)
- Historical ERP CSV/grid as an alternative production source; rewriting ADR-021 transport or adding a second
  ETL pipeline
- New EIE, CEG, Gate, matching, enrichment, AI, website, export or warehouse workflows
- AWS DR rollout, broad business acceptance, bulk historical document recovery
- Changing authorization or core accounting semantics just to make tests pass
- 'Merging PR #345/#346 or repairing their independent unresolved failures outside direct regression scope'
- Actual Odoo.sh Production deployment, destructive reset, Production data write, real overnight import or
  enabling outbound integrations
- Any second PR, raw git push, unapproved repo write, or change outside the bounded import ownership
locked_invariants:
- One PR to Staging covers the entire Production import enablement seam; all coding contracts are sequential
  phases of that one branch and one PR, not separate PRs.
- ERP SQL Server -> existing reader.py PROJECTION_SCRIPTS -> SourceIndex -> native Odoo ORM/importer; no new
  CSV-driven source of truth.
- ERP first (explicitly active companies/contacts; no ineligible Contact IsActive aliases or inactive partner
  creation), then commercial documents, then full VanillaSoft historical ContactID cohort + current delta.
- Native Odoo sale.order, purchase.order and account.move are commercial document owners; transaction is compiled
  from confirmed sale.order, never directly bulk written.
- Source-native ERP keys and VanillaSoft ContactIDs are identity; no fuzzy name, phone, email, Odoo ID, or
  unapproved crosswalk matching.
- Approved 763 / rejected 18 / pending 4095 decisions; 759 approved VanillaSoft crosswalk IDs and four duplicate-omitted
  IDs are preserved and reverified on input bytes. Pending IDs remain CRM leads, not ERP partner bindings.
- Every imported source row gets a consistent created/updated/unchanged/rejected or named exception disposition;
  material failure never reported as a green complete run.
- Odoo.sh Production writes are forbidden by default and may only be enabled by an exact-target, operator-authorized,
  explicitly bounded path; never bypass environment detection or rename target to suppress checks.
- No live SMTP, Linda SO/PO issuance, procurement, calls, external side effects, or overlapping CRM cron on
  historical import. Existing import_mode/skip_procurement behavior must remain verified.
- 'Preserve all non-import features and existing local/uncommitted work; no regression of ten-test closure
  work, PR #346 sale/load integration, or protected source semantics.'
- Whole-run resume must be idempotent across crash-after-write/before-checkpoint and duplicate replay; no infinite
  retry or unattended unbounded execution.
- No unapproved accounting posting, settlement, payment creation, or status fabrication. Source-accurate historical
  statuses remain a separately proven contract and cannot be silently redefined as all draft.
- Promotion does not authorize destruction of legacy Production data; any reset or new Odoo.sh database is
  a separate operator action.
- 'Separate proof gates: an implementation PR may be published with transparent NOT_RUN live-host probes and
  known inherited test failures; this cannot be described as import-ready, merge-ready or Production-ready
  until all relevant gates actually pass.'
- A current go-live ERP SQL snapshot is immutable through both ERP phases and carries source identity, extraction
  time, table counts and a secure read-only access proof; old fixture grids and the October 3 backup are never
  live cutover authority.
- A first-time Production import is permitted only into an explicitly admitted empty-business-data target;
  any reset, fresh database replacement or override of contaminated data requires a separate operator decision,
  never an automatic side effect of this PR.
acceptance_criteria:
- No reported COMPLETE on a run with rejected worksheets, unresolved source records, failed payables reconciliation
  or source-read errors. Each issue has source-native key, reason and quantified exposure.
- Replay after partial failure or interruption uses existing native identifiers, creates zero duplicate documents
  and cannot silently skip rejected records.
- Historical accounting status is verified against approved source contract. If actual state/posting requires
  semantics not currently admitted, mark BLOCKED_ARCHITECTURE and do not post, close or fabricate payment/settlement.
- No blanket acceptance of draft account.move as source-accurate when the source says otherwise; no automation
  of posting without operator authority.
- All accepted record/financial statuses and unsupported cases are explicit in candidate receipt and proposed
  operator cutover runbook.
- No PARTIAL status, failed worksheet or unreadable source may be reported as COMPLETE; summary, process exit
  and operator gate distinguish script completion from data acceptance.
- No stale source backup, source ID drift, duplicate payable identity, disallowed cancelled/imported inactive
  person or unrecognized category silently falls into accepted imported totals.
forbidden_actions:
- No actual Production writes, Odoo.sh deployment, reset, PR merge or cutover during implementation/validation.
- No arbitrary production bypass flags, ODOO_STAGE spoofing, environment rename, direct SQL INSERT/UPDATE to
  source, or privileged open SQL Server endpoint.
- No raw git push, gh pr create or API publication; one final repository-local make pr (Makefile pr ->
  scripts/make_push_pipeline.sh, base Staging) only, per amendment v1.2 D1.
- No export of customer PII, CRM crosswalk, credentials, private source databases or contact notes to GitHub/PR/test
  receipts.
- No gating suppression or automatic status changes to hide full-suite errors, failed import rows, DNC, or
  rejected identities.
- Do not run a continuous daemon/background process inside Odoo.sh, uncontrolled cron, automatic email/stock
  side effects or a bulk modified-after API pretending to cover historical CRM.
- Do not deploy this contract ZIP or run its example scripts in Production; code publication does not authorize
  Promotion, first Production writes, ERP source mutation, CRM provider writes or emailing customers.
validation_obligations:
- Native Odoo Enterprise source-ID replay and all-source-row reconciliation; compare source count, target count,
  exact IDs and amount totals/draft state.
- Adversarial tests for missing parent, inactive contact, shared SO across worksheets, one payable per PayableID,
  cancelled records, inventory without matching sale, and intentionally failed transaction.
- Prove source-accurate accounting-state mapping where approved; otherwise a failing proof and architecture
  escalation is required, not green.
- Import error state remains nonzero for material failure and partial status is visible and actionable.
- 'Report separately: code implementation evidence, final candidate Enterprise regression proof, Odoo.sh read-only
  hosting proof, actual Production import authorization, and post-run data acceptance. No earlier phase may
  imply a later PASS.'
- Negative test that exit status=0 with an explicitly PARTIAL result does not permit automatic next-phase DATA_COMPLETE;
  exception register remains machine- and human-readable.
- Test known accepted accounting semantics from ADR-021 amendments, including draft account.move and no payments,
  against a separately labelled accounting-state acceptance requirement rather than conflating implementation
  truth and source historical truth.
delivery_mode: Single shared branch; no PR in this phase; accumulate patch and evidence for one terminal governed
  PR
implementation_discretion: Source-accurate status logic may be implemented only if existing approved business
  semantics and directly inspected source data unambiguously support it; otherwise stop on exact unresolved
  policy.
external_action_permissions:
- Read-only inspections of authorized repositories and target environments where accessible.
- Edit and test a single bounded local worktree in the writable repository after rebind.
- One PR publication to Staging by the repository-local make pr terminal ceremony only (amendment v1.2 D1),
  after review of that publication source and once all code-gated phases pass; operational NOT_RUN/BLOCKED items
  cannot be called import-ready.
- No permission to merge, deploy, modify Odoo.sh Production data, modify SQL Server, rotate secrets or run
  full Production imports.
unresolved_unknowns:
- Source-accurate native account.move posting/settlement policy not independently established; historical importer
  currently leaves moves draft.
- Source full-import rejected counts at go-live cutover are unknown and cannot be waived by this contract.
- If operator accepts a restricted ERP historical dataset that excludes posting states, that is a separate
  explicit scope decision, not agent discretion.
- Host access, current SQL backup and live CRM credentials are operational cutover preconditions, not automatic
  blockers to offline coding, focused tests or one PR publication. If unverified, mark IMPORT_READY=BLOCKED/UNKNOWN,
  not PASS.
inspection_scope:
- plasticos_partner_import/erp/summary.py
- plasticos_partner_import/erp/mapping_status.py
- plasticos_transaction/models/native_document_import.py
- docs/adr/ADR-021-erp-sql-crm-api-import.md
- historical ERP data status proof / tests
modification_scope:
- Existing ERP summary/target-owned accounting importer/tests, only where evidence proves the defect. Do not
  add accounting models or independent posting writer.
readiness_claim: BOUNDED_IMPLEMENTATION_ONLY_NOT_PRODUCTION_READINESS
baseline_expectations:
- 'Staging source snapshot 42556d2e5e7434be43f2ff7f89e66b1c8ee6c15a; #345 head 76c7d0bf0e3b449be367ebd82de74273f303ad7b
  and #346 head 26f97308885a638c45d957ef9767b5e1dd00ed4c both open on 2026-10-30. New coding work may start
  from an exact verified current Staging head without waiting for these unrelated merges; rebind/rebase, inspect
  collisions and retest before publication/merge.'
- 'Known last reported full Enterprise test suite 1,103 tests with 8 failures, 2 errors on #346 evidence; validate
  current baseline independently and separate existing failures from candidate regressions.'
- Current importer guard rejects ODOO_STAGE=production or production-looking DB names. Existing Makefile import-erp
  is Docker/local-first.
- Current active-only contact exclusion exists via mapping.contact_exclusion and erp_import_service; do not
  reimplement it.
- Current CRM 4,876-ID runner hardcodes /mnt/extra-addons/Current Work - IGNORE; current full bulk modified-after
  API is not a historical importer.
- Current ERP native document importer creates draft account.move and no posting/payment; actual historical
  status parity is not established.
- ERP source go-live-day SQL backup, Odoo.sh source reachability, Odoo.sh installed module configuration, runtime
  tool access and Production data cleanliness unverified.
preservation_obligations:
- Keep original ADR-021/approved crosswalk law and source identity markers intact; preserve duplicate-safe
  replay.
- Keep CRM warnings with reason and explicit held/failed classes; Do Not Call is preserved as contact restriction.
- Keep native documents, SO-confirm/transaction compile, purchase/invoice/bill semantics and source payables
  reconciliation; no new transaction writer.
- Keep original source owner negative tests effective; add new positive Production-approved test rather than
  deleting deny tests.
- No unapproved new addon/model/IR model schema or runtime dependency; minimal owner changes, tests and operator
  documentation only.
- Preserve existing native Odoo.sh protection and rollback checkpoint; AWS recovery implementation and broad
  business UAT are deferred without expanding this coding seam.
- Preserve the accurate distinction between historical cohort completion, current-source delta completeness,
  and unproven live total; never claim all contacts loaded solely from the 4,876-ID historical snapshot.
