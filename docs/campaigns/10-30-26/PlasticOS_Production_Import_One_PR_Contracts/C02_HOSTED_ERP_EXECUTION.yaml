- 'Observed Cursor-Governance source snapshot: https://github.com/Quantum-L9/Cursor-Governance/commit/f47c256b2c282b51a22b416f28466d60018e299f;
  not the publication owner under amendment v1.2 D1'
- 'Amendment v1.2 (13_AMENDMENT_v1.2_OPERATOR_DECISIONS.md): operator decisions D1-D4, 2026-10-30; prevails
  over conflicting v1.1 text'
- 'Observed Quantum-L9/.github snapshot: https://github.com/Quantum-L9/.github/commit/3dcdeaae355b6de08562993f705084d7a3714bfd;
  canonical consumer projection + independent PASS receipts NOT_VERIFIED'
- 'Operator latest decision: worksheet images and document-to-transaction attachments are deferred; six contracts
  together form one PR only'
- 'Odoo 19 official Odoo.sh shell and interruption documentation: https://www.odoo.com/documentation/19.0/administration/odoo_sh/getting_started/branches.html;
  https://www.odoo.com/documentation/19.0/administration/odoo_sh/advanced.html'
in_scope:
- Existing Makefile import-erp wiring only insofar as it needs a truthful Odoo.sh adapter; prefer reuse of
  plasticos_partner_import/scripts/import_erp_shell.py and existing Odoo CLI.
- Secure read-only ERP SQL Server connection into the existing erp/reader.py projection registry, using already-declared
  pymssql when available.
- Operator entrypoint for first active-only partner phase then complete commercial phase, exact target, output
  summary/census and no diagnostic LIMIT.
- Resumable bounded execution using existing 200-worksheet commits and source-native idempotent identities,
  with explicit interrupted-run cursor/restart invariant.
- Preserve import_mode, skip_procurement, disabled external issuance and controlled CRM cron/mail during import.
- Use verified Odoo.sh native `odoo-bin shell` / equivalent CLI and actual Odoo.sh config; local `docker compose`
  remains test-only. Test installed pymssql on exact hosted build before requesting Production import.
- Freeze source snapshot fingerprint across phases and resumes, including restored database identifier and
  projection census; reject mid-run source drift instead of blending two snapshots.
- Specify bounded batch start/end source-native keys and a persistent progress/replay witness. `ERP_LIMIT`
  newest-N/25% is diagnostics, never a full-census resume cursor. Any batching must preserve cross-worksheet
  shared SO/PO and payable consistency.
- 'Explicitly define crash windows: before DB commit, after DB commit/before progress receipt, and between
  Phase 1 and Phase 2; replay safe and no double confirmation side effects.'
out_of_scope:
- Worksheet images, historical document binaries, and attaching images/documents to transactions (fully deferred)
- Historical ERP CSV/grid as an alternative production source; rewriting ADR-021 transport or adding a second
  ETL pipeline
- New EIE, CEG, Gate, matching, enrichment, AI, website, export or warehouse workflows
- AWS DR rollout, broad business acceptance, bulk historical document recovery
- Changing authorization or core accounting semantics just to make tests pass
- 'Merging PR #345/#346 or repairing their independent unresolved failures outside direct regression scope'
- Actual Odoo.sh Production deployment, destructive reset, Production data write, real overnight import or
  enabling outbound integrations
- Any second PR, raw git push, unapproved repo write, or change outside the bounded import ownership
locked_invariants:
- One PR to Staging covers the entire Production import enablement seam; all coding contracts are sequential
  phases of that one branch and one PR, not separate PRs.
- ERP SQL Server -> existing reader.py PROJECTION_SCRIPTS -> SourceIndex -> native Odoo ORM/importer; no new
  CSV-driven source of truth.
- ERP first (explicitly active companies/contacts; no ineligible Contact IsActive aliases or inactive partner
  creation), then commercial documents, then full VanillaSoft historical ContactID cohort + current delta.
- Native Odoo sale.order, purchase.order and account.move are commercial document owners; transaction is compiled
  from confirmed sale.order, never directly bulk written.
- Source-native ERP keys and VanillaSoft ContactIDs are identity; no fuzzy name, phone, email, Odoo ID, or
  unapproved crosswalk matching.
- Approved 763 / rejected 18 / pending 4095 decisions; 759 approved VanillaSoft crosswalk IDs and four duplicate-omitted
  IDs are preserved and reverified on input bytes. Pending IDs remain CRM leads, not ERP partner bindings.
- Every imported source row gets a consistent created/updated/unchanged/rejected or named exception disposition;
  material failure never reported as a green complete run.
- Odoo.sh Production writes are forbidden by default and may only be enabled by an exact-target, operator-authorized,
  explicitly bounded path; never bypass environment detection or rename target to suppress checks.
- No live SMTP, Linda SO/PO issuance, procurement, calls, external side effects, or overlapping CRM cron on
  historical import. Existing import_mode/skip_procurement behavior must remain verified.
- 'Preserve all non-import features and existing local/uncommitted work; no regression of ten-test closure
  work, PR #346 sale/load integration, or protected source semantics.'
- Whole-run resume must be idempotent across crash-after-write/before-checkpoint and duplicate replay; no infinite
  retry or unattended unbounded execution.
- No unapproved accounting posting, settlement, payment creation, or status fabrication. Source-accurate historical
  statuses remain a separately proven contract and cannot be silently redefined as all draft.
- Promotion does not authorize destruction of legacy Production data; any reset or new Odoo.sh database is
  a separate operator action.
- 'Separate proof gates: an implementation PR may be published with transparent NOT_RUN live-host probes and
  known inherited test failures; this cannot be described as import-ready, merge-ready or Production-ready
  until all relevant gates actually pass.'
- A current go-live ERP SQL snapshot is immutable through both ERP phases and carries source identity, extraction
  time, table counts and a secure read-only access proof; old fixture grids and the October 3 backup are never
  live cutover authority.
- A first-time Production import is permitted only into an explicitly admitted empty-business-data target;
  any reset, fresh database replacement or override of contaminated data requires a separate operator decision,
  never an automatic side effect of this PR.
acceptance_criteria:
- The coding PR contains an Odoo.sh-native command/adapter invoking the canonical importer without Docker/local
  venv assumptions, validated on a disposable Odoo Enterprise target with production-shaped stage/DB inputs;
  execution on the actual intended Odoo.sh host is a distinct HOSTED_IMPORT_READY proof and remains NOT_RUN
  until observed.
- First run is active-only ERP partners with empty-target guard. Second full ERP commercial run resumes on
  same database with deliberate ERP_REQUIRE_EMPTY=0. No 25% or other diagnostic cap.
- Odoo.sh SQL reader uses the existing source path. Production-host read-only current SQL connectivity must
  be observed before cutover; if unavailable during PR coding, mark HOSTED_IMPORT_READY=BLOCKED/NOT_RUN, not
  PR code failure. Never add a second ETL or public SQL exposure.
- Interrupt after durable ERP commit and replay produces no duplicate ERP identity, invoice, bill, PO, SO or
  transaction; uncommitted worksheet is safely retried.
- Import activity does not send emails, create payment postings, trigger procurement or initiate stock movements.
- Machine-readable summaries, source census, batch/restart evidence, fail-closed error propagation and exact
  SHA/source identity are observable.
- No added forever-running daemon, unbounded cron or nonstandard Odoo.sh service.
- Exact hosted runtime resolves user addon import path, Odoo config, `pymssql` version/driver and read-only
  private ERP SQL connectivity without uploading legacy CSV. No network exposure or credential logging.
- Every resumed block uses same immutable ERP source and release/database; fail closed on changed source, incomplete
  partner-stage checkpoint, stale code or missing protected auth.
- If Odoo.sh process/session budget cannot cover complete run, prove bounded deterministic resumption without
  the `ERP_LIMIT` truncation trick; otherwise explicitly block overnight execution and leave the PR implementable,
  not falsely hosted-ready.
- The historical confirmed SO path is proven not to produce buyer mail/Linda issuance, procurement/picking,
  accounting posting or payments, including after restart and replay.
forbidden_actions:
- No actual Production writes, Odoo.sh deployment, reset, PR merge or cutover during implementation/validation.
- No arbitrary production bypass flags, ODOO_STAGE spoofing, environment rename, direct SQL INSERT/UPDATE to
  source, or privileged open SQL Server endpoint.
- No raw git push, gh pr create or API publication; one final repository-local make pr (Makefile pr ->
  scripts/make_push_pipeline.sh, base Staging) only, per amendment v1.2 D1.
- No export of customer PII, CRM crosswalk, credentials, private source databases or contact notes to GitHub/PR/test
  receipts.
- No gating suppression or automatic status changes to hide full-suite errors, failed import rows, DNC, or
  rejected identities.
- Do not run a continuous daemon/background process inside Odoo.sh, uncontrolled cron, automatic email/stock
  side effects or a bulk modified-after API pretending to cover historical CRM.
- Do not deploy this contract ZIP or run its example scripts in Production; code publication does not authorize
  Promotion, first Production writes, ERP source mutation, CRM provider writes or emailing customers.
validation_obligations:
- Run exact canonical partner+commercial source against disposable Odoo 19 Enterprise clone with Odoo.sh-like
  config and deliberately interrupted bounded session.
- Verify direct-SQL driver loads from root requirements and read-only source; no credentials appear in logs.
- Check zero duplicated business rows and source-key hash stability after identical replay; test paused/resumed
  commercial batch.
- 'Confirm negative side effects: no mail queue, no picking/procurement, no payment/posting, no background
  CRM overlap.'
- Check all source projections loaded and emitted import summary schema validates.
- 'Report separately: code implementation evidence, final candidate Enterprise regression proof, Odoo.sh read-only
  hosting proof, actual Production import authorization, and post-run data acceptance. No earlier phase may
  imply a later PASS.'
- Adversarial shared-SO crossing batch boundary; duplicated source rows and late source drift; SIGTERM before/after
  commit; first-pass interrupted partner layer; invoice/payable integrity across replay.
- Make exact source snapshots and readonly driver check private; redact addresses, secrets and PII from CI/PR
  receipts.
delivery_mode: Single shared branch; no PR in this phase; accumulate patch and evidence for one terminal governed
  PR
implementation_discretion: Adapter must call existing Odoo import owner, not reconstruct SQL/ORM logic. Choose
  bounded batch/retry mechanism only after proving existing source-ID replay semantics and Odoo.sh process
  behavior.
external_action_permissions:
- Read-only inspections of authorized repositories and target environments where accessible.
- Edit and test a single bounded local worktree in the writable repository after rebind.
- One PR publication to Staging by the repository-local make pr terminal ceremony only (amendment v1.2 D1),
  after review of that publication source and once all code-gated phases pass; operational NOT_RUN/BLOCKED items
  cannot be called import-ready.
- No permission to merge, deploy, modify Odoo.sh Production data, modify SQL Server, rotate secrets or run
  full Production imports.
unresolved_unknowns:
- Real Odoo.sh shell lifecycle/resource limitations and whether source egress/tunnel is feasible under approved
  security policy.
- Actual current SQL backup materialization and production-visible SQL reader credentials.
- Historical native document posting status authority to be resolved or explicitly blocked by C03.
- Host access, current SQL backup and live CRM credentials are operational cutover preconditions, not automatic
  blockers to offline coding, focused tests or one PR publication. If unverified, mark IMPORT_READY=BLOCKED/UNKNOWN,
  not PASS.
inspection_scope:
- Makefile import-erp target and directly invoked scripts
- plasticos_partner_import/scripts/import_erp_shell.py
- plasticos_partner_import/erp/reader.py
- plasticos_partner_import/scripts/run_erp_import.py
- plasticos_transaction/models/native_document_import.py
- root requirements.txt
- Odoo.sh Odoo 19 shell environment and logs
modification_scope:
- Existing importer entrypoint, its runner/wiring and focused tests/documentation; reader.py only if an observed
  defect demands it. No new ETL service or wholesale rewrite.
readiness_claim: BOUNDED_IMPLEMENTATION_ONLY_NOT_PRODUCTION_READINESS
baseline_expectations:
