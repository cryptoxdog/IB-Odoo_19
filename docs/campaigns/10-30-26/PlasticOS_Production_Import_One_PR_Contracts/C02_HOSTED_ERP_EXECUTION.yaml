contract_id: PLASTICOS.PROD_IMPORT.20261030.C02
objective: Make the existing two-stage ERP direct-SQL importer executable in bounded Odoo.sh Production sessions
  using the exact same reader, ORM writer and source identity, without requiring Docker Compose on Odoo.sh.
target:
  repository_or_artifact: https://github.com/cryptoxdog/IB-Odoo_19
  base_revision: 42556d2e5e7434be43f2ff7f89e66b1c8ee6c15a
  branch_or_worktree: feat/production-erp-crm-bootstrap (one proposed isolated worktree; bind actual branch
    + SHA in C00)
