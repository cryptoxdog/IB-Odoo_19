  off_infisical_emergency_escrow: required_and_tested_after_owner_approved_escrow_location
  infisical_host_or_project: UNKNOWN_VERIFY
  backup_secret_ref_secret: do_not_store_secret_values_in_source
  emergency_escrow_location: restricted_1Password_vault_with_independent_bootstrap
  1password_secret_class: only_off_Infisical_emergency_credentials; primary_runtime_secrets_remain_Infisical
  repo_config: safe_declarative_IaC_schedules_pointers_and_runbooks_only
