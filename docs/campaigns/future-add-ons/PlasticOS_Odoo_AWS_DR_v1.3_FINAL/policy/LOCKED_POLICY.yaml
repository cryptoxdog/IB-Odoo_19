  1Password_outage: separate_residual_risk_if_no_offline_escrow; do_not_claim_survived

# The following fields clarify the already-locked independence and complete handoff requirements.
recovery_release_custody:
  pinned_deployable_code_and_dependencies_independent_of_git_host: mandatory
  pr_not_merged_does_not_prevent_recovery: mandatory
  complete_restore_iac_state_and_runtime_artifacts_independently_escrowed: mandatory
  only_verified_secret_references_in_git: true
  operator_pack_as_soon_as_full_recovery_is_proven: true
  refresh_1password_document_after_every_material_incremental_change: mandatory
  daily_independent_recovery_when_2h_source_unavailable: protected_partial_milestone_not_campaign_done
account_provisioning:
  existing_independent_company_controlled_account: preferred
  new_separate_account_if_none_exists: only_after_specific_verified_account_owner_and_spend_approval
  application_account_as_substitute: forbidden
  provider_account_id_region_budget: discover_before_mutation

checkpoint_promotion:
  writer_can_self_admit: false
  verifier_is_separately_authorized: true
  only_verified_manifest_advances_last_good: true
  writer_cannot_write_admitted_or_last_good_prefix: true
