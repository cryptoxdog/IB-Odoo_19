  environment: production_only
  native_backups: keep_enabled_verify_configure_only_supported_native_controls
  native_execution_contract: contracts/01_ODOO_NATIVE_BACKUP.md
  manual_backup: one_real_supported_on_demand_native_checkpoint_when_authorized
  native_restore_test: disposable_isolated_nonproduction_only
independent_recovery:
