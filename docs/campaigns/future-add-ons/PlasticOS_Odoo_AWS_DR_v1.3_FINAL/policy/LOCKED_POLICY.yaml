objectives:
  business_hours_rpo_target_minutes: 120
  rpo_proven: false
  rto_hours_target: 4
  rto_proven: false
  unit_of_restore: consistent_database_filestore_plus_revision_and_secrets
  verified_independent_restore_required: true
backup_efficiency:
  initial_full_baseline: true
  changed_content_only_after_baseline: desired_must_prove
  new_and_changed_rows_only_is_not_a_valid_db_restore: true
  cross_checkpoint_deduplication: desired_must_prove
  database_consistency: point_in_time_mandatory
  deletion_tracking: mandatory
  unchanged_filestore_content: reuse_by_verified_hash
  manifest_dependency_closure: mandatory
security:
  s3_block_public_access: true
  independent_iam_and_keys: true
  encryption_at_rest_and_in_transit: true
  object_lock_compliance_target: true
  immutable_retention_min_days: 90
  writer_can_delete_or_shorten_retention: false
  root_mfa_and_no_long_lived_static_aws_keys: true
  audit_and_failure_alerts: true
retention_and_tiering:
  active_hot_recovery_days: 30
  warm_recovery_days: 365
  eligible_cold_archive_age_days: 365
  cold_only_for_self_contained_recoverable_sets: true
  recent_checkpoint_dependencies_never_cold: true
  live_business_records_untouched: true
  operational_pruning_requires_dependency_proof: true
boundaries:
  odoo_production_writes: operational_business_data_writes_forbidden; supported_native_backup_artifact_actions_authorized_in_contract_01
  odoo_backup_source_reads: permitted_when_authorized
  ERP_sql_backups: out_of_scope
  enterprise_license_failover_proof: required
  aws_new_resource_creation: permitted_in_verified_company_controlled_scope
  aws_existing_unrelated_resources_mutation: forbidden
  aws_account_id: UNKNOWN_RESOLVE_AT_P0
  aws_region: UNKNOWN_RESOLVE_AT_P0
  aws_monthly_budget_usd: UNKNOWN_RESOLVE_AT_P0
  source_capture_method: UNKNOWN_PROVE_AT_P0
  source_fresh_backup_frequency: UNKNOWN_PROVE_AT_P0
  remote_code_publication: via_verified_governance_make_pr_only
  merge_or_production_cutover: forbidden
  native_backup_actions: official_provider_UI_manual_backup_and_nonproduction_restore_only
  native_backup_frequency_override: forbidden_if_platform_managed
readiness:
  native_odoo_protection: platform_claim_not_project_verified
  source_capabilities: UNKNOWN
  aws_vault: NOT_CREATED_BY_THIS_PACK
  independent_full_restore: NOT_RUN
  two_hour_fresh_snapshot: NOT_PROVEN
  incremental_mechanism: NOT_PROVEN
  native_odoo_configured: NOT_VERIFIED_ON_ACTUAL_PRODUCTION
  infisical_secret_integrations: NOT_CONFIGURED_BY_THIS_PACK
  1password_emergency_pack: NOT_CREATED_BY_THIS_PACK
  external_full_recovery_rehearsal: NOT_RUN
  campaign_DONE: NOT_PROVEN
secrets_and_configuration:
