  authorized_project_environment_path: UNKNOWN_RESOLVE_FROM_EXISTING_OWNER
  secret_scoping: dedicated_dr_project_or_folders_and_least_privilege_identities
  static_aws_keys: avoid_use_iam_roles_sts
  non_secret_config_owner: version_controlled_ops/independent_dr
  sensitive_inventory_and_iac_state: private_encrypted_outside_git
