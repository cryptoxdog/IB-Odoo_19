# SonarCloud Automatic Analysis configuration.
#
# Automatic Analysis does NOT read sonar-project.properties — it only reads
# this file. This mirrors the analysis scope already declared in
# sonar-project.properties (kept for CI-based scanner compatibility).
# Keep the two files in sync.

sonar.sources=.
sonar.tests=tests,tests-odoo
sonar.test.inclusions=**/tests/**/*.py,**/test_*.py

# Exclusions (aligned with sonar-project.properties, pyproject.toml, .pre-commit-config.yaml)
sonar.exclusions=\
  odoo-enterprise/**,\
  addons/**,\
  .venv/**,\
  venv/**,\
  docs/**,\
  scripts/**,\
  tools/**,\
  **/__pycache__/**,\
  **/node_modules/**,\
  .git/**,\
  **/migrations/**,\
  plasticos_graph_engine/**,\
  plasticos_graph_integration/**,\
  plasticos_graph_intelligence/**,\
  plasticos_graph_3d_embedding/**,\
  plasticos_inference_engine/**,\
  plasticos_buyer_match_engine/**,\
  plasticos_matching/**,\
  plasticos_enrichment/**,\
  plasticos_web_leads/**,\
  plasticos_dev_tools/**,\
  Files To Harvest/**

sonar.python.version=3.12
