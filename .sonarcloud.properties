# SonarCloud Automatic Analysis configuration.
#
# Automatic Analysis does NOT read sonar-project.properties — it only reads
# this file. Scope keys below match sonar-project.properties.
# This file does not set a coverage report path. Automatic analysis cannot
# import coverage.

sonar.sources=.
sonar.tests=tests,tests-odoo
sonar.test.inclusions=**/tests/**/*.py,**/test_*.py

# Source exclusions. Same list as sonar-project.properties.
# Active modules stay in analysis, including plasticos_matching,
# plasticos_enrichment, plasticos_web_leads, and plasticos_dev_tools.
# scripts/ and tools/ stay in analysis. Vendor, generated, doc, and
# test-data paths stay out. Retired graph roots are not listed.
sonar.exclusions=\
  odoo-enterprise/**,\
  addons/**,\
  .venv/**,\
  venv/**,\
  docs/**,\
  scripts/*.md,\
  scripts/**/*.md,\
  scripts/audit/TOOLKIT PACK,\
  plasticos_dev_tools/tools/test_enhanced_matching_v6.0.py,\
  plasticos_dev_tools/tools/test_kb_integration.py,\
  **/__pycache__/**,\
  **/node_modules/**,\
  .git/**,\
  **/migrations/**,\
  Files To Harvest/**

sonar.python.version=3.12
