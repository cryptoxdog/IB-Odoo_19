# Local PostgreSQL + Odoo testing (Mac) — mirrors Odoo.sh production environment.
#
# Addons paths (all three tiers, matching Odoo.sh):
#   /mnt/extra-addons  → repo root         (plasticos_* custom modules)
#   /mnt/enterprise    → ./odoo-enterprise  (Enterprise modules — parity with production)
#   Odoo core          → baked into odoo:19 image
#
# Quick start:
#   docker compose -p odoo19 up -d db          # Start PostgreSQL
#   docker compose -p odoo19 up odoo           # Start Odoo (interactive, Ctrl+C to stop)
#
# Rebuild DB (enterprise + custom, no demo):
#   ./scripts/rebuild-odoo-no-demo.sh
#
# Enterprise module list (what production has installed):
#   config/odoo_module_order.yaml → docker_enterprise_modules
#
# Access:
#   Odoo:     http://localhost:8069
#   Postgres: localhost:5433 (user: odoo, pass: odoo)

name: odoo19

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: odoo
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    shm_size: 128mb
    volumes:
      - odoo_pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=50

  # Interactive Odoo for development (keeps running)
  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - .:/mnt/extra-addons
      - ./odoo-enterprise:/mnt/enterprise:ro
      - odoo_data:/var/lib/odoo
      - ./config:/etc/odoo:ro
    command: >
      --addons-path=/mnt/extra-addons,/mnt/enterprise,/usr/lib/python3/dist-packages/odoo/addons
      -d odoo
      --db_host=db
      --db_port=5432
      --db_user=odoo
      --db_password=odoo
      --without-demo=all
      --no-database-list
      --dev=none
      --workers=2
      --max-cron-threads=1
      --limit-time-cpu=60
      --limit-time-real=120
      --limit-memory-hard=2684354560
      --limit-memory-soft=2147483648

  # Test runner (stops after init) - NO demo data
  odoo-test:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/mnt/extra-addons
      - ./odoo-enterprise:/mnt/enterprise:ro
    command: >
      --addons-path=/mnt/extra-addons,/mnt/enterprise,/usr/lib/python3/dist-packages/odoo/addons
      -d odoo
      --db_host=db
      --db_port=5432
      --db_user=odoo
      --db_password=odoo
      --without-demo=all
      --log-level=info
      --stop-after-init
      --workers=0
      --max-cron-threads=0

  # Test runner WITH demo data (matches Odoo.sh staging/dev environment)
  odoo-test-demo:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/mnt/extra-addons
      - ./odoo-enterprise:/mnt/enterprise:ro
    environment:
      - ODOO_DEMO=1
    command: >
      --addons-path=/mnt/extra-addons,/mnt/enterprise,/usr/lib/python3/dist-packages/odoo/addons
      -d odoo_demo
      --db_host=db
      --db_port=5432
      --db_user=odoo
      --db_password=odoo
      --log-level=test
      --test-enable
      --stop-after-init
      --workers=0
      --max-cron-threads=0

volumes:
  odoo_pgdata:
  odoo_data:
