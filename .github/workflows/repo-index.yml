name: Update Repo Index

# Runs after every PR merge (a merge always produces a push to the base
# branch) plus manual dispatch. Keeps reports/repo-index/*.txt fresh via
# the l9-repo-index skill's repo-local generator.
on:
  push:
    branches:
      - Staging
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  actions: write  # dispatch ci.yml on the index branch (GITHUB_TOKEN events do not trigger workflows)

# Only one index update at a time
concurrency:
  group: repo-index
  cancel-in-progress: false

jobs:
  update-repo-index:
    name: Regenerate repo-index
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Optional REPO_INDEX_PAT (fine-grained: contents + pull-requests on
          # this repo) lets the index PR trigger CI on its own. Without it the
          # workflow falls back to GITHUB_TOKEN and dispatches ci.yml explicitly.
          token: ${{ secrets.REPO_INDEX_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate repo indexes
        run: python3 scripts/repo_generators/export_repo_indexes.py

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- reports/repo-index; then
            echo "No index updates needed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Repo index has been updated"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Staging is ruleset-protected and rejects direct bot pushes, so a
      # refreshed index rides an ordinary pull request on a bot-owned branch.
      # The branch is replaced under a lease (never a blind force) and the PR
      # is reused while one is open.
      - name: Publish updated indexes as a pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPO_INDEX_PAT || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.REPO_INDEX_PAT != '' }}
        run: |
          set -euo pipefail
          branch="chore/repo-index"
          short="${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add reports/repo-index
          git commit -m "chore(repo-index): regenerate lookup indexes for ${short}"
          expected="$(git ls-remote --heads origin "$branch" | cut -f1)"
          if [ -z "$expected" ]; then
            # Branch does not exist yet: a plain push creates it (and fails
            # loudly if it appeared in the meantime, which is the safe outcome).
            git push origin "HEAD:refs/heads/${branch}"
          else
            # Replace the bot-owned branch only if it is still at the tip we
            # observed (lease), never a blind force.
            git push --force-with-lease="refs/heads/${branch}:${expected}" origin "HEAD:refs/heads/${branch}"
          fi
          open_count="$(gh pr list --head "$branch" --base Staging --state open --json number --jq 'length')"
          if [ "$open_count" = "0" ]; then
            gh pr create --base Staging --head "$branch" \
              --title "chore(repo-index): regenerate lookup indexes for ${short}" \
              --body "Automated refresh of reports/repo-index after ${GITHUB_SHA} on Staging. Generated by the Update Repo Index workflow." \
              || echo "::warning::Index branch ${branch} is pushed but the PR could not be opened (repository policy may block Actions-created PRs); open it manually."
          else
            echo "Updated the open repo-index PR on ${branch}"
          fi
          if [ "$HAS_PAT" != "true" ]; then
            # Pushes and PRs made with GITHUB_TOKEN never trigger workflows, so
            # the required checks would never run on the index PR. Dispatch the
            # CI gate on the branch explicitly (ci.yml exposes workflow_dispatch).
            gh workflow run ci.yml --ref "$branch" \
              || echo "::warning::Could not dispatch ci.yml on ${branch}; re-run it manually so the required checks report."
          fi
