# ═══════════════════════════════════════════════════════════════════════════
# GATE-01 Baseline Ratchet — thin caller (IB-Odoo_19 / PlasticOS adoption)
#
# All ratchet logic lives in the reusable workflow pinned below by immutable
# commit SHA (Quantum-L9/l9-ci-core). This caller only supplies repository-
# specific inputs. CI never writes ledgers — only humans do, in reviewed PRs
# (see .github/CODEOWNERS: .l9/baselines/** requires owner review).
#
# Sibling parity (fourth adopter in the GATE-01 program):
#   Constellation.Gate.Node/.github/workflows/baseline-ratchet-caller.yml
#   Enrichment.Inference.Engine/.github/workflows/baseline-ratchet-caller.yml
#   Cognitive.Engine.Graphs/.github/workflows/baseline-ratchet-caller.yml
#
# Repo specifics vs siblings:
#   - Integration branch is `Staging` (not `main`).
#   - Only the pure-Python test tier runs here (tests/conftest.py auto-skips
#     every Odoo-importing module when the Odoo framework is absent), so the
#     dependency manifest is the minimal requirements-ci.txt (pytest trio).
#   - Zero-debt adoption: 296 passed / 10 skipped at baseline; both ledgers
#     are intentionally empty.
#
# Branch-protection check names exposed by the reusable workflow:
#   Baseline Ratchet / Required Tests
#   Baseline Ratchet / Quarantined Debt
#   Baseline Ratchet / Workflow Integrity
#   Baseline Ratchet / Ratchet Verdict
# ═══════════════════════════════════════════════════════════════════════════
name: Baseline Ratchet

on:
  pull_request:
    branches: [Staging]
  push:
    branches: [Staging]

permissions:
  contents: read

jobs:
  ratchet:
    name: Baseline Ratchet
    uses: Quantum-L9/l9-ci-core/.github/workflows/baseline-ratchet.yml@d81a06ed821106a487df2e5ad06d93e347392af6
    with:
      core-revision: d81a06ed821106a487df2e5ad06d93e347392af6
      sdk-revision: 0779fca8238011f8abea551895f96584676e9d17
      python-version: "3.12"
      pytest-paths: tests
      test-quarantine-ledger: .l9/baselines/test-quarantine.yml
      packet-envelope-ledger: .l9/baselines/packet-envelope.yml
      # PlasticOS consumes TransportPacket exclusively through the SDK inside
      # plasticos_gate (single-egress invariant, enforced by
      # tests/test_gate_single_egress.py); it declares no deprecated
      # PacketEnvelope symbol and has zero deprecated references
      # (empty-but-valid ledger), so declaration paths stay empty.
      requirements-files: requirements-ci.txt
