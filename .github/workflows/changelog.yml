name: Update Changelog

on:
  push:
    branches:
      - Production  # Auto-generate changelog on merge to Production
  workflow_dispatch:  # Allow manual trigger

# Only one changelog update at a time
concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  update-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for commitizen
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install commitizen
        run: pip install --only-binary ":all:" commitizen==4.10.0

      - name: Generate changelog
        run: |
          # Create CHANGELOG.md if it doesn't exist
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "All notable changes to PlasticOS will be documented in this file." >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/)," >> CHANGELOG.md
            echo "and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)." >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi

          # Generate changelog from conventional commits.
          # cz exits non-zero when there are no new conventional commits since
          # the last release — that is an expected no-op, not a failure. Detect
          # it explicitly instead of masking every error with `|| true`.
          set +e
          OUTPUT=$(cz changelog --unreleased-version "HEAD" --incremental 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            if echo "$OUTPUT" | grep -qi "no commits found\|nothing to generate\|no new commits"; then
              echo "No new conventional commits — changelog unchanged (expected no-op)."
            else
              echo "::error::cz changelog failed unexpectedly (exit $STATUS)"
              exit $STATUS
            fi
          fi

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog updates needed"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changelog has been updated"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changelog
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md [skip ci]"
          git push
