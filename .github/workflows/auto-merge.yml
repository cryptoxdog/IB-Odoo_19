name: Auto-Merge

# Auto-merge is OPT-IN: a PR is armed for squash auto-merge ONLY when a human
# applies the `automerge` label. Previously every non-draft PR was armed
# automatically, which merged PRs the moment CI went green — without explicit
# human intent. Label-gating restores that intent boundary (GATE-01).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [Staging, Production]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    steps:
      - uses: actions/checkout@v6

      - name: Enable auto-merge (squash)
        uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d  # v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
