name: PR Gate

on:
  pull_request:
    branches: [staging, main]
    paths-ignore:
      - 'plasticos_graph_engine/**'
      - 'plasticos_graph_integration/**'
      - 'plasticos_graph_intelligence/**'
      - 'plasticos_graph_3d_embedding/**'
  push:
    branches: [staging, main]
    paths-ignore:
      - 'plasticos_graph_engine/**'
      - 'plasticos_graph_integration/**'
      - 'plasticos_graph_intelligence/**'
      - 'plasticos_graph_3d_embedding/**'

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linters
        run: pip install ruff==0.4.10 mypy==1.14.0

      - name: Ruff lint
        run: |
          ruff check . \
            --output-format=github \
            --exclude plasticos_inference_engine \
            --exclude plasticos_buyer_match_engine \
            --exclude plasticos_matching

      - name: Ruff format check
        run: |
          ruff format --check . \
            --exclude plasticos_inference_engine \
            --exclude plasticos_buyer_match_engine \
            --exclude plasticos_matching

      - name: mypy type check
        run: mypy . --config-file=pyproject.toml
        continue-on-error: true  # advisory until backlog cleared

  xml-and-shell:
    name: XML + Shell Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: sudo apt-get install -y libxml2-utils shellcheck

      - name: Validate XML syntax
        run: |
          find . -name "*.xml" -not -path "./.git/*" -not -path "./.venv/*" | \
            xargs --no-run-if-empty xmllint --noout

      - name: Shellcheck
        run: |
          find . -name "*.sh" -not -path "./.git/*" | \
            xargs --no-run-if-empty shellcheck --severity=warning

  odoo-patterns:
    name: Odoo 19 Pattern Checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run Odoo pattern checks
        run: |
          chmod +x ./scripts/check_odoo_patterns.sh
          ./scripts/check_odoo_patterns.sh || true  # pre-existing issues tracked separately
        continue-on-error: true

      - name: Validate module manifests
        run: |
          ERRORS=0
          for manifest in $(find . -name "__manifest__.py" -not -path "./.venv/*"); do
            if ! python3 -c "exec(open('$manifest').read())" 2>/dev/null; then
              echo "ERROR: Invalid manifest syntax: $manifest"
              ERRORS=$((ERRORS + 1))
            fi
          done
          [ $ERRORS -eq 0 ] || exit 1

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
