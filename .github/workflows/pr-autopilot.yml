name: PR Autopilot

on:
  workflow_dispatch:  # manual only — scheduled run disabled (too soon)

# Limit to one autopilot run at a time
concurrency:
  group: pr-autopilot
  cancel-in-progress: false

jobs:
  scan-prs:
    name: Scan Open PRs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for PR analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --only-binary ":all:" requests==2.32.5 PyGithub==2.8.1

      # Scan-only reporter: pr_autopilot.py reports PR signals and never gates
      # merges. A non-zero exit means the scanner itself broke — that should
      # fail this run visibly (GATE-01 fail-closed), not be masked.
      - name: Run PR Autopilot (scan only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONARCLOUD_API_KEY: ${{ secrets.SONARCLOUD_API_KEY }}
        run: |
          python3 scripts/pr_autopilot.py

      - name: Report completion
        if: always()
        run: |
          echo "✅ PR Autopilot scan complete"
          echo "Review results in the job logs above"
