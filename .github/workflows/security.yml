name: Security Scan

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - 'plasticos_graph_engine/**'
      - 'plasticos_graph_integration/**'
      - 'plasticos_graph_intelligence/**'
      - 'plasticos_graph_3d_embedding/**'
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - 'plasticos_graph_engine/**'
      - 'plasticos_graph_integration/**'
      - 'plasticos_graph_intelligence/**'
      - 'plasticos_graph_3d_embedding/**'
  schedule:
    # Run weekly on Monday at 9am UTC
    - cron: '0 9 * * 1'

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit==2.9.0

      - name: Run pip-audit
        run: |
          # Scan requirements if they exist
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --ignore-vuln GHSA-0000-0000-0000 || true
          fi
          # Also scan any installed packages
          pip-audit || true
        continue-on-error: true

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'  # Don't fail build, just report
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy for SARIF output
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
