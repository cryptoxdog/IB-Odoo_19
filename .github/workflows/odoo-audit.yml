name: Odoo Code Audit

on:
  push:
    branches: [main, master, develop, staging]
  pull_request:
    branches: [main, master, develop, staging]

jobs:
  # Job 0: Static file checks (fast, no Python runtime needed)
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          find . -name "*.sh" -not -path "./.git/*" | while read f; do
            bash -n "$f" || (echo "Syntax error in $f" && exit 1)
          done

      - name: Enforce _name string literals (no CONSTANT pattern)
        run: |
          # _name must always be "model.name" — never _name = SOME_CONSTANT
          # Exceptions: field names that happen to contain "name" (display_name, etc.)
          FIELD_EXCLUSIONS="display_name|model_name|field_name|_unique_name|buyer_name"
          FIELD_EXCLUSIONS="$FIELD_EXCLUSIONS|company_name|contact_name|pending_company_name"
          FIELD_EXCLUSIONS="$FIELD_EXCLUSIONS|full_name|utm_name|pickup_contact_name|delivery_contact_name"
          if grep -rn "_name = [A-Z][A-Z0-9_]*" plasticos_*/models/*.py 2>/dev/null \
             | grep -v "#" \
             | grep -vE "$FIELD_EXCLUSIONS"; then
            echo "❌ _name must be a string literal. Use: _name = \"model.name\""
            exit 1
          fi
          echo "✅ All _name assignments use string literals"

  # Job 1: Check for circular dependencies (BLOCKING - fails fast)
  circular-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Circular Dependencies & Cross-Module @api.depends
        run: python3 ci/check_circular_deps.py .

  # Job 2: Check for orphan model references (BLOCKING - fails fast)
  orphan-model-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Orphan Model References in XML
        run: python3 ci/check_orphan_model_refs.py .

  # Job 2b: Check for duplicate model definitions (BLOCKING - prevents inheritance bugs)
  model-inheritance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Model Inheritance Patterns
        run: python3 ci/check_model_inheritance.py .

  # Job 3: XPath Anchor Stability (BLOCKING - prevents silent UI corruption)
  xpath-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check XPath Anchor Stability
        id: xpath
        run: |
          python3 ci/check_xpath_stability.py . || true

          # Count issues by severity
          if [ -f xpath_stability_report.json ]; then
            XPATH_HIGH=$(jq '[.[] | select(.severity=="HIGH")] | length' xpath_stability_report.json)
            XPATH_CRITICAL=$(jq '[.[] | select(.severity=="CRITICAL")] | length' xpath_stability_report.json)
            XPATH_MEDIUM=$(jq '[.[] | select(.severity=="MEDIUM")] | length' xpath_stability_report.json)

            echo "xpath_high=$XPATH_HIGH" >> $GITHUB_OUTPUT
            echo "xpath_critical=$XPATH_CRITICAL" >> $GITHUB_OUTPUT
            echo "xpath_medium=$XPATH_MEDIUM" >> $GITHUB_OUTPUT

            echo "### XPath Stability Results" >> $GITHUB_STEP_SUMMARY
            echo "- CRITICAL: $XPATH_CRITICAL" >> $GITHUB_STEP_SUMMARY
            echo "- HIGH: $XPATH_HIGH" >> $GITHUB_STEP_SUMMARY
            echo "- MEDIUM: $XPATH_MEDIUM" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for XPath Stability Regressions
        run: |
          if [ -f xpath_stability_report.json ]; then
            XPATH_HIGH=${{ steps.xpath.outputs.xpath_high }}
            XPATH_CRITICAL=${{ steps.xpath.outputs.xpath_critical }}

            # Baseline: 0 CRITICAL, 0 HIGH (after fixes applied 2026-03-05)
            # All 52 XPath stability issues fixed in commit 23729dc7
            BASELINE_CRITICAL=0
            BASELINE_HIGH=0

            if [ "$XPATH_CRITICAL" -gt "$BASELINE_CRITICAL" ] || [ "$XPATH_HIGH" -gt "$BASELINE_HIGH" ]; then
              echo "❌ REGRESSION: XPath stability issues detected"
              echo "   CRITICAL: $XPATH_CRITICAL (baseline: $BASELINE_CRITICAL)"
              echo "   HIGH: $XPATH_HIGH (baseline: $BASELINE_HIGH)"
              echo ""
              echo "Issues found:"
              jq -r '.[] | select(.severity=="CRITICAL" or .severity=="HIGH") | "- [\(.severity)] \(.issue_type): \(.xpath)\n  File: \(.file)\n  Fix: \(.fix_suggestion)"' xpath_stability_report.json
              exit 1
            else
              echo "✅ No XPath stability regressions"
            fi
          fi

      - name: Upload XPath Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xpath-stability-report
          path: xpath_stability_report.json

  # Job 4: Full audit (runs in parallel)
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Comprehensive Audit
        id: audit
        run: |
          python3 scripts/audit/odoo_audit.py . || true

          # Count issues by severity
          HIGH_COUNT=$(jq '[.[] | select(.severity=="HIGH")] | length' odoo_audit_report.json)
          CRITICAL_COUNT=$(jq '[.[] | select(.severity=="CRITICAL")] | length' odoo_audit_report.json)

          echo "high_count=$HIGH_COUNT" >> $GITHUB_OUTPUT
          echo "critical_count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT

          echo "### Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "- HIGH: $HIGH_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- CRITICAL: $CRITICAL_COUNT (known false positives for inherited fields)" >> $GITHUB_STEP_SUMMARY

      - name: Check for HIGH severity regressions
        run: |
          HIGH_COUNT=${{ steps.audit.outputs.high_count }}

          # Baseline: 0 HIGH issues (after fixes applied 2026-03-05)
          BASELINE_HIGH=0

          if [ "$HIGH_COUNT" -gt "$BASELINE_HIGH" ]; then
            echo "❌ REGRESSION: Found $HIGH_COUNT HIGH issues (baseline: $BASELINE_HIGH)"
            echo ""
            echo "New HIGH issues:"
            jq -r '.[] | select(.severity=="HIGH") | "- \(.type): \(.message)\n  File: \(.file):\(.line // "N/A")"' odoo_audit_report.json
            exit 1
          else
            echo "✅ No HIGH severity regressions (found: $HIGH_COUNT, baseline: $BASELINE_HIGH)"
          fi

      - name: Run Extended Audits (Business Logic, Performance, Security)
        id: extended
        run: |
          python3 scripts/audit/run_all_audits.py . || true

          # Count extended audit issues
          if [ -f extended_audit_report.json ]; then
            EXT_HIGH=$(jq '[.[] | select(.severity=="HIGH")] | length' extended_audit_report.json)
            EXT_CRITICAL=$(jq '[.[] | select(.severity=="CRITICAL")] | length' extended_audit_report.json)
            echo "ext_high=$EXT_HIGH" >> $GITHUB_OUTPUT
            echo "ext_critical=$EXT_CRITICAL" >> $GITHUB_OUTPUT

            echo "### Extended Audit Results" >> $GITHUB_STEP_SUMMARY
            echo "- HIGH: $EXT_HIGH" >> $GITHUB_STEP_SUMMARY
            echo "- CRITICAL: $EXT_CRITICAL" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check Extended Audit Regressions
        run: |
          if [ -f extended_audit_report.json ]; then
            EXT_HIGH=${{ steps.extended.outputs.ext_high }}

            # Baseline: 4 HIGH issues (pre-existing N+1 queries in plasticos_logistics/models/load.py
            # and plasticos_transaction/models/transaction.py - not introduced by test framework move)
            BASELINE_EXT_HIGH=4

            if [ "$EXT_HIGH" -gt "$BASELINE_EXT_HIGH" ]; then
              echo "❌ REGRESSION: Extended audit found $EXT_HIGH HIGH issues (baseline: $BASELINE_EXT_HIGH)"
              jq -r '.[] | select(.severity=="HIGH") | "- \(.type): \(.file):\(.line // "N/A")"' extended_audit_report.json | head -20
              exit 1
            else
              echo "✅ No extended audit regressions (found: $EXT_HIGH, baseline: $BASELINE_EXT_HIGH)"
            fi
          fi

      - name: Upload Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-audit-report
          path: |
            odoo_audit_report.json
            extended_audit_report.json
            AUDIT_REPORT.md

      - name: Comment on PR (if regression)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('odoo_audit_report.json'));
            const high = report.filter(e => e.severity === 'HIGH');

            const comment = `## ❌ Audit Regression Detected

            This PR introduces **${high.length} HIGH severity issues**.

            ### Issues Found:
            ${high.slice(0, 10).map(e =>
              `- **${e.type}** in \`${e.model || 'N/A'}\`\n  ${e.message}\n  📁 \`${e.file}:${e.line || 'N/A'}\``
            ).join('\n\n')}

            ${high.length > 10 ? `\n... and ${high.length - 10} more issues` : ''}

            ### How to Fix:
            1. Run locally: \`python3 scripts/audit/odoo_audit.py .\`
            2. Review \`AUDIT_REPORT.md\` for details
            3. See \`scripts/audit/odoo_audit.py\` docstring for known false positive patterns
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
