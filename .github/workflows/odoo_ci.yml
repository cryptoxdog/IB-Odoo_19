name: Odoo CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Run Odoo tests (Docker)
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}:/mnt/extra-addons" \
            odoo:19 \
            --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons \
            -d odoo \
            --db_host=127.0.0.1 \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            -i plasticos_documents,plasticos_commission,plasticos_logistics,plasticos_transaction \
            --without-demo=all \
            --test-enable \
            --log-level=info \
            --stop-after-init
