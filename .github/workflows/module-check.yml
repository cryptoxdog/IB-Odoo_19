name: Odoo Module Validation

on:
  push:
    branches: [staging, main]
    paths-ignore:
      - 'plasticos_graph_engine/**'
      - 'plasticos_graph_integration/**'
      - 'plasticos_graph_intelligence/**'
      - 'plasticos_graph_3d_embedding/**'
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - 'plasticos_graph_engine/**'
      - 'plasticos_graph_integration/**'
      - 'plasticos_graph_intelligence/**'
      - 'plasticos_graph_3d_embedding/**'

jobs:
  validate-manifests:
    name: Validate Module Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate __manifest__.py files
        run: |
          echo "=== Validating Odoo module manifests ==="
          ERRORS=0

          for manifest in $(find . -name "__manifest__.py" -not -path "./.venv/*" -not -path "./venv/*"); do
            echo "Checking: $manifest"

            # Check if manifest is valid Python
            if ! python3 -c "exec(open('$manifest').read())" 2>/dev/null; then
              echo "  ERROR: Invalid Python syntax in $manifest"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Extract and validate required fields
            if ! python3 scripts/validate_manifest.py "$manifest"; then
              ERRORS=$((ERRORS + 1))
            fi
          done

          echo ""
          echo "=== Summary ==="
          if [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS manifest error(s)"
            exit 1
          else
            echo "All manifests valid"
          fi

  check-dependencies:
    name: Check Module Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run module wiring check
        run: |
          if [ -f scripts/check_module_wiring.py ]; then
            python3 scripts/check_module_wiring.py
          else
            echo "Module wiring check script not found, skipping"
          fi

  validate-xml:
    name: Validate XML Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lxml
        run: pip install lxml

      - name: Validate XML syntax
        run: |
          echo "=== Validating XML files ==="
          ERRORS=0

          for xml in $(find . -name "*.xml" -not -path "./.venv/*" -not -path "./venv/*"); do
            if ! python3 -c "from lxml import etree; etree.parse('$xml')" 2>/dev/null; then
              echo "ERROR: Invalid XML: $xml"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS XML error(s)"
            exit 1
          else
            echo "All XML files valid"
          fi

  check-security-files:
    name: Validate Security Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check ir.model.access.csv format
        run: |
          echo "=== Checking security CSV files ==="
          ERRORS=0

          for csv in $(find . -name "ir.model.access.csv" -not -path "./.venv/*"); do
            echo "Checking: $csv"

            # Check header
            HEADER=$(head -1 "$csv")
            EXPECTED="id,name,model_id:id,group_id:id,perm_read,perm_write,perm_create,perm_unlink"

            if [ "$HEADER" != "$EXPECTED" ]; then
              echo "  WARNING: Non-standard header in $csv"
              echo "  Expected: $EXPECTED"
              echo "  Got: $HEADER"
            fi

            # Check for empty model_id references
            if grep -E ',,' "$csv" | grep -v '^#' > /dev/null; then
              echo "  WARNING: Empty fields detected in $csv"
            fi
          done

          echo "Security file check complete"
