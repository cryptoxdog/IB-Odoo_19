# SonarCloud configuration for Odoo 19 ReBoot
sonar.projectKey=cryptoxdog_IB-Odoo_19
sonar.organization=cryptoxdog
sonar.projectName=IB-Odoo_19

# Source configuration
sonar.sources=.
sonar.tests=tests,tests-odoo
sonar.test.inclusions=**/tests/**/*.py,**/test_*.py

# Exclusions (aligned with pyproject.toml and .pre-commit-config.yaml)
sonar.exclusions=\
  odoo-enterprise/**,\
  addons/**,\
  .venv/**,\
  venv/**,\
  docs/**,\
  scripts/**,\
  tools/**,\
  **/__pycache__/**,\
  **/node_modules/**,\
  .git/**,\
  **/migrations/**,\
  plasticos_graph_engine/**,\
  plasticos_graph_integration/**,\
  plasticos_graph_intelligence/**,\
  plasticos_graph_3d_embedding/**,\
  plasticos_inference_engine/**,\
  plasticos_buyer_match_engine/**,\
  plasticos_matching/**,\
  plasticos_enrichment/**,\
  plasticos_web_leads/**,\
  plasticos_dev_tools/**,\
  Files To Harvest/**

# Python version
sonar.python.version=3.12

# Quality gate
sonar.qualitygate.wait=true

# SCM
sonar.scm.provider=git

# Coverage (uncomment if you generate coverage reports)
# sonar.python.coverage.reportPaths=coverage.xml
