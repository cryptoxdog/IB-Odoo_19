# SonarCloud configuration for Odoo 19 ReBoot
sonar.projectKey=cryptoxdog_IB-Odoo_19
sonar.organization=cryptoxdog
sonar.projectName=IB-Odoo_19

# Source configuration. These scope keys match .sonarcloud.properties.
sonar.sources=.
sonar.tests=tests,tests-odoo
# Test inclusions are also applied as source exclusions. Limit them to the
# declared test roots so first-party test_*.py elsewhere, including
# scripts/audit/test_audit.py, stays in source scope.
sonar.test.inclusions=tests/**,tests/*,tests-odoo/**,tests-odoo/*

# Source exclusions. Active modules stay in analysis, including
# plasticos_matching, plasticos_enrichment, plasticos_web_leads, and
# plasticos_dev_tools. scripts/ and tools/ stay in analysis: they are
# first-party adapters and validators. Vendor, generated, doc, and
# test-data paths stay out. The retired graph, inference, and buyer-match
# roots are not in this tree, so they are not listed.
sonar.exclusions=\
  odoo-enterprise/**,\
  addons/**,\
  .venv/**,\
  venv/**,\
  docs/**,\
  scripts/*.md,\
  scripts/**/*.md,\
  scripts/audit/TOOLKIT PACK,\
  plasticos_dev_tools/tools/test_enhanced_matching_v6.0.py,\
  plasticos_dev_tools/tools/test_kb_integration.py,\
  **/__pycache__/**,\
  **/node_modules/**,\
  .git/**,\
  **/migrations/**,\
  Files To Harvest/**

# Python version
sonar.python.version=3.12

# Quality gate
sonar.qualitygate.wait=true

# SCM
sonar.scm.provider=git

# Coverage stays unset. Set sonar.python.coverage.reportPaths only when
# CI-based analysis is the active mode and coverage.xml exists at scanner
# time. Automatic analysis cannot import coverage, and the two modes must
# not run together. Do not add pytest for Sonar.
# sonar.python.coverage.reportPaths=coverage.xml
