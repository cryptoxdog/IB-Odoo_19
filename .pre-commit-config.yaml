# Pre-commit hooks for Odoo 19 development
# Install: pip install pre-commit && pre-commit install && pre-commit install --hook-type pre-push && pre-commit install --hook-type commit-msg
# Run manually: pre-commit run --all-files
# Pre-push (index export): pre-commit run --hook-stage pre-push

exclude: |
  (?x)^(
    odoo-enterprise/.*|
    plasticos_graph_engine/.*|
    plasticos_graph_integration/.*|
    plasticos_graph_intelligence/.*|
    plasticos_graph_3d_embedding/.*
  )$

repos:
  # Python linting with ruff (fast, replaces flake8/isort/pyupgrade)
  # IMPORTANT: Keep version in sync with CI (.github/workflows/*.yml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^docs/

      - id: ruff-format
        exclude: ^docs/

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-xml
        exclude: ^docs/

      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: '^plasticos_enrichment/knowledge_base/.*\.yaml$|buyer_matching_rag\.yaml$|^docs/'

      - id: end-of-file-fixer
        exclude: ^docs/

      - id: trailing-whitespace
        exclude: ^docs/

      - id: check-added-large-files
        args: ['--maxkb=1000']

      - id: check-merge-conflict

  # Commit message validation (conventional commits: feat:, fix:, docs:, etc.)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert

  # Odoo-specific checks (catches what ruff/mypy can't)
  - repo: local
    hooks:
      - id: odoo-patterns
        name: Odoo 19 pattern check
        entry: ./scripts/check_odoo_patterns.sh
        language: script
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: module-wiring
        name: Module dependency wiring check
        entry: python3 scripts/check_module_wiring.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: cron-invariants
        name: Cron invariant check
        entry: python3 tools/cron_invariant_check.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: circular-deps
        name: Circular dependency check
        entry: python3 ci/check_circular_deps.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: orphan-model-refs
        name: Orphan model reference check
        entry: python3 ci/check_orphan_model_refs.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: package-init
        name: Package __init__.py check
        entry: python3 ci/check_package_init.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: xpath-stability
        name: XPath anchor stability check
        entry: python3 ci/check_xpath_stability.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: odoo19-hooks
        name: Odoo 19 hook pattern check
        entry: python3 ci/check_odoo19_hooks.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: odoo19-xml
        name: Odoo 19 XML pattern check
        entry: python3 ci/check_odoo19_xml.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: field-integrity
        name: Field integrity check
        entry: python3 ci/check_field_integrity.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: model-inheritance
        name: Model inheritance pattern check
        entry: python3 ci/check_model_inheritance.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: orm-integrity
        name: ORM integrity check
        entry: python3 ci/check_orm_integrity.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: constraint-patterns
        name: Constraint pattern check
        entry: python3 ci/check_constraint_patterns.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: disabled-actions
        name: Disabled action reference check
        entry: python3 ci/check_disabled_actions.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: odoo-antipatterns
        name: Odoo anti-pattern check (Python idioms)
        entry: python3 ci/check_odoo_antipatterns.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: automation-field-refs
        name: Automation field reference check
        entry: python3 ci/check_automation_field_refs.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: state-guard-bypass
        name: State guard bypass check
        entry: python3 ci/check_state_guard_bypass.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: acl-completeness
        name: ACL completeness check
        entry: python3 ci/check_acl_completeness.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: phantom-enum-values
        name: Phantom enum value check
        entry: python3 -m pytest tests/test_phantom_enum_values.py -x -q --no-header --tb=short
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: manifest-contract
        name: Manifest contract check (version, depends order)
        entry: python3 -m pytest tests/test_repo_dependency_integrity.py -x -q --no-header --tb=short
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pipeline-v2-guard
        name: pipeline_v2.py import fence
        entry: python3 ci/check_pipeline_v2_guard.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: dev-tools-fence
        name: plasticos_dev_tools production fence
        entry: python3 ci/check_dev_tools_fence.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: critical-manifest
        name: Critical manifest check
        entry: python3 ci/check_critical_manifest.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: enhanced-audit
        name: Enhanced XML ID and dependency audit
        entry: python3 ci/enhanced_audit.py
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

  # Secret detection — uses locally installed gitleaks (brew install gitleaks)
  # bypasses pre-commit managed download due to macOS SSL cert issues
  - repo: local
    hooks:
      - id: gitleaks-commit
        name: gitleaks (staged file scan)
        entry: gitleaks protect --config .gitleaks.toml --redact --staged --exit-code 2
        language: system
        stages: [pre-commit]
        pass_filenames: false

      - id: gitleaks-push
        name: gitleaks (full repo scan on push)
        entry: gitleaks detect --config .gitleaks.toml --redact --exit-code 2
        language: system
        stages: [pre-push]
        pass_filenames: false

  # Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        additional_dependencies: []
        exclude: |
          (?x)^(
            tests-odoo/.*|
            tests/.*|
            addons/.*|
            \.venv/.*|
            venv/.*|
            .*/migrations/.*|
            scripts/.*|
            docs/.*|
            plasticos_dev_tools/.*|
            plasticos_inference_engine/.*|
            plasticos_web_leads/.*|
            plasticos_enrichment/.*|
            plasticos_buyer_match_engine/.*|
            tools/.*
          )$
