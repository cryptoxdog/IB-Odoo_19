# Pre-commit hooks for Odoo 19 development
# Install: pip install pre-commit && pre-commit install && pre-commit install --hook-type pre-push
# Run manually: pre-commit run --all-files
# Pre-push (index export): pre-commit run --hook-stage pre-push

repos:
  # Python linting with ruff (fast, replaces flake8/isort/pyupgrade)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: '^plasticos_enrichment/knowledge_base/.*\.yaml$|buyer_matching_rag\.yaml$'
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  # Odoo-specific checks (catches what ruff/mypy can't)
  - repo: local
    hooks:
      - id: odoo-patterns
        name: Odoo 19 pattern check
        entry: ./scripts/check_odoo_patterns.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: module-wiring
        name: Module dependency wiring check
        entry: python3 scripts/check_module_wiring.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: export-odoo-index
        name: Export Odoo repo index
        entry: python3 scripts/export_odoo_index.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: generate-subsystem-readmes
        name: Generate subsystem READMEs
        entry: python3 scripts/generate_subsystem_readmes.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        additional_dependencies: []
        exclude: |
          (?x)^(
            tests-odoo/.*|
            addons/.*|
            \.venv/.*|
            venv/.*|
            .*/migrations/.*|
            scripts/.*|
            plasticos_dev_tools/.*|
            plasticos_inference_engine/.*|
            plasticos_web_leads/.*|
            plasticos_enrichment/.*|
            plasticos_buyer_match_engine/.*
          )$
