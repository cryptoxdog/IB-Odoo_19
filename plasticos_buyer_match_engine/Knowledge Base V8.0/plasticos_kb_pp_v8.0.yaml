recycling_rules:
- rule_id: PP_MFR_DEGRADATION_CYCLES
  material_type: PP
  rule: PP MFR increases exponentially with recycling cycles - limits reuse
  reasoning: 'Virgin PP: MFI 10 g/10min. After 1 cycle: 11.67 (+17%). After 6 cycles: 75.4 (+654%). After 20 cycles: 300-500.
    High MFR (>150) limits applications to fiber/film only.'
  confidence: 0.92
  mfr_progression:
    virgin:
      value:
      - 10.0
      - 10.0
      typical: 10.0
      unit: g/10min
    cycle_1:
      value:
      - 11.67
      - 11.67
      typical: 11.67
      unit: g/10min
    cycle_6:
      value:
      - 75.4
      - 75.4
      typical: 75.4
      unit: g/10min
    cycle_20:
      value:
      - 300.0
      - 500.0
      typical: 400.0
      unit: g/10min
  application_limits:
    mfr_0_5: raffia, sheet (8-12 cycles)
    mfr_15_30: injection, thin-wall (4-8 cycles)
    mfr_60_150: fiber, film (2-4 cycles)
    mfr_150_plus: limited applications (1-2 cycles)
- rule_id: PP_PE_CONTAMINATION_TOLERANCE
  material_type: PP
  rule: PE contamination tolerance varies dramatically by application
  reasoning: 'Food contact: ≤0.5% PE. Medical: ≤1% PE. Automotive: ≤5% PE. Electronics: ≤3% PE. Industrial: ≤8% PE. Textile:
    ≤15% PE. Higher contamination reduces value 20-50%.'
  confidence: 0.9
  contamination_limits:
