# ============================================================================
# plasticos Knowledge Base Template v8.0
# Schema: plasticos_kb_v8.0
# ============================================================================
# INSTRUCTIONS:
#   - Every top-level section is REQUIRED (even if empty list []).
#   - All keys use snake_case.
#   - All numeric values use {value: [min, max], unit: "..."} pattern.
#   - All IDs are UPPER_SNAKE_CASE and globally unique across all KB files.
#   - Cross-references use the exact ID string from the target section.
#   - Confidence scores are decimals 0.00–1.00.
# ============================================================================


# ── 1. METADATA ─────────────────────────────────────────────────────────────
# Purpose: Polymer identity, version control, data quality, provenance
metadata:
  polymer_family: "Polyolefins"                    # e.g. Polyolefins, Styrenics, Engineering
  polymer_type: "PP"                               # short code: PP, HDPE, LDPE, HIPS, ABS, PET, etc.
  full_name: "Polypropylene"
  resin_id_code: 5                                 # SPI code (1-7)
  cas_number: "9003-07-0"                          # CAS registry (optional for some polymers)
  structure: "Linear backbone with methyl side groups"
  version: "8.0"
  schema_version: "8.0.0"                          # pins to this template spec
  last_updated: "2026-02-22"
  data_quality: "verified"                         # verified | provisional | estimated
  source_tier: "tier1"                             # tier1 (ASTM+mfr) | tier2 (research) | tier3 (inferred)
  data_sources:
    - "ASTM D4101"
    - "Comprehensive PP recycling research"
    - "Automotive/packaging industry standards"
  note: "Highest volume commodity plastic after PE - 80M+ tonnes/year globally"


# ── 2. MATERIAL GRADES ─────────────────────────────────────────────────────
# Purpose: Every virgin + recycled grade with full property specs, applications, PCR limits
material_grades:

  - grade_id: "PP_HOMOPOLYMER_INJECTION"           # UPPER_SNAKE — globally unique
    grade_name: "PP Homopolymer - Injection Molding"
    description: "High crystallinity PP for rigid applications requiring stiffness and heat resistance"
    type: "virgin"                                 # virgin | post_consumer | post_industrial
    polymer_structure: "isotactic homopolymer"

    # --- Melt Flow ---
    melt_flow_rate:
      value: [2, 30]                               # always [min, max]
      typical: 12                                  # optional midpoint
      unit: "g/10min"
      test_conditions: "230°C/2.16kg"
      test_method: "ASTM D1238"
      note: "MFI for PP always 230°C/2.16kg — do not convert"

    # --- Density ---
    density:
      value: [0.900, 0.910]
      unit: "g/cm³"
      test_method: "ASTM D792"

    # --- Mechanical Properties ---
    mechanical_properties:
      tensile_strength:     { value: [30, 38],     unit: "MPa",  test_method: "ASTM D638" }
      flexural_modulus:     { value: [1400, 1800], unit: "MPa",  test_method: "ASTM D790" }
      impact_strength:      { value: [20, 80],     unit: "J/m",  test_method: "ASTM D256" }
      hdt:                  { value: [95, 105],    unit: "°C",   test_method: "ASTM D648" }
      elongation_at_break:  { value: null,         unit: "%",    test_method: "ASTM D638" }  # null = not applicable

    # --- Crystallinity (polymer-specific, optional) ---
    crystallinity:
      crystallinity_pct:    { value: [65, 75],  unit: "%" }
      isotacticity_pct:     { value: [95, 99],  unit: "%" }

    # --- Thermal Properties ---
    thermal_properties:
      melting_point:        { value: [160, 166], unit: "°C" }
      processing_temp:      { value: [190, 260], unit: "°C" }
      mold_temp:            { value: [20, 80],   unit: "°C" }
      degradation_onset:    { value: 280,        unit: "°C" }

    # --- Optical Properties (polymer-specific, optional — e.g. LDPE film) ---
    optical_properties: null   # or: { haze_pct: {value: [2,8], unit: "%"}, gloss_pct: ... }

    # --- Electrical Properties (polymer-specific, optional — e.g. LDPE wire/cable) ---
    electrical_properties: null

    # --- Processing Parameters (grade-specific) ---
    processing_parameters:
      barrel_temp:          { value: [190, 260],  unit: "°C" }
      nozzle_temp:          { value: [200, 260],  unit: "°C" }
      mold_temp:            { value: [20, 80],    unit: "°C" }
      # blow_up_ratio, draw_down_ratio, cycle_time, etc. — add when relevant

    # --- Contamination Profile (for recycled grades only, null for virgin) ---
    contamination_profile: null
    # For recycled grades, use:
    # contamination_profile:
    #   foreign_polymers_pct: { value: [0.1, 0.5], unit: "%" }
    #   dirt_organics_pct:    { value: [0.2, 1.0], unit: "%" }
    #   moisture:             { value: [500, 2000], unit: "ppm" }
    #   odor: "minimal"                         # none | minimal | moderate | strong
    #   quality_variation:
    #     consistency: "moderate"
    #     color_variation: "low"
    #     property_variation_pct: { value: [10, 25], unit: "%" }

    # --- Applications ---
    applications:
      primary:
        - product: "Bottle caps and closures"
          scrap_source: "Packaging manufacturing PIR, post-consumer sorted"
          quality_tier_required: [1, 2]
        - product: "Automotive battery cases"
          scrap_source: "Automotive manufacturing, end-of-life vehicles"
          quality_tier_required: [2, 3]
        - product: "Industrial containers and pallets"
          scrap_source: "Industrial use, manufacturing PIR"
          quality_tier_required: [2, 3]
      secondary:
        - product: "Rigid packaging"
          scrap_source: "Packaging manufacturing, post-consumer"
          quality_tier_required: [2, 3]

    # --- PCR Compatibility ---
    pcr_compatibility:
      max_pcr_pct: 100
      typical_pcr_pct: [25, 75]
      limitations: null                            # or string description
      note: "PP highly recyclable — up to 100% PCR in non-critical applications"

    # --- Recycling Challenges (grade-specific, optional) ---
    recycling_challenges: null
    # For impact copolymer:
    # recycling_challenges:
    #   rubber_degradation: "Rubber phase degrades during thermal cycling"
    #   density_separation: "Low density overlaps with PE — separation difficult"
    #   chemical_recycling_preferred: true

    # --- Certifications (grade-specific, optional) ---
    certifications: null
    # For medical grade:
    # certifications:
    #   - "USP Class VI"
    #   - "ISO 10993 biocompatibility"
    #   - "FDA 21 CFR 177.1520"

    # --- Regulatory Requirements (grade-specific, optional) ---
    regulatory_requirements: null
    # For wire/cable:
    # regulatory_requirements:
    #   - "UL 44 thermoset-insulated wires and cables"
    #   - "UL 1581 electrical wires and cables"
    #   - "NEC National Electrical Code"

    # --- Market Data (grade-level, optional) ---
    market_data:
      availability: "abundant"                     # abundant | moderate | limited | scarce
      demand: "high"                               # high | moderate | low
      typical_discount_vs_virgin_pct: null         # for recycled grades: [30, 50]
      processing_cost:                             # optional
        value: null
        unit: "USD/ton"


# ── 3. PRODUCT-SCRAP MAPPING ───────────────────────────────────────────────
# Purpose: Product → scrap grade → contamination → buyer routing → reverse reasoning
product_scrap_mapping:

  # Group by industry sector
  automotive:
    - product: "Automotive bumpers and fascia"
      scrap_grade_ref: "PP_IMPACT_COPOLYMER"       # references grade_id
      scrap_quality_tier: [2, 3]
      typical_contamination:
        total_pct: { value: [2.0, 5.0], unit: "%" }
        contaminants:
          - name: "paint/coating"
            pct: { value: [1, 3], unit: "%" }
          - name: "TPO/TPE"
            pct: { value: 2, unit: "%" }
          - name: "adhesives"
            pct: { value: 0.5, unit: "%" }
      suitable_buyer_refs:                         # references buyer_id from buyers.yaml
        - "PP_AUTOMOTIVE_TIER2"
        - "PP_INDUSTRIAL_CONTAINERS"
      reverse_reasoning: "IF buyer needs automotive bumpers THEN source automotive PP ICP tier 2-3"
      note: null

    - product: "Automotive interior trim and panels"
