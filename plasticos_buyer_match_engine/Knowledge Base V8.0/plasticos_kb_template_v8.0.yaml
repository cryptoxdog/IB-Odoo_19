# ── 4. SOURCE QUALITY TIERS ────────────────────────────────────────────────
# Purpose: Tier 1–4 definitions with explicit numeric thresholds per contaminant type
source_quality_tiers:

  tier1_premium:
    definition: "Manufacturing PIR, single-source, minimal contamination, known grade"
    contamination_max:          { value: 0.5,  unit: "%" }
    cross_polymer_max:          { value: 0.5,  unit: "%" }     # PE in PP, PP in HDPE, etc.
    moisture_max:               { value: 0.1,  unit: "%" }     # or ppm with unit: "ppm"
    ash_max:                    { value: 1.0,  unit: "%" }
    dirt_max:                   { value: 0.1,  unit: "%" }
    pvc_contamination_max:      { value: null, unit: "ppm" }   # polymer-specific; null if N/A
    pet_contamination_max:      { value: null, unit: "ppm" }
    metal_contamination_max:    { value: null, unit: "ppm" }
    property_retention_min_pct: 95
    sorting_purity_min_pct:     99
    processing_history:         "Single cycle or virgin manufacturing scrap"
    mfr_increase_max_pct:       20                              # MFI/MI increase vs virgin
    examples:
      - "Injection molding PIR (runners, sprues)"
      - "Medical device manufacturing PIR"
      - "Automotive component manufacturing scrap"
      - "Packaging manufacturing PIR (caps, containers)"
    suitable_applications:
      - "Medical devices"
      - "Food contact (indirect)"
      - "Automotive visible components"
      - "Premium packaging"
    value_premium_pct: [25, 40]                                 # vs market baseline

  tier2_standard:
    definition: "Post-industrial or sorted post-consumer, moderate contamination"
    contamination_max:          { value: 3.0,  unit: "%" }
    cross_polymer_max:          { value: 3.0,  unit: "%" }
    moisture_max:               { value: 0.2,  unit: "%" }
    ash_max:                    { value: 2.0,  unit: "%" }
    dirt_max:                   { value: 0.5,  unit: "%" }
    pvc_contamination_max:      { value: null, unit: "ppm" }
    pet_contamination_max:      { value: null, unit: "ppm" }
    metal_contamination_max:    { value: null, unit: "ppm" }
    property_retention_min_pct: 80
    sorting_purity_min_pct:     85
    processing_history:         "1–3 recycling cycles"
    mfr_increase_max_pct:       50
    examples:
      - "Sorted post-consumer packaging (washed)"
      - "Automotive components (sorted)"
      - "Industrial containers (used)"
      - "Post-consumer bottle caps (sorted)"
    suitable_applications:
      - "Automotive interior (non-visible)"
      - "Packaging (non-food)"
      - "Industrial containers"
      - "Consumer goods"
    value_premium_pct: [0, 0]

  tier3_utility:
    definition: "Mixed post-consumer, higher contamination, multiple cycles"
    contamination_max:          { value: 8.0,  unit: "%" }
    cross_polymer_max:          { value: 8.0,  unit: "%" }
    moisture_max:               { value: 0.5,  unit: "%" }
    ash_max:                    { value: 3.0,  unit: "%" }
    dirt_max:                   { value: 0.8,  unit: "%" }
    pvc_contamination_max:      { value: null, unit: "ppm" }
    pet_contamination_max:      { value: null, unit: "ppm" }
    metal_contamination_max:    { value: null, unit: "ppm" }
    property_retention_min_pct: 60
    sorting_purity_min_pct:     70
    processing_history:         "3–6 recycling cycles or unknown"
    mfr_increase_max_pct:       100
    examples:
      - "Mixed post-consumer PP (unsorted)"
      - "Contaminated packaging waste"
      - "General waste stream PP"
      - "Woven bags (used, contaminated)"
    suitable_applications:
      - "Industrial applications (non-critical)"
      - "Construction materials"
      - "Low-value consumer goods"
      - "Downcycled products"
    value_discount_pct: [45, 60]

  tier4_marginal:
    definition: "Heavily contaminated, degraded, multiple unknown cycles"
    contamination_min:          { value: 8.0,  unit: "%" }
    property_retention_max_pct: 60
    processing_history:         "6+ cycles or severely degraded"
    mfr_min:                    { value: 150,  unit: "g/10min" }  # polymer-specific threshold
    examples:
      - "Heavily contaminated textile waste"
      - "Degraded carpet backing"
      - "Mixed polymer waste streams"
    suitable_applications:
      - "Chemical recycling feedstock"
      - "Pyrolysis feedstock"
      - "Very limited mechanical recycling"
    value_discount_pct: [70, 85]


# ── 5. RECYCLING RULES ─────────────────────────────────────────────────────
# Purpose: Multi-cycle degradation, contamination tolerance, processing constraints
recycling_rules:

  - rule_id: "PP_MFR_DEGRADATION_CYCLES"
    material_type: "PP"
    rule: "PP MFR increases exponentially with recycling cycles — limits reuse"
    reasoning: >
      Virgin PP MFI 10 g/10min. After 1 cycle: 11.67–17.
      After 6 cycles: 75.4–654. After 20 cycles: 300–500.
      High MFR (>150) limits applications to fiber/film only.
    confidence: 0.92
    source: "Comprehensive PP recycling research"
    data:
      mfr_progression:
        virgin:   { value: 10,         unit: "g/10min" }
        cycle_1:  { value: [11.67, 17], unit: "g/10min" }
        cycle_6:  { value: [75.4, 654], unit: "g/10min" }
        cycle_20: { value: [300, 500],  unit: "g/10min" }
      application_limits:
        - mfr_range: [0, 5]
          applications: ["raffia", "sheet"]
          max_cycles: [8, 12]
        - mfr_range: [15, 30]
          applications: ["injection", "thin-wall"]
          max_cycles: [4, 8]
        - mfr_range: [60, 150]
          applications: ["fiber", "film"]
          max_cycles: [2, 4]
        - mfr_range: [150, 9999]
          applications: ["limited applications"]
          max_cycles: [1, 2]

  - rule_id: "PP_PE_CONTAMINATION_TOLERANCE"
    material_type: "PP"
    rule: "PE contamination tolerance varies dramatically by application"
    reasoning: >
      Food contact: <0.5% PE. Medical: <1% PE. Automotive: <5% PE.
      Electronics: <3% PE. Industrial: <8% PE. Textile: <15% PE.
      Higher contamination reduces value 20–50%.
    confidence: 0.90
    source: "ASTM D4101, recycling research"
    data:
      contamination_limits_by_application:
        - application: "food_contact"
          max_pct: { value: 0.5, unit: "%" }
        - application: "medical"
          max_pct: { value: 1.0, unit: "%" }
        - application: "automotive"
          max_pct: { value: 5.0, unit: "%" }
        - application: "electronics"
          max_pct: { value: 3.0, unit: "%" }
        - application: "industrial"
          max_pct: { value: 8.0, unit: "%" }
        - application: "textile"
          max_pct: { value: 15.0, unit: "%" }

  - rule_id: "PP_INJECTION_PIR_PREMIUM"
    material_type: "PP"
    rule: "Injection molding PIR is highest quality PP scrap — Tier 1"
    reasoning: >
      Injection PIR (runners, sprues): clean, single grade, known MFI,
      minimal contamination (<0.5%), 95%+ property retention.
      Premium value 25–40% above market.
    confidence: 0.95
    source: "Industry best practices"
    data:
      pir_characteristics:
        contamination_pct:       { value: [0.1, 0.5], unit: "%" }
        quality_tier:            1
        property_retention_pct:  { value: [95, 100],  unit: "%" }
        value_premium_pct:       { value: [25, 40],   unit: "%" }

  - rule_id: "PP_FOOD_CONTACT_RESTRICTION"
    material_type: "PP"
    rule: "Post-consumer food contact PP cannot be reused for direct food contact"
    reasoning: >
      FDA regulations restrict PCR from food contact applications.
      Route to indirect food contact (0–10% PCR) or non-food (25–100% PCR).
    confidence: 0.98
    source: "FDA 21 CFR 177.1520"
    data:
      pcr_limits:
        direct_food_contact_pct:   0
        indirect_food_contact_pct: { value: [0, 10],   unit: "%" }
        non_food_pct:              { value: [25, 100],  unit: "%" }

  - rule_id: "PP_HOMOPOLYMER_VS_COPOLYMER_SEPARATION"
    material_type: "PP"
    rule: "PP homopolymer and copolymer require separation for optimal recycling"
    reasoning: >
      Homopolymer density 0.900–0.910, Tm 160–166°C vs
      Copolymer density 0.895–0.905, Tm 145–158°C.
      Mixed grades reduce property consistency.
      Density separation achieves 90–95% purity.
    confidence: 0.85
    source: "Recycling technology research"
    data:
      separation_efficiency_pct: { value: [90, 95], unit: "%" }

  - rule_id: "PP_STABILIZER_REQUIREMENT"
    material_type: "PP"
    rule: "Antioxidant stabilizers critical for multi-cycle PP recycling"
    reasoning: >
      Stabilizer addition maintains MW through multiple cycles, prevents chain scission.
      Without stabilizers: 60–70% MW reduction after 6 cycles.
      With stabilizers: 20–30% MW reduction.
    confidence: 0.88
    source: "Polymer degradation research"
    data:
      mw_reduction_without_stabilizer_pct: { value: [60, 70], unit: "%" }
      mw_reduction_with_stabilizer_pct:    { value: [20, 30], unit: "%" }


