# ── 10. STANDARDS ───────────────────────────────────────────────────────────
# Purpose: Referenced ASTM, ISO, FDA, UL standards with scope, relevance, test params
standards:

  - standard_id: "ASTM_D4101"
    title: "Classification System for Polypropylene Materials"
    scope: "Defines PP types, grades, and property requirements"
    relevance: "Primary classification standard for PP materials"
    key_parameters: []                               # optional: from HIPS format
    test_conditions: null
    note: null

  - standard_id: "ASTM_D1238"
    title: "Melt Flow Rates of Thermoplastics"
    scope: "Standard test method for MFR/MI by extrusion plastometer"
    relevance: "Critical for PP processability and quality assessment"
    key_parameters:
      - "Test conditions: 230°C/2.16kg for PP"
      - "Precision requirements"
      - "Sample preparation"
    test_conditions: "230°C/2.16kg for PP; 190°C/2.16kg for PE; 200°C/5kg for HIPS"
    note: "PP MFI always 230°C/2.16kg — do not convert"

  - standard_id: "ASTM_D792"
    title: "Density and Specific Gravity of Plastics by Displacement"
    scope: "Defines methods for measuring density"
    relevance: "Density classification and quality control"
    key_parameters:
      - "Displacement method (water)"
      - "Temperature control (23°C)"
    test_conditions: null
    note: null

  - standard_id: "ASTM_D638"
