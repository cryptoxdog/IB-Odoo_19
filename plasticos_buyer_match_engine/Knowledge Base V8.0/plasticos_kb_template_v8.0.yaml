# ── 8. QUALITY INDICATORS ──────────────────────────────────────────────────
# Purpose: Test methods, threshold bands (excellent→poor), significance, price impact
quality_indicators:

  - indicator_id: "PP_MFI_CONSISTENCY"
    indicator_name: "MFI Consistency"
    test_method: "ASTM D1238 (230°C/2.16kg)"
    material_types: ["PP"]
    thresholds:
      low:       { value: [0.5, 5],    unit: "g/10min" }
      medium:    { value: [15, 30],    unit: "g/10min" }
      high:      { value: [60, 150],   unit: "g/10min" }
      very_high: { value: [150, 500],  unit: "g/10min" }
    significance: "Critical for application matching and recycling cycle assessment"
    impact_on_price_pct: null                         # or numeric, as in LDPE
    impact_on_quality_points: null                    # or numeric
    verification_method: null
    note: "PP MFI always 230°C/2.16kg — do not convert to 190°C"

  - indicator_id: "PP_PE_CONTAMINATION"
    indicator_name: "PE Contamination"
    test_method: "FTIR or DSC"
    material_types: ["PP"]
    thresholds:
      excellent: { value: [0, 0.5],    unit: "%" }
      good:      { value: [0.5, 3.0],  unit: "%" }
      acceptable:{ value: [3.0, 8.0],  unit: "%" }
      poor:      { value: [8.0, 100],  unit: "%" }
    significance: "Determines application suitability and quality tier"
    impact_on_price_pct: null
    impact_on_quality_points: null
    verification_method: "Density separation, FTIR spectroscopy"
    note: null

  - indicator_id: "PP_COLOR_CONSISTENCY"
    indicator_name: "Color Consistency"
    test_method: "Visual inspection"
    material_types: ["PP"]
    thresholds:
      excellent: "Natural/clear, consistent color"
      good:      "Single consistent color"
      acceptable:"Mixed colors or moderate discoloration"
      poor:      "Heavily mixed or degraded color"
    significance: "Indicates thermal degradation and source quality"
    impact_on_price_pct: null
    impact_on_quality_points: null
    verification_method: "Visual inspection, color measurement"
    note: null

  - indicator_id: "PP_ASH_CONTENT"
    indicator_name: "Ash Content"
    test_method: "ASTM D2584"
    material_types: ["PP"]
    thresholds:
      excellent: { value: [0, 1.0],    unit: "%" }
      good:      { value: [1.0, 2.0],  unit: "%" }
      acceptable:{ value: [2.0, 3.0],  unit: "%" }
      poor:      { value: [3.0, 100],  unit: "%" }
    significance: "Indicates filler content and contamination level"
    impact_on_price_pct: null
    impact_on_quality_points: null
    verification_method: "ASTM D2584 muffle furnace"
    note: null

