    scope: "Tensile strength, modulus, and elongation"
    relevance: "Mechanical property characterization"
    key_parameters:
      - "Standard specimen geometry (Type I, IV, V)"
      - "Test speed 50 mm/min typical"
    test_conditions: null
    note: null

  - standard_id: "ASTM_D256"
    title: "Impact Resistance of Plastics (Izod)"
    scope: "Izod impact testing"
    relevance: "Critical for impact-modified polymers (HIPS, PP ICP)"
    key_parameters: []
    test_conditions: null
    note: null

  - standard_id: "ASTM_D2584"
    title: "Ash Content of Plastics"
    scope: "Determines inorganic residue (fillers, contaminants)"
    relevance: "Contamination and filler content verification"
    key_parameters: []
    test_conditions: null
    note: null

  - standard_id: "USP_CLASS_VI"
