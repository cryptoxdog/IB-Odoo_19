# ── 11. PROCESSING GUIDANCE ────────────────────────────────────────────────
# Purpose: Drying, temperature control, PCR/virgin mixing, contamination removal, stabilization
processing_guidance:

  drying:
    required: false                                  # true for HIPS, PET; false for PP, PE
    temperature:      { value: null, unit: "°C" }    # e.g. [70, 80] for HIPS
    duration:         { value: null, unit: "hours" }  # e.g. [2, 4]
    moisture_target:  { value: null, unit: "ppm" }    # e.g. 500
    note: "PP not hygroscopic — drying optional unless moisture contamination present"

  temperature_control:
    critical: true
    processing_temp:    { value: [190, 260], unit: "°C" }
    optimal_range:      { value: [220, 240], unit: "°C" }
    degradation_onset:  { value: 280,        unit: "°C" }
    warning: null                                     # e.g. "Yellowing indicates thermal degradation"

  mixing_pcr_virgin:
    recommended_method: "Dry blend or masterbatch"
    homogenization: null                              # "Critical for property consistency" (HIPS)
    max_pcr_pct_by_application:
      medical_devices:        15
      food_contact_indirect:  10
      automotive_interior:    50
      packaging_nonfood:      100
      industrial_containers:  100
      # Add polymer-specific: electronics_premium, pressure_pipe, wire_cable, etc.

  contamination_removal:
    washing: "Required for post-consumer sources"
    sorting: "Critical — separate PP homopolymer from copolymer, separate from PE"
    density_separation: "Effective for PP/PE separation (0.900–0.910 vs 0.910–0.940)"
    metal_detection: null                             # "Required for electronics applications"
    # LDPE-specific:
    # hot_wash_temp: { value: [60, 80], unit: "°C" }
    # screening: "Required for particulate removal"
    # air_classification: null

  stabilization:
    antioxidants: "Highly recommended for multi-cycle recycling"
    benefit: "Reduces MW degradation from 60–70% to 20–30% after 6 cycles"
    compatibilizer: null                              # HDPE: "MAPE 2-5% for PP contamination >3%"

  # HIPS-specific:
  rubber_phase_preservation: null
  # rubber_phase_preservation:
  #   avoid_excessive_shear: "High shear can damage rubber phase morphology"
  #   avoid_multiple_reprocessing: "Each cycle degrades rubber phase"
  #   monitor_impact_strength: "Primary indicator of rubber phase integrity"


