inference_rules:
- rule_id: PA_PRODUCT_TO_BUYER_FORWARD
  inference_type: buyer_matching
  logic: IF product=engine_components THEN grade=pa66_gf30 AND quality_tier=[1,2] AND match_buyers=[automotive_tier1]
  reasoning: Forward reasoning from product to suitable buyers based on grade and quality tier
  confidence: 0.9
- rule_id: PA_BUYER_TO_SOURCE_BACKWARD
  inference_type: source_matching
  logic: IF buyer=automotive_tier1 THEN require_grade=pa66_gf30 AND require_tier=[1,2] AND require_moisture<0.08
  reasoning: Backward reasoning from buyer requirements to acceptable sources
  confidence: 0.98
- rule_id: PA_INJECTION_PIR_PREMIUM_MATCHING
  inference_type: buyer_matching
  logic: IF source=injection_pir AND contamination<0.5% THEN tier=1 AND match_all_buyers
  reasoning: Injection PIR is premium quality - suitable for all PA applications
  confidence: 0.95
- rule_id: PA_MOISTURE_REJECTION
  inference_type: quality_control
  logic: IF moisture>0.10% THEN require_drying OR reject
  reasoning: Moisture >0.10% causes hydrolytic degradation - drying required
  confidence: 0.95
- rule_id: PA_TEXTILE_CHEMICAL_ROUTING
  inference_type: buyer_matching
  logic: IF source=textile_waste THEN route_to_chemical_recycling
  reasoning: Textile PA heavily contaminated - mechanical recycling not viable
  confidence: 0.9
- rule_id: PA_GF_CONTENT_MATCHING
  inference_type: buyer_matching
  logic: IF gf_content>=30% THEN automotive_structural OR industrial_housings; IF gf_content<10% THEN gears_bearings OR consumer_appliances
  reasoning: GF content determines application suitability
  confidence: 0.88
- rule_id: PA6_PA66_SEPARATION_ROUTING
  inference_type: processing_requirement
  logic: IF mixed_pa6_pa66 THEN separation_recommended FOR optimal_properties
  reasoning: PA6 and PA66 have different processing requirements - separation improves quality
  confidence: 0.85
