  rule: PA is hygroscopic - moisture >0.10% causes hydrolysis and degradation
  reasoning: PA absorbs moisture from air. Moisture >0.10% causes hydrolytic degradation during processing, reducing molecular
    weight and properties. Drying required before processing.
  confidence: 0.95
  moisture_max_pct: 0.1
  drying_required: true
  drying_temp_c:
  - 80
  - 100
  drying_time_hours:
  - 4
  - 8
- rule_id: PA_REGRIND_RETENTION_CYCLES
  material_type: PA
  rule: PA6 retains ~70% tensile strength after 3 cycles, PA66 ~75%
  reasoning: 'After 3 cycles: PA6 tensile -22%, PA66 tensile -25%. Property retention 70-75%. Blend with virgin or use stabilizers.'
  confidence: 0.88
  property_retention_pct:
  - 70
  - 75
  cycles: 3
- rule_id: PA_GLASS_FIBER_CONSISTENCY
  material_type: PA
  rule: Glass fiber content must be consistent for property retention
  reasoning: GF content variation >5% causes significant property inconsistency. Separate GF10, GF15, GF20, GF30 grades for
    optimal recycling.
  confidence: 0.92
  gf_variation_max_pct: 5.0
- rule_id: PA_TEXTILE_CHEMICAL_RECYCLING
  material_type: PA
  rule: Textile PA waste requires chemical recycling (caprolactam recovery)
  reasoning: Textile PA contaminated with dyes, organic matter, mixed fibers. Mechanical recycling not viable. Chemical recycling
    via hydrolysis achieves 75-95% caprolactam yield.
  confidence: 0.9
  chemical_recycling_preferred: true
  caprolactam_yield_pct:
  - 75
  - 95
- rule_id: PA_INJECTION_PIR_PREMIUM
  material_type: PA
  rule: Injection molding PIR is highest quality PA scrap - Tier 1
  reasoning: 'Injection PIR (runners, sprues): clean, single grade, known filler %, minimal contamination (<0.5%), 95%+ property
    retention. Premium value 25-40% above market.'
  confidence: 0.95
  pir_characteristics:
    contamination_pct:
    - 0.1
    - 0.5
    quality_tier: 1
    property_retention_pct:
    - 95
    - 100
    value_premium_pct:
    - 25
    - 40
- rule_id: PA6_PA66_SEPARATION
  material_type: PA
  rule: PA6 and PA66 should be separated for optimal recycling
  reasoning: PA6 (Tm 215-225°C) and PA66 (Tm 255-265°C) have different processing requirements. Mixed grades reduce property
    consistency. Separate for best results.
  confidence: 0.85
  separation_recommended: true
