quality_indicators:
- indicator_id: PA_MOISTURE_CONTENT
  test_method: Karl Fischer (ISO 15512)
  material_types:
  - PA
  thresholds:
    excellent:
      moisture:
        value:
        - 0.0
        - 0.05
        typical: 0.025
        unit: '%'
    good:
      moisture:
        value:
        - 0.05
        - 0.08
        typical: 0.065
        unit: '%'
    acceptable:
      moisture:
        value:
        - 0.08
        - 0.1
        typical: 0.09
        unit: '%'
    poor:
      moisture:
        value:
        - 0.1
        - 100.0
        typical: 50.05
        unit: '%'
  significance: Critical - moisture causes hydrolytic degradation
  action: dry_if_above_0.10
