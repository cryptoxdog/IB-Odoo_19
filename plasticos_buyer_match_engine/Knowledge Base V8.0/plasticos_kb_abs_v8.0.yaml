    quality_tier:
    - 2
    - 3
- rule_id: ABS_ELECTROPLATING_CHALLENGE
  material_type: ABS
  rule: Electroplated ABS requires de-plating before recycling
  reasoning: Chrome/nickel plating on ABS (plumbing fixtures, automotive trim) must be removed before recycling. De-plating
    adds cost but enables Tier 2-3 quality. Unplated scrap is Tier 4.
  confidence: 0.92
  processing_requirements:
    de_plating_required: true
    de_plating_methods:
    - chemical stripping
    - mechanical removal
    cost_impact: moderate - adds $200-400/ton
- rule_id: ABS_MULTI_CYCLE_LIMITS
  rule: ABS recycling cycle limits vary by application tier
  reasoning: 'Toys/premium: 1-2 cycles max (Tier 1). Electronics/automotive: 3-4 cycles acceptable (Tier 2). Industrial: 5-6
    cycles OK (Tier 3).'
  confidence: 0.85
  cycle_limits:
    toys_premium_max_cycles: 2
    electronics_automotive_max_cycles: 4
    industrial_max_cycles: 6
- rule_id: ABS_PC_BLEND_SEPARATION
  material_type: PC/ABS blend
  rule: PC/ABS blends require separation or dedicated recycling stream
  reasoning: 'PC/ABS blends common in automotive and electronics. Separation difficult and costly. Best practice: dedicated
    PC/ABS recycling stream or accept as contaminated ABS (Tier 3).'
  confidence: 0.87
  processing_options:
    dedicated_stream: preferred - maintains blend properties
    separation: costly - chemical or selective dissolution
    contaminated_abs: acceptable for Tier 3 applications
