recycling_rules:
- rule_id: ABS_PIR_VS_PCR_QUALITY
  rule: ABS PIR significantly higher quality than PCR due to thermal history
  reasoning: 'PIR ABS: single cycle, known grade, minimal contamination, 90%+ property retention. PCR ABS: multiple cycles,
    mixed grades, contamination, 60-80% property retention. Impact strength particularly sensitive to recycling.'
  confidence: 0.88
  pir_characteristics:
    property_retention:
      value:
      - 90.0
      - 100.0
      typical: 95.0
      unit: '%'
    contamination:
      value:
      - 0.1
      - 0.5
      typical: 0.3
      unit: '%'
    quality_tier: 1
  pcr_characteristics:
    property_retention:
      value:
      - 60.0
      - 80.0
      typical: 70.0
      unit: '%'
    contamination:
      value:
      - 1.0
      - 5.0
      typical: 3.0
      unit: '%'
    quality_tier:
    - 2
    - 3
- rule_id: ABS_IMPACT_DEGRADATION
  material_type: ABS
  rule: ABS impact strength degrades with recycling cycles - butadiene oxidation
  reasoning: Butadiene rubber phase oxidizes during thermal cycling, reducing impact strength 10-20% per cycle. Tensile strength
    more stable. Impact-critical applications require Tier 1-2 only.
  confidence: 0.9
  degradation_rates:
    impact_strength_loss_per_cycle:
      value:
      - 10.0
      - 20.0
      typical: 15.0
      unit: '%'
    tensile_strength_loss_per_cycle:
      value:
      - 3.0
      - 8.0
      typical: 5.5
      unit: '%'
- rule_id: ABS_WEEE_SOURCE_QUALITY
  material_type: ABS
  source_type: WEEE electronics
  rule: WEEE ABS sources vary widely - sorting by grade critical
  reasoning: 'WEEE contains GP ABS, FR ABS, PC/ABS blends. Sorting purity 70-85%. Contamination: metals, adhesives, other
    plastics. Grade identification critical for buyer matching.'
  confidence: 0.85
  weee_characteristics:
    sorting_purity:
