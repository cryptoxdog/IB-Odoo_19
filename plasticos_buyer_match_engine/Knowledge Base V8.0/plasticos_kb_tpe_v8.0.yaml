recycling_rules:
- rule_id: TPE_TYPE_SEPARATION
  material_type: TPE
  rule: Different TPE types (TPE-S, TPE-V, TPE-O, TPE-U) should be separated
  reasoning: Different TPE types have different base polymers and processing requirements. Mixed types reduce property consistency.
  confidence: 0.85
  separation_recommended: true
- rule_id: TPE_INJECTION_PIR_PREMIUM
  material_type: TPE
  rule: Injection molding PIR is highest quality TPE scrap - Tier 1
  reasoning: 'Injection PIR: clean, single type, minimal contamination (<0.5%), 95%+ property retention. Premium value 25-40%
    above market.'
  confidence: 0.95
  pir_characteristics:
    contamination_pct:
    - 0.1
    - 0.5
    quality_tier: 1
    property_retention_pct:
    - 95
    - 100
    value_premium_pct:
    - 25
    - 40
- rule_id: TPE_MEDICAL_PIR_ONLY
  material_type: TPE
  rule: Medical TPE requires PIR only - post-consumer medical waste not recyclable
  reasoning: Medical regulations prohibit post-consumer medical waste recycling. Only manufacturing PIR acceptable.
  confidence: 0.98
  restriction: medical_pir_only
- rule_id: TPE_FOOTWEAR_LOW_VALUE
  material_type: TPE
  rule: Footwear TPE waste is Tier 3-4 due to high contamination
  reasoning: Footwear waste heavily contaminated with dirt (3-10%), adhesives (1-3%), limited applications.
  confidence: 0.88
  quality_tier:
  - 3
  - 4
- rule_id: TPE_HARDNESS_MATCHING
  material_type: TPE
  rule: TPE hardness (Shore A) should match application requirements
  reasoning: TPE hardness ranges from 20-95 Shore A. Soft (20-40) for grips, medium (40-70) for seals, hard (70-95) for structural.
  confidence: 0.9
- rule_id: TPE_WEATHER_RESISTANCE
  material_type: TPE
  rule: TPE-V preferred for outdoor/weather-exposed applications
  reasoning: TPE-V (vulcanizate) has excellent weather resistance and UV stability. TPE-S degrades in outdoor applications.
  confidence: 0.92
