inference_rules:
- rule_id: TPE_PRODUCT_TO_BUYER_FORWARD
  inference_type: buyer_matching
  logic: IF product=automotive_seals THEN grade=tpe_v AND quality_tier=[2,3] AND match_buyers=[automotive_tier2, industrial_seals]
  reasoning: Forward reasoning from product to suitable buyers
  confidence: 0.9
- rule_id: TPE_BUYER_TO_SOURCE_BACKWARD
  inference_type: source_matching
  logic: IF buyer=medical_device_manufacturers THEN require_grade=tpe_u_medical AND require_tier=1 AND require_source=medical_pir_only
  reasoning: Backward reasoning from buyer requirements to acceptable sources
  confidence: 0.98
- rule_id: TPE_INJECTION_PIR_PREMIUM_MATCHING
  inference_type: buyer_matching
  logic: IF source=injection_pir AND contamination<0.5% THEN tier=1 AND match_all_buyers
  reasoning: Injection PIR is premium quality
  confidence: 0.95
- rule_id: TPE_HARDNESS_APPLICATION_MATCHING
  inference_type: application_matching
  logic: IF hardness=20-40 THEN grips_soft_touch; IF hardness=40-70 THEN seals_gaskets; IF hardness=70-95 THEN structural
  reasoning: Hardness determines application suitability
  confidence: 0.9
- rule_id: TPE_TYPE_SEPARATION_ROUTING
  inference_type: processing_requirement
  logic: IF mixed_tpe_types THEN separation_recommended FOR optimal_properties
  reasoning: Different TPE types have different processing requirements
  confidence: 0.85
