recycling_rules:
- rule_id: HDPE_REGRIND_RETENTION_CYCLES
  material_type: HDPE
  rule: HDPE retains ~65% properties after 3 regrind cycles
  reasoning: 'After 3 cycles: tensile -35%, impact -40%, MI -40%. Property retention 65%. Blend with virgin or use compatibilizer
    to restore performance.'
  confidence: 0.92
  property_retention_pct: 65
  cycles: 3
- rule_id: HDPE_PP_CONTAMINATION_TOLERANCE
  material_type: HDPE
  rule: PP contamination ≤5% acceptable with compatibilizer (MAPE)
  reasoning: PP contamination ≤5 wt% causes negligible property loss when compatibilizer (MAPE) present. Beyond 5%, stiffness
    and HDT decline.
  confidence: 0.91
  pp_contamination_max_pct: 5.0
  compatibilizer_required: true
- rule_id: HDPE_PVC_ZERO_TOLERANCE
  material_type: HDPE
  rule: PVC contamination >0.1% causes HCl evolution and corrosion
  reasoning: PVC contamination >0.1 wt% causes HCl evolution above 200°C, leading to equipment corrosion and toxic off-gassing.
    Zero tolerance for safety.
  confidence: 0.98
  pvc_contamination_max_ppm: 1000
  safety_critical: true
  action: reject_or_reroute_to_washing
- rule_id: HDPE_MOISTURE_CONTROL
  material_type: HDPE
  rule: Moisture >500 ppm causes bubbles and surface defects
  reasoning: HDPE not hygroscopic but moisture contamination >500 ppm causes processing defects. Drying recommended for quality
    applications.
  confidence: 0.88
  moisture_max_ppm: 500
  drying_recommended: true
- rule_id: HDPE_INJECTION_PIR_PREMIUM
  material_type: HDPE
  rule: Injection molding PIR is highest quality HDPE scrap - Tier 1
  reasoning: 'Injection PIR (runners, sprues): clean, single grade, known MI, minimal contamination (<0.5%), 95%+ property
    retention. Premium value 25-40% above market.'
  confidence: 0.95
  pir_characteristics:
    contamination:
      value:
      - 0.1
      - 0.5
      typical: 0.3
      unit: '%'
    quality_tier: 1
    property_retention:
      value:
      - 95.0
      - 100.0
      typical: 97.5
      unit: '%'
    value_premium:
      value:
      - 25.0
      - 40.0
      typical: 32.5
      unit: '%'
- rule_id: HDPE_FOOD_CONTACT_RESTRICTION
  material_type: HDPE
  rule: Post-consumer food contact HDPE cannot be reused for direct food contact
  reasoning: FDA regulations restrict PCR from food contact applications. Route to indirect food contact (10-15% PCR) or non-food
    applications (20-100% PCR).
  confidence: 0.98
  restriction: food_contact_pcr → non_food_or_indirect_only
  pcr_limits:
    direct_food_contact:
      value:
      - 0.0
      - 0.0
