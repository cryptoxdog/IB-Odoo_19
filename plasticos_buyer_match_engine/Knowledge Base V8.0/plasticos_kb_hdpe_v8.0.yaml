quality_indicators:
- indicator_id: HDPE_MI_CONSISTENCY
  test_method: ASTM D1238 (190°C/2.16kg)
  material_types:
  - HDPE
  thresholds:
    ultra_low_mi:
      value:
      - 0.01
      - 0.1
      typical: 0.055
      unit: ''
    low_mi:
      value:
      - 0.1
      - 2.0
      typical: 1.05
      unit: ''
    medium_mi:
      value:
      - 8.0
      - 34.0
      typical: 21.0
      unit: ''
    high_mi:
      value:
      - 34.0
      - 100.0
      typical: 67.0
      unit: ''
  significance: Critical for application matching and processing
- indicator_id: HDPE_PP_CONTAMINATION
  test_method: FTIR or DSC
  material_types:
  - HDPE
  thresholds:
    excellent:
      pp_contamination:
        value:
        - 0.0
        - 0.5
        typical: 0.25
        unit: '%'
    good:
      pp_contamination:
        value:
        - 0.5
        - 3.0
        typical: 1.75
        unit: '%'
    acceptable:
      pp_contamination:
        value:
        - 3.0
        - 5.0
        typical: 4.0
        unit: '%'
    poor:
      pp_contamination:
        value:
        - 5.0
        - 100.0
        typical: 52.5
        unit: '%'
  significance: Determines application suitability and quality tier
- indicator_id: HDPE_PVC_CONTAMINATION
  test_method: FTIR or XRF
  material_types:
  - HDPE
  thresholds:
    acceptable:
      pvc_contamination_ppm:
      - 0
      - 1000
    reject:
      pvc_contamination_ppm:
      - 1000
      - 100000
  significance: Safety critical - PVC causes HCl evolution and corrosion
  action: reject_if_above_threshold
- indicator_id: HDPE_COLOR_CONSISTENCY
  test_method: Visual inspection
  material_types:
  - HDPE
  thresholds:
    excellent: Natural/clear, consistent color
    good: Single consistent color
    acceptable: Mixed colors or moderate discoloration
    poor: Heavily mixed or degraded color
  significance: Indicates thermal degradation and source quality
inference_rules:
- rule_id: HDPE_PRODUCT_TO_BUYER_FORWARD
  inference_type: buyer_matching
  logic: IF product=milk_jugs THEN grade=hdpe_blow_molding AND quality_tier=[2,3] AND match_buyers=[blow_molding_non_food,
    extrusion_pipe]
  reasoning: Forward reasoning from product to suitable buyers based on grade and quality tier
  confidence: 0.9
- rule_id: HDPE_BUYER_TO_SOURCE_BACKWARD
  inference_type: source_matching
  logic: IF buyer=pipe_manufacturers_pressure THEN require_grade=hdpe_pe4710 AND require_tier=[1,2] AND require_certification=PE4710
  reasoning: Backward reasoning from buyer requirements to acceptable sources
  confidence: 0.98
- rule_id: HDPE_INJECTION_PIR_PREMIUM_MATCHING
  inference_type: buyer_matching
  logic: IF source=injection_pir AND contamination<0.5% THEN tier=1 AND match_all_buyers
  reasoning: Injection PIR is premium quality - suitable for all HDPE applications
  confidence: 0.95
- rule_id: HDPE_MI_APPLICATION_MATCHING
  inference_type: application_matching
  logic: IF mi<0.4 THEN pipe_extrusion; IF mi=0.2-0.8 THEN blow_molding; IF mi=8-34 THEN injection_molding
  reasoning: MI determines application suitability
  confidence: 0.92
- rule_id: HDPE_FOOD_CONTACT_EXCLUSION
  inference_type: application_matching
  logic: IF source=post_consumer_food_contact THEN exclude_direct_food_contact AND route_to_indirect_or_non_food
  reasoning: FDA restrictions on PCR food contact
  confidence: 0.98
- rule_id: HDPE_PP_CONTAMINATION_ROUTING
  inference_type: buyer_matching
  logic: IF pp_contamination<0.5% THEN pressure_pipe_buyers; IF pp<3% THEN non_pressure_pipe; IF pp<5% THEN industrial_with_compatibilizer;
    IF pp>5% THEN reject_or_downcycle
  reasoning: PP contamination level determines buyer tier matching
  confidence: 0.88
- rule_id: HDPE_PVC_CONTAMINATION_REJECTION
  inference_type: quality_control
  logic: IF pvc_contamination>0.1% THEN reject_or_reroute_to_washing FOR safety
  reasoning: PVC contamination causes HCl evolution and equipment corrosion
  confidence: 0.98
standards:
- standard_id: ASTM_D3350
  title: Polyethylene Plastics Pipe and Fittings Materials
  scope: Defines PE pipe classifications (PE2406, PE3408, PE4710, PE100)
  relevance: Primary classification standard for HDPE pipe materials
- standard_id: ASTM_D1248
  title: Polyethylene Plastics Extrusion Materials
  scope: Defines HDPE extrusion material classifications
  relevance: Standard for HDPE extrusion applications
- standard_id: ASTM_D1238
  title: Melt Flow Rates of Thermoplastics
  test_conditions: 190°C/2.16kg for HDPE
  significance: Critical for HDPE processability and quality assessment
- standard_id: ASTM_D1693
  title: Environmental Stress-Crack Resistance (ESCR)
  scope: Measures resistance to stress cracking
  relevance: Critical for pipe and container applications
- standard_id: NSF_61
  title: Drinking Water System Components
  scope: Certifies materials for potable water contact
  relevance: Required for HDPE pressure pipe in water systems
- standard_id: ISO_4427
  title: Polyethylene (PE) pipes for water supply
  scope: International standard for PE water pipe
  relevance: Global standard for HDPE pressure pipe
processing_guidance:
  drying:
    required: false
    note: HDPE not hygroscopic - drying optional unless moisture contamination present
    moisture_threshold_ppm: 500
  temperature_control:
    processing_temp:
      value:
      - 180.0
      - 250.0
      typical: 215.0
      unit: °C
    optimal_range:
      value:
      - 190.0
      - 220.0
      typical: 205.0
      unit: °C
    degradation_onset:
      value:
      - 280.0
      - 280.0
      typical: 280.0
      unit: °C
  mixing_pcr_virgin:
    recommended_method: Dry blend or masterbatch
    max_pcr_pct_by_application:
      pressure_pipe: 30
      non_pressure_pipe: 95
      food_contact_indirect: 15
      blow_molding_non_food: 60
      injection_molding: 50
  contamination_removal:
    washing: Required for post-consumer sources
    sorting: Critical - separate HDPE from PP, PET, PVC
    density_separation: Effective for HDPE/PP separation (0.952-0.965 vs 0.900-0.910)
  compatibilization:
    hdpe_pp_blends: Use MAPE compatibilizer (2-5%) for PP contamination >3%
    benefit: Reduces property loss from PP contamination
